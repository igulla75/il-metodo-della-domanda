<p lang="en">The app has moved. If you are not taken there automatically, open <a href="../index-en.html">The Method of the Question</a>.</p>
<script>
  // Vecchia app ritirata: si toglie SOLO la sua cache e il suo service worker, poi si va alla nuova app.
  (function () {
    var vai = function () { try { location.replace('../'); } catch (e) {} };
    var lavori = [];
    try { if (window.caches) lavori.push(caches.delete('viaggio-nel-buio-v1').catch(function () {})); } catch (e) {}
    try {
      if ('serviceWorker' in navigator) lavori.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
        return Promise.all(rs.filter(function (r) { return r.scope.indexOf('/viaggio-nel-buio-pwa/') >= 0; }).map(function (r) { return r.unregister(); }));
      }).catch(function () {}));
    } catch (e) {}
    Promise.all(lavori).then(vai, vai);
    setTimeout(vai, 1500); // in ogni caso
  })();
</script>
