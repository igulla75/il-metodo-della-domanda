d, as that of not being good enough for one’s child. This is not an itinerary on how to be a good parent — that would be a claim this book has never allowed itself to make even for smaller problems. It is an itinerary about a specific scientific finding, concerning exactly this fear: the fear of getting it wrong."}, {"t": "sh", "text": "The most liberating finding in this itinerary"}, {"t": "p", "text": "The developmental psychologist Edward Tronick has spent decades filming, moment by moment, interactions between parents and small children. His best-known finding, now replicated in dozens of subsequent studies: even the healthiest, most securely attached parent-child pairs — the ones specialists would call a perfectly successful attachment — are mismatched — out of sync, not in tune — about seventy per cent of the time. A distracted parent, who responds with a delay, who misreads a signal, who gets the tone wrong: this is not the exception of a bad parent. It is the statistical norm for every parent, good or not so good."}, {"t": "p", "text": "What distinguishes healthy relationships from struggling ones, according to Tronick, is not the absence of these mismatches — impossible to avoid — but what he calls repair: returning, after the rupture, to re-establish contact. It is the cycle of rupture and repair, repeated thousands of times, that builds a child’s security — not uninterrupted perfection, which according to his research does not exist in any relationship observed, not even among the most attuned parents."}, {"t": "p", "text": "Most of the studies replicating Tronick’s work, however, come from Western, educated, industrialised, rich and democratic samples — what researchers call, with an acronym that has become standard, WEIRD samples, from the English initials of Western, Educated, Industrialized, Rich, Democratic. A 2022 study by Helen Wefers and colleagues, from the universities of Münster and Otavalo, tested the phenomenon by comparing urban German infants with Kichwa infants from the rural Ecuadorian Andes, raised with a far more physical, close-contact style of caregiving. The result: mismatch and the search for repair emerge in both settings — a genuine universality. But the form changes: Kichwa infants reacted more intensely to the interruption of physical contact, consistent with a caregiving style in which bodily closeness, not eye contact, is the main channel of the relationship."}, {"t": "sh", "text": "An idea that completes the picture"}, {"t": "p", "text": "Decades before Tronick, the psychoanalyst Donald Winnicott had sensed something similar, giving it a name that has entered everyday language: the “good enough” parent. For Winnicott, a parent who never failed, who anticipated every need before the child even felt it, would deprive the child of the chance to learn to tolerate frustration and build their own resources. Failure, in the right measure and followed by repair, is not an obstacle to development: to some extent, it is a necessary ingredient of it."}, {"t": "sh", "text": "A case"}, {"t": "p", "text": "A parent loses patience with a child after a hard day, raises their voice over something that did not deserve it, and spends the evening reproaching themselves. Tronick’s finding does not say that moment does not matter — it does, and it is right to recognise that. It says that what will really decide the outcome, for the child, is not that the moment happened, but what happens afterwards: whether the parent comes back, acknowledges what happened, re-establishes contact. It is the repair, not the avoided incident, that is the real work of parenting."}, {"t": "sh", "text": "Orientation itinerary"}, {"t": "table", "rows": [["Manifestation", "Tool", "Origin", "Why it is useful"], ["You fear that every mistake you make as a parent leaves permanent damage", "Knowing that misalignment between parent and child is the statistical norm, not the exception of a bad parent", "Edward Tronick — research on parent-child interaction (confirmed in Germany/Ecuador, see text)", "Puts into perspective a fear often larger than the reality the data describe."], ["You wonder what really matters for the bond with your child", "Focusing on repair after a difficult moment, rather than the impossible attempt never to make mistakes", "Tronick — the rupture-and-repair cycle", "It is the mechanism the data most closely associate with secure attachment, not perfection."], ["You feel guilty for not being a perfect parent", "Considering that a “good enough” parent, not a perfect one, is what healthy development requires", "Donald Winnicott — the good-enough parent", "A measured, repaired failure is part of the process, not a threat to it."], ["After a difficult moment with your child, you don’t know what to do", "Going back, naming what happened, re-establishing contact — this is the step that matters most", "Tronick — repair as the central mechanism", "The data show the act of going back matters more than the moment that preceded it."]]}], "ricorda": "Even in the healthiest parent-child relationships, mismatch is the norm, not the exception — it happens about seven times out of ten, according to the most solid data available. What builds security is not the absence of mistakes, impossible to guarantee, but the repair that follows them. A “good enough” parent, not a perfect one, is exactly what a child’s development requires.", "approfondire": ["Edward Tronick and Claudia Gold – The Power of Discord (Little, Brown Spark, 2020); research on the “still-face experiment” and the cycle of rupture and repair", "Helen Wefers, Nils Schuhmacher, Ledys Hernández Chacón, Joscha Kärtner – Universality without Uniformity: Infants’ Reactions to Unresponsive Partners in Urban Germany and Rural Ecuador (Memory & Cognition, 2022)", "Donald Winnicott – The Child, the Family and the Outside World (Penguin Books, 1964)"]}, "20": {"title": "Itinerary 20 — The world and the future — How can I face a conflict without turning it into a war?", "body": [{"t": "sh", "text": "Before going on"}, {"t": "p", "text": "Conflict is not always a failure. It can arise from differing interests, incompatible needs or different values. It becomes destructive when the problem stops being the centre of the discussion and the other person becomes the problem. The Method of the Question does not teach how to win a conflict, but how to find one’s bearings within it."}, {"t": "p", "text": "It is worth knowing that the tools presented in this itinerary — Nonviolent Communication, interest-based negotiation — reflect a more direct, individualist style of conflict management. The communication scholar Stella Ting-Toomey developed a theory, empirically tested across five cultures and confirmed by a 2003 cross-cultural test published in Communication Research, according to which individualist cultures tend to handle conflict directly — confronting it openly to reach a compromise — while more collectivist cultures favour indirect styles, such as avoiding open confrontation or yielding ground, to protect the group’s harmony rather than one’s own individual position. Neither style is absolutely “more right”: separating people from the problem, as Fisher and Ury propose, assumes a context in which direct confrontation is culturally acceptable — an assumption that does not hold everywhere in the same way."}, {"t": "sh", "text": "A case"}, {"t": "p", "text": "Two siblings must decide how to care for their elderly mother. Both want what is best for her, but each interprets the other’s behaviour as selfishness. After a few weeks, they are no longer discussing their mother’s care, but grievances accumulated over the years. The original problem remains unresolved: the conflict has taken its place."}, {"t": "sh", "text": "Orientation itinerary"}, {"t": "table", "rows": [["Manifestation", "Tool", "Origin", "Why it is useful"], ["The conflict arises from mutual interpretations", "Distinguishing facts from interpretations", "Method of the Question", "Reduces attributions of intent that have not been demonstrated."], ["The goal becomes being right", "Asking which problem you actually want to solve", "Method of the Question", "Brings attention back to the problem instead of the opponent."], ["The positions seem irreconcilable", "Identifying the underlying needs", "Marshall Rosenberg – Non-violent Communication (an individualist style, see text)", "Similar needs can generate different positions."], ["The dialogue stalls", "Separating the people from the problem", "Roger Fisher and William Ury – Interest-based negotiation", "Favours the search for shared solutions."], ["The confrontation becomes harmful", "Assessing whether to suspend or end the confrontation", "Mediation and conflict-management practice", "Reminds us that not every conflict can be resolved immediately."], ["The conflict concerns a practical decision to be made together, not only a wrong to clarify", "Defining the problem precisely, generating several alternatives, evaluating them together, checking the result", "Arthur Nezu, Christine Nezu, Thomas D’Zurilla — Problem-Solving Therapy", "Shifts attention from who is right to how to solve it together, as in the case of the two brothers."]]}], "ricorda": "A conflict is not resolved by proving who is wrong, but by understanding what problem is really being addressed. When we lose sight of the problem, the conflict tends to feed itself.", "approfondire": ["Marshall Rosenberg – Nonviolent Communication: A Language of Life (PuddleDancer Press, 1999)", "Roger Fisher and William Ury – Getting to Yes (Houghton Mifflin, 1981)", "Daniel Kahneman – Thinking, Fast and Slow (Farrar, Straus and Giroux, 2011)", "Stella Ting-Toomey et al. – Culture, Face Maintenance, and Styles of Handling Interpersonal Conflict: A Study in Five Cultures (International Journal of Conflict Management, 1991); John Oetzel and Stella Ting-Toomey – Face Concerns in Interpersonal Conflict: A Cross-Cultural Empirical Test of the Face-Negotiation Theory (Communication Research, 2003)", "Arthur M. Nezu, Christine Maguth Nezu, Thomas J. D’Zurilla – Problem-Solving Therapy: A Treatment Manual (Springer Publishing Company, 2013)"]}, "21": {"title": "Itinerary 21 — The limit that will not move — How can I live knowing that my life has an end?", "body": [{"t": "sh", "text": "A name for what happens"}, {"t": "p", "text": "Awareness of one’s own mortality is not an illness, and is not, in itself, a pathological thought. It is an encounter with a universal limit: we know our life will have an end, but we do not know when it will arrive, nor can we observe from outside what it means, for us, to no longer exist."}, {"t": "p", "text": "This knowledge is peculiar. It is certain in its general content — every human life ends — and uncertain in almost everything concerning the individual: the moment, the circumstances, what will precede the end and what, if anything, may follow it. It is precisely this combination of certainty and ignorance that can produce fear, denial, urgency, sadness, or a constant search for reassurance."}, {"t": "p", "text": "The Method of the Question cannot turn death into a solvable problem. It can, however, prevent a category error: looking for a definitive answer where the available information cannot supply one. It can also distinguish mortality, which does not depend on us, from how we inhabit our time, which at least in part remains a matter of our own decisions."}, {"t": "p", "text": "Not all questions about death have the same status. “Will my life have an end?” gets a certain answer. “When will it happen?” can only ever receive estimates, never an individual guarantee. “What is there afterwards?” belongs to philosophy, religion and personal belief, but has no provable, shared answer. “How do I want to live knowing that my time is limited?”, by contrast, is a practical question, open and still entrusted to the traveller."}, {"t": "sh", "text": "What actually helps"}, {"t": "p", "text": "The first help is not asking reason for what reason cannot guarantee. Seeking absolute certainty of being safe, interpreting every symptom as an omen, or constantly checking the future does not remove the limit: it narrows the present. The useful question is not “How can I be certain it won’t happen?”, but “What information is actually present, and what am I adding through fear?”"}, {"t": "p", "text": "The second help is distinguishing the thought of death from the presence of an immediate danger. We can be mortal without being, at this moment, in danger. This distinction is not meant to dismiss a symptom or to avoid a medical assessment when one is needed; it is meant to stop the general possibility of death from automatically becoming the prediction that it is imminent."}, {"t": "p", "text": "The third help is recognising that finitude changes the value of choices. Knowing that time is not infinite can clarify a priority, but it does not oblige anyone to live in a permanent state of urgency. Even resting, waiting, preparing slowly or devoting oneself to something ordinary can be a full way of using one’s time. Mortality does not demand a spectacular life; it asks only that unwitting postponement not be mistaken for a choice."}, {"t": "p", "text": "Finally, one must accept that fear may return. A serious method does not promise to erase it. It can, however, stop it occupying the whole landscape. When the anguish becomes persistent, triggers panic attacks, prevents sleeping, working or going out, the most rigorous step is not to keep questioning oneself alone: it is to ask a competent professional for help. This, too, means correctly recognising the kind of problem one is facing."}, {"t": "sh", "text": "A case"}, {"t": "p", "text": "After the sudden death of a colleague her own age, a woman begins watching her own body with a new kind of attention. A pain in her chest, a dizzy spell, a difficult night’s sleep immediately become evidence of a serious illness. She searches for information, seeks reassurance, checks the same signs over and over. For a few hours she calms down; then the doubt returns."}, {"t": "p", "text": "The initial fact is real: someone her age died suddenly. Her fear, too, is real. What is not proven, however, is the conclusion that the same thing is about to happen to her. Her mind has turned a general possibility into an individual prediction."}, {"t": "p", "text": "The first useful question is not “How can I be sure I won’t die soon?” No one can offer her that certainty. It is: “Are there symptoms that call for a medical assessment?” If the answer is yes, she should see a doctor. If the assessment shows no current danger and the checking keeps occupying her days, a second question arises: “Am I still looking for information, or am I looking for a reassurance that no information could ever make final?”"}, {"t": "p", "text": "This distinction does not remove mortality and does not make light of the fear. It does, however, give back a more faithful map: a universal limit, a concrete risk to be assessed when signs exist, an anguish that may call for help, and a present in which decisions remain possible."}, {"t": "sh", "text": "A wider view: what actually happens, after a loss"}, {"t": "p", "text": "This itinerary has, until now, spoken of the fear of dying, not of grief for someone who has already died — but the two themes share an assumption worth checking. The common imagination, largely inherited from Elisabeth Kübler-Ross’s stage model, assumes an almost obligatory path: shock, denial, anger, bargaining, depression, acceptance. The psychologist George Bonanno, at Columbia University, has spent more than two decades measuring what actually happens, following thousands of people over time after a bereavement or a potentially traumatic event. The most solid finding of his research contradicts the common imagination: the most frequent trajectory is not a slow passage through phases of rising and then falling grief, but resilience — the capacity to carry on functioning, with real pain but without a prolonged collapse, from the very first weeks. This is not an exception reserved for the strongest: in his samples, it turned out to be by far the most common response, more widespread than complicated or chronic grief."}, {"t": "p", "text": "This does not mean that pain does not exist, nor that the stages described by Kübler-Ross — originally conceived for people facing their own imminent death, not for those left behind after someone else’s loss — are without descriptive value for those who genuinely go through them. It means they are not a compulsory stage: anyone who does not “pass through” anger or bargaining is not grieving the wrong way. Bonanno’s research gives back, here too, the same distinction this book has sought elsewhere: between what is certain (the loss is real, the pain is legitimate) and what is only a model — useful for some, not prescriptive for everyone."}, {"t": "sh", "text": "Orientation itinerary"}, {"t": "table", "rows": [["Manifestation", "Tool", "Origin", "Why it is useful"], ["You are looking for absolute certainty about the moment or circumstances of your death.", "Distinguishing what is certain, what is only probable and what cannot be known.", "Method of the Question — accepting the epistemic limit.", "Avoids treating the absence of certainty as hidden information that, with enough searching, could be found."], ["An event that happened to someone else becomes a prediction of what will happen to you.", "Separating the observed fact from the individual inference.", "Method of the Question — the distinction between fact, interpretation and prediction.", "Remembers that a real case shows something is possible, not that it is imminent for every similar person."], ["Every bodily sensation is interpreted as a sign of mortal danger.", "Checking the signals with the appropriate tools and, when necessary, consulting a doctor.", "Clinical method and the principle of competence.", "Replaces self-diagnosis and repetitive checking with an assessment suited to the type of problem."], ["The fear returns even after reassurance and checks.", "Asking whether you are seeking new information or an impossible guarantee.", "Method of the Question — checking the question itself.", "Shows when the search has stopped increasing knowledge and is instead feeding the need for certainty."], ["Finiteness makes every undertaking feel pointless.", "Narrowing the horizon: which choice retains value today, even without a guarantee about the future?", "Method of the Question — deciding with incomplete information.", "Allows you to act without requiring that the value of a gesture depend on its lasting forever."], ["Awareness of the limit produces a constant urgency to do everything.", "Distinguishing what matters from what must be done immediately.", "Reflection on finiteness and priorities.", "Stops the memento mori (remember you must die) from becoming a new form of pressure or performance."], ["The thought of death consistently prevents you from sleeping, working, going out or living your relationships.", "Recognising that the problem is no longer only philosophical, and seeking professional help.", "Clinical psychology and the principle of competence.", "Gives the suffering its proper name and the right level of care, without reducing it to a lack of willpower."]]}, {"t": "sh", "text": "A hypothesis, and a cross-cultural test of it"}, {"t": "p", "text": "The anthropologist Ernest Becker, already cited in this book, proposed an influential idea: much of human behaviour — the pursuit of self-esteem, belonging to a group, the wish to leave a mark — would function as a defence, often unconscious, against the anguish of one’s own mortality. A 2013 study by Hongfei Du and colleagues, published in the Journal of Experimental Social Psychology, tested this idea by comparing an Austrian sample with a Chinese one: in both, self-esteem genuinely reduces death-related anxiety — but the kind of self-esteem that works changes. In Austria, what mainly provides the shield is the perceived value of oneself as an individual. In China, it is mainly the perceived value of one’s relationships. Becker’s mechanism holds up, but what feeds it depends on where, and how, a culture teaches people to build their sense of worth."}], "ricorda": "Mortality is not a problem the Method of the Question can solve. It is a limit the method can help name correctly. We do not know when our life will end, and we cannot prove what lies beyond that boundary. We can, however, distinguish present danger from general possibility, seek help when needed, and decide how to use the stretch of path that remains visible. Finitude does not determine what should have value. It makes it more urgent to ask ourselves what, for us, does.", "approfondire": ["Epictetus – Enchiridion", "Seneca – On the Shortness of Life", "Michel de Montaigne – Essays, in particular “To Philosophise Is to Learn to Die”", "Irvin D. Yalom – Staring at the Sun: Overcoming the Terror of Death (Jossey-Bass, 2008)", "Ernest Becker – The Denial of Death (Free Press, 1973)", "Hongfei Du, Eva Jonas et al. – Cultural Influences on Terror Management: Independent and Interdependent Self-Esteem as Anxiety Buffers (Journal of Experimental Social Psychology, 2013)", "George A. Bonanno – The Other Side of Sadness: What the New Science of Bereavement Tells Us About Life After Loss (Basic Books, 2009)"]}, "22": {"title": "Itinerary 22 — Meaning, faith and gratitude — How can I find a direction again when I have lost the sense of the path?", "body": [{"t": "sh", "text": "A name for what happens"}, {"t": "p", "text": "There are moments when the problem is not making a decision, but no longer being able to see any direction at all. It can happen after a bereavement, a failure, an illness, a sudden change, or with no obvious cause. We have not always lost the way: sometimes we have lost the map we were reading it with."}, {"t": "sh", "text": "What actually helps"}, {"t": "p", "text": "The Method of the Question invites us not to confuse the loss of meaning with the loss of worth. When we no longer know which direction to take, the first question is not “What is the meaning of my life?”, but “What is the question I am still able to face today?” Narrowing the horizon does not mean giving up on the future: it means finding a stable point to start from again."}, {"t": "sh", "text": "A case"}, {"t": "p", "text": "After retiring, Anna finds that the days she had imagined as an achievement feel empty. For years she had identified her own role with her work. With that point of reference gone, she concludes that she has also lost the meaning of her life. The problem is not the absence of activity, but the belief that one’s personal worth coincides with a single role."}, {"t": "sh", "text": "Orientation itinerary"}, {"t": "table", "rows": [["Manifestation", "Tool", "Origin", "Why it is useful"], ["«My life no longer has meaning.»", "Distinguishing the fact from the interpretation.", "Method of the Question", "The loss of one direction does not prove every direction is lost."], ["A change erases the usual role.", "Separating identity from role.", "Developmental psychology", "A person is worth more than the functions they perform."], ["I can’t see the future.", "Narrowing the time horizon.", "Method of the Question", "Allows you to start again from concrete, checkable decisions."], ["Every choice feels pointless.", "Identifying one small but meaningful action.", "The logic of gradual action", "Action often precedes the return of motivation."], ["The loss of meaning persists over time with intense suffering.", "Seeking a consultation with a professional.", "The principle of competence", "Some conditions require specific help."]]}], "ricorda": "Losing the sense of the path does not mean having lost the way for good. It often means that the map we were using to read reality is no longer sufficient and needs updating.\n\nA useful finding, for anyone in Anna’s position: searching for meaning is not, in itself, a sign that something is wrong. A 2008 study by the psychologist Michael Steger and colleagues, on large American and Japanese samples, distinguished two different dimensions: the presence of meaning (feeling that one’s life already has it) and the search for meaning (actively looking for it). Americans reported, on average, more presence; the Japanese, more search. This does not mean one culture lives with more meaning than the other — it means the relationship between already having a direction and searching for a new one is not the same everywhere, and that being in the searching phase, like Anna after retiring, is not in itself a sign of being lost.", "approfondire": ["Viktor E. Frankl – Man’s Search for Meaning (Verlag für Jugend und Volk, 1946; English ed. Beacon Press, 1959)", "Emily Esfahani Smith – The Power of Meaning (Crown, 2017)", "Michael Steger, Yoshito Kawabata, Satoshi Shimai, Keiko Otake – The Meaningful Life in Japan and the United States: Levels and Correlates of Meaning in Life (Journal of Research in Personality, 2008)", "Albert Camus – The Myth of Sisyphus (Le Mythe de Sisyphe, Gallimard, 1942)"]}, "23": {"title": "Itinerary 23 — Loss and changing bonds — How can I grieve for a child who never arrived?", "body": [{"t": "p", "text": "It affects about one couple in six worldwide, and remains one of the least publicly recognised forms of grief: that for a longed-for child who does not arrive. The psychologist Pauline Boss gave a precise name to this kind of pain — ambiguous loss — describing in this way every grief in which there is no clear event to mourn. In infertility, the person is physically absent but remains psychologically present: an imagined, awaited child, to whom space has already been given in one’s life even before they existed."}, {"t": "p", "text": "Boss is clear on a point worth repeating: with ambiguous loss, “closure is a myth” — the title of her most recent book on the subject. This does not mean the pain is never worked through, but that the realistic goal is not to “turn the page” cleanly — it is learning to live alongside an absence that has no funeral, no date, no rite that makes it socially visible to others."}, {"t": "p", "text": "Boss’s theory has also been tested outside the context in which it arose. The scholar Simon Robins applied it, in 2010, to the families of people who disappeared during the civil conflict in Nepal — a collective, not individual, context, marked by mass loss. The concept held up: there too, the absence of certainty produced the same kind of suspended suffering Boss describes. But the study also showed an important difference: collective practices and community rituals, almost absent from Boss’s original theory, played a supporting role that does not emerge with the same force in the more individualist contexts the theory comes from."}, {"t": "sh", "text": "Absence of closure does not mean absence of resilience"}, {"t": "p", "text": "Boss’s “myth of closure” does not imply that this loss condemns those who live it to constantly acute pain. Research on resilience after bereavement, in particular that of the psychologist George Bonanno, at Columbia University, shows that continuing to function — working, feeling joy, building other plans — is the most common outcome even after losses with no rites or public recognition, not a sign that the pain was not real or did not matter enough. Resilience and absence of closure are not mutually exclusive: one can carry forward a full life and, at the same time, never entirely “turn the page” on that imagined child."}, {"t": "sh", "text": "Where to look for help"}, {"t": "p", "text": "A psychologist specialising in reproductive health, or a counselling course offered by the fertility clinic itself, remain the most direct point of access. In many countries, support groups exist specifically for infertility — talking to others going through the same condition reduces the isolation this grief almost always brings with it."}], "ricorda": "Not having a precise event to mourn does not make the grief any less real. Recognising it as ambiguous loss, instead of expecting a clean closure that rarely comes, is already a way of moving through it with less confusion.", "approfondire": ["Pauline Boss – Ambiguous Loss: Learning to Live with Unresolved Grief (Harvard University Press, 1999)", "Simon Robins – Ambiguous Loss in a Non-Western Context: Families of the Disappeared in Post-Conflict Nepal (Family Relations, 2010)", "George A. Bonanno – The Other Side of Sadness: What the New Science of Bereavement Tells Us About Life After Loss (Basic Books, 2009)"]}, "24": {"title": "Itinerary 24 — Loss and changing bonds — How can I support a parent who, while still present, is beginning to disappear?", "body": [{"t": "p", "text": "Pauline Boss’s same concept of ambiguous loss describes, in mirrored form, another widespread experience: caring for an elderly parent whose cognitive decline makes them, little by little, less present to themselves. Here the person is physically present but increasingly inaccessible psychologically — the exact opposite of infertility, with the same underlying structure: a grief with no precise moment when it begins, often lived in solitude because the person you love is, technically, still there."}, {"t": "p", "text": "Added to this is often a reversal of roles that is hard to put into words: the child who becomes, in practice, the parent of their own parent. This is not a problem to be solved with a technique, but a condition to be recognised for what it is — avoiding measuring it against the same criteria as an ordinary bereavement, which simply do not apply here."}, {"t": "sh", "text": "A case"}, {"t": "p", "text": "A man visits his mother, as he does every Sunday. She asks him whether he has eaten yet, straightens his shirt collar — the same gestures as always. Then, mid-afternoon, she turns to him and asks: “And your brother, when is he coming?” He has no brother. He realises, in that moment, that his mother is looking at him without fully seeing him — present in the room, but not entirely recognised. She is still there, sitting in front of him, and yet part of her is already elsewhere. Before leaving, he checks that she has taken her evening medication, reminds the home carer about Thursday’s appointment, signs a form for the local health authority. Within a single afternoon, he has been both son and parent to the same person, with neither role ever having a clean edge."}, {"t": "sh", "text": "A wider view: resilience in those who provide care"}, {"t": "p", "text": "The common belief holds that anyone accompanying such a prolonged loss is condemned to a slow, progressive emotional decline. The most solid research on bereavement, in particular that of the psychologist George Bonanno, at Columbia University, tells a different story: following thousands of people over time after a loss — including the relatives of long-term patients — Bonanno found that the most common trajectory is not the prolonged collapse predicted by stage models such as Kübler-Ross’s, but resilience: the ability to carry on functioning, to experience moments of relief or normality too, while still being inside real pain. This is not the armour of someone who “does not feel enough”: in his data, it is by far the most frequent outcome."}, {"t": "p", "text": "This is not an obligation to “cope well”, nor a minimising of the real difficulty described in this itinerary. It is information worth having: anyone who catches themselves laughing, getting distracted, or simply having a light day in the midst of an anticipatory grief lasting years is not betraying the person they are caring for, nor denying the seriousness of the situation. According to the most rigorous data available, they are doing exactly what most people in their position end up doing."}, {"t": "sh", "text": "Where to look for help"}, {"t": "p", "text": "A geriatrician or a centre specialising in cognitive decline is the first medical point of reference. Associations dedicated to Alzheimer’s and dementia often offer support groups for family members, not just information about the illness. Home care and respite care services, where available, are not a luxury: they prevent the exhaustion of the carer, which in turn undermines the quality of the care itself."}], "ricorda": "The pain of watching someone still physically present gradually disappear is an ambiguous loss just as much as one caused by physical absence — and deserves the same recognition, even though it rarely receives it. Seeking specific support for those caring for a parent in these conditions is not an exception; it is often necessary.", "approfondire": ["Pauline Boss – Loving Someone Who Has Dementia: How to Find Hope While Coping with Stress and Grief (Jossey-Bass, 2011)", "George A. Bonanno – The Other Side of Sadness: What the New Science of Bereavement Tells Us About Life After Loss (Basic Books, 2009)"]}, "25": {"title": "Itinerary 25 — Loss and changing bonds — How can I move through the loss of a place, not of a person?", "body": [{"t": "p", "text": "The psychiatrist and anthropologist Maurice Eisenbruch, working with Cambodian refugees, coined the expression cultural bereavement to describe something Western psychiatric categories struggled to name: grief not for the loss of a person, but of an entire world — an everyday language, a social structure, a system of reference points that made the world legible."}, {"t": "p", "text": "One of his most useful, and least intuitive, observations: those pushed to assimilate quickly into a new culture tend to suffer more from cultural bereavement, not less — while those who maintain ties to the practices and ceremonies of their culture of origin tend to move through it better. Integrating and remaining faithful to what one has left behind are not, contrary to common belief, goals in conflict with each other."}, {"t": "sh", "text": "Losing a place without ever having left it"}, {"t": "p", "text": "Eisenbruch describes a grief born of displacement — for those who leave a place. But there is a related form of pain that affects those who stay put while the place itself changes before their eyes: a mine, an environmental disaster, a neighbourhood transformed until it becomes unrecognisable. The environmental philosopher Glenn Albrecht coined for this the term solastalgia — the absence of comfort (solacium) caused by witnessing the transformation of an environment one considered home, while remaining physically in place. One does not need a border to cross, nor a plane to catch, to lose the sense of belonging to a place: it is enough for the place to change too much, too fast, while the person who lives there stays and watches."}, {"t": "sh", "text": "Where to look for help"}, {"t": "p", "text": "Associations and cultural centres of one’s own community of origin, where they exist, are not just an emotional tie: Eisenbruch’s research identifies them as a concrete protective factor. Psychological support specialising in migration-related trauma, when needed, understands this condition better than a generic course of treatment. Maintaining practices, ceremonies, or even just language habits from one’s culture of origin, where possible, is not an obstacle to integration: Eisenbruch’s data suggest the opposite."}], "ricorda": "Losing a place, a language, a world of reference points is a genuine bereavement, even without anyone dying. Maintaining a tie to one’s culture of origin, instead of forcing rapid assimilation, helps one move through it — it does not stand in the way.", "approfondire": ["Maurice Eisenbruch – From Post-Traumatic Stress Disorder to Cultural Bereavement: Diagnosis of Southeast Asian Refugees (1991)", "Glenn Albrecht – Solastalgia: A New Concept in Health and Identity (Philosophy Activism Nature, 2005)"]}, "26": {"title": "Itinerary 26 — Work and rebuilding — How can I start again after an economic failure?", "body": [{"t": "p", "text": "This itinerary is different both from the one on chronic poverty and from the one on losing a job. It does not concern a structural condition that drags on over time, nor the search for new employment: it concerns a specific event — the failure of a business, a financial collapse, a project one had invested everything in, now lost — and what happens inside the person right afterwards, as they try to rebuild."}, {"t": "sh", "text": "An economic failure is also a bereavement"}, {"t": "p", "text": "The scholar Dean Shepherd, among the most cited researchers in the world on this subject, has proposed something rarely said out loud: the loss of a business through failure produces, in the person who created or ran it, a psychological reaction comparable to bereavement — not a metaphor, but a real emotional process which, if ignored, interferes with the very ability to learn from what happened. Anyone who treats failure as a purely economic fact, to be resolved only with paperwork and figures, risks ignoring the part that most affects recovery over the long term."}, {"t": "p", "text": "Shepherd proposes a dual-process, non-linear model: the person oscillates between a loss orientation — moving through the pain, the anger, the guilt over what has ended — and a restoration orientation — dealing with practical matters, learning from the mistake, looking ahead. One does not move once and for all from the first to the second: one oscillates between the two, and it is normal that this should be so. One day processing prevails, the next day rebuilding does, and this is not a sign of inconsistency."}, {"t": "sh", "text": "Stigma, not only loss"}, {"t": "p", "text": "A substantial part of Shepherd’s research concerns what he has called the stigma of entrepreneurial failure: a set of negative judgements about someone who has failed, coming from two directions — the external judgement of those watching, and the internal judgement the person directs at themselves, often harsher than the first. The second tends to be the harder one to move through, and the one least recognised by those around."}, {"t": "p", "text": "How heavily this stigma weighs, however, is not the same everywhere. A 2023 study by Naga Lakshmi Damaraju, Jay Barney and Gregory Dess, using data from fifteen countries over a fifteen-year span, showed that the stigma of entrepreneurial failure changes systematically according to three precise cultural dimensions: it is more pronounced where the individual, rather than the group, is held responsible for their own outcomes; where power and social-status distances are more rigid; and where the culture rewards competitiveness and personal achievement more than quality of life and cooperation. Knowing that one’s own inner judgement is also, in part, a product of the context one grew up in — not just an objective assessment of oneself — can already lighten its weight."}, {"t": "sh", "text": "The inner judgement, named precisely"}, {"t": "p", "text": "This book has already met, in Itinerary 15, the distinction between guilt — which concerns a specific behaviour and drives a person to repair — and shame, which concerns the whole person and tends to paralyse. The researcher Brené Brown, who has devoted her academic career specifically to the study of shame, observes that the most effective way of moving through it is neither to deny it nor to endure it in silence, but to name it out loud with someone trusted: shame thrives on secrecy, judgement and silence, and loses much of its power as soon as it is shared. For someone whose business has failed, this means something concrete: an honest account of what happened — to a friend, a family member, a peer group who has lived through the same thing — is not a pointless exposure, but often the most direct way to stop the inner judgement from becoming permanent."}, {"t": "sh", "text": "A case"}, {"t": "p", "text": "Someone who has closed a business after years of work often avoids, for months, talking about what happened — not out of shame over the financial loss itself, but for fear of being judged incapable, not merely unlucky. Naming the difference between failure and incapacity, even just to oneself, is already a first step: many failures depend on market conditions, timing, factors no personal skill could have fully controlled."}], "ricorda": "An economic failure is not only a problem to be fixed with new figures: it is often also a bereavement, with its own necessary working-through. Oscillating between grief for what has ended and the drive to start again is normal, not a sign of weakness. The inner stigma, the judgement one directs at oneself, often weighs more heavily than the external one — and deserves the same recognition this book has given to every other form of unjustified shame.", "approfondire": ["Dean A. Shepherd – Learning from Business Failure: Propositions of Grief Recovery for the Self-Employed (Academy of Management Review, 2003)", "Dean A. Shepherd – Grief Recovery from the Loss of a Family Business: A Multi- and Meso-Level Theory (2009)", "Naga Lakshmi Damaraju, Jay B. Barney, Gregory G. Dess – Cultural Influences on Stigma of Failure and Entrepreneurial Activity (Organization Management Journal, 2023)", "Brené Brown – Daring Greatly: How the Courage to Be Vulnerable Transforms the Way We Live, Love, Parent, and Lead (Gotham Books, 2012)"]}, "27": {"title": "Itinerary 27 — Loss and changing bonds — How can I move through infidelity in a relationship I still want to live?", "body": [{"t": "p", "text": "This itinerary is different from the one on the end of a love story. There, a relationship ends; here, often, the relationship continues — but something within it has broken in a way neither person had foreseen. Infidelity is not only about the loss of a promise: it is about discovering that the shared reality up to that point was not what one believed it to be."}, {"t": "sh", "text": "Discovery as a traumatic event"}, {"t": "p", "text": "The psychologist Shirley Glass, described by the New York Times as “the godmother of infidelity research”, documented over more than two decades what happens to someone who discovers they have been betrayed. Her main finding: the revelation of infidelity is not simply painful news, but an event that produces properly traumatic reactions — intrusive thoughts, hypervigilance, images that return without control — of the same clinical nature as other traumatic events, not just a more intense sadness than usual."}, {"t": "p", "text": "Glass also identifies a paradox that makes rebuilding particularly difficult: the person who was unfaithful must, paradoxically, become the person who helps the other heal — while their natural instinct would be to avoid the hurt look they caused. Recognising this paradox, instead of denying it, is often the first step that allows rebuilding, when both want it, to truly begin."}, {"t": "sh", "text": "Rebuilding trust, one gesture at a time"}, {"t": "p", "text": "If Glass documents the traumatic nature of the discovery, the psychologist John Gottman — who observed thousands of couples in his own relationship research laboratory at the University of Washington — focuses on what happens afterwards, when rebuilding is wanted by both. His most useful finding: trust is not repaired with a single grand declaration or promise, but accumulates through what Gottman calls “turning towards” moments — small everyday gestures in which one person turns towards the other instead of away, repeated consistently over time. There is no shortcut that replaces this slow accumulation: it is precisely its gradualness, verifiable day after day, that makes it credible to the person who was betrayed."}, {"t": "p", "text": "Both Glass and Gottman built their findings mainly on white, middle-class American couples. A 1997 paper by Christie Penn, Stacy Hernández and María Bermúdez, in the American Journal of Family Therapy, examined how infidelity is experienced and dealt with in African American, Hispanic and Asian American contexts, finding real differences in the meaning attributed to infidelity and in the paths to rebuilding considered legitimate — tied to specific religious and family traditions. The clinical core observed by Glass and Gottman — the traumatic nature of the discovery, the value of small repeated gestures — is not disproved, but it needs to be applied knowing that the models it rests on do not come from a universal sample."}, {"t": "sh", "text": "A case"}, {"t": "p", "text": "In the months following the discovery of an infidelity, the person betrayed often finds themselves relieving the same memory several times a day, searching for details that do not help them feel better, distrusting innocuous signals. This is not obsession out of control: it is, almost word for word, the same dynamic described in the trauma literature. Naming it as such — rather than as a weakness to get over quickly — is already part of moving through it."}], "ricorda": "The pain of infidelity is not “just” a breach of trust: it has a real traumatic component, clinically measured. Rebuilding, when wanted by both sides, requires an uncomfortable role from the person who was unfaithful — becoming part of the other’s healing — and, for the person betrayed, the time this takes.", "approfondire": ["Shirley P. Glass – Not “Just Friends”: Rebuilding Trust and Recovering Your Sanity After Infidelity (Free Press, 2003)", "John Gottman and Nan Silver – What Makes Love Last? How to Build Trust and Avoid Betrayal (Simon & Schuster, 2012)", "Christie D. Penn, Stacy L. Hernández, J. María Bermúdez – Using a Cross-Cultural Perspective to Understand Infidelity in Couples Therapy (American Journal of Family Therapy, 1997)"]}, "28": {"title": "Itinerary 28 — Loss and changing bonds — How can I carry a pain that never ends, alongside a love that never runs out?", "body": [{"t": "p", "text": "Becoming the parent of a child with a significant disability is often an experience that, until 1962, did not even have a name. It is not grief for a person who has gone: it is a pain that lives alongside, day after day, a love that is just as real — and which, unlike ordinary bereavement, never reaches a true closure."}, {"t": "sh", "text": "A pain that does not close, and that returns"}, {"t": "p", "text": "The counsellor Simon Olshansky coined the expression chronic sorrow, observing parents of children with intellectual disability. Unlike grief for a death, which tends to fade over time, chronic sorrow comes back in waves, often precisely at the moments when other children the same age reach milestones — school, independence, a first love — that one’s own child will not reach, or will reach in a different way than imagined. This does not mean the earlier grief was never worked through: it means this type of loss, by its very nature, resurfaces."}, {"t": "p", "text": "Pauline Boss, the same scholar of ambiguous loss already met in this book, has explicitly linked chronic sorrow to her own theory: here too, the loved person is present, fully, and yet the life imagined for them — and with them — remains absent. It is the same ambiguous-loss structure met elsewhere in this book, applied to a relationship that has always existed, not one that has only just begun."}, {"t": "p", "text": "A point the research stresses clearly, and worth quoting in full: chronic sorrow is not in contradiction with love for one’s child. Often the opposite is true — it is precisely because the love is so complete that the discrepancy between the imagined life and the real one keeps making itself felt."}, {"t": "p", "text": "Olshansky’s theory, developed by observing American families in the 1960s, has also been tested elsewhere. A 2025 study by a group of Saudi researchers, published in JMIR Pediatrics and Parenting, applied the same construct to parents in Saudi Arabia, confirming its presence — the same high scores of sadness tied to thinking about the child’s disability, the same recurring nature of the pain. The authors note, however, a limitation worth reporting with the same honesty: research on chronic sorrow outside Western contexts remains scarce, and what holds for a family in Jeddah may not hold the same way elsewhere in the region."}, {"t": "sh", "text": "A case"}, {"t": "p", "text": "A parent takes their child to a birthday party for a peer, and for a few moments the comparison with the other children the same age reopens a pain that had seemed, years earlier, already worked through. This is not a step backward: it is chronic sorrow showing up exactly as the research describes it — in waves, not in a straight line, never finally concluded."}], "ricorda": "The pain that accompanies the parent of a child with a significant disability is not a grief to be got over once and for all: it is a condition that resurfaces over time, often at moments of comparison with milestones not reached. It does not contradict love for one’s child — it arises, in part, precisely from that love.", "approfondire": ["Simon Olshansky – Chronic Sorrow: A Response to Having a Mentally Defective Child (1962)", "Pauline Boss – the application of ambiguous loss to chronic sorrow (already met in this book)", "Samaa Al Anazi et al. – Examination of Chronic Sorrow Among Parents of Children With Disabilities: Cross-Sectional Study (JMIR Pediatrics and Parenting, 2025)"]}, "29": {"title": "Itinerary 29 — Meaning, faith and gratitude — How can I move through a crisis in my deepest convictions?", "body": [{"t": "p", "text": "This itinerary is different from the one on losing the sense of the path. There the problem was no longer knowing which direction to take. Here the problem is more radical: calling into question the convictions — religious, philosophical, about one’s very identity — that until then had supported every other direction. It concerns those who have a religious faith just as much as those who have never had one: no one is excluded from this kind of crisis."}, {"t": "sh", "text": "Doubt as a stage, not a failure"}, {"t": "p", "text": "The psychologist and theologian James Fowler, of Emory University, built his theory of faith development on more than six hundred interviews, conducted with people aged four to eighty-eight, belonging to different religious traditions — and with people with no religious affiliation at all. His model identifies a stage, typical especially of adulthood, in which received convictions are critically called into question, often with a sense of being lost or even guilty simply for doubting."}, {"t": "p", "text": "The most important point of his research, for anyone going through this crisis, is this: that stage of doubt and critical rebuilding is not a failure of faith or of one’s convictions. In Fowler’s data, it is a recognisable developmental stage — often necessary to reach a later phase in which conviction and doubt manage to coexist, instead of excluding each other."}, {"t": "p", "text": "It is worth reporting, for honesty’s sake, a limitation acknowledged by scholars of religion themselves: Fowler’s theory is based on interviews conducted almost entirely in a late-twentieth-century American context, and several researchers — including the scholar Paul Baxter, who proposed an adaptation to African contexts — have observed that his stages partly reflect cultural assumptions specific to that context, not necessarily a universal path. This does not empty out the underlying insight, that doubt can be a stage and not a failure: it simply means that the precise form that stage takes, according to the most serious criticism of the theory, may not be the same everywhere."}, {"t": "sh", "text": "A case"}, {"t": "p", "text": "Someone who has always known, clearly, what they believed — on a religious level, or simply about who they were — finds themselves, at a certain point in life, no longer recognising themselves in those same certainties. This is not necessarily a final loss: according to the data collected by Fowler, it is more often the beginning of a phase in which convictions are rebuilt on more personal, less inherited foundations, often sturdier than the ones they started from."}], "ricorda": "A crisis in one’s deepest convictions — religious or not — is not necessarily a sign of being permanently lost. Research on faith development recognises it as a common stage, often gone through precisely by those who will end up with more mature convictions, not more fragile ones, than the ones they started with.", "approfondire": ["James W. Fowler – Stages of Faith: The Psychology of Human Development and the Quest for Meaning (Harper & Row, 1981)"]}, "30": {"title": "Itinerary 30 — Meaning, faith and gratitude — How can I welcome what life gives me?", "body": [{"t": "sh", "text": "A name for what happens"}, {"t": "p", "text": "We are prepared to face difficulties far more than we are prepared to welcome positive change. A birth, a love, a recovery, a new job, good news can create as much disorientation as a loss. Joy, too, requires a new sense of bearings."}, {"t": "sh", "text": "What actually helps"}, {"t": "p", "text": "The Method of the Question invites us not to react automatically even to favourable events. The question is not only “Why did this happen?”, but “What responsibilities, possibilities and limits come with this gift?” Welcoming does not mean possessing, but learning to inhabit what changes without taking everything for granted."}, {"t": "sh", "text": "A case"}, {"t": "p", "text": "After years of precarious work, Luca gets the job he wanted. Instead of excitement, he feels fear: he is afraid of not being up to it and of losing what he has gained. The positive event does not remove the questions; it raises new ones. The problem is not the success, but how it is interpreted."}, {"t": "p", "text": "Luca’s reaction, however much it may seem like a quirk of his own, is documented as a genuine cultural pattern. Four 2011 studies by the psychologist Yuri Miyamoto and Xiaoming Ma, published in the journal Emotion, showed that dampening a positive emotion instead of savouring it fully — exactly what Luca does — is significantly more common in East Asian cultures than in Western ones. The cause is not an individual flaw, but a widespread cultural belief: that too positive an emotion can attract negative consequences, and that a dialectical balance between highs and lows is wiser than full-blown enthusiasm. This does not mean Luca’s fear is wrong and needs correcting — it means how a person welcomes good news also depends on which cultural script they have learned, not only on the news itself."}, {"t": "sh", "text": "Orientation itinerary"}, {"t": "table", "rows": [["Manifestation", "Tool", "Origin", "Why it is useful"], ["Good news generates fear.", "Recognising that even positive changes require adjustment.", "Method of the Question", "Normalises a frequent reaction."], ["You fear you don’t deserve what has happened.", "Distinguishing the facts from judgements about yourself.", "Method of the Question", "Avoids unsubstantiated conclusions."], ["Enthusiasm leads to impulsive decisions.", "Giving yourself time to observe.", "Practical prudence", "Allows more considered choices."], ["Everything starts to be taken for granted.", "Cultivating gratitude and responsibility.", "Philosophical and ethical tradition", "Helps you safeguard what has value."], ["The event changes plans and relationships.", "Reformulating your questions about the future.", "Method of the Question", "Every new phase requires a new map."]]}], "ricorda": "The Method of the Question is not useful only when the path becomes difficult. It is also useful when life surprises us with something good, because every gift opens new questions and new responsibilities.", "approfondire": ["Martin Seligman – Learned Optimism (Knopf, 1991)", "Yuri Miyamoto, Xiaoming Ma – Dampening or Savoring Positive Emotions: A Dialectical Cultural Script Guides Emotion Regulation (Emotion, 2011)", "Mihály Csíkszentmihályi – Flow (Harper & Row, 1990)", "Seneca – Letters to Lucilius (gratitude and the use of time)"]}, "31": {"title": "Itinerary 31 — Loss and changing bonds — How can I move through the death of someone I love, whether a person or an animal?", "body": [{"t": "p", "text": "This book has already encountered death from several angles: one’s own (Itinerary 21), that of a child who never arrived (Itinerary 23), the slow death of a parent who disappears while still present (Itinerary 24). What is missing is the most direct case of all: someone who was there, and has died. It is also the case on which research has gathered the most data — often in contrast with what one would expect from a bereavement."}, {"t": "sh", "text": "Not a single path, but several"}, {"t": "p", "text": "The model most widespread in the popular imagination, Elisabeth Kübler-Ross’s stage model, assumes a single path: shock, denial, anger, bargaining, depression, acceptance. The most solid research tells a more complex story. Following thousands of widowed spouses for years, the psychologist George Bonanno — already met in this book — has identified at least four distinct paths, not just one: resilience, that is, continuing to function with real pain but without a prolonged collapse, turns out to be the most common; some people go through a slower recovery, which settles within a year or two; another, smaller part develops a chronic grief that does not ease over time; and in some cases, surprisingly, those who were already living with depressive suffering before the loss show improvement afterwards — a sign that that specific relationship was itself a source of difficulty. None of these paths is “the right one”: they are simply the paths research most often observes."}, {"t": "sh", "text": "Letting go, or continuing the bond?"}, {"t": "p", "text": "Kübler-Ross’s stage model shares an older assumption, going back to Freud, that is worth making explicit: that the ultimate goal of a healthy bereavement is, in some form, to “let go” of the person who is no longer there, in order to reinvest one’s energies elsewhere. In 1996 the scholar Dennis Klass, together with Phyllis Silverman and Steven Nickman, gathered research that calls this premise into question, showing that maintaining a continuing bond with someone who has died — talking to them, sensing their presence, including them in one’s decisions — is a widespread and healthy experience, not a sign of unresolved grief. Bonanno himself, for that matter, does not ask anyone to let go: his resilience model describes those who continue to function, not those who sever the bond, and he is among the authors who, in more recent years, have explored precisely the link between resilience and continuing bonds, including from a cross-cultural angle. A dedicated chapter describes in detail how, in Japanese culture, ancestor worship makes this continuing bond a daily, institutionalised practice, not a psychological exception: the deceased remains an active part of the family, consulted before a small household altar. The authors argue that the “letting go” model reflects the values of Western modernity more than a universal fact about healthy grieving."}, {"t": "sh", "text": "A case"}, {"t": "p", "text": "After the death of her husband, with whom she had shared forty-three years, a woman fears she will no longer be able to manage anything. In the months that follow, almost to her own surprise, she finds herself cooking for herself, calling a friend back, returning to the parish choir — while the pain remains, whole, every evening. This is not inconsistency, nor a sign that she did not love him enough: it is, according to the most solid data available, the most common form grief actually takes."}, {"t": "sh", "text": "When death was not announced: bereavement by suicide"}, {"t": "p", "text": "Grief for a suicide shares with other bereavements the same paths described above, but research treats it as a case apart, for a precise reason: those left behind often find themselves grappling not only with the absence, but with the absence of an explanation. In 1972 the psychologist Edwin Shneidman, among the founders of modern suicidology, coined the term postvention to describe the work — clinical, community-based, research-based — directed at those who survive a suicide within their family or among people close to them. The term itself signals something important: caring for those who remain is not a minor appendix to caring for those who suffer to the point of taking their own life, but a field in its own right, with its own needs."}, {"t": "sh", "text": "Why the signs seem clear only afterwards"}, {"t": "p", "text": "The question “how did I fail to notice” assumes that the signs were there, visible, and that not seeing them was a failing. Research on this point tells a different story, and it is worth knowing before letting that question become a verdict on oneself."}, {"t": "p", "text": "In 1975 the psychologist Baruch Fischhoff first described a mechanism that today has a precise name, hindsight bias: once we know the outcome of an event, the mind automatically reorganises memories so as to make that outcome seem coherent, predictable, almost inevitable — even when, at the moment the facts were unfolding, nothing made it predictable. Fischhoff measured this by asking two groups of people to assess the probability of certain events: those who already knew the outcome systematically judged that outcome more predictable than those who had yet to find it out. This is not an isolated error: it is one of the most replicated effects in all of cognitive psychology, and it is exactly the effect at work when someone, after a suicide, looks back and finds “signs” that at the time, reasonably, were not signs at all."}, {"t": "p", "text": "Added to this is a more technical finding: studies that reconstruct a suicide after the fact through interviews, medical records and testimony — a method called psychological autopsy, developed by Shneidman himself together with Norman Farberow — show that communications of suicidal intent, when they exist, are in most cases indirect, ambiguous, or disguised as everyday complaints (“I’m tired”, “it would be easier for everyone if I weren’t around”), not explicit announcements. Some studies on the impulsiveness of the act, moreover, show that in a non-negligible share of cases the time between the decision and the act is measured in minutes, not days — which makes a margin for observation, however attentive, almost impossible to achieve in time, almost by definition. This does not mean that, in some cases, a sign was not genuinely present: it means that the way we remember it today — sharp, unambiguous, impossible not to see — is almost always a reconstruction the mind performs afterwards, not a faithful photograph of what could actually be perceived at that moment. Those who did not notice, in most documented cases, did not fail at a task that was genuinely within their reach."}, {"t": "p", "text": "Anyone who was present, or who lived alongside the person, therefore often goes through a grief complicated by a further weight: that recurring question tends to turn quickly not into specific guilt — a precise behaviour, missed at a precise moment — but into a global judgement on themselves, of the kind already distinguished in Itinerary 15: not “I was wrong not to notice”, but “I am a person who was not capable of protecting someone I loved”. This is exactly the mechanism that itinerary invites us to counter, bringing the judgement back from the self to the behaviour — here, the behaviour in question is often unrecognisable even at close range, not through negligence, but because that is how it presents itself in most documented cases."}, {"t": "p", "text": "The clinical psychologist John Jordan, among the researchers who have studied this type of bereavement the longest, observes that survivors of a suicide report, compared with other bereavements, higher levels of shame, perceived responsibility and isolation — often made worse by the social stigma that still surrounds suicide, a further form of the unauthorised grief encountered several times in this book. The most recent estimates of the scale of the phenomenon, produced by the researcher Julie Cerel and colleagues, indicate that every suicide leaves a measurable mark on a far larger number of people than previously thought: not only the closest family members, but friends, colleagues, neighbours."}, {"t": "sh", "text": "The risk for those left behind"}, {"t": "p", "text": "There is a question many survivors ask themselves and struggle to say out loud: whether this could, in some way, happen again — whether living closely through a suicide makes it more likely to happen to those who remain as well. Research does not hide this finding: a large Swedish study of 11.4 million people, carried out by Dag Tidemalm and colleagues in 2011, confirmed that having a family member who died by suicide is associated with a higher risk of suicide oneself, independently of any diagnosed psychiatric disorder. An earlier Danish study using national registries, by Ping Qin, Esben Agerbo and Preben Mortensen (2002), had reached the same conclusion: a family history of suicide is a risk factor in its own right, which adds to, but is not reducible to, the psychiatric one."}, {"t": "p", "text": "This finding should not be read as a sentence: the great majority of those who survive a suicide within their family never come close to such an act themselves, and the risk measured by these studies is relative, not an individual fate. It is, instead, the reason why Shneidman’s postvention is not only an act of care for the pain of those who remain, but a genuine form of prevention: the specific support groups, the treatment of prolonged grief when needed, and the breaking of isolation described in this Itinerary are, in the literature, among the factors that reduce precisely that added risk. Caring for those who remain is not only humane: for them, it is a real protective measure."}, {"t": "sh", "text": "Continuing to live: what research says about “afterwards”"}, {"t": "p", "text": "The question that follows the pain — how does one go on — has a partial answer in research, and it is worth distinguishing three different levels, because they call for different tools."}, {"t": "p", "text": "The first is time. As shown at the start of this Itinerary, the most common trajectory of a bereavement — even of this kind — is not the disappearance of pain, but the gradual recovery of the capacity to function alongside it. Expecting to “work through” grief by a set deadline finds no support in the data, and can turn into a further judgement on oneself when that deadline, inevitably, is not met."}, {"t": "p", "text": "The second level is when the pain does not follow that trajectory. The psychiatrist Katherine Shear, at Columbia University, has developed and validated in numerous randomised clinical trials a specific treatment, Complicated Grief Treatment, for cases — a minority, but not a rare one, and more frequent precisely in bereavement by suicide — in which the pain remains acute, invasive, and continues to interfere heavily with daily life well beyond a year. Her work has helped this condition be recognised, since 2022, as a clinical category in its own right in the diagnostic manual DSM-5-TR, under the name prolonged grief disorder: not to pathologise intense pain, but to make a specific treatment available to those who remain stuck in a form of grief different from others. Recognising when one is in this condition — not because of the pain itself, but because of its persistent interference with everyday living — is what allows a person to seek this kind of help, if needed, instead of waiting for it to pass on its own."}, {"t": "p", "text": "The third level is the specific loneliness of this bereavement, for which research converges on a fairly clear-cut answer: contact with other survivors of a suicide reduces shame and isolation in a way that generic support, however well-intentioned, rarely manages to replicate. Jordan himself, together with other researchers in the field, has documented how peer groups — people who share the same specific experience, not a generic bereavement — offer a place where the unanswered question can be spoken without needing to be justified, and where self-judgement meets a counterpoint made up of people who have gone through exactly the same doubt."}, {"t": "sh", "text": "A third case"}, {"t": "p", "text": "A twenty-year-old daughter is at home when her mother jumps from the balcony. In the months that follow she asks herself every day what she could have noticed, what she could have said, which morning had been the decisive one. She finds no answer, because that answer — in most cases research has documented — simply does not exist in a form she could have seen in time. The pain for her mother and the process of living with the absence of an explanation remain two separate struggles, and the second, often, is the longer one to move through."}, {"t": "sh", "text": "An animal is not “just an animal”"}, {"t": "p", "text": "The loss of an animal one has lived with for years shares many of its clinical features with the grief for a person — with a further complication this book has already met elsewhere under another name. In 1989 the psychologist Kenneth Doka coined the expression disenfranchised grief, to describe losses that those around tend not to fully recognise (Itinerary 10). More recent research, in particular that of the psychologist Millie Cordaro, has explicitly applied this concept to the loss of a pet: anyone grieving a dog or a cat often runs into reactions such as “it was just an animal”, which do not ease the pain but isolate it, depriving it of the social recognition that normally accompanies a bereavement — permission to take time off work, condolences, shared rituals."}, {"t": "p", "text": "For someone living alone, or who went through particularly difficult years alongside that animal, the bond can be built around a daily, unconditional presence hard to replace with other human relationships over the same period. This does not mean equating every animal loss with that of a person: it means recognising that, when it happens, the pain that follows is real, measurable, and does not deserve to be quietly dismissed."}, {"t": "sh", "text": "A second case"}, {"t": "p", "text": "A man living alone spends twelve years structuring his days around his dog — the same walks, the same times, the same silent presence at home. When the dog dies, a colleague remarks: “At least it wasn’t a person.” The man nods, and does not speak of it to anyone for months — not because the pain was smaller, but because he had learned, in that moment, that he was not authorised to show it."}, {"t": "sh", "text": "Where to look for help"}, {"t": "p", "text": "Bereavement support groups, often organised by local associations or hospitals, offer a space where pain does not need to be explained or justified. For the loss of an animal, dedicated helplines now exist, often run by veterinary universities or sector associations, designed specifically for a grief that elsewhere struggles to find recognition. Psychological support specialising in grief processing remains the most suitable resource when the pain, in any of its forms, interferes for a long time with daily life. In Italy, besides the emergency number 112, Telefono Amico Italia (02 2327 2327, open every day) also offers a listening line for anyone going through a bereavement. For bereavement by suicide specifically, the De Leo Fund in Padua — founded by the psychiatrist Diego De Leo, among Italy’s leading experts in suicidology — is the most specific national point of reference: it offers support groups led by people who have lived through the same experience, as well as confidential correspondence with trained staff. The portal prevenireilsuicidio.it, run by the Suicide Prevention Service of Sant’Andrea Hospital in Rome, keeps an updated list of active mutual-support groups across the country."}], "ricorda": "Grief for the death of someone we love does not follow a single track: resilience — continuing to function, while still being inside real pain — is the most common outcome, not a sign of detachment. The same holds, with its own particular features, for the loss of an animal: the pain that follows is real even when those around minimise it, and it needs no one’s permission to be legitimate. Bereavement by suicide, in particular, is not an “extra” bereavement: it has its own literature, a technical name — postvention — and a higher risk of guilt sliding into a global shame about oneself, often fed by a hindsight that makes “obvious” only in retrospect what, at the moment it was happening, almost never was.", "approfondire": ["George A. Bonanno – The Other Side of Sadness: What the New Science of Bereavement Tells Us About Life After Loss (Basic Books, 2009)", "George A. Bonanno et al. – Resilience to Loss and Chronic Grief: A Prospective Study of Bereaved Spouses (Journal of Personality and Social Psychology, 2002)", "Dennis Klass, Phyllis R. Silverman, Steven L. Nickman (eds.) – Continuing Bonds: New Understandings of Grief (Taylor & Francis, 1996)", "Kenneth Doka – Disenfranchised Grief: Recognizing Hidden Sorrow", "Millie Cordaro – Pet Loss and Disenfranchised Grief: Implications for Mental Health Counseling Practice (Journal of Mental Health Counseling, 2012)", "Baruch Fischhoff – Hindsight ≠ Foresight: The Effect of Outcome Knowledge on Judgment Under Uncertainty (Journal of Experimental Psychology: Human Perception and Performance, 1975)", "Edwin S. Shneidman – Definition of Suicide (John Wiley & Sons, 1985)", "John R. Jordan and Bob Baugher – After Suicide Loss: Coping With Your Grief (Caring People Press, 2016)", "Julie Cerel et al. – How Many People Are Exposed to Suicide? Not Six (Suicide and Life-Threatening Behavior, 2018)", "Ping Qin, Esben Agerbo, Preben B. Mortensen – Suicide Risk in Relation to Family History of Completed Suicide and Psychiatric Disorders (The Lancet, 2002)", "Dag Tidemalm et al. – Familial Clustering of Suicide Risk: A Total Population Study of 11.4 Million Individuals (Psychological Medicine, 2011)", "M. Katherine Shear et al. – Treatment of Complicated Grief: A Randomized Controlled Trial (JAMA, 2005)", "Christopher Lukas and Henry M. Seiden – Silent Grief: Living in the Wake of Suicide (Jessica Kingsley Publishers, 2007)"]}, "32": {"title": "Itinerary 32 — Violence and manipulation — How can I recognise physical, psychological or economic violence, and manipulation?", "body": [{"t": "p", "text": "Not every clash between two people is a conflict between equals. Itinerary 20 spoke of conflicts in which both parties, even while disagreeing, remain on an equal footing — where distinguishing facts from interpretations, or separating people from the problem, can genuinely help. Here the situation is different. When there is violence or manipulation, there is no equality to restore: there is an imbalance of power expressed through controlling behaviour towards the other person."}, {"t": "p", "text": "**Not only physical violence**"}, {"t": "p", "text": "For decades, domestic violence was thought of almost solely in terms of isolated physical assault. The American sociologist Evan Stark proposed a more precise concept: coercive control — a continuous pattern of behaviours, often without obvious physical violence, which together deprive a person of their freedom and autonomy. Isolation from friends, control of money, constant belittling, monitoring of movements: none of these elements, taken alone, always looks serious. It is the pattern as a whole, not the isolated episode, that defines the violence."}, {"t": "p", "text": "Economic violence — denying access to money, preventing someone from working, controlling every expense — is often the least recognised of the three forms, and one of the most effective at making it harder to leave."}, {"t": "p", "text": "**When doubting yourself is the symptom, not the cause**"}, {"t": "p", "text": "In psychological manipulation, particularly in what is now called gaslighting (the term comes from Gaslight, a 1938 stage play later made into a film in 1944, in which a husband gradually manipulates his wife into believing she is going mad — among other things, he deliberately dims the house’s gas lights and then denies it happened when she notices), the abuser leads the victim to systematically doubt her own perception of reality — “that’s not how it happened”, “you’re too sensitive”, “am I making this up?”, repeated until it erodes the person’s trust in what she has seen, heard, remembered with her own faculties. Here the Method of the Question must be handled with particular care: distinguishing facts from interpretations is a valuable tool almost everywhere in this book, but in a manipulative relationship it can unintentionally become one more way of calling one’s own perception into question. The point here is not to check more thoroughly whether what one feels is justified: it is learning to trust a persistent unease, even when it cannot be precisely explained."}, {"t": "sh", "text": "**A case**"}, {"t": "p", "text": "At first it looked like care. Her partner wanted to know how every euro was spent — “so we can organise things better”, he said. Then the cards all passed to him — “so you don’t have to think about it”. When she went out with a friend, she would come back to a comment about how much that friend “turned her against him”, repeated often enough that she stopped, on her own, suggesting other outings. When she tried to say something was wrong, she would hear that she was overreacting, that no one had ever been so patient with her. There was not a single moment at which she could have pointed with certainty to the start of the violence. This is exactly what makes coercive control so hard to recognise from the inside: it does not arrive as an event, it arrives as a habit built one step at a time."}, {"t": "sh", "text": "**Orientation itinerary**"}, {"t": "table", "rows": [["Manifestation", "Tool", "Origin", "Why it is useful"], ["You suffer physical assaults, even isolated ones or ones minimised as “accidents”", "Recognising that any physical violence, even a single time, is violence — not an episode to justify", "Istanbul Convention, Council of Europe (2011, ratified by Italy in 2013)", "Names the act precisely, as a first step toward not minimising it"], ["You feel constantly belittled, controlled or second-guessed by someone close to you", "Recognising coercive control as a pattern, not as isolated individual episodes", "Evan Stark — Coercive Control", "Shifts attention from the single episode to the overall design"], ["You have no access to money, or every expense must be justified or authorised", "Naming economic violence as a form of violence in its own right, not normal household management", "Power and Control Wheel, Duluth Model", "Makes visible a form of control often not recognised as violence"], ["You systematically doubt your own perception after talking with this person", "Recognising gaslighting: trusting persistent unease, even without being able to explain it precisely", "Marie-France Hirigoyen — Stalking the Soul", "Restores value to your own perception, instead of continuing to question it"], ["You have cut yourself off from friends or family who “didn’t understand” the relationship", "Recognising isolation as a recurring tactic, not an independ
