. It answers a different question: not what kind of work needs doing right now — observing, deciding, regaining clarity — but how long the difficulty will remain one."}, {"t": "p", "text": "Some conditions have no solution: a serious illness, the death of a loved one, one’s own mortality, a war. The Method of the Question does not stop working in the face of these conditions, but its purpose changes: not to find an answer that makes them disappear, but to remain clear-headed and present while we live through them."}, {"t": "sh", "text": "Before going on"}, {"t": "p", "text": "This itinerary is not a guide to processing bereavement, a serious diagnosis or a war-related trauma, and it does not replace psychological, medical or spiritual support. It names a few perspectives developed by philosophy, psychology and ethics over the centuries, pointing — for genuine support — to qualified professionals."}, {"t": "sh", "text": "Orientation itinerary"}, {"t": "table", "rows": [["Manifestation", "Tool", "Origin", "Why it is useful"], ["A loss that feels unbearable", "Grief processing with professional help Giving yourself time, with no deadline", "Grief psychology", "Grief does not follow a fixed order: knowing this reduces the sense of “getting it wrong”."], ["A suffering you cannot remove (illness, permanent loss)", "Seeking meaning within the suffering, not outside it", "Viktor Frankl — logotherapy", "Helps you stay yourself even when the pain cannot be taken away."], ["Circumstances that do not depend on you (a diagnosis, war, other people’s choices)", "Distinguishing what depends on you from what does not", "Epictetus — the dichotomy of control (Stoicism)", "Focuses your energy on what you can actually influence."], ["The need to pass judgement on a conflict or collective violence", "Ethical criteria for assessing a conflict: proportionality, last resort, protection of civilians", "The just-war tradition; international humanitarian law", "Offers a shared language for reasoning, without claiming to ease the pain."], ["The pain becomes so intense it blocks daily life", "Turning to a professional: psychotherapist, grief counsellor, doctor", "Clinical psychology", "Some suffering calls for help that no book can replace."], ["You struggle to accept that something has already happened, or keep fighting a reality you cannot change", "Radical acceptance: acknowledging the fact without fighting it, distinguishing acceptance from approval", "Marsha Linehan — dialectical behaviour therapy", "Pain is often unavoidable; the suffering added by resisting what cannot be changed, often is not."]]}, {"t": "p", "text": "Frankl’s logotherapy rests on one central idea: the deepest human drive is not to avoid pain, but to find meaning — even within pain that cannot be avoided. Frankl identified three ways of finding it: through a work completed or creative labour; through love for a person or an experience lived fully; or, when the first two are not open to us, through the attitude we choose to hold in the face of suffering that cannot be changed. This last path — which he called a “tragic optimism” capable of turning into a yes to life despite everything — is the one he developed by observing himself and other prisoners in the Nazi concentration camps."}, {"t": "p", "text": "The three criteria of the just-war tradition, recalled in the table, can be summarised as follows: proportionality, the harm caused must not exceed the expected benefit; last resort, a conflict is justifiable only if every peaceful alternative has genuinely been exhausted; protection of civilians, those not taking part in the fighting can never be a legitimate target. These are not criteria that say whether a specific conflict is just or unjust in the abstract — they offer a shared language for reasoning about it, instead of being left at the mercy of emotional reaction alone."}, {"t": "sh", "text": "A case — the dichotomy of control"}, {"t": "p", "text": "A serious diagnosis arrives without warning. The illness itself, its biological course, the body’s response to treatment do not depend on us: in Epictetus’s language, they are “not within our power”. What remains within our power is how we respond: which treatments to seek, with whom to share the burden, how to use the time we have. The dichotomy of control does not promise to reduce the pain, nor to govern the outcome: it only promises not to waste what energy remains fighting what cannot be changed."}], "ricorda": "Not every problem can be solved: some must be lived through. Looking for meaning does not mean justifying suffering, nor making it any less real. Asking for help is not a failure of the Method of the Question: it is an integral part of it.", "approfondire": ["Viktor Frankl – Man’s Search for Meaning (Verlag für Jugend und Volk, 1946; English ed. Beacon Press, 1959)", "Epictetus – Enchiridion", "Elisabeth Kübler-Ross – On Death and Dying (Macmillan, 1969)", "Augustine of Hippo – The City of God (De Civitate Dei); Thomas Aquinas – Summa Theologiae (II-II, q. 40, just-war theory)", "International Committee of the Red Cross – Geneva Conventions (1949) and Additional Protocols", "Marsha M. Linehan – DBT Skills Training Manual, 2nd edition (Guilford Press, 2015)"]}, "8": {"title": "Itinerary 8 — The limit that will not move — How can I think clearly while caught in a condition that does not depend on me?", "body": [{"t": "p", "text": "If you struggle to plan ahead, if urgent decisions stop you seeing beyond the immediate, if it feels as though you cannot resist a temptation you would not even consider with a clear head — and you live in a condition of economic, time or resource scarcity — this itinerary begins with something that must be said before anything else: this is not your fault, and it is not a flaw in your character."}, {"t": "p", "text": "The most rigorous research on this subject has shown that scarcity is not only a material condition: it is a state that directly consumes the capacity to reason well. Not because the person living with it is any less capable — but because a substantial part of their mind is constantly occupied managing what is missing. Anyone who has spent years telling someone in financial difficulty to “make better choices” has, usually without realising it, reversed cause and effect."}, {"t": "p", "text": "How much of one’s economic position really depends on one’s own choices, and how much on the context one is born into, is no longer only a philosophical question: research by the Harvard economist Raj Chetty has turned it into an empirical one, with a fairly clear-cut answer. Mapping the adult incomes of millions of people against the neighbourhood they grew up in, Chetty calculated that around sixty per cent of the income variation between neighbourhoods is causal in nature, not merely statistical: the same child, raised in two different neighbourhoods, would have a different expected income as an adult — not because of different merits, but simply because of growing up in one place rather than another."}, {"t": "p", "text": "A later study, carried out on seventy-two million people using social-network data, added an even more precise detail: having, as children, friendships with higher-income families turns out to be one of the strongest predictors of economic mobility in adulthood — stronger, in many cases, than the quality of the school attended. It is not how much you study, but who you grow up with."}, {"t": "p", "text": "One last figure places all this in time: someone born in America in 1940 had a ninety per cent chance of earning more, as an adult, than their parents. For someone born in the 1980s, that probability has fallen to around fifty per cent. This is not a snapshot of a lazier generation than the one before it: it is a snapshot of a social mobility that has narrowed, measurably, independently of individual choices."}, {"t": "p", "text": "These figures, too, lead to the same conclusion already met in this itinerary: the economic position we find ourselves in depends, to a surprisingly large extent, on factors no one chooses — place of birth, the networks we move in from childhood, the era we grow up in. Recognising this is not an excuse for inaction: it is the necessary premise for understanding where individual responsibility ends and where something else begins."}, {"t": "sh", "text": "Before going on"}, {"t": "p", "text": "This itinerary does not offer a technique for escaping poverty, and it would be dishonest to let it suggest otherwise. Earlier itineraries presented tools a person can apply alone, quickly, to return to a condition in which the Method of the Question, or other suitable tools, becomes available again. Here the situation is different: no individual technique dissolves a structural condition. What this itinerary can offer is more modest and, perhaps, just as useful: helping you recognise the mechanism for what it is, not waste what energy remains on blaming yourself, and direct what is left of your attention towards what is genuinely within your control."}, {"t": "sh", "text": "A case"}, {"t": "p", "text": "Someone living on an unstable income forgets to reply to an important email from their employer. Seen from outside, it looks like negligence. Seen from within, that week their mind was occupied working out whether the money would last until the end of the month, deciding which bill to put off, dealing with an unexpected rent problem. What they lacked was not the will to reply to the email: it was the cognitive bandwidth to hold it in mind alongside everything else. Recognising this mechanism — called tunnelling by those who have studied it — does not excuse every consequence, but it radically changes the question to ask: not “why am I so disorganised”, but “how can I reduce the number of things my mind has to keep in balance at the same time”."}, {"t": "p", "text": "The tunnelling mechanism has also been tested outside the United States. A group of Colombian researchers, led by Felipe González-Arango, replicated the original experiment in 2022 with four hundred and seventeen secondary-school students in Bogotá, from both high and low socioeconomic backgrounds. The result confirmed the cognitive cost of scarcity, but added something the original study had not captured: low-income students also showed more developed specific skills precisely in managing scarcity scenarios — a kind of “hidden talent” built by necessity. The authors called it the duality of poverty: a real, measurable cost, which does not rule out equally real skills developed precisely to cope with it."}, {"t": "sh", "text": "Orientation itinerary"}, {"t": "table", "rows": [["Manifestation", "Tool", "Origin", "Why it is useful"], ["You struggle to plan beyond the immediate, caught up in constant urgencies", "Recognising tunnelling as an effect of scarcity, not a personal flaw", "Mullainathan and Shafir, behavioural economics (replicated in Colombia, see text)", "Reduces self-blame and allows you to act on the load rather than on your character."], ["You make decisions that, seen from outside, look irrational", "Simplifying or automating less important everyday choices, to save mental resources", "Same source — cognitive bandwidth", "Frees up attention for the decisions that really matter."], ["You feel responsible for your economic situation", "Distinguishing what depends on you from what does not", "Epictetus — the dichotomy of control, already met in this book", "Directs limited energy toward what you can actually influence."], ["You want to understand your situation in broader terms than income alone", "The capability approach: poverty as a lack of real freedoms, not only of money", "Amartya Sen, development economics", "Helps you see which freedoms can still be cultivated or claimed."], ["You are looking only for individual solutions to a problem that is also structural", "Recognising when collective action is needed — mutual aid, organising, public policy", "Development economics (Banerjee and Duflo)", "Avoids carrying alone a burden that is, in part, systemic."]]}], "ricorda": "Economic scarcity consumes real, measurable cognitive resources: it is not a matter of character or willpower. No individual technique resolves a structural condition — but recognising it reduces the added weight of feeling guilty. Distinguishing what depends on you from what requires collective action is, here too, an act of clarity.", "approfondire": ["Sendhil Mullainathan and Eldar Shafir – Scarcity: Why Having Too Little Means So Much (Times Books/Henry Holt, 2013)", "Felipe González-Arango, Javier Corredor et al. – The Duality of Poverty: A Replication of Mani et al. (2013) in Colombia (Theory and Decision, 2022)", "Amartya Sen – Development as Freedom (Knopf, 1999)", "Abhijit Banerjee and Esther Duflo – Poor Economics (PublicAffairs, 2011)", "Epictetus – Enchiridion (already met in this book)", "Raj Chetty et al. – The Fading American Dream: Trends in Absolute Income Mobility Since 1940 (Science, 2017; Opportunity Insights, Harvard)"]}, "9": {"title": "Itinerary 9 — Work and rebuilding — How can I take action to find a job, right after losing one or for the first time?", "body": [{"t": "p", "text": "This itinerary is different from the previous one. Itinerary 8 said, honestly, that no individual technique dissolves a structural condition such as chronic poverty. Here the situation is partly different: job hunting remains shaped by factors that do not depend on you — economic cycles, discrimination, automation, the sector you are looking in — but there is also a real lever, measured by research, that a single person can pull on their own."}, {"t": "sh", "text": "Before going on"}, {"t": "p", "text": "No tool here guarantees you will be hired, and it would be dishonest to let it suggest otherwise. What this itinerary offers is more precise: knowing where, statistically, the real opportunities actually lie, instead of relying only on instinct or the effort of sending applications into the void."}, {"t": "sh", "text": "A case"}, {"t": "p", "text": "Right after losing a job, or when looking for a first job, the first move is to write to your three or four closest friends: they are the easiest people to reach, the ones who reply straight away. But the job, in the end, comes from an unexpected conversation with a former colleague from ten years before, met by chance at a dinner, through an acquaintance. This is not blind luck: it confirms a thoroughly studied mechanism. Close friends usually know more or less the same people and the same opportunities you already know. A distant acquaintance is a bridge to information you would otherwise never reach."}, {"t": "p", "text": "Jahoda’s model, born in Marienthal in the 1930s, has also been tested outside the Western context. A 2015 study by the psychologist Timo Gnambs, published in the Scandinavian Journal of Psychology, compared unemployed people in the United States and Japan: in both countries unemployment harms wellbeing, but the mechanism differs. In the more individualist culture, the damage comes mainly from the loss of status and income. In the more collectivist one, it comes mainly from the loss of a purpose shared with others — not one’s own position, but belonging to a common effort. What losing a job takes away also depends on what kind of bond one’s culture builds between the individual and the collective."}, {"t": "sh", "text": "Orientation itinerary"}, {"t": "table", "rows": [["Manifestation", "Tool", "Origin", "Why it is useful"], ["You feel disoriented, as well as worried about money", "Recognising that work also provided structure, contacts, a purpose — not only income", "Marie Jahoda, the Marienthal study (1933) (tested cross-culturally, see text)", "Helps you understand why the void it leaves is wider than the financial problem alone."], ["You job-hunt by turning only to your closest circle", "Also activating weak ties: former colleagues, distant acquaintances, occasional contacts", "Mark Granovetter — the strength of weak ties", "Weak ties give access to information your close circle does not have."], ["You feel the urgency to act immediately", "It is natural to turn to your close circle first — but not to stop there", "Granovetter, Getting a Job", "Those who find work only through strong ties stay unemployed longer, on average."], ["You miss your old routine", "Rebuilding daily structures: timetables, small goals, regular activities", "Marie Jahoda", "Partly replaces what the job provided beyond a salary."], ["You wonder whether effort or who you know counts for more", "Both matter, but networks carry more weight than people think", "Raj Chetty, already met in Itinerary 8", "Directs some of your energy toward widening your network too, not only toward applications."]]}], "ricorda": "No strategy guarantees being hired: factors that do not depend on you remain in play. But weak ties — acquaintances, not close friends — are statistically the most effective channel for finding real opportunities. Losing a job is not only losing an income: it is worth recognising everything else that goes missing too, without feeling it as a weakness.", "approfondire": ["Mark Granovetter – The Strength of Weak Ties (American Journal of Sociology, 1973); Getting a Job: A Study of Contacts and Careers (Harvard University Press, 1974)", "Marie Jahoda, Paul Lazarsfeld and Hans Zeisel – Marienthal: The Sociography of an Unemployed Community (Die Arbeitslosen von Marienthal, S. Hirzel, 1933)", "Timo Gnambs, Barbara Stiglbauer, Eva Selenko – Psychological Effects of (Non)Employment: A Cross-National Comparison of the United States and Japan (Scandinavian Journal of Psychology, 2015)"]}, "10": {"title": "Itinerary 10 — Loss and changing bonds — How can I face loneliness and bonds that break?", "body": [{"t": "p", "text": "Not all the wounds in this book are born from a sudden event. Some form slowly, almost without our noticing: a friendship that drifts apart with no clean break, a love that ends, a family with no dialogue and no one who ever formally decided to close the door. It is not war, it is not grief for a death. It is a quieter kind of pain and, for that very reason, often taken less seriously — even by the person living through it."}, {"t": "p", "text": "In 2023 the Surgeon General of the United States — the country’s highest public health authority — published a report declaring loneliness a public health epidemic, with measurable consequences: social isolation increases the risk of premature death by 29 per cent, an effect comparable to smoking fifteen cigarettes a day. This is not a figure of speech: it is an estimate built using the same methods used to measure cardiovascular risk."}, {"t": "p", "text": "One finding, however, complicates an easy assumption: that in more communal cultures, where bonds are by definition closer, loneliness is less widespread. A 2019 study by the psychologist Luzia Heu and colleagues, at the University of Groningen, published in Personality and Social Psychology Bulletin, compared several European countries and confirmed that collectivism does protect against loneliness, on average — but with a nuance worth knowing. The authors had also hypothesised a different mechanism: that the higher ideal of connection typical of collectivist cultures might create a gap, when not reached, capable of producing more loneliness. The data did not confirm this second hypothesis. What does hold up is that individualism carries a specific, real risk — less actual social connection, not merely perceived — while collectivism, overall, remains protective. Connection itself genuinely protects."}, {"t": "sh", "text": "Before going on"}, {"t": "p", "text": "This itinerary treats loneliness as a widespread condition, and the end of a relationship as an experience that deserves to be taken seriously, not as a clinical problem. If the loneliness is deep, persistent, or accompanied by suffering that does not pass, what was said in Itinerary 1 still holds: recognising the limit of your own resources and turning to a professional is not a failure, it is part of clarity."}, {"t": "sh", "text": "A case"}, {"t": "p", "text": "Two friends write to each other less and less, with no argument, no clear reason. Each waits for the other to write first, and the silence stretches on until it feels too late to break it without first having to explain how they lost touch. Neither would say they are grieving — and yet what they feel, when they think about it, is exactly that: the loss of something that mattered, with no funeral, with no one asking how they are. A real pain, rarely granted the right to be lived as such."}, {"t": "p", "text": "The end of a romantic relationship is, among all the bonds that break, the one science has devoted the most attention to — and the results confirm something anyone living through it already knows, but rarely hears stated with this precision: the social psychologist Ethan Kross and colleagues showed, with MRI scans, that romantic rejection activates the same brain areas as physical pain — the secondary somatosensory cortex and the posterior insula. “Having your heart broken” is not, from the brain’s point of view, just a figure of speech. This explains why, after a break-up, simple tasks like concentrating or sleeping become as hard as after a physical trauma."}, {"t": "sh", "text": "A second case"}, {"t": "p", "text": "After the end of a long relationship, the strongest temptation is often to stay in touch — checking social media, replying to a message “just to clear things up”, leaving a door half open. Attachment research shows this is almost always the choice that prolongs the suffering, not the one that shortens it: maintaining contact, even minimal, with an ex-partner is associated with slower recovery and more persistent distress. Because the attachment system keeps looking for the person who activated it, and every contact reactivates it instead of letting it wind down."}, {"t": "sh", "text": "**A third case**"}, {"t": "p", "text": "Anyone who has lived with an animal for years knows that the time they share almost always has a deadline nearer than their own. The thought of its absence can arrive even while it is still there, beside them, asleep on the sofa — a grief that begins before the loss itself, often without the person feeling it knowing what to call it."}, {"t": "sh", "text": "Orientation itinerary"}, {"t": "table", "rows": [["Manifestation", "Tool", "Origin", "Why it is useful"], ["You feel lonely even surrounded by people", "Distinguishing the quantity of contacts from the quality of the connection", "Vivek Murthy, US Surgeon General (2023)", "Loneliness depends on how truly seen you feel, not on how many people you spend time with."], ["You wonder whether it’s worth investing time in relationships rather than in work or success", "Quality relationships are the strongest predictor of health and happiness over the long term", "Robert Waldinger, Harvard Study of Adult Development (85 years of data)", "It is the longest study ever conducted on adult life: no other factor, measured with the same rigour, carries the same weight."], ["A friendship or family bond has drifted apart without a clean break", "Recognising this as real grief, even without an event to mark it", "Unauthorised grief, already met in this book", "Naming the loss is the first step to moving through it, instead of ignoring it."], ["You don’t know where to start in rebuilding a connection", "Small, constant gestures count for more than rare grand ones", "Waldinger, Harvard Study of Adult Development", "The study shows that steady care over time, not occasional intensity, is what keeps relationships alive."], ["A love story has ended and you struggle to concentrate or sleep", "Recognising that the pain has a measurable physical basis, not only an emotional one", "Ethan Kross and colleagues, neuroimaging of romantic rejection", "Explains why the body, not only the mind, seems to react as to a real wound."], ["After a break-up, you feel the need to stay in touch with your ex-partner", "Cutting off contact, even minimal, almost always speeds up recovery", "Attachment research (Marshall and others)", "Every contact reactivates the attachment system instead of letting it run its course."], ["The mere thought of losing an animal you love takes your breath away, even while it is still with you", "Naming this pain as real and legitimate — it begins before the loss, not after, and does not need to wait for the event to be taken seriously", "Kenneth Doka, disenfranchised grief (1989)", "Anticipatory grief is not an exaggeration: it is the same emotional response to a bond whose certain end is known from the very beginning."], ["", "", "", ""]]}], "ricorda": "Loneliness is not a character flaw: it is a condition with measurable physical consequences, recognised as such by public health authorities. The quality of relationships matters more than their quantity, and is the most solid factor ever measured for a long, satisfying life. A bond that drifts apart with no break, a love story that ends, or the loss of an animal with whom life was shared, are still a loss — with a basis that is physical too, not only emotional — and deserve to be recognised as such, even when others do not treat them that way.", "approfondire": ["Vivek Murthy – Our Epidemic of Loneliness and Isolation (U.S. Department of Health and Human Services, 2023)", "Robert Waldinger and Marc Schulz – The Good Life: Lessons from the World’s Longest Scientific Study of Happiness (Simon & Schuster, 2023)", "Ethan Kross et al. – Social Rejection Shares Somatosensory Representations with Physical Pain (PNAS, 2011)", "Luzia C. Heu, Martijn van Zomeren, Nina Hansen – Lonely Alone or Lonely Together? A Cultural-Psychological Examination of Individualism–Collectivism and Loneliness in Five European Countries (Personality and Social Psychology Bulletin, 2019)", "John Bowlby – Attachment and Loss, Vol. 1: Attachment (Hogarth Press, 1969), and its applications to romantic separation", "Kenneth Doka – Disenfranchised Grief: Recognizing Hidden Sorrow (Lexington Books, 1989)"]}, "11": {"title": "Itinerary 11 — Loss and changing bonds — How can I look back without becoming a prisoner of it?", "body": [{"t": "p", "text": "Sooner or later it happens to everyone: stopping, looking at the road travelled, and asking whether it was the right one. This is not a question confined to old age — it can arrive at forty or at eighty — but it is a question time makes more pressing. The good news, backed by some of the most solid research in developmental psychology, is that this question tends to hurt less with age, not more — even though almost no one expects that."}, {"t": "sh", "text": "The paradox of ageing"}, {"t": "p", "text": "The psychologist Laura Carstensen, of Stanford, has documented something that contradicts common intuition: despite physical and cognitive decline, emotional wellbeing tends to improve with age. Older people, on average, feel fewer negative emotions, remember the past in a better light, and report more satisfying relationships than when they were younger. Carstensen called this mechanism socioemotional selectivity theory: as the time perceived as remaining grows shorter, priorities shift on their own — less investment in future goals (building, accumulating, climbing), more attention to what gives meaning now. It is not old age itself that produces this effect: it is the perception of a shorter horizon, which is in fact also observed in young people facing a major change or a serious illness."}, {"t": "p", "text": "One clarification is worth making, in fairness: a related but distinct effect — whether age also brings wiser reasoning about social conflicts, not just a more positive emotional tone — does not hold up the same way everywhere. Igor Grossmann and colleagues, in a 2012 study in Psychological Science, compared Americans and Japanese in how they reason about interpersonal conflicts: among Americans, the recognition of multiple viewpoints and the value of compromise increased with age. Among the Japanese, age made no difference — probably because that disposition to consider multiple perspectives was already more present, at every age, in a culture where the self is thought of as interdependent with others from the start."}, {"t": "sh", "text": "What we really regret, and when"}, {"t": "p", "text": "A series of studies, starting with work by Thomas Gilovich and Victoria Medvec at Cornell, found a precise temporal pattern in regret: in the short term, people regret above all the actions they took — such as a decision that turned out badly. But in the long term, the regret that remains, the one that still weighs after years, almost always concerns actions not taken: the talent not cultivated, the love not declared, the opportunity not seized. Not having done, more than having done badly, is what stays with us longest."}, {"t": "p", "text": "This is not an invitation to chase every opportunity without judgement — that would be another form of noise, not of clarity. It is useful information at the moment of the decision itself: faced with hesitation between acting and not acting, knowing that the not-done weighs more heavily over time is a concrete fact to put on the scale, not just an intuition."}, {"t": "sh", "text": "A case"}, {"t": "p", "text": "At seventy, someone looks back and no longer thinks, as they feared in their youth, about their most glaring mistakes — that wrong career choice, that argument never truly resolved. They think, more insistently, about the trip never taken for fear of spending money, the language never learned because there always seemed to be time later, the person never called back out of pride. This is not a failing of memory: it is exactly the pattern research predicts. And alongside this, without having set out to, they look at everything else — even the mistakes — with less harshness than they would have used at forty."}, {"t": "p", "text": "Anyone who fears that growing older means mainly losing finds, in Carstensen’s data, a concrete reason to believe the opposite. Anyone torn between acting and letting it go can carry Gilovich and Medvec’s finding into the decision: we regret what we did not do more than what we did badly. And anyone looking back harshly at a mistake of their own can simply ask whether they would judge it with the same severity in twenty years — anticipating a process that, for most people, happens anyway with time."}, {"t": "p", "text": "There is no need to wait for old age to benefit from this: Carstensen’s mechanism depends on the perception of the time remaining, not on chronological age itself. Anyone wondering whether it is worth changing course now can let a horizon perceived as shorter guide the choice right away, instead of putting it off to an older tomorrow that may be no wiser than today."}], "ricorda": "Emotional wellbeing, according to the best data available, tends to improve with age, not worsen. What we regret for longest is not the mistakes we made, but the opportunities we did not seize. Looking back with less harshness is not a comforting illusion: it is the most common pattern, observed and measured, of those who have simply lived long enough to be able to do it.", "approfondire": ["Laura Carstensen – The Influence of a Sense of Time on Human Development (Science, 2006)", "Thomas Gilovich and Victoria Medvec – The Temporal Pattern to the Experience of Regret (Journal of Personality and Social Psychology, 1994)", "Igor Grossmann, Mayumi Karasawa et al. – Aging and Wisdom: Culture Matters (Psychological Science, 2012)", "Neal Roese – If Only: How to Turn Regret into Opportunity (Broadway Books, 2005)"]}, "12": {"title": "Itinerary 12 — Scarcity and choice — How can I choose when there are too many options?", "body": [{"t": "p", "text": "Earlier itineraries dealt mainly with conditions of scarcity — too little time, too little money, too few opportunities. This itinerary addresses the opposite problem, less widely recognised but real: when the available options are so numerous that choosing, instead of being a pleasure, becomes a burden."}, {"t": "sh", "text": "The theory, and a necessary honesty"}, {"t": "p", "text": "The psychologist Barry Schwartz, in his book The Paradox of Choice (2004), proposed that beyond a certain threshold, having more options no longer produces more freedom or satisfaction, but the opposite: more choices mean more effort comparing them, a greater likelihood of regretting the option not chosen, and expectations that rise faster than any real choice could satisfy them."}, {"t": "p", "text": "The most cited case in support of this idea is the famous “jam experiment” by Sheena Iyengar and Mark Lepper (2000): in a supermarket, a display with 24 varieties of jam attracted more browsers than one with only 6, but sold ten times less. It is right to be fully honest, as this book has always tried to be: a 2010 meta-analysis of around fifty studies did not confirm a general, consistent effect of “choice overload”, and a 2015 re-examination showed the effect appears only under specific conditions — it is not a universal law, but a real phenomenon in certain circumstances, not all. This is worth knowing, rather than treating a single experiment as a definitive truth."}, {"t": "p", "text": "Another honest point is worth making, further upstream: the very idea that having more personal choice is always desirable reflects a model of the self — the independent one, typical of individualist cultures — that is not universal. Iyengar and Lepper, in another study from the same period, compared children of Anglo-American and Asian-American background: the former showed more motivation when they could choose for themselves, the latter turned out more motivated when the choice was made for them by a trusted figure — a parent, a teacher — not by a stranger. Autonomous choice is therefore not a universal good that everyone aspires to in the same way: its value also depends on how far a culture builds the self as independent or as intertwined with those close to it."}, {"t": "p", "text": "What holds up better under scrutiny, and is more useful in practice, is a distinction Schwartz himself proposes: that between “maximisers” and “satisficers”. Maximisers compare every possible option in search of the perfect choice, and tend to remain more dissatisfied even when they choose well. Satisficers — in the sense of setting a reasonable threshold and stopping at the first option that clears it — decide more quickly, regret less, and report, on average, greater satisfaction."}, {"t": "sh", "text": "A case"}, {"t": "p", "text": "Choosing a series to watch in the evening, from among thousands of available titles, can take longer than watching it. This is not laziness, nor a character flaw for indecision: it is the same dynamic Schwartz describes, applied to a minimal choice. Setting a simple criterion in advance — “I’ll watch the first title that catches my interest within two minutes” — is not giving up on the quality of the choice. It is simply stopping treating a minor decision as though it needed the same care as a choice that really matters."}, {"t": "sh", "text": "Orientation itinerary"}, {"t": "table", "rows": [["Manifestation", "Tool", "Origin", "Why it is useful"], ["You freeze over minor decisions as much as over important ones", "Distinguishing the real weight of the decision from the number of options available", "Barry Schwartz, The Paradox of Choice (see also Iyengar-Lepper 1999 in the text)", "Not every choice deserves the same investment of energy."], ["You compare every option searching for the perfect choice", "Setting a reasonable threshold in advance, and stopping at the first option that clears it", "Schwartz — the distinction between maximisers and satisficers", "Satisficers decide faster and report, on average, greater satisfaction."], ["After choosing, you immediately think about the discarded options", "Recognising that regret for the unchosen alternative is a predictable side effect of choosing itself, not a sign that the choice was wrong", "Schwartz — opportunity cost and rising expectations", "Separates the normal discomfort of choosing from a real judgement on its quality."]]}], "ricorda": "Beyond a certain threshold, more options do not mean more freedom: they can mean more effort and less satisfaction, even though the effect is neither automatic nor the same in every situation. Deciding to settle for a good option, instead of looking for the best possible one, is not a lesser compromise: in practice, it often produces less regret. It is worth reserving the time spent comparing for the choices that really matter, not for all of them equally.", "approfondire": ["Barry Schwartz – The Paradox of Choice: Why More Is Less (Harper Perennial, 2004)", "Sheena Iyengar and Mark Lepper – When Choice Is Demotivating (2000), with the later 2010 and 2015 meta-analytic reviews", "Sheena Iyengar, Mark Lepper – Rethinking the Value of Choice: A Cultural Perspective on Intrinsic Motivation (Journal of Personality and Social Psychology, 1999)"]}, "13": {"title": "Itinerary 13 — The world and the future — How can I manage my worry about the planet’s future without being overwhelmed by it?", "body": [{"t": "p", "text": "There is a kind of fear that previous generations never had to face in quite the same form: not the fear of an immediate danger, but a constant worry about a collective future that feels threatened, spanning a longer stretch of time than a single life. In 2017 the American Psychological Association gave it a name — eco-anxiety, defined as “a chronic fear of environmental doom”. It is worth saying straight away, with the same clarity this book has used for other conditions: this is not a clinical diagnosis, and in most cases it is considered a rational response to a real threat — not an exaggeration to be corrected."}, {"t": "sh", "text": "How widespread it is, and who it weighs on most"}, {"t": "p", "text": "In 2021 the scientific journal The Lancet Planetary Health published the first global-scale survey of climate anxiety in young people: ten thousand people aged 16 to 25, across ten different countries. The results: 59% described themselves as very or extremely worried about climate change, 84% at least moderately so. More than 45% reported that these feelings interfere with their everyday functioning — studying, sleeping, eating, having fun. 75% said they found the future frightening. 83% believe that the adults in power have failed to look after the planet, leaving the problem to the generations that follow."}, {"t": "p", "text": "These aggregate figures, however, hide a stark disparity present within the same study. Of the ten countries involved, four belong to the Global South (Brazil, India, Nigeria, the Philippines) and six to the Global North (Australia, Finland, France, Portugal, the United Kingdom, the United States). Fear for the future turns out to be systematically higher in Global South countries — as high as 92% in the Philippines, against lower percentages in the Global North — the same countries that, according to research on historical contributions to emissions, bear less responsibility for the climate crisis yet already face its most direct effects. Climate anxiety is therefore not a uniform experience on a global scale: it is more acute precisely where the concrete risk is highest."}, {"t": "sh", "text": "Not all ecological emotions work the same way"}, {"t": "p", "text": "Here the research offers a valuable, and consistent, indication: not all forms of ecological worry produce the same effect. A 2021 study by the psychologist Samantha Stanley and colleagues, on a large Australian national sample, found that anxiety, in this domain, is associated with less engagement in collective action — it tends to close down, not open up. Anger, by contrast, proves a more effective driver of concrete engagement: people who are angry about inaction, rather than merely worried, tend to participate more, not less."}, {"t": "sh", "text": "Orientation itinerary"}, {"t": "table", "rows": [["Manifestation", "Tool", "Origin", "Why it is useful"], ["You wonder whether your concern about the climate is exaggerated or pathological", "Recognising it as a rational response to a real threat, not a problem to correct", "American Psychological Association (Clayton et al., 2017)", "Avoids adding the weight of self-blame to an already legitimate concern."], ["You feel alone in feeling this concern", "Knowing it affects most young people worldwide, not just you", "Hickman et al., The Lancet Planetary Health (2021)", "Puts the isolation into perspective: it is a shared experience on a global scale, documented with data."], ["The concern paralyses you instead of pushing you to act", "Noticing whether what you feel is closer to anxiety (which tends to paralyse) or to anger at others’ inaction (which tends to mobilise)", "Research on eco-anxiety and eco-emotions", "Recognising the specific emotion helps you understand whether it is helping or hindering."], ["You don’t know how to place this concern alongside the rest of your life", "Applying the distinction between fruitful doubt and imprisoning doubt", "Consistent with the chapter on Doubt", "The same distinction, applied at different scales, helps you recognise it more quickly."]]}], "ricorda": "Worry about the planet’s future is not an exaggeration to be corrected: it is a response shared by millions of people, on every continent, and is recognised as rational by the scientific community. Not all forms of this worry work the same way: some open towards action, others close towards paralysis. Recognising which of the two one is experiencing, at a given moment, is already a step towards moving through it better.", "approfondire": ["Susan Clayton, Christie Manning, Kirra Krygsman, Meighen Speiser – Mental Health and Our Changing Climate (American Psychological Association and ecoAmerica, 2017)", "Caroline Hickman, Elizabeth Marks, Panu Pihkala, Susan Clayton et al. – Climate Anxiety in Children and Young People (The Lancet Planetary Health, 2021)", "Samantha K. Stanley, Teaghan L. Hogg, Zoe Leviston, Iain Walker – From Anger to Action: Differential Impacts of Eco-Anxiety, Eco-Depression, and Eco-Anger on Climate Action and Wellbeing (Journal of Climate Change and Health, 2021)"]}, "14": {"title": "Itinerary 14 — Body and mind — How can I live with a long-term psychiatric condition, or support someone who has one?", "body": [{"t": "p", "text": "Every other itinerary in this chapter has named tools to try. This one is different, for a precise reason: major depression, chronic anxiety disorders, bipolar disorder, schizophrenia and other conditions that can involve psychotic episodes are not a state one moves through in an afternoon, nor a condition that dissolves with a personal technique. For those who live with them, they are a long-term condition — sometimes a lifelong one — with biological, psychological and social foundations together. And they do not concern only the person affected: they concern, just as genuinely, those who live alongside someone who suffers from them. For this reason, here, the book does not propose techniques: above all, it proposes recognising what is happening, without shame, on both sides, and knowing where real help can be found."}, {"t": "sh", "text": "One fact, before anything else"}, {"t": "p", "text": "According to the World Health Organization, depression is the leading cause of disability worldwide, affecting more than three hundred million people. It is not a sign of personal weakness, nor the result of a fragile character: research describes it with a biopsychosocial model, that is, as the interweaving of biological factors (including a genetic component and effects on neurochemical systems), psychological factors and social factors — never just one of these, never an individual fault. The same holds, often with even greater intensity, for conditions such as bipolar disorder and schizophrenia, which can involve psychotic episodes — moments in which contact with shared reality is altered, with delusions or hallucinations. Here too, the research is clear: these are not the result of a choice, nor of moral weakness, but complex medical conditions, with documented neurobiological foundations."}, {"t": "p", "text": "And yet, even in the world’s wealthiest countries, nearly half of people with depression receive no treatment at all, and the stigma surrounding conditions with a psychotic component remains, in many societies, heavier still. The cause most often cited by the World Health Organization itself is not the lack of effective treatments — they exist, and work for most people who receive them — but stigma: the shame of admitting it, the fear of being judged, the feeling of having to “cope alone”. This is perhaps the one point in this entire book where the biggest problem is not the lack of a method, but the silence surrounding a condition that the method, on its own, cannot resolve."}, {"t": "sh", "text": "A voice, not a technique"}, {"t": "p", "text": "The writer Andrew Solomon, in his book The Noonday Demon — a work that weaves his own experience of depression together with years of scientific and historical research on the subject — writes: “the opposite of depression is not happiness but vitality”: the capacity to feel, even when what is felt is painful. He does not offer a technique for getting out of it. He offers something that at times matters just as much: reasoned, non-consoling proof that it is possible to describe this condition with precision, dignity and even beauty, without either minimising it or being defined by it."}, {"t": "sh", "text": "Those who live alongside"}, {"t": "p", "text": "There is an aspect of these conditions that rarely finds space, and that deserves to be named with the same seriousness: living alongside someone with a serious psychiatric illness — especially when it involves psychotic episodes — is in itself a complex, exhausting, often lonely experience. It is not a secondary matter compared to that of the person who is ill: it is a problem in its own right, with its own body of scientific literature."}, {"t": "p", "text": "The psychiatrist E. Fuller Torrey, in his Surviving Schizophrenia — the reference text on this subject since 1983, repeatedly updated — describes schizophrenia both from the point of view of the person living with it and from that of the family, with a frankness rare in this field: he does not hide how difficult it is, but nor does he leave families without concrete tools to find their bearings."}, {"t": "p", "text": "One of the most solid findings in this field concerns precisely the role of those close by. Since the 1970s, the psychiatrists Christine Vaughn and Julian Leff have documented that families in which criticism, hostility or excessive emotional involvement predominate — a cluster of attitudes called “expressed emotion” — are associated with a risk of relapse in the patient three to seven times higher than in families with a calmer emotional climate. This is not a judgement on families, who are almost always already strained by a difficult situation: it is a finding that has led to the development of family psychoeducation programmes — structured courses, run by professionals, that teach people to understand the illness and to communicate in ways less exhausting for everyone — whose effectiveness in reducing relapses has been confirmed in numerous controlled studies."}, {"t": "p", "text": "The point is not to “behave better” for someone who is already doing everything possible in a difficult situation. It is knowing that specific help exists for those who support as well, not only for the person who is ill — and that asking for it is no less legitimate."}, {"t": "sh", "text": "Where to look for help"}, {"t": "p", "text": "It is not this book’s role, and it would be irresponsible for it to be, to point to a cure. It can, however, point clearly to where the path begins: the GP is often the first point of access, and is the one who directs you to a specialist when needed; the psychotherapist works on the psychological aspects, often with approaches of proven effectiveness according to research; the psychiatrist is the medical specialist also competent for any drug treatment, when indicated; public mental health services, in many countries, also offer family psychoeducation courses for those living alongside someone who is ill; helplines remain a point of access for anyone who does not know where to start. None of these paths is a sign of failure — neither for the person who is ill, nor for those alongside them. Seeking them out is, if anything, the clearest-headed act this book can suggest in this itinerary."}], "ricorda": "A long-term psychiatric condition — including one with psychotic episodes — is not proof of weakness, but a condition with biological, psychological and social foundations together, recognised as such by medical science worldwide. Stigma, not the lack of treatment, remains the first obstacle to recovery for millions of people. Those who live alongside someone who is ill face a real difficulty of their own, for which specific help exists, not just good will. Asking for help — from whichever side of this condition one finds oneself — is not an exception to this book: in this itinerary, more than in any other, it is its very heart.", "approfondire": ["World Health Organization – Depression and Other Common Mental Disorders: Global Health Estimates (2017)", "Andrew Solomon – The Noonday Demon: An Atlas of Depression (Scribner, 2001; National Book Award)", "E. Fuller Torrey – Surviving Schizophrenia: A Family Manual (Harper & Row, 1983)", "Christine Vaughn and Julian Leff – The Measurement of Expressed Emotion in the Families of Psychiatric Patients (British Journal of Social and Clinical Psychology, 1976)"]}, "15": {"title": "Itinerary 15 — Body and mind — How can I tell apart the guilt that repairs from the shame that paralyses?", "body": [{"t": "p", "text": "This theme has run through the book several times without ever being named directly. Itinerary 8 tried to lift the guilt from those living in poverty. Itinerary 14 spoke of the shame that delays a diagnosis, for those who are ill and for those alongside them. This itinerary finally gives a precise name to something the book has dealt with several times without stating it: everyday language uses “guilt” and “shame” as synonyms, but the most rigorous research shows they are two different emotions, with opposite effects."}, {"t": "sh", "text": "Two emotions, not one"}, {"t": "p", "text": "The psychologist June Tangney has devoted a large part of her career to this distinction, studying it in children, adolescents and adults. Guilt concerns a specific behaviour — “I did something wrong”. When it is not accompanied by shame, it turns out to be an adaptive emotion: it drives a person to repair, to apologise, to do better next time. Shame concerns the whole person — “I am a bad person”. It tends to be a maladaptive emotion: those who feel it freeze, hide, and sometimes end up attacking others simply to push away an unbearable feeling."}, {"t": "p", "text": "The most solid finding supporting this distinction comes from a longitudinal study that followed a group of fifth-grade children, measuring their tendency towards guilt — not shame. As adults, the children more prone to guilt turned out to be arrested, convicted and imprisoned less often; among the adolescents in the same group, they had safer sexual relationships. This is not an anecdotal effect: it is one of the most solid findings in all of contemporary moral psychology."}, {"t": "sh", "text": "A necessary honesty"}, {"t": "p", "text": "Not all research agrees with such a clear-cut reading. A minority view, called functionalist, holds that shame too, at certain intensities and in certain contexts, can serve a function — signalling to a group that one recognises a mistake, for instance, can have a social value. The broader consensus nonetheless remains Tangney’s: chronic shame is associated with depression, misdirected anger and lower empathy, while guilt — when it stays anchored to a specific behaviour, and does not degenerate into a global self-judgement — is associated with empathy and reparative behaviour. It is worth knowing about the debate, rather than treating a complex distinction as though it had no exceptions."}, {"t": "p", "text": "That minority view also finds support outside Western psychology. The Dutch psychologist Batja Mesquita, a pioneer of the cultural psychology of emotion, argues that in many cultures — often the more collectivist ones — shame does not function at all as a predominantly maladaptive emotion: it can be a moral, honourable emotion, one that makes a person more socially acceptable rather than isolating them. In her book she describes a study carried out by colleagues on Dutch and Filipino salespeople who had made the same mistake in front of a customer: shame froze the Dutch salespeople, while the Filipino ones remained able to act and recover the situation. This does not mean Tangney is wrong: it means the same emotion, in the same moment, can behave differently depending on which function the culture assigns to it."}, {"t": "sh", "text": "Guilt and responsibility: another necessary distinction"}, {"t": "p", "text": "There is a simple way to tell guilt and responsibility apart, even before entering into philosophy: guilt looks backward, responsibility looks forward. Guilt answers the question “who caused this?” — and to exist it needs a specific act, carried out by a specific person, at a specific moment. Responsibility answers a different question: “who can do something now, regardless of who caused what?” — and this second question does not require having caused the problem at all."}, {"t": "p", "text": "A small example, far from philosophy: a child knocks over a glass during a family dinner. Who is to blame is clear — it was him, through carelessness. But who is responsible for cleaning it up does not necessarily coincide with who is to blame: a parent sitting nearby, who spilled nothing and bears no blame at all, can still choose — or have to choose — to be the person who picks up a cloth, simply because they are in a position to do so. No one asks them to feel guilty about the spilt glass. They are asked, if anything, to be responsible for what happens in the room they are in."}, {"t": "p", "text": "The philosopher Hannah Arendt carried this same distinction onto a much larger scale, reflecting on post-war Germany. For her, one can speak of guilt only in the face of an act a person has materially carried out — never for a thought, an intention, or for what someone else chose in their place. Responsibility follows a different logic: it extends even to what one did not do personally, by the mere fact of belonging to a community, a group, a role from which no individual choice can fully detach itself. Arendt noted a paradoxical effect: attributing guilt to everyone indiscriminately ends up protecting those who actually acted, because it dilutes individual responsibility into a vague collective feeling. Responsibility, by contrast, does not need to identify a specific guilty party in the past to remain valid: it can face forward even when guilt, on its own, would no longer find anyone to settle on."}, {"t": "p", "text": "The South African Truth and Reconciliation Commission did not ask every citizen to declare themselves guilty of the crimes of apartheid: it asked everyone to take on political responsibility for what would come afterwards — exactly like the parent beside the spilt glass, on a far larger and far more painful scale."}, {"t": "sh", "text": "A case"}, {"t": "p", "text": "Two sentences can arise from the same mistake: forgetting an important birthday. “I forgot your birthday, I’m sorry, let’s make up for it this weekend” recognises a specific behaviour and proposes a repair: that is guilt. “I’m a terrible friend, I don’t deserve your trust” shifts the judgement from the action to the whole person, and offers nothing to repair, only a self-condemnation that asks to be comforted: that is shame. The difference does not lie in the seriousness of the mistake, which is identical in both cases — it lies in where the weight of the judgement falls."}, {"t": "sh", "text": "Orientation itinerary"}, {"t": "table", "rows": [["Manifestation", "Tool", "Origin", "Why it is useful"], ["After a mistake, you feel like “a bad person”, not just the author of an error", "Bringing the judgement back from the self to the behaviour: what, exactly, did you do", "June Tangney — the distinction between guilt and shame (with cross-cultural limits, see text)", "Shifts attention from a total judgement, which paralyses, to a specific problem, which can be addressed."], ["You regret something done in the past, but don’t know how to react beyond ruminating", "Asking what concrete repair is still possible — even small, even symbolic", "Tangney — guilt as a reparative emotion", "Guilt works when it leads to action, not when it remains rumination for its own sake."], ["You put off for a long time facing something you feel guilty or embarrassed about", "Noticing whether what is holding you back is shame (fear of total judgement on yourself) more than guilt itself", "Tangney — shame motivates avoidance, guilt motivates action", "Recognising which of the two emotions is in charge helps explain why you are stuck."], ["You wonder whether blaming yourself helps you avoid repeating a mistake", "Guilt tied to behaviour prevents recurrence better than blanket shame about yourself", "Tangney — longitudinal study on childhood guilt and adult outcomes", "The data show it is specific guilt, not general self-condemnation, that is associated with better future behaviour."], ["You feel guilty for something you did not personally do — a historical wrong, an inherited privilege, a collective problem", "Distinguish: guilt requires a personal act; responsibility does not. You can take an active role without declaring yourself guilty", "Hannah Arendt — collective and political responsibility", "Allows you to act without the paralysing weight of a guilt that, strictly speaking, was never yours."]]}], "ricorda": "Guilt and shame are not synonyms: guilt concerns what one has done and is often a drive to repair; shame concerns what one is, and tends to paralyse. Responsibility is yet another thing: one can be responsible for what happens now, even without being guilty of what happened before. None of the three should be suppressed — but it is worth recognising which one is speaking, before letting it decide what to do. The same distinction, applied to the earlier Itineraries in this book, makes clearer why certain “faults” — poverty, an illness, a delayed diagnosis — are not faults at all, but shame induced by an outside gaze that this book has always tried to correct.", "approfondire": ["June Tangney and Ronda Dearing – Shame and Guilt (Guilford Press, 2002)", "Batja Mesquita – Between Us: How Cultures Create Emotions (W. W. Norton & Company, 2022)", "June Tangney, Jeff Stuewig and Debra Mashek – Moral Emotions and Moral Behavior (Annual Review of Psychology, 2007) (a review of the guilt/shame distinction and its effects)", "Hannah Arendt – Collective Responsibility; Responsibility and Judgment (Schocken Books, 2003)"]}, "16": {"title": "Itinerary 16 — Body and mind — How can I understand an addiction, my own or that of someone close to me?", "body": [{"t": "p", "text": "Few conditions are judged with as much moral severity as addiction — to substances, or to behaviours such as gambling. The most common judgement is still one of weak willpower. Scientific research, from different angles and not always in agreement with each other, tells a more complicated story."}, {"t": "sh", "text": "Two ways of explaining the same thing"}, {"t": "p", "text": "The neuroscientist Nora Volkow, director of the main US research institute on addiction, has shown through years of neuroimaging studies that repeated use of a substance concretely alters the brain’s reward and self-control circuits. For this line of research, addiction is a chronic medical condition, with measurable biological foundations — not a sign of weak willpower or poor character."}, {"t": "p", "text": "Another line of research, just as rigorous, places the emphasis elsewhere. In the 1970s the psychologist Bruce Alexander ran an experiment that became famous — known as Rat Park — comparing rats kept in isolated cages with rats living in an environment rich in stimulation, space and company. Both groups had free access to morphine-laced water. The isolated rats consumed far more of it; those in the enriched environment, for the most part, ignored it. Alexander’s conclusion was not that the substance itself did not matter, but that isolation and the lack of social connection were a determining factor at least as much as the substance’s chemical properties."}, {"t": "p", "text": "The two perspectives are not entirely in contradiction, and Volkow herself, in more recent years, has publicly shifted her emphasis towards more pragmatic approaches. On one point, however, every serious line of research agrees, and it is perhaps the most important point to take away: addiction is not, at its root, a matter of character or morality."}, {"t": "p", "text": "It is worth mentioning, for honesty’s sake, a third type of approach too, with a necessary caveat. Recovery programmes rooted in North American Indigenous traditions — such as the Wellbriety movement, born among Native communities — integrate cultural identity, spirituality and community in a way that neither the neurobiological model nor the social-connection model fully captures on its own. They do not, however, have the same body of quantitative evidence as the decades of research behind Volkow and Alexander: the available studies, some of which openly acknowledge this, often work with small samples. This does not make them any less genuine or less useful for those who find support in them — it simply means Western science has historically had far more funding to produce that specific kind of evidence at scale."}, {"t": "sh", "text": "When the addiction is food"}, {"t": "p", "text": "There are people who cannot stop eating certain foods — almost always sweet, almost always fatty — even knowing they would like to stop. Is this a genuine addiction, like one to a substance? On this, science is divided, and it is worth giving both sides a hearing."}, {"t": "p", "text": "An American psychologist, Ashley Gearhardt, built a test that measures one’s relationship with food using the same questions one would use for a substance addiction: have you lost control? Have you tried to stop and been unable to? Do you keep going even when it hurts you? According to her work, for many people the answer resembles, surprisingly closely, that of someone struggling with alcohol or smoking."}, {"t": "p", "text": "Two Cambridge researchers, Hisham Ziauddeen and Paul Fletcher, reviewed all the available evidence and reached a more cautious conclusion. For them, speaking of “food addiction” in general terms is a bigger claim than the data allow. The case holds up better, in their view, if one speaks instead of a problem already recognised by medicine: binge eating disorder — recurring episodes in which a person eats a clearly larger-than-normal amount of food, in a short time, with the feeling of being unable to stop. This is a genuine diagnosis, with precise criteria, different from a difficult relationship with sweets in general."}, {"t": "p", "text": "Anyone reading this Itinerary does not need to know who is right. They need to know that the doubt is legitimate, shared by serious scientists, and that failing to “control oneself” around sweets is not a verdict on one’s character."}, {"t": "p", "text": "Two things, however, genuinely help, regardless of what the problem is called."}, {"t": "p", "text": "The first comes from a now-classic study: banning a food entirely, with a rigid rule, often does not make the craving go away — it makes it grow. The iron rule “never again any sweets” can become part of the problem, not the solution."}, {"t": "p", "text": "The second is a method called Mindfulness-Based Eating Awareness Training — in practice, training yourself to genuinely recognise when you are hungry and when you are full, instead of following externally imposed rules. In a study comparing groups, those who followed this course had fewer binge-eating episodes, measurably, not just as a perceived improvement."}, {"t": "p", "text": "These do not replace professional help, when the problem weighs heavily. But they shift the right question to ask: not “how much willpower do I have”, but “what mechanism am I feeding without realising it”. Sometimes, behind that need that seems to be only about food, there is something else — a tension, a tiredness, an emptiness that food soothes for a moment without ever truly filling. Recognising this does not solve the problem, but it changes the question to ask oneself: not only “how do I stop”, but “what do I really need, right now”. It is the same question this whole Itinerary is built on."}, {"t": "sh", "text": "A case"}, {"t": "p", "text": "Someone living alongside a person with an addiction often feels responsible for making them stop — controlling, hiding, covering up the consequences. Research on families shows that these behaviours, however much they are driven by love, often end up protecting the addiction more than the person: they make it easier to continue, not harder. This does not mean stopping loving or helping — it means telling apart supporting a person from unintentionally supporting their problem."}, {"t": "sh", "text": "Orientation itinerary"}, {"t": "table", "rows": [["Manifestation", "Tool", "Origin", "Why it is useful"], ["You judge yourself, or someone with an addiction, as weak or lacking willpower", "Recognising the documented neurobiological basis of addiction, regardless of which theory explains it best", "Nora Volkow — neuroimaging of addiction", "Shifts moral judgement toward a more accurate understanding of the mechanism."], ["You wonder why an addiction persists even when the person genuinely wants to stop", "Considering the role of isolation and social connection, not only of the substance itself", "Bruce Alexander — the Rat Park experiment", "Opens the door to interventions beyond willpower alone: rebuilding bonds, not only resisting."], ["You live alongside someone with an addiction and feel responsible for making them stop", "Distinguishing supporting the person from unintentionally supporting their problem", "Research on families and addiction", "Helps you recognise when helping protects the person and when it protects only the addiction."], ["You believe the only valid outcome is total, immediate abstinence", "Learning about the harm-reduction approach, recognised by most of the scientific community as effective", "Harm-reduction approaches in public health", "Reduces immediate risks even when complete abstinence is not, for now, a realistic goal."]]}], "ricorda": "Addiction is not, at its root, a matter of character or willpower — this is the point on which research converges, even when theories differ on the how and the why. Isolation seems to make it worse, social connection seems to protect against it. Those who live alongside a person with an addiction face a difficulty of their own, for which specific support exists, and they deserve to seek it out just as much as the person with the addiction itself.", "approfondire": ["Nora Volkow, George Koob and A. Thomas McLellan – Neurobiologic Advances from the Brain Disease Model of Addiction (New England Journal of Medicine, 2016)", "Bruce Alexander – Addiction: The View from Rat Park (online essay, 2010)", "Support groups for family members (e.g. Al-Anon) — resources aimed specifically at those living alongside addiction", "Ashley N. Gearhardt, William R. Corbin, Kelly D. Brownell – Preliminary Validation of the Yale Food Addiction Scale (Appetite, 2009)", "Hisham Ziauddeen, Paul C. Fletcher – Is Food Addiction a Valid and Useful Concept? (Obesity Reviews, 2013)", "Janet Polivy, C. Peter Herman – Dieting and Bingeing: A Causal Analysis (American Psychologist, 1985)", "Jean L. Kristeller, Ruth Q. Wolever, Virgil Sheets – Mindfulness-Based Eating Awareness Training (MB-EAT) for Binge Eating: A Randomized Clinical Trial (Mindfulness, 2013)", "Mary F. Dallman et al. – Chronic Stress and Obesity: A New View of “Comfort Food” (Proceedings of the National Academy of Sciences, 2003)"]}, "17": {"title": "Itinerary 17 — The limit that will not move — How can I reorganise an entire life around a limit that does not pass and does not kill?", "body": [{"t": "p", "text": "Itinerary 1 deals with acute pain, which passes. What Cannot Be Solved deals with terminal illness, which leaves no time to reorganise much of anything. This itinerary concerns a third condition, different from both: a non-fatal chronic illness — diabetes, multiple sclerosis, persistent pain, a disability — which is neither an episode to move through nor an ending to be accompanied. It is an entire life to be reorganised around a limit that stays."}, {"t": "sh", "text": "A name for what happens"}, {"t": "p", "text": "The British sociologist Michael Bury, studying people with rheumatoid arthritis, coined an expression in 1982 that has become a landmark across the whole sociology of health: biographical disruption. A chronic diagnosis, for Bury, does not simply add a problem to a life that otherwise carries on unchanged: it interrupts the taken-for-granted assumptions on which that life was built, forcing a person to rethink their own biography and self-image from scratch. This is not an exaggerated metaphor — it is the same word, disruption, that one would use for a sudden event, even though chronic illness often develops gradually."}, {"t": "p", "text": "Bury also observed something less obvious: over time, some people do not simply normalise the disruption — they reach a biographical reconstruction that, in some cases, strengthens their sense of identity rather than merely weakening it. This does not always happen, and it should not be presented as an obligation or a milestone one must reach to feel “in order” with one’s own illness. But it is a real, documented possibility, not just a well-meaning platitude."}, {"t": "sh", "text": "What actually helps"}, {"t": "p", "text": "The nurse and researcher Kate Lorig, at Stanford, developed and validated through randomised studies a chronic disease self-management programme, now used in more than thirty countries. The programme does not teach people to treat their specific illness — it brings together people with different diagnoses (heart disease, lung disease, arthritis) around shared skills: how to communicate with doctors, how to manage everyday symptoms, how to plan the energy available. The central finding of her research is that the factor that best predicts improvement is self-efficacy — how capable a person feels of influencing their own condition, even when they cannot cure it."}, {"t": "sh", "text": "A case"}, {"t": "p", "text": "Someone living for years with a chronic illness often learns to do something that people without that condition never learn: to plan their energy as a limited, visible resource, not an infinite, taken-for-granted one. This is not resignation — it is a skill, developed out of necessity, that makes it possible to keep doing what matters, by choosing more carefully what does not matter enough to be worth its cost."}, {"t": "p", "text": "Anyone who feels that a chronic diagnosis has interrupted the life they had imagined can name it, with Bury, as a genuine biographical disruption — recognising it with this precision helps it not be felt as a personal weakness. Anyone who fears that living with illness means only losing, never rebuilding, can know that a biographical reconstruction, sometimes even sturdier than before, is documented as possible — not guaranteed, but real, not just a well-meaning platitude."}, {"t": "p", "text": "Anyone who feels overwhelmed by the daily management of illness finds, in Kate Lorig’s self-management programmes at Stanford, a precise indication: the factor most closely tied to improvement is not the severity of the diagnosis, but self-efficacy — the confidence that one can still influence it. And anyone struggling to choose how to spend the limited energy illness leaves them can treat it as a visible resource to be planned, not something to be taken for granted: that is exactly what makes it possible to keep doing what matters."}], "ricorda": "A non-fatal chronic illness is neither an episode to move through nor an ending to be accompanied: it is an entire life to be reorganised around a limit that stays. This reorganisation has a name in research — biographical disruption — and can, in some cases, lead to a reconstruction sturdier than before, even though that is not something owed. The factor most closely linked to improvement is not the severity of the diagnosis, but the confidence that one can still influence it.", "approfondire": ["Michael Bury – Chronic Illness as Biographical Disruption (1982)", "Kate Lorig – Living a Healthy Life with Chronic Conditions (5th edition, Bull Publishing Company, 2020; research from the Patient Education Research Center, Stanford University)"]}, "18": {"title": "Itinerary 18 — Scarcity and choice — How can I move through the feeling of never having enough time?", "body": [{"t": "p", "text": "In Itinerary 8 we met Sendhil Mullainathan and Eldar Shafir, and their book on scarcity. That book, in fact, is not only about money: it is about scarcity in general, and time is the other major form this scarcity takes. It consumes the same cognitive resource, produces the same narrowing of vision — yet it remains, curiously, far less widely recognised as a serious problem."}, {"t": "sh", "text": "A surprising finding"}, {"t": "p", "text": "The psychologist Ashley Whillans, at Harvard Business School, has devoted her research specifically to this subject. An analysis of two and a half million people showed that the subjective feeling of time poverty has a negative effect on wellbeing stronger than that of unemployment. About eighty per cent of working adults report feeling chronically short of time — a figure that makes this condition more of a widespread norm than a personal exception."}, {"t": "p", "text": "There is an inequality within this inequality, and it is consistent with what was already written in Itinerary 8: time poverty hits hardest those already in economic difficulty — people with more than one job, longer commutes to work, those raising children alone. Those with less money often also have less time, and the two kinds of scarcity add up instead of staying separate."}, {"t": "p", "text": "Whillans’s research, carried out on samples from wealthy countries, however describes only part of the global picture. A different strand of research — that of development economics and gender studies — documents a structural time poverty across the Global South, often more severe and unevenly distributed between men and women. A 2024 study of the Accra metropolitan area, in Ghana, showed that women turn out to be systematically poorer in time than men, owing to the combined burden of paid work, unpaid domestic work and longer, harder commutes. In rural Pakistan, 37% of employed women are time-poor, against 19% of employed men. This is not the same time poverty described by Whillans, born of diaries packed with chosen commitments: it is a structural time poverty, often unchosen, which adds to — not replaces — the one already described in this itinerary."}, {"t": "sh", "text": "A counterintuitive finding"}, {"t": "p", "text": "In a series of studies published in the journal Proceedings of the National Academy of Sciences, Whillans and colleagues showed something most people do not do spontaneously: using money to buy time — paying for a service that frees up hours otherwise spent on unwanted tasks — produces a greater increase in happiness, on average, than buying a material good of the same value. This is not a luxury reserved for the already well-off: the effect appears even at modest income levels, for anyone who can afford even a small expense of this kind."}, {"t": "sh", "text": "A case"}, {"t": "p", "text": "Two people with the same number of free hours can live their week in opposite ways: one lives it as leftover time, fought over by a thousand commitments right up to the last minute; the other lives it as their own time, protected in advance. The difference is not in the amount of time available — it is identical — but in the fact that one defended it before others could claim it, while the other waited to see what was left of it."}, {"t": "sh", "text": "Orientation itinerary"}, {"t": "table", "rows": [["Manifestation", "Tool", "Origin", "Why it is useful"], ["You feel chronically short of time, even when your calendar doesn’t look that full", "Recognising time poverty as a measurable condition, not a personal inability to get organised", "Ashley Whillans, Harvard Business School", "Its effect on wellbeing is comparable to, and sometimes greater than, that of unemployment: it is not a minor problem."], ["You feel guilty spending money to save time", "Treating the purchase of time as an investment in happiness, not a waste", "Whillans — Buying Time Promotes Happiness (PNAS)", "The data show a happiness benefit greater than that of an equivalent material purchase."], ["Your free time gets eroded by other people’s demands before you can use it", "Protecting time in advance, not only managing what is left of it", "Research on time planning", "Time not defended in advance tends, by definition, to be taken up by outside demands."], ["You are already in financial difficulty and feel even more short of time", "Recognising that time poverty and financial poverty compound each other — it is not a specific inability of yours", "Whillans — inequality in time poverty", "Places the difficulty within a broader structural picture, not only a personal one."]]}], "ricorda": "Time poverty is a real and measurable condition, with an impact on wellbeing that can exceed that of unemployment — not a personal failure of organisation. It hits hardest those already in economic difficulty. Investing money, when possible, to buy time produces more happiness than an equivalent material purchase. Protecting time in advance works better than defending whatever is left of it.", "approfondire": ["Sendhil Mullainathan and Eldar Shafir – Scarcity: Why Having Too Little Means So Much (already met in Itinerary 8)", "Ashley Whillans – Time Smart: How to Reclaim Your Time and Live a Happier Life (Harvard Business Review Press, 2020)", "Ashley Whillans, Elizabeth Dunn, Michael Norton – Buying Time Promotes Happiness (PNAS, 2017)", "Alice Carmichael et al. – Time Poverty and Gender in Urban Sub-Saharan Africa: Long Working Days and Long Commutes in Ghana’s Greater Accra Metropolitan Area (Journal of International Development, 2024)"]}, "19": {"title": "Itinerary 19 — Meaning, faith and gratitude — How can I manage the fear of getting it wrong as a parent?", "body": [{"t": "p", "text": "Few fears are as widespread, and as rarely spoken alou
