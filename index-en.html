ent choice", "Lundy Bancroft — Why Does He Do That?", "Helps distinguish a chosen estrangement from an induced one"]]}, {"t": "p", "text": "**What to do, with due caution**"}, {"t": "p", "text": "Recognising the pattern, as this Itinerary invites you to do, is a necessary step but not enough on its own. The next question — what to do — deserves the same care, and an important premise applies here: there is no single right step for everyone, and some generic advice, applied to the wrong situation, can increase the risk instead of reducing it. For this reason, rather than a list of instructions to follow alone, this Itinerary offers a direction."}, {"t": "p", "text": "**Talking to someone you trust**"}, {"t": "p", "text": "A friend, a family member, a colleague. This breaks the isolation that coercive control often deliberately builds, and is almost always a safe first step, regardless of what is decided afterwards."}, {"t": "p", "text": "**Contacting an anti-violence centre, or the number 1522**"}, {"t": "p", "text": "This does not require having already decided what to do. Whoever answers is trained to listen, to assess the level of risk together with the person, and to build — not impose — a personalised safety plan: which documents to carry, when it is safer to move, who to turn to in an emergency. On one point, research on this subject is clear, even if uncomfortable: the moment a person leaves a violent relationship is often the most dangerous one, not the safest. This is precisely why planning with a professional, instead of acting on instinct or following generic advice read somewhere, makes a real difference."}, {"t": "p", "text": "**Documenting, if and when it is safe to do so**"}, {"t": "p", "text": "Dates, messages, witnesses: this can be useful in future, but only if doing so does not expose someone to immediate risk. It is a step to weigh together with professional support, not to undertake alone if the situation at home is already tense."}, {"t": "p", "text": "None of these steps requires already having a clear idea of what one ultimately wants to do. Asking for help is not a commitment to leave everything at once: it is a way of not facing, alone, a situation that, by its very nature, was built to seem impossible to face with others."}, {"t": "p", "text": "**And what if there is no violence, but “only” manipulation?**"}, {"t": "p", "text": "Not all manipulation happens within a violent relationship. A friendship, a family member, a boss or a colleague can manipulate without there ever being physical violence, and without the same concrete risk that makes leaving an abusive partner so delicate. The tools for recognising it seen so far — the pattern rather than the isolated episode, doubting one’s own perception as a symptom — remain valid. But the response can be more direct, because the safety calculation is different."}, {"t": "p", "text": "**Clear boundaries, stated in few words**"}, {"t": "p", "text": "A manipulator clings to justifications to reopen the discussion: the more sentences are added to explain oneself, the more room is given to be called into question again. A boundary stated in few words, and repeated consistently, works better than a long explanation."}, {"t": "p", "text": "**An outside perspective**"}, {"t": "p", "text": "Talking to someone not involved — who can confirm, or correct, one’s own perception — is the same principle already met in this Itinerary: trusting the persistent unease, instead of continuing to question it alone."}, {"t": "p", "text": "**A psychotherapist, not for an emergency but to process it**"}, {"t": "p", "text": "Unlike a context of violence, here no urgent intervention is needed: a course of therapy that calmly helps recognise the pattern clearly and rebuild trust in one’s own judgement can be useful."}, {"t": "p", "text": "**In a work context, documenting serves a different purpose**"}, {"t": "p", "text": "Noting down dates and specific episodes can serve a formal process — human resources, a union — not physical safety, which here is usually not at stake in the same way."}, {"t": "p", "text": "**Reducing exposure, when avoidance is not possible**"}, {"t": "p", "text": "If the person cannot be avoided entirely — a family member, a colleague one still has to work with — narrowing what is shared with them reduces the material that can be used to manipulate, even without having to cut off the relationship."}], "ricorda": "Violence is not only physical, and its most widespread form is often the hardest to name: a pattern built up over time, not an isolated event. Doubting one’s own perception, within such a relationship, is more often a symptom of manipulation than a sign of truly being “too sensitive”. This Itinerary does not replace professional intervention, and could not: in Italy, the number 1522 is free, available twenty-four hours a day, and takes requests for help even just for advice, with guaranteed anonymity.", "approfondire": ["Evan Stark – Coercive Control: How Men Entrap Women in Personal Life (Oxford University Press, 2007)", "Lundy Bancroft – Why Does He Do That? Inside the Minds of Angry and Controlling Men (Berkley Books, 2002)", "Domestic Abuse Intervention Project – Power and Control Wheel (Duluth, Minnesota, 1984)", "Marie-France Hirigoyen – Stalking the Soul: Emotional Abuse and the Erosion of Identity (Le Harcèlement moral, 1998)", "Council of Europe – Convention on preventing and combating violence against women and domestic violence, the Istanbul Convention (2011, ratified by Italy with Law No. 77/2013)", "ISTAT – data and surveys on violence against women, anti-violence centres and the number 1522 (2023-2024)"]}}</script>

const ITINERARIES = {

      music: { title: 'Johann Sebastian Bach — Prelude in C major, BWV 846 (1722)', note: 'Orderly, predictable lines that bring a sense of methodical calm — often used in clinical settings precisely to support concentration.', url: 'https://www.youtube.com/results?search_query=Bach%20Prelude%20in%20C%20major%20BWV%20846' },
      film: { title: 'Sully (2016), Clint Eastwood', note: 'Pilot Chesley Sullenberger keeps operational clarity through the 208 seconds of the flight — not spectacular heroism, but the cold application of learned procedure.', url: 'https://www.youtube.com/results?search_query=Sully%202016%20trailer' },

  2: {
    title: 'Observing better before looking for a solution',
    family: 'The method — observing and deciding',
    recognition: 'You notice that people involved in the same situation describe it differently, or that you’re jumping straight to an explanation without having gathered enough facts.',
    keyInsight: 'Observation comes before explanation. Poor observation makes finding the solution unlikely, even when one exists.',
    caution: null,

  3: {

  4: {

      music: { title: 'U2 — I Still Haven’t Found What I’m Looking For (1987)', note: 'A song built entirely around the search for, not the possession of, an answer.', url: 'https://www.youtube.com/results?search_query=U2%20I%20Still%20Haven%27t%20Found%20What%20I%27m%20Looking%20For' },
      film: { title: 'Good Will Hunting (1997), Gus Van Sant', note: 'It’s the psychologist’s questions, not his answers, that unlock the protagonist — the best-known illustration of the power of a good question.', url: 'https://www.youtube.com/results?search_query=Good%20Will%20Hunting%201997%20trailer' },
    },
    quote: { text: 'A beautiful question is an ambitious yet actionable question that can begin to shift the way we perceive or think about something — and that might serve as a catalyst to bring about change.', author: 'Warren Berger', source: 'A More Beautiful Question, 2014, p. 8' },

  5: {

    caution: null,

    culture: {

      music: { title: 'Coldplay — The Scientist (2002)', note: 'The attempt to go back to the start and redo the calculations, the way you do when a hypothesis turns out wrong and needs correcting.', url: 'https://www.youtube.com/results?search_query=Coldplay%20The%20Scientist' },
      film: { title: 'Blow-Up (1966), Michelangelo Antonioni', note: 'Palme d’Or at Cannes. A photographer obsessively enlarges an image to check what he actually saw — this Itinerary’s own discipline, taken to the extreme.', url: 'https://www.youtube.com/results?search_query=Blow-Up%201966%20Antonioni%20trailer' },
    },
    quote: { text: 'Every genuine test of a theory is an attempt to falsify it, to refute it. It can never be positively justified: it can only be found not yet refuted.', author: 'Karl Popper', source: 'Conjectures and Refutations, 1963, p. 36' },

  6: {

    caution: null,

    culture: {

      music: { title: 'Miles Davis — So What (1959, from Kind of Blue)', note: 'The track that opened the door to modal jazz — a compositional method chosen precisely because the problem, improvisation, called for a different tool than traditional harmony.', url: 'https://www.youtube.com/results?search_query=Miles%20Davis%20So%20What' },
      film: { title: 'Moneyball (2011), Bennett Miller', note: 'A sports manager applies an unconventional statistical method, but the right one for the problem in front of him, against those who insist on the traditional tools.', url: 'https://www.youtube.com/results?search_query=Moneyball%202011%20trailer' },

  },
  8: {
    title: 'Thinking clearly inside a condition that doesn’t depend on you',
    family: 'The limit that will not move',
    recognition: 'You’re living with scarcity of money, time or resources, and find it hard to plan, decide calmly, or resist choices you wouldn’t make with a clear head.',
    keyInsight: 'Scarcity consumes real, measurable cognitive resources: it is not a matter of character or willpower.',
    caution: null,
    helpLine: null,
    culture: {
      art: { title: 'Vincent van Gogh — The Potato Eaters (1885)', note: 'A family united despite material hardship — not degradation, but dignity inside scarcity.', url: 'https://www.vangoghmuseum.nl/en/collection/s0005v1962' },
      music: { title: 'Tracy Chapman — Fast Car (1988)', note: 'One of the most honest songs about economic scarcity and the wish to get out of it, without self-pity.', url: 'https://www.youtube.com/results?search_query=Tracy%20Chapman%20Fast%20Car' },
      film: { title: 'Nomadland (2020), Chloé Zhao', note: 'Academy Award for Best Picture. Tells the story of life inside real economic scarcity, without cheap compassion or an easy redemption.', url: 'https://www.youtube.com/results?search_query=Nomadland%202020%20trailer' },
    },
    quote: { text: 'Scarcity captures our attention, and this attention has a narrow benefit: we are better at handling pressing needs in the moment. But it also has a cost: we neglect other things, and become less effective in the rest of life.', author: 'Sendhil Mullainathan and Eldar Shafir', source: 'Scarcity: Why Having Too Little Means So Much, 2013' },
  },

  11: {

    quote: { text: 'I have long since abandoned the idea of a life without storms, or a world without dry and savage seasons. Life is too complicated, too constantly changing, to be anything but what it is.', author: 'Kay Redfield Jamison', source: 'An Unquiet Mind, 1995, p. 215' },

  15: {
    title: 'Telling guilt that repairs apart from shame that paralyses',
    family: 'Body and mind',
    recognition: 'After a mistake you feel like “a wrong person”, not just the author of a wrong act — or you feel guilty for something you didn’t personally cause.',
    keyInsight: 'Guilt is about what you did, and pushes you to make amends. Shame is about what you are, and tends to paralyse. Recognising which one is speaking changes everything.',

    culture: {

  16: {

  18: {

      music: { title: 'Marvin Gaye — What’s Going On (1971)', note: 'An invitation to dialogue instead of confrontation, written at a moment of high social tension.', url: 'https://www.youtube.com/results?search_query=Marvin%20Gaye%20What%27s%20Going%20On' },
      film: { title: '12 Angry Men (1957), Sidney Lumet', note: 'Twelve people in disagreement learn to really listen to each other, one position at a time, instead of simply defending their own.', url: 'https://www.youtube.com/results?search_query=12%20Angry%20Men%201957%20trailer' },
    },
    quote: { text: 'Once you can clearly describe what you are reacting to, free of your interpretation or judgment, the other person is less likely to become defensive as they listen to you.', author: 'Marshall B. Rosenberg', source: 'Nonviolent Communication: A Language of Life, 1999' },

  21: {
    title: 'Living with the knowledge that your own life has an end',
    family: 'The limit that will not move',
    recognition: 'The thought of death — your own, or that of someone you love — has come back insistently, perhaps after losing someone your own age, and you find it hard to tell fear apart from real danger.',
    keyInsight: 'Mortality isn’t a problem the method can solve, but a limit it can help you name correctly — telling present danger apart from a general possibility.',
    caution: 'sensitive',
    helpLine: 'listening',
    culture: {
      art: { title: 'Caspar David Friedrich — The Monk by the Sea (1808-10)', note: 'The tiny figure before the immensity: not terror, but contemplation. Alte Nationalgalerie, Berlin.', url: 'https://commons.wikimedia.org/wiki/File:Friedrich,_Caspar_David_-_M%C3%B6nch_am_Meer_-_Alte_Nationalgalerie_in_Berlin.jpg' },
      music: { title: 'Samuel Barber — Adagio for Strings', note: 'Described by scholars as a journey from sadness to a “serene acceptance”, not to despair.', url: 'https://www.youtube.com/results?search_query=Samuel%20Barber%20Adagio%20for%20Strings' },
      film: { title: 'Departures — Okuribito (2008)', note: 'Academy Award for Best Foreign Language Film. Tells the story of death with dignity and delicacy, not drama.', url: 'https://www.youtube.com/results?search_query=Departures%20Okuribito%20trailer' },
    },
    quote: { text: 'The more unlived your life, the greater your death anxiety. The more you fail to live your life fully, the more you will fear death.', author: 'Irvin D. Yalom', source: 'Staring at the Sun, 2008' },
  },
  22: {
    title: 'Finding a direction again when you’ve lost the sense of the path',
    family: 'Meaning, faith and gratitude',
    recognition: 'After a loss, a change, or with no obvious cause, you can no longer see a direction — you haven’t lost the road, you’ve lost the map you used to read it.',
    keyInsight: 'Losing the sense of the path doesn’t mean you’ve lost the way forever. It often means the map needs updating.',
    caution: null,
    helpLine: null,
    culture: {
      art: { title: 'Gustave Doré — illustration for Dante’s Inferno, Canto I (1861)', note: '“Midway upon the journey of our life, I found myself within a forest dark, for the straightforward pathway had been lost” — the image that gave this very book its name.', url: 'https://commons.wikimedia.org/wiki/File:Dante_lost_in_the_dark_forest,_illustration_to_Dante%E2%80%99s_Inferno_by_Gustave_Dor%C3%A9.jpg' },
      music: { title: 'Bruce Springsteen — The Rising (2002)', note: 'A song built explicitly around finding a direction again after losing every map.', url: 'https://www.youtube.com/results?search_query=Bruce%20Springsteen%20The%20Rising' },
      film: { title: 'Wild (2014), Jean-Marc Vallée', note: 'A woman who, after losing every direction, literally rebuilds her own path one step at a time along the Pacific Crest Trail.', url: 'https://www.youtube.com/results?search_query=Wild%202014%20trailer' },
    },
    quote: { text: 'Every transition begins with an ending. We have to let go of the old thing before we can pick up the new one — not just outwardly, but inwardly as well.', author: 'William Bridges', source: 'Transitions: Making Sense of Life’s Changes, 1980' },
  },
  23: {
    title: 'Grieving a child who never arrived',
    family: 'Loss and changing bonds',
    recognition: 'A longed-for child doesn’t arrive — through infertility, through a path that never reached its end — and you carry a real pain with no precise event to mourn.',
    keyInsight: 'Not having a precise event to mourn doesn’t make the grief any less real. “Closure is a myth”: the goal isn’t to turn the page, but to learn to live alongside the absence.',
    caution: 'sensitive',
    helpLine: 'fertility',
    culture: {
      art: { title: 'Frida Kahlo — Henry Ford Hospital (1932)', note: 'Painted after a miscarriage, one of the first explicit portrayals of this grief in the history of art — raw, not consoling, but honest.', url: 'https://en.wikipedia.org/wiki/Henry_Ford_Hospital_(painting)' },
      music: { title: 'Sarah McLachlan — Angel (1997)', note: 'Though not written for this, it has been adopted by many perinatal-loss communities as the soundtrack to a grief that is often silent.', url: 'https://www.youtube.com/results?search_query=Sarah%20McLachlan%20Angel' },
      film: { title: 'Private Life (2018), Tamara Jenkins', note: 'Tells, with rare realism, a couple’s journey through infertility and treatment, without sentimentality or guaranteed outcomes.', url: 'https://www.youtube.com/results?search_query=Private%20Life%202018%20trailer' },
    },
    quote: { text: 'We do better to live with grief than to deny it or close the door on it. Our task is to acknowledge our losses, name them, find meaning in them, and let go of the search for closure. Instead of seeking closure, we seek meaning and new hope.', author: 'Pauline Boss', source: 'The Myth of Closure, 2021' },
  },
  24: {
    title: 'Accompanying a parent who, while still present, is beginning to disappear',
    family: 'Loss and changing bonds',
    recognition: 'An elderly parent is still physically present, but cognitive decline is making them, little by little, less reachable — and you find yourself effectively becoming your parent’s parent.',

    helpLine: 'caregiver',
    culture: {

      music: { title: 'Ludovico Einaudi — Seven Days Walking (soundtrack of The Father)', note: 'The Italian composer who wrote the film’s score — hypnotic pieces repeated with small variations, mirroring the confusion of memory.', url: 'https://www.youtube.com/results?search_query=Ludovico%20Einaudi%20Seven%20Days%20Walking' },
      film: { title: 'The Father (2020), Florian Zeller', note: 'Academy Award for Best Actor. Tells the story of dementia from the point of view of the person living it, not only of those caring for them — a rare angle. Emotionally intense; watch it when you feel ready.', url: 'https://www.youtube.com/results?search_query=The%20Father%202020%20trailer' },
    },
    quote: { text: 'I don’t like to use the word “acceptance”, but I think we can learn to be comfortable with what we cannot solve.', author: 'Pauline Boss', source: 'interview, On Being Project' },
  },
  25: {

    family: 'Loss and changing bonds',
    recognition: 'You’ve left your country, your language, your world of references — or you’ve stayed put while the place you called home has changed before your eyes.',
    keyInsight: 'Losing a place or a world of references is grief in its own right, even without anyone’s death. Keeping a tie to your culture of origin helps, it doesn’t hinder.',

      music: { title: 'Simon & Garfunkel — Homeward Bound (1966)', note: 'Longing for a place left behind, written on tour far from home.', url: 'https://www.youtube.com/results?search_query=Simon%20and%20Garfunkel%20Homeward%20Bound' },
      film: { title: 'Brooklyn (2015), John Crowley', note: 'A young Irish woman torn between two worlds in the 1950s — longing, double belonging, with no easy rhetoric.', url: 'https://www.youtube.com/results?search_query=Brooklyn%202015%20trailer' },
    },
    quote: { text: 'Linguistic dispossession is close to the dispossession of the self.', author: 'Eva Hoffman', source: 'Lost in Translation: A Life in a New Language, 1989' },

  27: {

      music: { title: 'Christina Perri — Jar of Hearts (2010)', note: 'The pain and resilience after a discovery that changes everything — not revenge, but the attempt to put oneself back together.', url: 'https://www.youtube.com/results?search_query=Christina%20Perri%20Jar%20of%20Hearts' },
      film: { title: 'The Days of Abandonment (I giorni dell’abbandono, 2005), Roberto Faenza — from the novel by Elena Ferrante', note: 'Tells the upheaval of discovery with rare precision. The film’s ending, though, diverges from this Itinerary: the protagonist doesn’t rebuild the couple, she rebuilds herself.', url: 'https://www.youtube.com/results?search_query=I%20giorni%20dell%27abbandono%20trailer' },

// historical origin is not proof of its clinical effectiveness.

  { tool: 'Guided breathing', origin: 'Herbert Benson — The Relaxation Response, 1975, which clinically defined the “relaxation response”.', evidence: 'A large body of later research has measured physiological effects (reduced heart rate and blood pressure) associated with slow, controlled breathing, with results of varying size across studies.' },
  { tool: 'Progressive muscle relaxation (Jacobson)', origin: 'Edmund Jacobson — Progressive Relaxation, University of Chicago Press, 1929.', evidence: 'A clinically widespread technique for a century; later studies show a benefit for anxiety and muscle tension, with mixed methodological quality.' },
  { tool: '5-4-3-2-1 grounding', origin: 'A sensory-anchoring technique widely used in clinical practice for anxiety, panic and dissociative symptoms, with no single identifiable originating author.', evidence: 'There is no single primary source to cite here: it is a technique widely taught within trauma-informed protocols, not a procedure verified by a dedicated clinical trial.' },
  { tool: 'Mindfulness, 5 minutes', origin: 'Jon Kabat-Zinn — Full Catastrophe Living, 1990, a secular adaptation of Vipassana meditation.', evidence: 'Structured mindfulness-based interventions (MBSR, MBCT) have a solid literature on stress and depressive relapse; an isolated 5-minute practice has not been studied with the same rigour as 8-week protocols.' },
  { tool: 'Cognitive restructuring (CBT)', origin: 'Aaron Beck — Cognitive Therapy of Depression, 1979; Albert Ellis — Reason and Emotion in Psychotherapy, 1962.', evidence: 'CBT is among the psychological interventions with the strongest evidence base (numerous randomised trials and meta-analyses) for anxiety and depression. The exercise proposed here is a teaching extract of the technique, not the full treatment.' },

  14: {
    type: 'informational',
    intro: 'Every other Itinerary in this book names tools to try. This one is different, and for a precise reason: conditions such as major depression, chronic anxiety disorders, bipolar disorder or schizophrenia are not a state you pass through in an afternoon, nor a condition that dissolves with a personal technique. That is why the book offers no techniques here.',
    sections: [
      {
        title: 'A fact',
        body: 'According to the World Health Organization, depression is the leading cause of disability worldwide, affecting over three hundred million people. It is not a sign of personal weakness: research describes it as a tangle of biological, psychological and social factors — never an individual fault. The same is true of bipolar disorder and schizophrenia, complex medical conditions with documented neurobiological bases. And yet, even in the wealthiest countries in the world, nearly half of people with depression receive no treatment at all. The most commonly cited cause is not a lack of effective treatment — it exists, and it works for most people who receive it — but stigma: the shame of admitting it, the fear of being judged.',
      },
      {
        title: 'A voice, not a technique',
        body: 'The writer Andrew Solomon, who wove his own experience of depression together with years of research, writes that the opposite of depression is not happiness, but vitality — the capacity to feel, even when what you feel is painful. He doesn’t offer a technique for getting out of it. He offers proof, reasoned and unsentimental, that it is possible to describe this condition with precision, dignity and even beauty, without minimising it or letting it define you.',
      },
      {
        title: 'Those who live alongside',
        body: 'Living alongside someone with a serious psychiatric illness is, in turn, a complex and often lonely experience — a problem in its own right, with its own scientific literature. The psychiatrists Christine Vaughn and Julian Leff documented that families marked by high criticism, hostility or excessive emotional involvement are associated with a three- to sevenfold higher risk of relapse in the patient. This is not a judgment on families, who are almost always already under strain: it is a finding that led to the development of family psychoeducation programmes, whose effectiveness in reducing relapse has been confirmed in numerous controlled studies. Specific help exists for those who accompany, too, not only for those who are ill.',
      },
      {
        title: 'Where to seek help',
        body: 'Your GP is often the first point of access, and will direct you to a specialist when needed. A psychotherapist works on the psychological aspects, often with approaches of proven effectiveness. A psychiatrist is also qualified for any medication-based treatment. Public mental-health services, in many countries, also offer family psychoeducation pathways. Helplines remain a point of entry for those who don’t know where to start. None of these paths is a sign of failure — neither for the person who is ill, nor for those alongside them.',
      },
    ],
  },

// ============ 1. GUIDED BREATHING ============
function BreathingTool({ baseFont, onExit }) {
  const [running, setRunning] = useState(false);
  const [phase, setPhase] = useState('inhale'); // inhale | hold | exhale
  const [scale, setScale] = useState(0.55);
  const [cycles, setCycles] = useState(0);
  const timeoutRef = useRef(null);

  const PHASES = [
    { key: 'inhale', label: 'Breathe in through your nose', duration: 4000, targetScale: 1 },
    { key: 'hold', label: 'Hold', duration: 1500, targetScale: 1 },
    { key: 'exhale', label: 'Breathe out through your mouth', duration: 6000, targetScale: 0.55 },
  ];

  useEffect(() => {
    if (!running) return;
    let idx = PHASES.findIndex((p) => p.key === phase);
    const current = PHASES[idx];
    setScale(current.targetScale);
    timeoutRef.current = setTimeout(() => {
      const nextIdx = (idx + 1) % PHASES.length;
      if (nextIdx === 0) setCycles((c) => c + 1);
      setPhase(PHASES[nextIdx].key);
    }, current.duration);
    return () => clearTimeout(timeoutRef.current);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [running, phase]);

  const start = () => { setPhase('inhale'); setCycles(0); setRunning(true); };
  const stop = () => { setRunning(false); clearTimeout(timeoutRef.current); setScale(0.55); };
  const currentLabel = PHASES.find((p) => p.key === phase)?.label || 'Breathe in through your nose';

  return (
    <div>
      <div style={{ ...card, textAlign: 'center', paddingTop: 40, paddingBottom: 36 }}>
        <div style={{ width: 220, height: 220, margin: '0 auto 28px auto', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <div style={{
            width: 180 * scale, height: 180 * scale, borderRadius: '50%',
            background: 'radial-gradient(circle, #EAF1FC 0%, #1F4E8C 100%)',
            transition: `all ${phase === 'inhale' ? 4 : phase === 'exhale' ? 6 : 1.5}s ease-in-out`,
            boxShadow: '0 4px 24px rgba(31,78,140,0.25)',
          }} />
        </div>
        <div style={{ fontSize: baseFont * 1.15, fontWeight: 800, color: '#17203A', marginBottom: 8, minHeight: 30 }}>
          {running ? currentLabel : 'Ready whenever you are'}
        </div>
        {running && <div style={{ fontSize: baseFont * 0.85, color: '#6b6b6b' }}>Cycles completed: {cycles}</div>}
      </div>
      <div style={{ display: 'flex', gap: 12, justifyContent: 'center' }}>
        {!running
          ? <button onClick={start} style={btnPrimary('#1F4E8C')}>Start</button>
          : <button onClick={stop} style={btnSecondary}>Stop</button>}
        <button onClick={onExit} style={btnSecondary}>&#8592; Back to tools</button>
      </div>
      <p style={{ fontSize: baseFont * 0.85, color: '#6b6b6b', textAlign: 'center', marginTop: 20, lineHeight: 1.5 }}>
        Breathe in as the circle grows, breathe out as it shrinks. Five to ten minutes is enough.
      </p>
    </div>
  );
}

// ============ 2. MUSCLE RELAXATION (JACOBSON) ============
const MUSCLE_GROUPS = ['Hands and forearms', 'Arms', 'Shoulders', 'Face', 'Abdomen', 'Legs', 'Feet'];
function JacobsonTool({ baseFont, onExit }) {
  const [idx, setIdx] = useState(0);
  const [phase, setPhase] = useState('ready'); // ready | tension | release
  const [secondsLeft, setSecondsLeft] = useState(6);
  const intervalRef = useRef(null);

  useEffect(() => {
    if (phase === 'ready') return;
    setSecondsLeft(phase === 'tension' ? 6 : 8);
    intervalRef.current = setInterval(() => {
      setSecondsLeft((s) => {
        if (s <= 1) {
          clearInterval(intervalRef.current);
          if (phase === 'tension') setPhase('release');
          else if (idx < MUSCLE_GROUPS.length - 1) { setIdx((i) => i + 1); setPhase('ready'); }
          else setPhase('done');
          return 0;
        }
        return s - 1;
      });
    }, 1000);
    return () => clearInterval(intervalRef.current);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [phase]);

  const startGroup = () => setPhase('tension');
  const restart = () => { setIdx(0); setPhase('ready'); };

  if (phase === 'done') {
    return (
      <div style={card}>
        <div style={{ textAlign: 'center' }}>
          <div style={{ fontSize: 40, marginBottom: 12 }}>&#10003;</div>
          <div style={{ fontSize: baseFont * 1.1, fontWeight: 800, color: '#17203A', marginBottom: 20 }}>
            Sequence completed
          </div>
          <div style={{ display: 'flex', gap: 12, justifyContent: 'center' }}>
            <button onClick={restart} style={btnPrimary('#6B4FA0')}>Start over</button>
            <button onClick={onExit} style={btnSecondary}>&#8592; Tools</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div>
      <div style={{ fontSize: 13, color: '#6b6b6b', fontWeight: 700, marginBottom: 8 }}>
        GROUP {idx + 1} OF {MUSCLE_GROUPS.length}
      </div>
      <div style={{ ...card, textAlign: 'center', paddingTop: 32, paddingBottom: 32 }}>
        <div style={{ fontSize: baseFont * 1.3, fontWeight: 800, color: '#6B4FA0', marginBottom: 18 }}>
          {MUSCLE_GROUPS[idx]}
        </div>
        {phase === 'ready' && (
          <>
            <p style={{ fontSize: baseFont, color: '#2b2b2b', marginBottom: 20 }}>Ready to tense this muscle group?</p>
            <button onClick={startGroup} style={btnPrimary('#6B4FA0')}>Start tensing</button>
          </>
        )}
        {phase === 'tension' && (
          <>
            <div style={{ fontSize: baseFont * 1.6, fontWeight: 800, color: '#C0392B', marginBottom: 10 }}>Tense</div>
            <div style={{ fontSize: baseFont * 2, fontWeight: 800, color: '#17203A' }}>{secondsLeft}</div>
          </>
        )}
        {phase === 'release' && (
          <>
            <div style={{ fontSize: baseFont * 1.6, fontWeight: 800, color: '#2F8F5B', marginBottom: 10 }}>Release</div>
            <div style={{ fontSize: baseFont * 2, fontWeight: 800, color: '#17203A' }}>{secondsLeft}</div>
            <p style={{ fontSize: baseFont * 0.85, color: '#6b6b6b', marginTop: 12 }}>Notice the contrast between tension and release.</p>
          </>
        )}
      </div>
      <button onClick={onExit} style={btnSecondary}>&#8592; Back to tools</button>
    </div>
  );
}

// ============ 3. GROUNDING 5-4-3-2-1 ============
const GROUNDING_STEPS = [
  { count: 5, sense: 'see', icon: '👁️', color: '#2F8F5B' },
  { count: 4, sense: 'touch', icon: '✋', color: '#3F7FBF' },
  { count: 3, sense: 'hear', icon: '👂', color: '#D4A017' },
  { count: 2, sense: 'smell', icon: '👃', color: '#6B4FA0' },
  { count: 1, sense: 'taste', icon: '👅', color: '#C0392B' },
];
function GroundingTool({ baseFont, onExit }) {
  const [idx, setIdx] = useState(0);
  const [values, setValues] = useState(Array(5).fill(''));
  const step = GROUNDING_STEPS[idx];
  const items = (values[idx] || '').split('\n');

  const updateItem = (i, val) => {
    const lines = (values[idx] || '').split('\n');
    while (lines.length < step.count) lines.push('');
    lines[i] = val;
    setValues((prev) => { const next = [...prev]; next[idx] = lines.join('\n'); return next; });
  };

  if (idx >= GROUNDING_STEPS.length) {
    return (
      <div style={card}>
        <div style={{ textAlign: 'center' }}>
          <div style={{ fontSize: 40, marginBottom: 12 }}>&#10003;</div>
          <div style={{ fontSize: baseFont * 1.1, fontWeight: 800, color: '#17203A', marginBottom: 8 }}>Sequence completed</div>
          <p style={{ fontSize: baseFont * 0.9, color: '#5b5b5b', marginBottom: 20 }}>How do you feel now, compared to before?</p>
          <div style={{ display: 'flex', gap: 12, justifyContent: 'center' }}>
            <button onClick={() => { setIdx(0); setValues(Array(5).fill('')); }} style={btnPrimary('#2F8F5B')}>Start over</button>
            <button onClick={onExit} style={btnSecondary}>&#8592; Tools</button>
          </div>
        </div>
      </div>
    );
  }

  const lines = (values[idx] || '').split('\n');
  while (lines.length < step.count) lines.push('');

  return (
    <div>
      <div style={{ fontSize: 13, color: '#6b6b6b', fontWeight: 700, marginBottom: 8 }}>STEP {idx + 1} OF 5</div>
      <div style={card}>
        <div style={{ fontSize: 34, marginBottom: 8 }}>{step.icon}</div>
        <div style={{ fontSize: baseFont * 1.15, fontWeight: 800, color: step.color, marginBottom: 16 }}>
          Name {step.count} things you {step.sense}
        </div>
        {Array.from({ length: step.count }).map((_, i) => (
          <input key={i} type="text" value={lines[i] || ''} onChange={(e) => updateItem(i, e.target.value)}
            placeholder={`${i + 1}.`} style={inputStyle} />
        ))}
      </div>
      <div style={{ display: 'flex', justifyContent: 'space-between', gap: 12 }}>
        <button onClick={onExit} style={btnSecondary}>&#8592; Tools</button>
        <button onClick={() => setIdx((i) => i + 1)} style={btnPrimary(step.color)}>
          {idx < GROUNDING_STEPS.length - 1 ? 'Next →' : 'Finish'}
        </button>
      </div>
    </div>
  );
}

// ============ 4. MINDFULNESS TIMER ============
function MindfulnessTool({ baseFont, onExit }) {
  const [running, setRunning] = useState(false);
  const [secondsLeft, setSecondsLeft] = useState(5 * 60);
  const [scale, setScale] = useState(0.6);
  const intervalRef = useRef(null);
  const breathRef = useRef(null);

  useEffect(() => {
    if (!running) return;
    intervalRef.current = setInterval(() => {
      setSecondsLeft((s) => { if (s <= 1) { setRunning(false); return 0; } return s - 1; });
    }, 1000);
    let expanding = true;
    breathRef.current = setInterval(() => { setScale(expanding ? 1 : 0.6); expanding = !expanding; }, 4000);
    return () => { clearInterval(intervalRef.current); clearInterval(breathRef.current); };
  }, [running]);

  const mins = Math.floor(secondsLeft / 60);
  const secs = secondsLeft % 60;
  const start = () => { setSecondsLeft(5 * 60); setRunning(true); };
  const stop = () => { setRunning(false); setSecondsLeft(5 * 60); setScale(0.6); };

  return (
    <div>
      <div style={{ ...card, textAlign: 'center', paddingTop: 40, paddingBottom: 36 }}>
        <div style={{ width: 200, height: 200, margin: '0 auto 24px auto', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>

  const [problem, setProblem] = useState('');
  const [reasons, setReasons] = useState(['', '', '', '', '']);
  const [started, setStarted] = useState(false);

  const updateReason = (i, val) => setReasons((prev) => { const next = [...prev]; next[i] = val; return next; });
  const lastFilled = reasons.reduce((acc, r, i) => r.trim() ? i : acc, -1);

  if (!started) {
    return (
      <div>
        <div style={card}>
          <div style={{ fontSize: baseFont * 0.95, fontWeight: 800, color: '#D4A017', marginBottom: 10 }}>What is the initial symptom or problem?</div>
          <p style={{ fontSize: baseFont * 0.85, color: '#6b6b6b', marginBottom: 10 }}>Describe it the way you’d tell it to someone — the fact, not yet the cause.</p>
          <input type="text" value={problem} onChange={(e) => setProblem(e.target.value)} placeholder="E.g. A project is running two weeks late" style={inputStyle} />
        </div>
        <button onClick={() => problem.trim() && setStarted(true)} disabled={!problem.trim()} style={{ ...btnPrimary('#D4A017'), opacity: problem.trim() ? 1 : 0.5, width: '100%', marginBottom: 12 }}>
          Start asking "why"
        </button>
        <button onClick={onExit} style={btnSecondary}>&#8592; Back to tools</button>

    );

  return (
    <div>
      <div style={{ ...card, background: '#FEF6E2', borderColor: '#D4A017' }}>
        <div style={{ fontSize: 12.5, fontWeight: 800, color: '#8a6d00', marginBottom: 4 }}>THE PROBLEM</div>
        <div style={{ fontSize: baseFont * 0.95, color: '#17203A' }}>{problem}</div>
      </div>
      <p style={{ fontSize: baseFont * 0.78, color: '#6b6b6b', marginBottom: 14, lineHeight: 1.4 }}>
        Five "whys" don’t guarantee you’ll reach the real cause — in complex problems, there is usually no single cause to uncover. This exercise helps you explore possible causes, not prove them.
      </p>
      {reasons.map((val, i) => {
        if (i > 0 && !reasons[i - 1].trim()) return null;
        return (
          <div key={i} style={card}>
            <div style={{ fontSize: baseFont * 0.95, fontWeight: 800, color: '#D4A017', marginBottom: 8 }}>
              Why {i === 0 ? '' : 'did this happen'}? <span style={{ color: '#c9a227' }}>({i + 1}/5)</span>
            </div>
            <input type="text" value={val} onChange={(e) => updateReason(i, e.target.value)}
              placeholder="Write the immediate cause..." style={inputStyle} autoFocus={i === lastFilled + 1} />
          </div>
        );
      })}
      {lastFilled === 4 && (
        <div style={{ ...card, background: '#D4A017', color: '#fff' }}>
          <div style={{ fontSize: 12.5, fontWeight: 800, marginBottom: 6 }}>A POSSIBLE DEEPER CAUSE</div>
          <div style={{ fontSize: baseFont * 1.02, fontWeight: 600 }}>{reasons[4]}</div>
        </div>
      )}
      <button onClick={onExit} style={btnSecondary}>&#8592; Back to tools</button>
    </div>
  );
}

const OODA_PHASES = [
  { key: 'osserva', label: 'Observe', prompt: 'What signals do you have available right now, without interpreting them yet?', color: '#1F4E8C' },
  { key: 'orienta', label: 'Orient', prompt: 'How do these signals connect to what you already know or have already lived through?', color: '#2F8F5B' },
  { key: 'decidi', label: 'Decide', prompt: 'What is the most reasonable action, given the information you have now?', color: '#E67E22' },
  { key: 'agisci', label: 'Act', prompt: 'What will you actually do? The loop will start again by observing the effect of this action.', color: '#C0392B' },
];
function OODATool({ baseFont, onExit }) {
  const [round, setRound] = useState(1);
  const [idx, setIdx] = useState(0);
  const [history, setHistory] = useState([]);
  const [current, setCurrent] = useState({ osserva: '', orienta: '', decidi: '', agisci: '' });
  const phase = OODA_PHASES[idx];

  const updateField = (val) => setCurrent((prev) => ({ ...prev, [phase.key]: val }));
  const next = () => {
    if (idx < 3) { setIdx(idx + 1); return; }
    setHistory((h) => [...h, { round, ...current }]);
    setCurrent({ osserva: '', orienta: '', decidi: '', agisci: '' });
    setIdx(0);
    setRound((r) => r + 1);
  };

  return (
    <div>
      {history.length > 0 && (
        <div style={{ marginBottom: 16 }}>
          {history.map((h, i) => (
            <div key={i} style={{ fontSize: baseFont * 0.8, color: '#6b6b6b', marginBottom: 4 }}>
              Loop {h.round} completed — you acted: "{h.agisci.slice(0, 60)}{h.agisci.length > 60 ? '…' : ''}"
            </div>
          ))}
        </div>
      )}
      <div style={{ fontSize: 13, color: '#6b6b6b', fontWeight: 700, marginBottom: 8 }}>LOOP {round} — STEP {idx + 1} OF 4</div>
      <div style={{ ...card, borderColor: phase.color }}>
        <div style={{ fontSize: baseFont * 1.2, fontWeight: 800, color: phase.color, marginBottom: 10 }}>{phase.label}</div>
        <p style={{ fontSize: baseFont * 0.92, color: '#2b2b2b', marginBottom: 14, lineHeight: 1.5 }}>{phase.prompt}</p>
        <textarea value={current[phase.key]} onChange={(e) => updateField(e.target.value)} rows={4} style={{ ...inputStyle, marginBottom: 0, resize: 'vertical' }} />
      </div>
      <div style={{ display: 'flex', justifyContent: 'space-between', gap: 12 }}>
        <button onClick={onExit} style={btnSecondary}>&#8592; Tools</button>
        <button onClick={next} style={btnPrimary(phase.color)}>{idx < 3 ? 'Next →' : 'Act and restart the loop'}</button>
      </div>
    </div>
  );
}

function MatriceTool({ baseFont, onExit }) {

// ============ 13. COLOUR AND BREATHE ============
function hexPoints(cx, cy, r) {
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const angle = (Math.PI / 180) * (60 * i - 30);
    pts.push(`${cx + r * Math.cos(angle)},${cy + r * Math.sin(angle)}`);
  }
  return pts.join(' ');
}
const PALETTE = ['#1F4E8C', '#2F8F5B', '#D4A017', '#C0392B', '#6B4FA0', '#E67E22', '#C2185B', '#3F7FBF', '#FBF6EE'];
function ColoringTool({ baseFont, onExit }) {
  const HEX_R = 26;
  const HEX_W = HEX_R * Math.sqrt(3);
  const HEX_H = HEX_R * 2;
  const COLS = 6, ROWS = 7;
  const [fills, setFills] = useState({});
  const [activeColor, setActiveColor] = useState(PALETTE[0]);
  const [secondsLeft, setSecondsLeft] = useState(10 * 60);
  const [running, setRunning] = useState(false);
  const intervalRef = useRef(null);

  useEffect(() => {
    if (!running) return;
    intervalRef.current = setInterval(() => {
      setSecondsLeft((s) => { if (s <= 1) { setRunning(false); return 0; } return s - 1; });
    }, 1000);
    return () => clearInterval(intervalRef.current);
  }, [running]);

  const hexes = [];
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const x = col * HEX_W + (row % 2 === 1 ? HEX_W / 2 : 0) + HEX_W;
      const y = row * (HEX_H * 0.75) + HEX_H / 2 + 10;
      hexes.push({ id: `h${row}-${col}`, cx: x, cy: y });
    }
  }
  const viewW = COLS * HEX_W + HEX_W + 10;
  const viewH = ROWS * HEX_H * 0.75 + HEX_H / 2 + 20;

  const paint = (id) => setFills((prev) => ({ ...prev, [id]: activeColor }));
  const reset = () => { setFills({}); setSecondsLeft(10 * 60); setRunning(false); };
  const mins = Math.floor(secondsLeft / 60);
  const secs = secondsLeft % 60;

  return (
    <div>
      <div style={{ ...card, textAlign: 'center' }}>
        <p style={{ fontSize: baseFont * 0.85, color: '#5b5b5b', marginBottom: 16, lineHeight: 1.5 }}>
          Choose a colour, then tap the cells to fill them in. There is no right way to do it.
        </p>
        <svg viewBox={`0 0 ${viewW} ${viewH}`} width="100%" style={{ maxWidth: 320, margin: '0 auto', display: 'block' }}>
          {hexes.map((h) => (
            <polygon key={h.id} points={hexPoints(h.cx, h.cy, HEX_R - 1.5)} fill={fills[h.id] || '#fff'} stroke="#d8d2bf" strokeWidth="1"
              onClick={() => paint(h.id)} style={{ cursor: 'pointer' }} />
          ))}
        </svg>
        <div style={{ display: 'flex', gap: 8, justifyContent: 'center', flexWrap: 'wrap', marginTop: 18, marginBottom: 16 }}>
          {PALETTE.map((c) => (
            <button key={c} onClick={() => setActiveColor(c)} aria-label={`Choose colour ${c}`}
              style={{ width: 32, height: 32, borderRadius: '50%', background: c, border: activeColor === c ? '3px solid #17203A' : '1.5px solid #d8d2bf', cursor: 'pointer' }} />
          ))}
        </div>
        <div style={{ fontSize: baseFont * 1.1, fontWeight: 800, color: '#17203A', marginBottom: 12 }}>
          {String(mins).padStart(2, '0')}:{String(secs).padStart(2, '0')}
        </div>
        <div style={{ display: 'flex', gap: 10, justifyContent: 'center' }}>
          {!running
            ? <button onClick={() => setRunning(true)} style={btnPrimary('#6B4FA0')}>{secondsLeft < 10 * 60 ? 'Resume' : 'Start the timer'}</button>
            : <button onClick={() => setRunning(false)} style={btnSecondary}>Pause</button>}
          <button onClick={reset} style={btnSecondary}>Start over</button>
        </div>
      </div>
      <p style={{ fontSize: baseFont * 0.78, color: '#6b6b6b', textAlign: 'center', marginBottom: 16, lineHeight: 1.5 }}>
        Research links colouring a structured pattern like this one to a short-term reduction in anxiety — it isn’t specific to any particular shape, but to having outlines already given, without having to decide what to draw.
      </p>
      <button onClick={onExit} style={btnSecondary}>&#8592; Back to tools</button>
    </div>
  );
}

// ============ 15. WHAT KIND OF PROBLEM IS IT? (DECISION TREE FOR CHOOSING THE METHOD) ============
function DecisionTreeTool({ baseFont, onExit }) {
  const [step, setStep] = useState(0);
  const [answers, setAnswers] = useState([]);

  const questions = [
    { q: 'Is the problem mostly about a verifiable fact, or an interpretation/opinion?', a: 'A verifiable fact', b: 'An interpretation or opinion' },
    { q: 'Does it involve other people you need to reach an agreement with, or is it a matter that concerns only you?', a: 'Other people, an agreement is needed', b: 'It concerns only me' },
    { q: 'Do you already have an idea of the cause, or are you still in the dark about what’s going on?', a: 'I already have an idea to check', b: 'I’m still in the dark' },
  ];

  const results = {
    'a-a-a': { title: 'Fact-checking', tools: ['Hypothesis lab', 'SOAP scheme'], nota: 'You already have a plausible explanation: the right step is to test it against the evidence, not to look for another one.' },
    'a-a-b': { title: 'Searching for causes', tools: ['The 5 Whys', 'Ishikawa diagram'], nota: 'A clear explanation is still missing: these tools help trace back from the symptom to the cause.' },
    'a-b-a': { title: 'Fact-based negotiation', tools: ['Nonviolent Communication', 'SOAP scheme'], nota: 'There’s a fact to clarify together with others: separating observation from interpretation is the first step.' },
    'a-b-b': { title: 'Collaborative discussion', tools: ['Nonviolent Communication', 'The 5 Whys'], nota: 'Before negotiating a solution, it may help to first understand together what’s really going on.' },
    'b-a-a': { title: 'Personal decision', tools: ['Decision matrix', 'Circle of control and influence'], nota: 'You already have an option in mind: comparing it against clear criteria helps you decide with more confidence.' },
    'b-a-b': { title: 'Clarify before deciding', tools: ['Cognitive restructuring', 'Circle of control and influence'], nota: 'Before choosing, it may help to understand how much of this really depends on you.' },
    'b-b-a': { title: 'Discussion over a shared interpretation', tools: ['Nonviolent Communication', 'Decision matrix'], nota: 'The disagreement is about an interpretation, not a fact: listen before proposing solutions.' },
    'b-b-b': { title: 'Open exploration', tools: ['The 5 Whys', 'Nonviolent Communication'], nota: 'A situation that’s still unclear and involves others: start from the questions, not the solutions.' },
  };

  const pick = (choice) => {
    const next = [...answers, choice];
    setAnswers(next);
    setStep(step + 1);
  };
  const reset = () => { setAnswers([]); setStep(0); };
  const key = answers.join('-');
  const result = results[key];

  return (
    <div>
      <div style={card}>
        {step < questions.length ? (
          <>
            <div style={{ fontSize: 12.5, fontWeight: 800, color: '#1F4E8C', marginBottom: 10 }}>STEP {step + 1} OF {questions.length}</div>
            <p style={{ fontSize: baseFont * 1.02, lineHeight: 1.5, marginBottom: 20 }}>{questions[step].q}</p>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              <button onClick={() => pick('a')} style={btnPrimary('#1F4E8C')}>{questions[step].a}</button>
              <button onClick={() => pick('b')} style={btnPrimary('#1F4E8C')}>{questions[step].b}</button>
            </div>
          </>
        ) : result ? (
          <>
            <div style={{ fontSize: 12.5, fontWeight: 800, color: '#1F4E8C', marginBottom: 10 }}>A FIRST LEAD TO EXPLORE</div>
            <p style={{ fontSize: baseFont * 1.1, fontWeight: 800, marginBottom: 10 }}>{result.title}</p>
            <p style={{ fontSize: baseFont * 0.9, lineHeight: 1.5, color: '#5b5b5b', marginBottom: 10 }}>{result.nota}</p>
            <p style={{ fontSize: baseFont * 0.8, lineHeight: 1.5, color: '#6b6b6b', marginBottom: 14, fontStyle: 'italic' }}>This is an orientational classification, not a diagnostic one: a real problem can belong to several categories at once, and may call for several different tools.</p>
            <div style={{ fontSize: 12.5, fontWeight: 800, color: '#6b6b6b', marginBottom: 8 }}>SUGGESTED TOOLS</div>
            {result.tools.map((t, i) => (
              <div key={i} style={{ padding: '10px 14px', background: '#F5F1E6', borderRadius: 10, marginBottom: 8, fontSize: baseFont * 0.92 }}>{t}</div>
            ))}
            <button onClick={reset} style={{ ...btnSecondary, marginTop: 10 }}>Start over</button>
          </>
        ) : null}
      </div>
      <button onClick={onExit} style={btnSecondary}>&#8592; Back to tools</button>
    </div>
  );
}

// ============ 16. HYPOTHESIS LAB ============
function HypothesisLabTool({ baseFont, onExit }) {
  const [hypothesis, setHypothesis] = useState('');
  const [forEv, setForEv] = useState(['']);
  const [againstEv, setAgainstEv] = useState(['']);
  const [updated, setUpdated] = useState('');

  const addRow = (setter, arr) => setter([...arr, '']);
  const updateRow = (setter, arr, i, val) => { const c = [...arr]; c[i] = val; setter(c); };
  const removeRow = (setter, arr, i) => setter(arr.filter((_, idx) => idx !== i));

  return (
    <div>
      <div style={card}>
        <div style={{ fontSize: 12.5, fontWeight: 800, color: '#C0392B', marginBottom: 8 }}>YOUR HYPOTHESIS</div>
        <p style={{ fontSize: baseFont * 0.85, color: '#5b5b5b', marginBottom: 10, lineHeight: 1.5 }}>Not a fact: a plausible explanation you want to check.</p>
        <textarea value={hypothesis} onChange={(e) => setHypothesis(e.target.value)} placeholder="E.g. I think my colleague isn’t answering me because they’re angry with me..."
          style={{ ...inputStyle, minHeight: 60, resize: 'vertical' }} />
      </div>

      <div style={{ ...card, borderColor: '#2F8F5B' }}>
        <div style={{ fontSize: 12.5, fontWeight: 800, color: '#2F8F5B', marginBottom: 10 }}>EVIDENCE FOR</div>
        {forEv.map((v, i) => (
          <div key={i} style={{ display: 'flex', gap: 8, marginBottom: 8 }}>
            <input value={v} onChange={(e) => updateRow(setForEv, forEv, i, e.target.value)} style={{ ...inputStyle, marginBottom: 0 }} placeholder="An observable fact, not an impression" />
            {forEv.length > 1 && <button onClick={() => removeRow(setForEv, forEv, i)} style={{ background: 'none', border: 'none', color: '#bbb', cursor: 'pointer', fontSize: 20 }}>&#215;</button>}
          </div>
        ))}
        <button onClick={() => addRow(setForEv, forEv)} style={btnSecondary}>+ Add evidence</button>
      </div>

      <div style={{ ...card, borderColor: '#C0392B' }}>
        <div style={{ fontSize: 12.5, fontWeight: 800, color: '#C0392B', marginBottom: 10 }}>EVIDENCE AGAINST</div>
        <p style={{ fontSize: baseFont * 0.8, color: '#6b6b6b', marginBottom: 10 }}>The hardest and most important step: looking for what contradicts the hypothesis, not just what confirms it.</p>
        {againstEv.map((v, i) => (
          <div key={i} style={{ display: 'flex', gap: 8, marginBottom: 8 }}>
            <input value={v} onChange={(e) => updateRow(setAgainstEv, againstEv, i, e.target.value)} style={{ ...inputStyle, marginBottom: 0 }} placeholder="What doesn’t fit with this explanation?" />
            {againstEv.length > 1 && <button onClick={() => removeRow(setAgainstEv, againstEv, i)} style={{ background: 'none', border: 'none', color: '#bbb', cursor: 'pointer', fontSize: 20 }}>&#215;</button>}
          </div>
        ))}
        <button onClick={() => addRow(setAgainstEv, againstEv)} style={btnSecondary}>+ Add evidence</button>
      </div>

      <div style={{ ...card, background: '#17203A' }}>
        <div style={{ fontSize: 12.5, fontWeight: 800, color: '#b8c0d4', marginBottom: 8 }}>UPDATED HYPOTHESIS</div>
        <p style={{ fontSize: baseFont * 0.85, color: '#b8c0d4', marginBottom: 10, lineHeight: 1.5 }}>In light of the evidence, does the hypothesis stay the same, need correcting, or need to be dropped?</p>
        <textarea value={updated} onChange={(e) => setUpdated(e.target.value)} placeholder="My updated hypothesis is..."
          style={{ ...inputStyle, minHeight: 60, resize: 'vertical', marginBottom: 0 }} />
      </div>
      <button onClick={onExit} style={btnSecondary}>&#8592; Back to tools</button>
    </div>
  );
}

// ============ 22. EXPRESSIVE WRITING ============
function ExpressiveWritingTool({ baseFont, onExit }) {
  const [text, setText] = useState('');
  const [seconds, setSeconds] = useState(15 * 60);
  const [running, setRunning] = useState(false);
  const intervalRef = useRef(null);

  useEffect(() => {
    if (!running) return;
    intervalRef.current = setInterval(() => {
      setSeconds((s) => { if (s <= 1) { setRunning(false); return 0; } return s - 1; });
    }, 1000);
    return () => clearInterval(intervalRef.current);
  }, [running]);

  const mins = Math.floor(seconds / 60);
  const secs = seconds % 60;
  const reset = () => { setSeconds(15 * 60); setRunning(false); };

  return (
    <div>
      <div style={card}>
        <p style={{ fontSize: baseFont * 0.85, color: '#5b5b5b', marginBottom: 12, lineHeight: 1.5 }}>
          Write without stopping to correct yourself, for yourself — not to be read. Describe what happened, what you really feel, and how it connects to other moments in your life. Research links this practice, repeated over time, to improved wellbeing — not to immediate relief: some people feel more agitated right after writing, before feeling better.
        </p>
        <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 14 }}>
          <div style={{ fontSize: baseFont * 1.1, fontWeight: 800, color: '#6B4FA0' }}>{String(mins).padStart(2, '0')}:{String(secs).padStart(2, '0')}</div>
          {!running
            ? <button onClick={() => setRunning(true)} style={btnPrimary('#6B4FA0')}>{seconds < 15 * 60 ? 'Resume' : 'Start the timer'}</button>
            : <button onClick={() => setRunning(false)} style={btnSecondary}>Pause</button>}
          <button onClick={reset} style={btnSecondary}>Start over</button>
        </div>
        <textarea value={text} onChange={(e) => setText(e.target.value)} placeholder="Start writing..."
          style={{ ...inputStyle, minHeight: 220, resize: 'vertical', marginBottom: 0, fontFamily: 'inherit' }} />
      </div>
      <p style={{ fontSize: baseFont * 0.78, color: '#6b6b6b', textAlign: 'center', marginBottom: 16 }}>
        This tool doesn’t save or send what you write: the text exists only while this page stays open and disappears when you close it. If you’re using a shared device, keep in mind that the browser may still keep traces in its history or cache.
      </p>
      <button onClick={onExit} style={btnSecondary}>&#8592; Back to tools</button>
    </div>
  );
}

  const [alternative, setAlternative] = useState('');
  const [need, setNeed] = useState('');
  const [choice, setChoice] = useState('');
  const [running, setRunning] = useState(false);
  const [secondsLeft, setSecondsLeft] = useState(60);
  const [scale, setScale] = useState(0.6);
  const intervalRef = useRef(null);
  const breathRef = useRef(null);

  useEffect(() => {
    if (!running) return;
    intervalRef.current = setInterval(() => {
      setSecondsLeft((s) => { if (s <= 1) { setRunning(false); return 0; } return s - 1; });
    }, 1000);
    let expanding = true;
    breathRef.current = setInterval(() => { setScale(expanding ? 1 : 0.6); expanding = !expanding; }, 4000);
    return () => { clearInterval(intervalRef.current); clearInterval(breathRef.current); };
  }, [running]);

  const startPause = () => { setSecondsLeft(60); setRunning(true); };
  const stopPause = () => { setRunning(false); setSecondsLeft(60); setScale(0.6); };

  const steps = [
    { label: 'WHAT DO I FEEL, RIGHT NOW, IN MY BODY?', color: '#D35400', val: sensation, set: setSensation, placeholder: 'Describe the physical sensation, if you can pick it out — where you feel it, how it arrived...', help: 'Physical hunger usually builds gradually and is felt in the stomach. A craving that arrives suddenly, tied to a specific emotion, often has nothing to do with food itself.' },
    { label: 'IF IT WEREN’T HUNGER, WHAT COULD IT BE?', color: '#6B4FA0', val: alternative, set: setAlternative, placeholder: 'Tiredness, boredom, stress, loneliness, a discomfort I’d rather not feel...', help: 'Food can soothe, for a few minutes, a tension that doesn’t come from the stomach. Naming it doesn’t remove the need, but it brings it into focus.' },
    { label: 'WHAT DO I REALLY NEED, RIGHT NOW, BEYOND FOOD?', color: '#2F8F5B', val: need, set: setNeed, placeholder: 'Rest, a break, talking to someone, moving, crying, doing nothing for a few minutes...', help: 'It isn’t always possible to get that thing right away. But knowing what’s really missing changes the question worth asking.' },
    { label: 'WHATEVER I DECIDE, I CAN DO IT WITHOUT JUDGING MYSELF', color: '#3F7FBF', val: choice, set: setChoice, placeholder: 'Write what you decided to do — eat, wait, do something else — without labelling it right or wrong...', help: 'Rigid self-denial often makes the relationship with food worse, not better. Eating mindfully, when that’s what you choose, is not a failure.' },
  ];

  const mins = Math.floor(secondsLeft / 60);
  const secs = secondsLeft % 60;

  return (
    <div>
      <div style={{ ...card, textAlign: 'center', paddingTop: 32, paddingBottom: 28, borderColor: '#D35400', borderWidth: 1.5 }}>
        <div style={{ fontSize: 12.5, fontWeight: 800, color: '#D35400', marginBottom: 14 }}>BEFORE ANSWERING, A ONE-MINUTE PAUSE</div>
        <div style={{ width: 140, height: 140, margin: '0 auto 18px auto', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <div style={{
            width: 110 * scale, height: 110 * scale, borderRadius: '50%',
            background: 'radial-gradient(circle, #FBE8D8 0%, #D35400 100%)',
            transition: 'all 4s ease-in-out', boxShadow: '0 4px 24px rgba(211,84,0,0.25)',
          }} />
        </div>
        <div style={{ fontSize: baseFont * 1.5, fontWeight: 800, color: '#17203A', marginBottom: 8 }}>
          {String(mins).padStart(2, '0')}:{String(secs).padStart(2, '0')}
        </div>
        <div style={{ fontSize: baseFont * 0.85, color: '#5b5b5b', marginBottom: 16, lineHeight: 1.4 }}>
          {running ? 'Follow the circle with your breath. There’s nothing else you need to do right now.' : secondsLeft === 0 ? 'Pause finished. When you’re ready, continue below.' : 'One minute, just to notice what’s there in your body before deciding.'}
        </div>
        {!running
          ? <button onClick={startPause} style={btnPrimary('#D35400')}>Start the pause</button>
          : <button onClick={stopPause} style={btnSecondary}>Stop</button>}
      </div>
      {steps.map((s, i) => (
        <div key={i} style={{ ...card, borderColor: s.color, borderWidth: 1.5 }}>
          <div style={{ fontSize: 12.5, fontWeight: 800, color: s.color, marginBottom: 6 }}>{s.label}</div>

            style={{ ...inputStyle, minHeight: 55, resize: 'vertical', marginBottom: 0 }} />
        </div>
      ))}
      <button onClick={onExit} style={btnSecondary}>&#8592; Back to tools</button>
    </div>
  );
}

// ============ 28. TIME TO WORRY ============
function WorryTimeTool({ baseFont, onExit }) {
  const [worries, setWorries] = useState([]);
  const [draft, setDraft] = useState('');
  const [phase, setPhase] = useState('cattura'); // 'cattura' (capture) | 'finestra' (window)
  const [secondsLeft, setSecondsLeft] = useState(20 * 60);
  const [running, setRunning] = useState(false);
  const intervalRef = useRef(null);

  useEffect(() => {
    if (!running) return;
    intervalRef.current = setInterval(() => {
      setSecondsLeft((s) => { if (s <= 1) { setRunning(false); return 0; } return s - 1; });
    }, 1000);
    return () => clearInterval(intervalRef.current);
  }, [running]);

  const addWorry = () => {
    if (!draft.trim()) return;
    setWorries((p) => [...p, { id: Date.now(), text: draft.trim(), note: '', done: false }]);
    setDraft('');
  };
  const removeWorry = (id) => setWorries((p) => p.filter((w) => w.id !== id));
  const updateNote = (id, note) => setWorries((p) => p.map((w) => (w.id === id ? { ...w, note } : w)));
  const toggleDone = (id) => setWorries((p) => p.map((w) => (w.id === id ? { ...w, done: !w.done } : w)));
  const resetAll = () => { setWorries([]); setPhase('cattura'); setSecondsLeft(20 * 60); setRunning(false); };

  const mins = Math.floor(secondsLeft / 60);
  const secs = secondsLeft % 60;

  return (
    <div>
      <div style={card}>
        <p style={{ fontSize: baseFont * 0.85, color: '#5b5b5b', marginBottom: 0, lineHeight: 1.5 }}>
          When a worry arrives, don’t try to solve it right away: write it here and postpone it to a dedicated moment. Research shows that shifting the moment you actually think about it — without suppressing it — reduces how often and how long it comes back for the rest of the day.
        </p>
      </div>

      {phase === 'cattura' && (
        <>
          <div style={card}>
            <div style={{ fontSize: 12.5, fontWeight: 800, color: '#3F7FBF', marginBottom: 10 }}>CAPTURE</div>
            <input value={draft} onChange={(e) => setDraft(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && addWorry()}
              placeholder="What’s worrying you right now?" style={inputStyle} />
            <button onClick={addWorry} style={btnPrimary('#3F7FBF')}>Add and postpone</button>
          </div>

          {worries.length > 0 && (
            <div style={card}>
              <div style={{ fontSize: 12.5, fontWeight: 800, color: '#6b6b6b', marginBottom: 10 }}>WAITING ({worries.length})</div>
              {worries.map((w) => (
                <div key={w.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '8px 0', borderBottom: '1px solid #f0ece0' }}>
                  <span style={{ fontSize: baseFont * 0.9 }}>{w.text}</span>
                  <button onClick={() => removeWorry(w.id)} style={{ background: 'none', border: 'none', color: '#bbb', cursor: 'pointer', fontSize: 18 }}>&#215;</button>
                </div>
              ))}
            </div>
          )}

          <button onClick={() => setPhase('finestra')} disabled={worries.length === 0}
            style={{ ...btnPrimary(worries.length === 0 ? '#c9c2ab' : '#D4A017'), width: '100%', marginBottom: 16, cursor: worries.length === 0 ? 'not-allowed' : 'pointer' }}>
            Open the dedicated window &#8594;
          </button>
        </>
      )}

      {phase === 'finestra' && (
        <>
          <div style={{ ...card, textAlign: 'center' }}>
            <div style={{ fontSize: baseFont * 1.1, fontWeight: 800, color: '#17203A', marginBottom: 12 }}>
              {String(mins).padStart(2, '0')}:{String(secs).padStart(2, '0')}
            </div>
            <div style={{ display: 'flex', gap: 10, justifyContent: 'center' }}>
              {!running
                ? <button onClick={() => setRunning(true)} style={btnPrimary('#D4A017')}>{secondsLeft < 20 * 60 ? 'Resume' : 'Start the window'}</button>
                : <button onClick={() => setRunning(false)} style={btnSecondary}>Pause</button>}
            </div>
          </div>

          <div style={{ fontSize: 12.5, fontWeight: 800, color: '#6b6b6b', margin: '20px 0 10px 0' }}>NOW, ONE AT A TIME</div>
          {worries.map((w) => (
            <div key={w.id} style={{ ...card, opacity: w.done ? 0.55 : 1 }}>
              <label style={{ display: 'flex', alignItems: 'flex-start', gap: 10, marginBottom: 10, cursor: 'pointer' }}>
                <input type="checkbox" checked={w.done} onChange={() => toggleDone(w.id)} style={{ width: 18, height: 18, marginTop: 2, flexShrink: 0 }} />
                <span style={{ fontSize: baseFont * 0.92, fontWeight: 700, textDecoration: w.done ? 'line-through' : 'none' }}>{w.text}</span>
              </label>
              <textarea value={w.note} onChange={(e) => updateNote(w.id, e.target.value)}
                placeholder="What do you notice now, really thinking about it? Is it still as urgent as it seemed?"
                style={{ ...inputStyle, minHeight: 50, resize: 'vertical', marginBottom: 0 }} />
            </div>
          ))}

          <button onClick={() => setPhase('cattura')} style={{ ...btnSecondary, width: '100%', marginBottom: 16 }}>&#8592; Back to capturing</button>
        </>
      )}

      <button onClick={resetAll} style={{ ...btnSecondary, width: '100%', marginBottom: 16 }}>Start over tomorrow</button>
      <button onClick={onExit} style={btnSecondary}>&#8592; Back to tools</button>
    </div>
  );
}

  const [problem, setProblem] = useState('');

  const [alternatives, setAlternatives] = useState(['', '']);
  const [evaluation, setEvaluation] = useState({});

  const updateEval = (i, val) => setEvaluation((p) => ({ ...p, [i]: val }));

// ============ 30. STIMULUS CONTROL FOR SLEEP ============
function StimulusControlTool({ baseFont, onExit }) {
  const rules = [
    { id: 'r1', text: 'Go to bed only when you feel sleepy, not just because it’s "time"', help: 'Real drowsiness, not general tiredness: eyes closing on their own.' },
    { id: 'r2', text: 'Use the bed only for sleep (and intimacy) — not phone, TV, reading', help: 'Any other activity in bed teaches the brain to associate it with wakefulness, not sleep.' },
    { id: 'r3', text: 'If you don’t fall asleep within 15-20 minutes, get up and go to another room', help: 'Go back to bed only when sleepiness really arrives — without checking the clock.' },
    { id: 'r4', text: 'Repeat the previous step as many times as needed during the night', help: 'Even several times, if necessary — the principle is the same each time.' },
    { id: 'r5', text: 'Wake up at the same time every morning, regardless of how much you slept', help: 'Even after a difficult night — this is what rebuilds a stable rhythm.' },
    { id: 'r6', text: 'Avoid naps during the day', help: 'Even if tired — sleep accumulated during the day takes sleep away from the night.' },
  ];
  const [checks, setChecks] = useState({});
  const [nights, setNights] = useState(0);

  const toggle = (id) => setChecks((p) => ({ ...p, [id]: !p[id] }));
  const logNight = () => { setNights((n) => n + 1); setChecks({}); };
  const reset = () => { setChecks({}); setNights(0); };
  const doneCount = Object.values(checks).filter(Boolean).length;

  return (
    <div>
      <div style={card}>
        <p style={{ fontSize: baseFont * 0.85, color: '#5b5b5b', marginBottom: 0, lineHeight: 1.5 }}>
          Stimulus control is one of the core components of cognitive behavioural therapy for insomnia, the non-drug treatment most supported by research. The underlying idea: the bed needs to go back to being associated only with sleep, not with frustrated wakefulness. The first few days are often the hardest — the full effects usually arrive after 2-4 weeks of consistent practice.
        </p>
      </div>

      <div style={card}>
        <div style={{ fontSize: 12.5, fontWeight: 800, color: '#6B4FA0', marginBottom: 10 }}>TONIGHT, WHICH DID YOU FOLLOW?</div>
        {rules.map((r) => (
          <label key={r.id} style={{ display: 'flex', alignItems: 'flex-start', gap: 10, marginBottom: 12, cursor: 'pointer' }}>
            <input type="checkbox" checked={!!checks[r.id]} onChange={() => toggle(r.id)} style={{ width: 18, height: 18, marginTop: 2, flexShrink: 0 }} />
            <span>
              <div style={{ fontSize: baseFont * 0.9 }}>{r.text}</div>
              <div style={{ fontSize: baseFont * 0.76, color: '#6b6b6b' }}>{r.help}</div>
            </span>
          </label>
        ))}
        <p style={{ fontSize: baseFont * 0.85, color: '#5b5b5b', margin: '10px 0 14px 0' }}>{doneCount} of 6 rules followed tonight.</p>
        <button onClick={logNight} style={btnPrimary('#6B4FA0')}>Log this night</button>
      </div>

      <div style={{ ...card, textAlign: 'center' }}>
        <div style={{ fontSize: baseFont * 1.3, fontWeight: 800, color: '#17203A' }}>{nights}</div>
        <p style={{ fontSize: baseFont * 0.85, color: '#6b6b6b', margin: 0 }}>nights logged so far</p>
      </div>

      <button onClick={reset} style={{ ...btnSecondary, width: '100%', marginBottom: 16 }}>Reset the count</button>
      <button onClick={onExit} style={btnSecondary}>&#8592; Back to tools</button>
    </div>
  );
}

// ============ 34. TURNING-POINT MOMENTS (FOR TWO PEOPLE) ============
function TurningTowardTool({ baseFont, onExit }) {
  const [nameA, setNameA] = useState('');
  const [nameB, setNameB] = useState('');
  const [moments, setMoments] = useState([]);
  const [draft, setDraft] = useState('');
  const [draftWho, setDraftWho] = useState('A');
  const [phase, setPhase] = useState('setup'); // 'setup' | 'conversazione' (conversation) | 'gesti' (gestures)

  const conversationPrompts = [
    { label: 'FOR THE ONE WHO FOUND OUT', text: 'What do you feel right now, in your own words — without having to justify or minimise it?' },
    { label: 'FOR THE ONE WHO BETRAYED', text: 'What do you understand, now, about what this meant for the other person — not what you wish it had meant?' },
    { label: 'TOGETHER', text: 'Rebuilding, if you both want it, doesn’t start from a single big promise: it starts from small gestures repeated over time. What concrete gestures, not words, could start building it?' },
  ];

  const addMoment = () => {
    if (!draft.trim()) return;
    setMoments((p) => [{ id: Date.now(), who: draftWho, text: draft.trim() }, ...p]);
    setDraft('');
  };
  const removeMoment = (id) => setMoments((p) => p.filter((m) => m.id !== id));

  if (phase === 'setup') {
    return (
      <div>
        <div style={card}>
          <p style={{ fontSize: baseFont * 0.85, color: '#5b5b5b', marginBottom: 16, lineHeight: 1.5 }}>
            This tool is meant to be used together, not alone. Trust, after a betrayal, isn’t repaired by a single big declaration: it builds up through small everyday gestures in which one person turns toward the other instead of away, repeated consistently over time.
          </p>
          <input value={nameA} onChange={(e) => setNameA(e.target.value)} placeholder="Your name" style={inputStyle} />
          <input value={nameB} onChange={(e) => setNameB(e.target.value)} placeholder="The other person’s name" style={{ ...inputStyle, marginBottom: 0 }} />
        </div>
        <button onClick={() => setPhase('conversazione')} disabled={!nameA.trim() || !nameB.trim()}
          style={{ ...btnPrimary(!nameA.trim() || !nameB.trim() ? '#c9c2ab' : '#C2185B'), width: '100%', marginBottom: 16 }}>
          Start
        </button>
        <button onClick={onExit} style={btnSecondary}>&#8592; Back to tools</button>
      </div>
    );
  }

  return (
    <div>
      <div style={{ display: 'flex', gap: 8, marginBottom: 16 }}>
        <button onClick={() => setPhase('conversazione')} style={phase === 'conversazione' ? btnPrimary('#C2185B') : btnSecondary}>Guided conversation</button>
        <button onClick={() => setPhase('gesti')} style={phase === 'gesti' ? btnPrimary('#C2185B') : btnSecondary}>Noticed gestures</button>
      </div>

      {phase === 'conversazione' && conversationPrompts.map((p, i) => (
        <div key={i} style={card}>
          <div style={{ fontSize: 12.5, fontWeight: 800, color: '#C2185B', marginBottom: 8 }}>{p.label}</div>
          <p style={{ fontSize: baseFont * 0.85, color: '#5b5b5b', marginBottom: 10, lineHeight: 1.5 }}>{p.text}</p>
          <textarea placeholder={`${nameA}’s notes...`} style={{ ...inputStyle, minHeight: 50, resize: 'vertical' }} />
          <textarea placeholder={`${nameB}’s notes...`} style={{ ...inputStyle, minHeight: 50, resize: 'vertical', marginBottom: 0 }} />
        </div>
      ))}

      {phase === 'gesti' && (
        <>
          <div style={card}>
            <p style={{ fontSize: baseFont * 0.85, color: '#5b5b5b', marginBottom: 14, lineHeight: 1.5 }}>
              Note down together, over time, the small concrete gestures you both notice — from either side. Not promises: gestures that already happened.
            </p>
            <textarea value={draft} onChange={(e) => setDraft(e.target.value)} placeholder="A concrete gesture you noticed..."
              style={{ ...inputStyle, minHeight: 45, resize: 'vertical' }} />
            <div style={{ display: 'flex', gap: 8, marginBottom: 12 }}>
              <button onClick={() => setDraftWho('A')} style={{ ...btnSecondary, borderColor: draftWho === 'A' ? '#C2185B' : '#d8d2bf', color: draftWho === 'A' ? '#C2185B' : '#5b5b5b', fontWeight: draftWho === 'A' ? 800 : 600 }}>
                {nameA || 'Person A'}
              </button>
              <button onClick={() => setDraftWho('B')} style={{ ...btnSecondary, borderColor: draftWho === 'B' ? '#C2185B' : '#d8d2bf', color: draftWho === 'B' ? '#C2185B' : '#5b5b5b', fontWeight: draftWho === 'B' ? 800 : 600 }}>
                {nameB || 'Person B'}
              </button>
            </div>
            <button onClick={addMoment} style={btnPrimary('#C2185B')}>Add</button>
          </div>

          {moments.length === 0 ? (
            <p style={{ fontSize: baseFont * 0.85, color: '#bbb', fontStyle: 'italic', textAlign: 'center' }}>No gestures recorded yet.</p>
          ) : (
            moments.map((m) => (
              <div key={m.id} style={{ ...card, display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                <div>
                  <div style={{ fontSize: 11.5, fontWeight: 800, color: '#C2185B', marginBottom: 4 }}>{m.who === 'A' ? (nameA || 'Person A') : (nameB || 'Person B')}</div>

                <button onClick={() => removeMoment(m.id)} style={{ background: 'none', border: 'none', color: '#bbb', cursor: 'pointer', fontSize: 18 }}>&#215;</button>
              </div>
            ))
          )}
        </>
      )}
      <button onClick={onExit} style={{ ...btnSecondary, marginTop: 8 }}>&#8592; Back to tools</button>
    </div>
  );
}
