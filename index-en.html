is not a result.**"}, {"t": "p", "text": "**Not even a good intention is a result.**"}, {"t": "p", "text": "**Before acting we must be able to say, as far as possible:**"}, {"t": "p", "text": "**What will we measure?**"}, {"t": "p", "text": "**When will we measure it?**"}, {"t": "p", "text": "**What result will we consider sufficient?**"}, {"t": "p", "text": "**Who will check the data?**"}, {"t": "p", "text": "**What will we do if the result does not arrive?**"}, {"t": "p", "text": "**What unexpected consequences will we look for?**"}, {"t": "p", "text": "It is the same principle as verification, carried over from building knowledge to governing a collective action."}, {"t": "p", "text": "And indeed the WHO’s most recent guidance for heat plans explicitly includes governance, roles and responsibilities, warning systems, surveillance, monitoring, evaluation and learning."}, {"t": "p", "text": "**Deciding is not enough.**"}, {"t": "p", "text": "**We must be able to check what the decision produces.**"}, {"t": "p", "text": "**And if it does not produce what we expected:**"}, {"t": "p", "text": "**Update.**"}, {"t": "p", "text": "**Then:**"}, {"t": "p", "text": "**Observe again.**"}, {"t": "p", "text": "**The Compass Rose, facing the climate**"}, {"t": "p", "text": "**The path could then be represented like this:**"}, {"t": "p", "text": "OBSERVE What is actually happening?"}, {"t": "p", "text": "**↓**"}, {"t": "p", "text": "DISTINGUISH What are the symptoms, causes, consequences, constraints and goals?"}, {"t": "p", "text": "**↓**"}, {"t": "p", "text": "QUESTION Which precise problem are we trying to address?"}, {"t": "p", "text": "**↓**"}, {"t": "p", "text": "VERIFY Which interventions work, and what could show us we are wrong?"}, {"t": "p", "text": "**↓**"}, {"t": "p", "text": "ACCEPT THE LIMIT What can we still avoid, and what must we also adapt to?"}, {"t": "p", "text": "**↓**"}, {"t": "p", "text": "UPDATE Do the results confirm our map?"}, {"t": "p", "text": "**↓**"}, {"t": "p", "text": "DECIDE Do we have enough information to act?"}, {"t": "p", "text": "**↓**"}, {"t": "p", "text": "**Then, when the decision becomes collective:**"}, {"t": "p", "text": "ASSIGN RESPONSIBILITY Who can actually intervene, at what level and with what obligations?"}, {"t": "p", "text": "**↓**"}, {"t": "p", "text": "MEASURE AND CHECK What happened after the decision?"}, {"t": "p", "text": "**↓**"}, {"t": "p", "text": "**RETURN TO OBSERVE**"}, {"t": "p", "text": "**The circle begins again.**"}, {"t": "p", "text": "**And us?**"}, {"t": "p", "text": "**A smaller question remains.**"}, {"t": "p", "text": "**And perhaps a more uncomfortable one.**"}, {"t": "p", "text": "**This book was also written using artificial intelligence.**"}, {"t": "p", "text": "**Artificial intelligence requires infrastructure.**"}, {"t": "p", "text": "**Infrastructure consumes energy and resources.**"}, {"t": "p", "text": "**We can therefore ask:**"}, {"t": "p", "text": "**Should we not have used it?**"}, {"t": "p", "text": "**The Method cannot answer with an automatic yes or no.**"}, {"t": "p", "text": "**It can, however, stop the question from being badly formulated.**"}, {"t": "p", "text": "**Not:**"}, {"t": "p", "text": "**Is artificial intelligence good or bad?**"}, {"t": "p", "text": "**But:**"}, {"t": "p", "text": "**What use?**"}, {"t": "p", "text": "**To obtain what benefit?**"}, {"t": "p", "text": "**With what consumption of resources?**"}, {"t": "p", "text": "**Compared with what alternative?**"}, {"t": "p", "text": "**Does the benefit obtained justify that cost?**"}, {"t": "p", "text": "**Can we get the same result while consuming less?**"}, {"t": "p", "text": "**What limit are we willing to set?**"}, {"t": "p", "text": "**How will we know if we have crossed it?**"}, {"t": "p", "text": "**These are less spectacular questions.**"}, {"t": "p", "text": "**But they allow us to decide.**"}, {"t": "p", "text": "And above all they prevent a comfortable division of the world into innocent tools and guilty tools, as if those of us who use them stood outside the system."}, {"t": "p", "text": "**We do not.**"}, {"t": "p", "text": "**Even this page belongs to the territory it is describing.**"}, {"t": "p", "text": "**What the Method cannot do**"}, {"t": "p", "text": "**Having come this far, we must stop.**"}, {"t": "p", "text": "**Because it would be easy to grant the Method more power than it has.**"}, {"t": "p", "text": "**The Method of the Question is not a climate model.**"}, {"t": "p", "text": "**It does not measure temperature.**"}, {"t": "p", "text": "**It does not calculate climate sensitivity.**"}, {"t": "p", "text": "**It does not establish the optimal energy mix.**"}, {"t": "p", "text": "**It does not design an electricity grid.**"}, {"t": "p", "text": "**It does not build a warning system.**"}, {"t": "p", "text": "**It does not decide which fiscal policy is socially acceptable.**"}, {"t": "p", "text": "It does not replace climatologists, epidemiologists, engineers, economists, urban planners, ecologists, administrators or citizens."}, {"t": "p", "text": "**And above all:**"}, {"t": "p", "text": "**on its own, it does not reduce a single tonne of greenhouse gas.**"}, {"t": "p", "text": "**It can do something that comes before.**"}, {"t": "p", "text": "**It can help us not to confuse the symptom with the cause.**"}, {"t": "p", "text": "**Not to turn a perception into a proof.**"}, {"t": "p", "text": "**Not to choose a solution simply because it belongs to our side.**"}, {"t": "p", "text": "**To look for what might prove us wrong.**"}, {"t": "p", "text": "**To distinguish what we can still avoid from what we must adapt to.**"}, {"t": "p", "text": "**To decide without waiting for an impossible certainty.**"}, {"t": "p", "text": "**To ask who actually holds the power to act.**"}, {"t": "p", "text": "**To check whether what we decided is producing what it promised.**"}, {"t": "p", "text": "**It is not a solution to the climate crisis.**"}, {"t": "p", "text": "**It is a way of not making a difficult problem worse with badly constructed decisions.**"}, {"t": "p", "text": "**The candle, the compass and the thermometer**"}, {"t": "p", "text": "**At the start of this journey we said that the candle does not light up everything.**"}, {"t": "p", "text": "**Faced with the climate crisis, this becomes obvious.**"}, {"t": "p", "text": "**We can measure a great deal.**"}, {"t": "p", "text": "**We cannot predict everything.**"}, {"t": "p", "text": "**The compass does not choose in our place.**"}, {"t": "p", "text": "**Not even here.**"}, {"t": "p", "text": "Science can show us risks, probabilities, scenarios, causal relationships and possible consequences."}, {"t": "p", "text": "**It can tell us that some paths expose us to greater risks than others.**"}, {"t": "p", "text": "**But then someone has to choose.**"}, {"t": "p", "text": "**And every choice distributes costs, benefits, risks and responsibilities.**"}, {"t": "p", "text": "**The Method of the Question does not cool the planet.**"}, {"t": "p", "text": "**It does not stop a heatwave.**"}, {"t": "p", "text": "**It does not bring back a glacier.**"}, {"t": "p", "text": "**It does not stop a city from reaching forty degrees.**"}, {"t": "p", "text": "**The compass does not change the climate.**"}, {"t": "p", "text": "**It can, however, help us understand where we are.**"}, {"t": "p", "text": "It can stop us from mistaking the direction we want for the one shown by the territory."}, {"t": "p", "text": "**It can force us to look even at what we would rather not see.**"}, {"t": "p", "text": "And, when we have enough light to choose, it can remind us that a moment comes when continuing to argue over the map is no longer caution."}, {"t": "p", "text": "**It is paralysis.**"}, {"t": "p", "text": "**Then we must decide.**"}, {"t": "p", "text": "**Act.**"}, {"t": "p", "text": "**Measure what happens.**"}, {"t": "p", "text": "**Correct course.**"}, {"t": "p", "text": "**And resume the journey.**"}, {"t": "p", "text": "**Because this time the dark is not only ahead of us.**"}, {"t": "p", "text": "**It is the world we are walking through.**"}, {"t": "p", "text": "**Essential sources for the appendix**"}, {"t": "li", "text": "International Energy Agency (IEA), Energy and AI, 2025."}, {"t": "li", "text": "World Meteorological Organization (WMO), State of the Global Climate 2025, published in 2026."}, {"t": "li", "text": "World Health Organization Regional Office for Europe, Planning for a warmer world, 16 July 2026."}, {"t": "li", "text": "Intergovernmental Panel on Climate Change (IPCC), AR6 Synthesis Report and related materials."}, {"t": "li", "text": "World Health Organization Regional Office for Europe, 2026 guidance on Heat-Health Action Plans."}], "id": "c40"}, {"title": "Appendix — THE JUDGED BODY", "group": "Appendices", "body": [{"t": "p", "text": "This book has never promised to solve everything. It has promised to give the tools to look more clearly at what can be changed, and to recognise honestly what cannot. There is a kind of judgement almost everyone encounters every day, which the book has not yet named: judgement about appearance — the body, and what one covers it with. It is a judgement that often has nothing to do with health, nothing to do with competence, nothing to do with who someone is — it concerns only how closely one approaches a standard that shifts with fashion and has little to do with merit. And yet it produces real consequences: at work, on mental health, on the environment, on the way a person learns — or fails to learn — to trust their own worth. For this reason it has a place here, among the appendices that complete the Method without belonging to the sequence of the 32 Itineraries."}, {"t": "sh", "text": "Self-care as status"}, {"t": "p", "text": "There is a question rarely asked with honesty: when someone takes care of themselves, whose desire are they actually respecting — their own, or that of a society that has learned to read the body as a curriculum? Self-care, in a growing part of contemporary culture, has stopped being purely a private act and has become a public marker of merit. Those who appear well cared for are read as disciplined, reliable, capable. Those who do not match that standard are read as lacking willpower — regardless of how much they do, eat or train."}, {"t": "p", "text": "This is a mistaken reading, and not out of kindness: out of evidence. Body weight depends on a network of factors — genetic, metabolic, hormonal, pharmacological, as well as behavioural — which clinical research has long considered multifactorial, not reducible to a matter of character. Two American researchers, Rebecca Puhl and Chelsea Heuer, reviewed decades of studies on this subject and document how people who are overweight or obese are stereotyped as lazy, lacking in self-discipline, less competent — a stereotype that runs through employment, healthcare and education, and one rarely challenged in Western culture. Stigma is not a neutral side effect: when a person internalises it, their data show that it worsens — rather than improves — the very health-related behaviours it is supposed to correct."}, {"t": "sh", "text": "The cost of eating well"}, {"t": "p", "text": "There is then a dimension that public discourse tends to erase: the economic one. Not all “healthy” diets cost the same. Adam Drewnowski, a researcher at the University of Washington, analysed the relationship between energy density and food cost, showing that the cheapest foods per calorie are systematically the refined, sugary or fatty ones — while a diet built on fresh vegetables, fish and lean protein has a structurally higher cost per calorie. Populations with lower income and education are therefore exposed to a double constraint: lower purchasing power, and a food market that makes the most accessible food also the least healthy. This is not individual weakness: it is economics applied to the body."}, {"t": "sh", "text": "The appearance that opens doors"}, {"t": "p", "text": "Finally, physical appearance does not stay confined to the private sphere: it enters the labour market. Economists Daniel Hamermesh and Jeff Biddle, in one of the most solid studies in labour economics on this subject, measured a “plainness penalty” of between 5 and 10%, slightly larger than the “premium” for attractiveness — holding education, experience and other observable variables constant. The phenomenon is also documented in other settings — university classrooms, legal professions, salary negotiation — and affects men and women, though with differing intensity. The same methodological caution applies: the correlation between appearance and income is solid; the mechanism producing it remains a matter of open debate."}, {"t": "sh", "text": "Dressing as a declaration of class"}, {"t": "p", "text": "The same mechanism of public judgement applies to what one covers the body with, not only to the body itself. A designer garment, a shoe of a certain brand, communicates more than taste: it communicates social position. The economist and sociologist Thorstein Veblen, more than a century ago, gave this mechanism a name — “conspicuous consumption”: part of consumption serves not the need it meets, but its function as a social signal, one that is more effective the more visible it is and the less accessible it is to the person looking on."}, {"t": "p", "text": "Those who cannot afford that signal face an economic mirror of the argument already made for food: quality costs money, and those with fewer resources necessarily buy less quality and more quantity. Fast fashion — low-cost, mass-produced garments, designed for a short life cycle — is the market’s response to this constraint, not a free aesthetic choice. And it is also the trigger for a second problem: a garment designed to last only briefly generates more waste and more production per unit of actual use. According to the most recent data from the United Nations environmental agency, the fashion industry now accounts for around 10% of global carbon dioxide emissions — more than the combined emissions of international flights and maritime shipping — and is among the largest industrial contributors to water pollution. Those with fewer resources, once again, do not choose to pollute more: they end up doing so as a side effect of a market that makes the only affordable price also the shortest-lived and most fragile one. The link between this dynamic and concern for the planet’s future has already been addressed at length in Itinerary 13, to which this paragraph refers anyone wishing to explore that particular angle further."}, {"t": "sh", "text": "How to actually push back"}, {"t": "p", "text": "Knowing that a judgement is unfounded is not enough to disarm it. The right question is not whether the judgement is wrong, but what to do, concretely, when it arrives — whether it concerns weight, clothing, or any other outward sign that has become a field of judgement."}, {"t": "p", "text": "Two American psychologists, Jennifer Crocker and Brenda Major, studied precisely this problem in other groups subject to stigma, and identified three concrete moves that stigmatised people use to protect their own sense of worth. First, correctly attributing the cause of the judgement: recognising that it arises from a widespread, documented stereotype, not from a real fact about oneself. Second, choosing the point of comparison: measuring oneself against people who share the same actual condition, not against the standard imposed by the dominant group. Third, consciously re-evaluating the dimensions on which one’s own worth is measured — giving less weight to a dimension on which social judgement is disproportionate, and investing more in verifiable, chosen dimensions: competence, relationships, contribution made."}, {"t": "p", "text": "It should be said honestly that not all the techniques proposed for this problem carry the same level of evidence. A brief intervention based on self-compassion alone, tested on women with internalised weight bias, showed benefits for intuitive eating and body appreciation, but almost no effect on the internalised bias itself. More solid, for the specific goal of reducing internalised weight-related judgement, are the cognitive-behavioural interventions built specifically for the subject. For judgement linked to clothing and status, no equally specific literature exists: Crocker and Major’s three mechanisms remain the most solid reference, general to any form of social stigma, without the level of clinical detail available for weight."}, {"t": "sh", "text": "A case"}, {"t": "p", "text": "Fifty-one years old. Nearly two years at the gym, three or four times a week. And a body that gives back almost nothing for that effort."}, {"t": "p", "text": "The diet is almost always correct — vegetables, lean protein, few excesses. Except on one point, sweets, where control often gives way, despite every good intention made the night before."}, {"t": "p", "text": "It is not a single reason. It is several reasons, together."}, {"t": "p", "text": "There is perimenopause: one of the largest studies ever conducted on this phase of life measured that, during these years, the body accumulates fat at almost double its previous rate — with the same diet, the same training."}, {"t": "p", "text": "There are medications: certain therapies, including some antidepressants, are linked to genuine weight gain, measured not in a single case but across hundreds of thousands of people followed over the years."}, {"t": "p", "text": "There is, perhaps, a third element that science has not yet fully understood — the availability of the brain’s reward circuits, the balance of hunger hormones, or both together, in proportions no instrument today can measure precisely for a single person."}, {"t": "p", "text": "And there is a fourth element, less measurable but just as real: that craving for something sweet is, at times, not hunger. It is a comfort — a way of filling, for a few minutes, a void that food cannot truly fill, but which it knows how to soothe, at least for an instant. This is not weakness: it is the same mechanism described a little earlier in this appendix — the body seeks comfort where it finds it, when stress has no other outlet."}, {"t": "p", "text": "Anyone living through this situation receives almost always the same unsolicited advice: eat less, move more. From people who know nothing of those four reasons. This is not malice. It is the same equation this appendix has described from the start — appearance read as merit — applied by people who apply it without even noticing they are doing so."}, {"t": "sh", "text": "Further reading"}, {"t": "li", "text": "Rebecca M. Puhl, Chelsea A. Heuer — The Stigma of Obesity: A Review and Update (Obesity, 2009)"}, {"t": "li", "text": "Adam Drewnowski, Sara E. Specter — Poverty and Obesity: The Role of Energy Density and Energy Costs (American Journal of Clinical Nutrition, 2004)"}, {"t": "li", "text": "Daniel S. Hamermesh, Jeff E. Biddle — Beauty and the Labor Market (American Economic Review, 1994)"}, {"t": "li", "text": "Thorstein Veblen — The Theory of the Leisure Class (1899)"}, {"t": "li", "text": "United Nations Environment Programme (UNEP) — data on emissions and the environmental impact of the fashion industry (2023)"}, {"t": "li", "text": "Jennifer Crocker, Brenda Major — Social Stigma and Self-Esteem: The Self-Protective Properties of Stigma (Psychological Review, 1989)"}, {"t": "li", "text": "Rebecca L. Pearl, Rebecca M. Puhl — Weight Bias Internalization and Health: A Systematic Review (Obesity Reviews, 2018)"}, {"t": "li", "text": "Gail A. Greendale et al. — Changes in Body Composition and Weight During the Menopause Transition (JCI Insight, 2019)"}, {"t": "li", "text": "Rafael Gafoor, Helen P. Booth, Martin C. Gulliford — Antidepressant Utilisation and Incidence of Weight Gain During 10 Years’ Follow-up (BMJ, 2018)"}, {"t": "li", "text": "Mary F. Dallman et al. — Chronic Stress and Obesity: A New View of “Comfort Food” (Proceedings of the National Academy of Sciences, 2003)"}], "id": "c41"}, {"title": "Annotated bibliography", "group": "Bibliography", "body": [{"t": "p", "text": "**Journey into the Dark – A Candle and a Compass**"}, {"t": "p", "text": "Stage 1 — Theoretical references"}, {"t": "table", "rows": [["Work", "Category", "Where", "Why it was chosen", "Concept from the Method", "Question for the Wayfarer"], ["Aristotle – Metaphysics (4th century BC)", "Philosophy", "Foundations of the Method", "Introduces the search for causes and knowledge as a natural human desire.", "The search for causes", "Am I really trying to understand, or just looking for an answer that reassures me?"], ["Francis Bacon – Novum Organum (1620)", "Epistemology", "Foundations of the Method", "Recalls the need to free oneself of prejudice before observing reality.", "Prejudice and observation", "Which ideas am I taking for granted?"], ["Galileo Galilei – The Assayer (1623)", "Scientific method", "Stage 1", "Reminds us that every inquiry must start from the facts before the explanations.", "Observation and verification", "Am I observing before I interpret?"], ["René Descartes – Discourse on the Method (1637)", "Philosophy", "Foundations of the Method", "Shows the value of methodical doubt and of breaking complex problems down.", "Method and doubt", "Have I broken the problem down into its parts?"], ["David Hume – An Enquiry Concerning Human Understanding (1748)", "Philosophy", "Foundations of the Method", "Invites us to distinguish between experience, habit and inference.", "The limits of induction", "What experiences is this conviction built on?"], ["Immanuel Kant – Critique of Pure Reason (1781)", "Philosophy", "Foundations of the Method", "Helps us reflect on the limits and possibilities of human knowledge.", "The limits of knowledge", "What can I actually know?"], ["Karl R. Popper – The Logic of Scientific Discovery (Julius Springer, 1934)", "Epistemology", "Foundations of the Method", "Inquiry grows by testing hypotheses, not merely by seeking confirmation.", "Falsifiability", "How could I discover that I am wrong?"], ["Thomas S. Kuhn – The Structure of Scientific Revolutions", "History of science", "Foundations of the Method", "Shows that even paradigms can change.", "Paradigms", "Am I observing from only one point of view?"], ["Imre Lakatos – The Methodology of Scientific Research Programmes (in Criticism and the Growth of Knowledge, Cambridge University Press, 1970)", "Epistemology", "Foundations of the Method", "Offers a dynamic view of the progress of knowledge.", "Research programmes", "Is my hypothesis really producing knowledge?"], ["Paul Feyerabend – Against Method (New Left Books, 1975)", "Philosophy of science", "Foundations of the Method", "Reminds us that no single method suffices in every situation and calls for critical openness.", "The plurality of methods", "Am I turning the method into a dogma?"], ["Nishida Kitarō – An Inquiry into the Good (Zen no kenkyū, 1911)", "Philosophy (Kyoto School)", "Stage 1", "Proposes another route to the direct knowledge of reality: not a confirmation of this book’s approach, but a distinct perspective to engage with honestly", "Pure experience", "Is my observation already interpretation, or can I still grasp its more immediate source?"]]}, {"t": "p", "text": "Pause 1"}, {"t": "p", "text": "🎨 To contemplate — Magritte (The Human Condition; The Son of Man), Vermeer (The Astronomer), Caravaggio (The Calling of Saint Matthew)"}, {"t": "p", "text": "🎼 To listen to — John Cage (4′33″), Arvo Pärt (Spiegel im Spiegel), Bach (Prelude No. 1 in C major)"}, {"t": "p", "text": "🎬 To watch — The Truman Show, The Matrix, 12 Angry Men"}, {"t": "p", "text": "📚 To read — Arthur Conan Doyle (Sherlock Holmes), Edgar Allan Poe (The Murders in the Rue Morgue), Galileo Galilei (The Assayer)"}, {"t": "p", "text": "🌿 To try — a small observation exercise, a photograph to remember (Earthrise), an episode from the history of science (Galileo’s telescope)"}, {"t": "p", "text": "✒️ Question for the journey — “What, in my everyday life, do I keep looking at without ever truly having seen it?”"}, {"t": "p", "text": "Stage 2 — Theoretical references"}, {"t": "table", "rows": [["Work", "Category", "Where", "Why it was chosen", "Concept from the method", "Question for the Wayfarer"], ["Daniel Kahneman & Amos Tversky – Judgment under Uncertainty: Heuristics and Biases (1974)", "Cognitive psychology", "Stage 2", "Introduces the heuristics and biases that influence judgement.", "Cognitive biases", "Am I describing the facts, or following a mental shortcut?"], ["Umberto Eco – The Name of the Rose (Bompiani, 1980)", "Literature", "Stage 2", "The inquiry becomes an exercise in distinguishing between clues, hypotheses and proof.", "Interpretation", "Are my conclusions supported by the facts?"], ["Confucius – The Analects (Lunyu, 5th century BC)", "Classical philosophy", "Stage 2", "Introduces the “rectification of names”: without exact words, thought and action lose their grip on reality.", "Precision of language", "Am I using the right words to describe what I observe?"], ["George Pólya – How to Solve It (Princeton University Press, 1945)", "Mathematics, pedagogy", "Stage 2 / Compass of the Question", "The first systematic academic attempt at a problem-solving method, built around questions as its central tool", "The four phases: understand, plan, carry out, look back", "Have I truly understood the problem before looking for a solution?"], ["John Dewey – How We Think (D.C. Heath, 1910)", "Philosophy, pedagogy", "Stage 2 / Compass of the Question", "Pólya’s philosophical root: reflective thought is born from a doubt or a perplexity, even before a solution is sought", "Reflective thought", "Am I starting from authentic doubt, or already rushing toward an answer?"]]}, {"t": "p", "text": "Pause 2"}, {"t": "p", "text": "📚 To read — Gilbert K. Chesterton (The Innocence of Father Brown)"}, {"t": "p", "text": "🎬 To watch — Rashomon, Arrival"}, {"t": "p", "text": "🎨 To contemplate — Jan van Eyck (The Arnolfini Portrait), Velázquez (Las Meninas)"}, {"t": "p", "text": "🎼 To listen to — Simon & Garfunkel (The Sound of Silence)"}, {"t": "p", "text": "🧭 To try — ten minutes of observation in a public place"}, {"t": "p", "text": "✒️ Quotation — Marcel Proust, on the true voyage of discovery as having new eyes"}, {"t": "p", "text": "Stage 3 — Theoretical references"}, {"t": "table", "rows": [["Work", "Category", "Where", "Why it was chosen", "Concept from the Method", "Question for the Wayfarer"], ["Karl Popper – Conjectures and Refutations (Routledge & Kegan Paul, 1963)", "Philosophy of science", "Stage 3", "Introduces the criterion of falsifiability as the boundary between science and non-science", "Falsifiability", "What should I observe if I were wrong?"], ["Peter Wason – On the Failure to Eliminate Hypotheses in a Conceptual Task (1960)", "Cognitive psychology", "Stage 3", "Experimentally demonstrates the tendency to seek confirmation rather than refutation", "Confirmation bias", "Am I testing my hypothesis, or only confirming it?"], ["Thomas Chamberlin – The Method of Multiple Working Hypotheses (1890)", "Scientific method", "Stage 3", "Proposes keeping several hypotheses alive with equal care, instead of growing attached to the first one", "Multiple working hypotheses", "Have I generated at least one alternative explanation?"], ["Thomas Bayes – the foundations of Bayesian reasoning (1763)", "Statistics, decision theory", "Stage 3", "Offers a criterion for understanding when evidence really should shift confidence in a hypothesis", "Bayesian updating", "Would this piece of evidence have looked different, if another hypothesis were the true one?"]]}, {"t": "p", "text": "Pause 3"}, {"t": "p", "text": "🎨 To contemplate — M. C. Escher (Belvedere), Galileo Galilei (the drawings of the Moon, Sidereus Nuncius, 1610)"}, {"t": "p", "text": "🎼 To listen to — Johann Sebastian Bach (The Art of Fugue)"}, {"t": "p", "text": "🎬 To watch — Blow-Up (Michelangelo Antonioni, 1966)"}, {"t": "p", "text": "📚 To read — Leonardo Sciascia (The Day of the Owl), Richard Feynman (Cargo Cult Science, 1974)"}, {"t": "p", "text": "🌿 To try — Peter Wason’s number-sequence task (2-4-6)"}, {"t": "p", "text": "✒️ Question for the journey — “The last time I was sure I was right, did I really look for a way to be wrong?”"}, {"t": "p", "text": "Stage 4 — Theoretical references"}, {"t": "table", "rows": [["Work", "Category", "Where", "Why it was chosen", "Concept from the Method", "Question for the Wayfarer"], ["Herbert Simon – bounded rationality and “satisficing” (Macmillan, 1947)", "Economics, decision sciences", "Stage 4", "1978 Nobel laureate; shows that deciding well does not mean comparing every possible option", "Bounded rationality", "Am I looking for the perfect choice, or a good-enough one?"], ["Gary Klein – Sources of Power: How People Make Decisions (MIT Press, 1998)", "Decision psychology", "Stage 4", "Studies how real experts (firefighters, doctors) decide well under pressure, without exhaustive comparison", "Recognition-primed decision", "Am I recognising a reasonable course of action, or waiting for a certainty that will never arrive?"]]}, {"t": "p", "text": "Pause 4"}, {"t": "p", "text": "🎨 To contemplate — Caspar David Friedrich (Wanderer above the Sea of Fog)"}, {"t": "p", "text": "🎼 To listen to — Erik Satie (Gymnopédie No. 1)"}, {"t": "p", "text": "🎬 To watch — Fail-Safe (1964, black and white)"}, {"t": "p", "text": "📚 To read — Alberto Moravia (The Time of Indifference), Beppe Fenoglio (A Private Affair)"}, {"t": "p", "text": "🌿 To try — pause in front of a minor decision you have been putting off, and ask yourself what you really expect to find"}, {"t": "p", "text": "✒️ Question for the journey — “Am I still looking for information, or am I just postponing the fear of choosing?”"}, {"t": "p", "text": "Stage 5 — Theoretical references"}, {"t": "table", "rows": [["Work", "Category", "Where", "Why it was chosen", "Concept from the Method", "Question for the Wayfarer"], ["Leon Festinger — A Theory of Cognitive Dissonance (Stanford University Press, 1957)", "Social psychology", "Stage 5", "Explains why the mind resists correcting a belief threatened by new data", "Cognitive dissonance", "Am I correcting the map, or defending it?"], ["Philip Tetlock, Dan Gardner — Superforecasting (Crown, 2015)", "Decision sciences", "Stage 5", "Shows that the best forecasters update often, in small steps, not all at once", "Incremental updating", "Am I updating in small steps, or waiting until I have to change everything at once?"], ["Philip Tetlock — Expert Political Judgment (Princeton University Press, 2005)", "Decision sciences", "Stage 5", "Distinguishes those who think “like hedgehogs” (one big idea) from those who think “like foxes” (many perspectives at once)", "Foxes and hedgehogs", "Am I defending a single idea, or holding several perspectives together?"], ["Thomas Kuhn — The Structure of Scientific Revolutions (University of Chicago Press, 1962)", "Philosophy of science", "Stage 5", "Shows the same mechanism of resistance and updating at the level of entire scientific communities", "Anomaly and paradigm shift", "How many patches am I adding to an idea that may need replacing?"]]}, {"t": "p", "text": "Pause 5"}, {"t": "p", "text": "🎨 To contemplate — J.M.W. Turner (weather studies and stormy seascapes)"}, {"t": "p", "text": "🎼 To listen to — Ludwig van Beethoven (sketches and revisions in his working notebooks)"}, {"t": "p", "text": "🎬 To watch — Moneyball (2011)"}, {"t": "p", "text": "📚 To read — Luigi Pirandello (One, No One and One Hundred Thousand), Italo Svevo (Zeno’s Conscience)"}, {"t": "p", "text": "🌿 To try — choose a long-held belief and ask what evidence would make you revise it, even just in part"}, {"t": "p", "text": "✒️ Question for the journey — “The last time a fact contradicted me, did I correct the map, or did I defend the belief?”"}, {"t": "p", "text": "Stage 6 — Theoretical references"}, {"t": "table", "rows": [["Work", "Category", "Where", "Why it was chosen", "Concept from the Method", "Question for the Wayfarer"], ["Lee Ross, Andrew Ward — Naive Realism in Everyday Life (in Values and Knowledge, Lawrence Erlbaum Associates, 1996)", "Social psychology", "Stage 6", "Explains why we believe we see reality objectively, and that anyone who disagrees must be misinformed or acting in bad faith", "Naive realism", "Am I listening, or just waiting for my turn to speak?"], ["Adam Grant — Think Again (Viking, 2021)", "Organisational psychology", "Stage 6", "Distinguishes four ways of handling ideas and disagreement — preacher, prosecutor, politician and scientist — and calls for a scientific mindset, open to revising one’s own beliefs.", "Preacher, prosecutor, politician, scientist", "In which of these modes am I listening to the other person?"], ["Daniel Kahneman and colleagues — adversarial collaboration (2001)", "Scientific method", "Stage 6", "Shows how scholars with opposing positions can design and conduct research together, agreed in advance, accepting its publication even when the result does not definitively settle the disagreement.", "Adversarial collaboration", "Is there a check that both of us would consider fair and informative?"]]}, {"t": "p", "text": "Pause 6"}, {"t": "p", "text": "🎨 To contemplate — M. C. Escher (Hand with Reflecting Sphere)"}, {"t": "p", "text": "🎼 To listen to — Johann Sebastian Bach (Concerto for Two Violins in D minor)"}, {"t": "p", "text": "🎬 To watch — Scenes from a Marriage (Ingmar Bergman, 1973)"}, {"t": "p", "text": "📚 To read — Alessandro Manzoni (The Betrothed, the character of Don Abbondio)"}, {"t": "p", "text": "🌿 To try — summarise aloud the position of someone who disagrees with you, before you respond"}, {"t": "p", "text": "✒️ Question for the journey — “Am I listening to understand, or am I just waiting for my turn to speak?”"}, {"t": "p", "text": "When the traveller cannot set off — Theoretical references"}, {"t": "table", "rows": [["Work", "Why it was chosen", "Concept from the Method", "Question for the Wayfarer"], ["Albert Bandura – Self-Efficacy: The Exercise of Control (1997)", "Distinguishes the real capacity to act from the subjective belief that one can, and shows it is the latter that decides behaviour", "Self-efficacy", "Am I waiting to feel capable before I try, or could I test it with one small gesture?"], ["Lyn Abramson, Martin Seligman, John Teasdale – “Learned Helplessness in Humans: Critique and Reformulation” (1978)", "Shows that giving up depends on how a person explains their past failures to themselves, not on the failure itself", "Attributional style", "Is the explanation I give myself for that failure specific to that situation, or have I turned it into a judgement on the whole of me?"], ["Jerome Frank – Persuasion and Healing (1974)", "Introduces demoralisation as a condition distinct from the illness that accompanies it, made up of helplessness and loss of meaning", "Demoralisation", "Is what I feel the response to a specific task, or has it spread to everything?"], ["David Kissane et al. – “Demoralization Syndrome” (Journal of Palliative Care, 2001)", "Gives demoralisation more precise clinical criteria, distinguishing it from a major depressive episode", "Demoralisation, clinical criteria", "Has this picture lasted for weeks, extending beyond today’s task?"], ["Neil Jacobson et al. – “A Component Analysis of Cognitive-Behavioral Treatment for Depression” (Journal of Consulting and Clinical Psychology, 1996)", "Shows that the behavioural component alone works as well as the full cognitive-behavioural package", "Behavioural activation", "Am I waiting for motivation before acting, or could I act and watch it arrive afterwards?"], ["Christopher Martell, Sona Dimidjian, Ruth Herman-Dunn – Behavioral Activation for Depression: A Clinician’s Guide (2010)", "Describes the operating protocol: choosing the activity for its value, not its ease, and scheduling it for a precise time", "Behavioural activation, protocol", "Have I chosen this gesture because it matters to me, or only because it is the easiest?"]]}, {"t": "p", "text": "Doubt — Theoretical references"}, {"t": "p", "text": "The voices encountered in this chapter, in order of appearance, with the work or contribution from which the cited concept is drawn."}, {"t": "table", "rows": [["Work", "Why it was chosen", "Concept from the Method", "Question for the Wayfarer"], ["Plato – Apology (4th century BC)", "Tells of Socrates’ choice to publicly acknowledge the limits of his own knowledge", "Doubt as the origin of inquiry", "Am I already assuming I know?"], ["Zhuangzi – Zhuangzi (c. 4th century BC)", "Questions the stability of identity and the distinction between dreaming and waking.", "Doubt about identity", "Am I certain of what I call “I”?"], ["Sextus Empiricus – Outlines of Pyrrhonism (2nd–3rd century AD; Italian ed. Laterza)", "Gathers the ancient sceptical doctrine on the suspension of judgement", "Epoché and ataraxia", "Is this judgement really necessary right now?"], ["Michel de Montaigne – Essays (1580)", "Turns awareness of the limits of one’s own judgement into a form of intellectual humility and openness to different perspectives.", "Intellectual humility", "What do I really know, without adding anything?"], ["Al-Ghazali – Deliverance from Error (al-Munqidh min al-dalal, c. 1108; Eng. trans. R.J. McCarthy, Fons Vitae)", "Tells of a crisis of radical doubt about the senses and reason, centuries before Descartes", "A radical crisis in the foundations of knowledge.", "What do I really base my certainties on?"], ["Katip Çelebi – Kashf al-zunun (17th century, posthumous)", "Gathers, orders and compares a vast bibliographic tradition, offering a tool for tracing works and disciplines back to their sources.", "Ordering and comparing sources.", "Am I checking, or just repeating?"], ["René Descartes – Discourse on the Method (1637)", "Uses doubt as a tool for reaching a certain foundation", "Methodical doubt toward certainty", "Do I really need a definitive fixed point?"], ["Charles S. Peirce – The Fixation of Belief (1877)", "Analyses the passage from doubt to belief and compares different ways of fixing convictions, pointing to the scientific method as a public, self-correcting procedure", "Doubt, inquiry and the correctability of beliefs.", "Am I ready to discover that this idea is wrong?"], ["Luciano De Crescenzo – Il dubbio [Doubt] (Mondadori, 1992)", "Turns doubt into a gentle companion, ready to change its mind", "Positive doubt", "Am I willing to change my mind if someone shows me I am wrong?"], ["Stuart Firestein – Ignorance: How It Drives Science (Oxford University Press, 2012)", "Shows how conscious ignorance and still-open questions steer scientific inquiry.", "Productive ignorance", "Am I using what I don’t know to guide the inquiry?"], ["Carlo Rovelli – Sull’eguaglianza di tutte le cose [On the Equality of All Things] (Adelphi, 2025)", "Argues that craving unshakeable certainties is a mistake, in dialogue with Taoist thought", "Uncertainty as the origin of wonder", "Can I still be amazed by what I don’t know?"], ["Oswaldo Porchat Pereira – Vida comum e ceticismo [Common Life and Scepticism] (1993)", "Devoted a central part of his philosophical work to the study of ancient and modern scepticism", "Scepticism as a discipline", "What can I truly claim to know?"], ["Luciano De Crescenzo (director) – Thus Spoke Bellavista (Così parlò Bellavista, 1984)", "Bellavista initially judges his new neighbour through a stereotype; getting to know him during the lift episode, he revises his judgement.", "Revising a hasty judgement", "Am I still judging someone on the basis of a first impression?"]]}, {"t": "p", "text": "The Method put to the test — Theoretical references"}, {"t": "p", "text": "The voices encountered in this chapter, in order of appearance, with the work or reference contribution."}, {"t": "table", "rows": [["Work", "Category", "Where", "Why it was chosen", "Concept from the Method", "Question for the Wayfarer"], ["Karl Popper — the criterion of falsifiability (already met in Stage 3)", "Philosophy of science", "Ending", "A method that could never fail would not be scientific: declaring its own limits in advance is what makes it honest", "Falsifiability applied by analogy to the method itself.", "Does my method admit, in advance, the conditions under which it will still produce a negative outcome?"], ["Warren Walker et al. — the distinction between epistemic, aleatory and deep uncertainty (Defining Uncertainty, Integrated Assessment, 2003)", "Decision theory, risk analysis", "Ending", "Distinguishes uncertainty that shrinks with more information from uncertainty that is calculable but irreducible, like a coin toss, and from the more radical kind in which not even a probability model exists to rely on", "Epistemic, aleatory and deep uncertainty", "Is this uncertainty something I could still discover, a calculable randomness that no amount of research can reduce, or is there not even a model to rely on?"]]}], "id": "c42"}]</script>
<script type="application/json" id="libro-data">{"1": {"title": "Itinerary 1 — The method — observing and deciding — How can I regain clarity when body and mind are struggling?", "body": [{"t": "p", "text": "During the journey, it can happen that we have to face a problem exactly when our resources seem to be running low. Anxiety, stress, panic, pain, fatigue or intense emotional involvement can make it harder to observe clearly, to reason in an orderly way and to make effective decisions. At such moments, the problem is not only what is happening, but also the condition in which we face it."}, {"t": "p", "text": "Even before applying the Method of the Question, or whatever else proves useful for the situation at hand, it can help to bring the body back to a more stable condition. This is not a mandatory step: it is a possibility, to be assessed case by case, together with a professional when the situation calls for it."}, {"t": "p", "text": "Over the years, medicine, clinical psychology, neuroscience and cognitive science have developed specific tools, with varying levels of scientific evidence, to help body and mind recover their balance. None of these tools is a universal solution, and none replaces, when necessary, a professional assessment."}, {"t": "sh", "text": "Before choosing a tool"}, {"t": "p", "text": "This itinerary names the techniques, briefly explains how they work and indicates their origin and their most widely recognised field of use. It does not replace a structured course of learning: for in-depth study, it remains necessary to turn to texts, courses or qualified professionals."}, {"t": "li", "text": "The first step is recognising that the body is in a state of alarm or fatigue."}, {"t": "li", "text": "Among the known tools, the most suitable one depends on the specific context."}, {"t": "li", "text": "Once the condition improves, the Method of the Question, or any other, becomes applicable again."}, {"t": "p", "text": "**What they are, in brief**"}, {"t": "p", "text": "**Diaphragmatic breathing — sitting or lying down comfortably, one hand on the chest and one on the abdomen. Breathe in slowly through the nose, letting the hand on the abdomen rise first, while the one on the chest stays almost still; breathe out slowly through the mouth, with lips slightly parted. Five to ten minutes, even just once a day to start, is enough: it is normal for it to require conscious effort at first, before becoming automatic.**"}, {"t": "p", "text": "**Progressive muscle relaxation (Jacobson) — sitting with a straight back and feet flat on the floor, or lying down. Tense one muscle group at a time for five to seven seconds — for example, clenching the fists tightly — then release suddenly, noticing for a moment the contrast between tension and release before moving to the next group. Proceed in sequence: hands and forearms, arms, shoulders, face, abdomen, legs and feet. A first complete session takes around fifteen to twenty minutes.**"}, {"t": "p", "text": "**Breathing with a prolonged out-breath — breathing so that the out-breath is longer than the in-breath: breathe in through the nose counting to four, breathe out through the mouth counting to eight, repeating the cycle five to ten times in a row. It activates the same calming response as diaphragmatic breathing, in an even simpler form, quicker to use in an acute moment.**"}, {"t": "p", "text": "**Scheduled breaks — interrupting work at fixed intervals, decided in advance, instead of waiting for fatigue to force a break at the worst possible moment.**"}, {"t": "p", "text": "**From anxiety to excitement — before a performance (an exam, an interview, a presentation), saying out loud “I’m excited” instead of trying to calm down. Anxiety and excitement are both high-arousal emotions: shifting from one to the other is easier than switching off altogether, and in studies it improves actual performance, not just the subjective feeling.**"}, {"t": "p", "text": "**Sleep hygiene — a set of habits with well-established evidence — regular hours, fewer screens in the evening, a dark, cool room — that improve the quality of sleep, not just its duration.**"}, {"t": "p", "text": "**Cognitive restructuring — the practical core of cognitive-behavioural therapy: identifying an automatic thought, checking it against the available facts, and replacing it — when the facts do not confirm it — with a more accurate interpretation, not necessarily a more positive one.**"}, {"t": "p", "text": "**Behavioural activation — gradually resuming activities with personal meaning even before feeling ready or motivated: action, often, comes before motivation rather than following it.**"}, {"t": "p", "text": "**Scheduled small steps — breaking a task that feels too big into minimal steps, each small enough to be started right away, without needing to feel ready for the whole task.**"}, {"t": "p", "text": "**Graded exposure (exposure therapy, Wolpe) — approaching what is feared progressively and by agreement, starting from the least intense levels, so as to gradually unlearn the association between that specific stimulus and danger. Best carried out with professional guidance.**"}, {"t": "p", "text": "**Reducing multitasking — focusing on a single task at a time instead of switching between several: every shift of attention has a real, measurable cognitive cost, not just a perceived one.**"}, {"t": "p", "text": "**Checklists — written checklists, used so as not to rely on memory alone for critical tasks, precisely at moments when attention is already under strain.**"}, {"t": "p", "text": "**Load management and adapted movement — calibrating physical activity to the energy available on that specific day, instead of following a fixed standard, to avoid both inactivity and excessive effort.**"}, {"t": "p", "text": "**Mindfulness — A clarification, in fairness: among these tools, mindfulness does not originate in Western clinical psychology, even though it is often presented as if it did. Jon Kabat-Zinn developed it from Vipassana Buddhist meditation, along with elements of yoga and Zen, deliberately stripping it of its religious context to make it applicable in medical and secular settings. He himself has written that it is no accident that mindfulness comes from Buddhism, whose central concern has always been the relief of suffering. Knowing its origin takes nothing away from its clinical effectiveness, documented by decades of studies — but it is worth not presenting it as though it were born in a Western laboratory.**"}, {"t": "p", "text": "In practice, mindfulness consists of bringing attention, intentionally and without judging what is noticed, to a present experience — the breath, bodily sensations, the sounds around you — and bringing it back there, gently, every time the mind wanders. It does not require emptying the mind or stopping thinking: it requires only noticing, repeatedly, where the attention has gone."}, {"t": "p", "text": "Five minutes are enough to begin: sitting comfortably, with eyes closed if that helps, bring your attention to the breath, without altering it. The mind will notice it has wandered elsewhere — this will happen often, from the very first day — and you bring it back to the breath, without judging yourself for noticing late: noticing is already the exercise, not a failure of the exercise."}, {"t": "sh", "text": "Orientation itinerary"}, {"t": "table", "rows": [["Manifestation", "Tool", "Origin", "When to remember it"], ["Anxiety", "Diaphragmatic breathing Progressive muscle relaxation (Jacobson) Sensory grounding", "Clinical psychology, physiology", "When arousal prevents clear thinking."], ["Panic attack", "Structured sensory grounding (5-4-3-2-1) (worked example) Breathing with a prolonged exhale", "Techniques widely taught in clinical practice, with no single author or definitive reference guideline", "To regain orientation and presence in the body."], ["Performance anxiety (exam, interview, presentation)", "Reframing anxiety as excitement, out loud", "Alison Wood Brooks — Journal of Experimental Psychology: General, 2014", "When the arousal is there regardless: redirect it, don’t try to switch it off."], ["Prolonged stress", "Scheduled breaks Regular physical activity Sleep hygiene", "Lifestyle medicine", "When you feel you have no energy left."], ["Rumination and intrusive thoughts", "Cognitive restructuring (CBT) Mindfulness practices (MBSR)", "Buddhist Vipassana meditation, adapted by Kabat-Zinn into a secular, clinical form", "When the same thought repeats without leading anywhere new."], ["Avoidance or freeze (low energy)", "Behavioural activation Small scheduled steps", "Clinical psychology", "When putting things off becomes the norm."], ["A specific fear that shapes your choices", "Graded exposure", "Exposure therapy (Wolpe)", "Best carried out with professional guidance."], ["Mental fatigue", "Reducing multitasking Checklists Regular breaks", "Cognitive science", "When mistakes start to increase."], ["Persistent pain", "Load management Adapted movement", "Pain medicine", "As a complement to medical care, never a substitute."]]}, {"t": "sh", "text": "A case — sensory grounding"}, {"t": "p", "text": "During a panic attack, thought fixes on a danger the body perceives as imminent, even when the mind knows it is not. Sensory grounding works by shifting attention from anticipatory thought — which feeds the alarm — to present perception: naming five things you can see, four you can touch, three you can hear, two you can smell, one you can taste requires attentional resources that anxious thought had been occupying. It does not remove the cause of the anxiety — the Method of the Question, if needed, will work on that further ahead — but it interrupts the cognitive loop that amplifies it."}], "ricorda": "Every tool has a field of application and limits. There is no tool that works for every situation. Knowing several tools means being freer to choose, not having more obligations to meet.", "approfondire": ["Edmund Jacobson – Progressive Relaxation (University of Chicago Press, 1929)", "Jon Kabat-Zinn – Full Catastrophe Living (Delacorte Press, 1990)", "Aaron Beck – Cognitive Therapy and the Emotional Disorders (International Universities Press, 1976)", "Albert Ellis – Reason and Emotion in Psychotherapy (Lyle Stuart, 1962)", "Joseph Wolpe – Psychotherapy by Reciprocal Inhibition (Stanford University Press, 1958)", "Herbert Benson – The Relaxation Response (William Morrow, 1975)"]}, "2": {"title": "Itinerary 2 — The method — observing and deciding — How can I observe better before looking for a solution?", "body": [{"t": "p", "text": "Every problem begins with an observation, but observing does not simply mean looking. It means gathering reliable information, distinguishing what is present from what we imagine, separating facts from interpretations, and recognising what we still do not know. We have stressed this since the first Stage, and we have given you the Method of the Question, but over the course of history numerous other tools have been developed to improve observation: from the scientific method to medicine, from investigation to aviation, from engineering to the cognitive sciences."}, {"t": "p", "text": "All share a common goal: reducing the errors produced by haste, by cognitive biases — systematic and predictable distortions of judgement, different from random errors because they always point in the same direction — and by premature conclusions."}, {"t": "p", "text": "It is worth knowing, before going on, that the very act of observing is not culturally neutral either. A 2001 study by Takahiko Masuda and Richard Nisbett, in the Personality and Social Psychology Bulletin, showed that Americans and Japanese, faced with the same scene, notice different things: Americans tend to focus on the main object in the foreground, the Japanese on the scene as a whole and on the relationships between its elements. This is not an isolated finding: it has been replicated in dozens of later studies, with explanations, videos and even eye-tracking. The tools that follow help you observe more carefully — but it is worth remembering that the starting point, what an eye notices first, is never entirely neutral."}, {"t": "sh", "text": "Orientation itinerary"}, {"t": "table", "rows": [["Manifestation", "Tool", "Origin", "Why it is useful"], ["The facts are unclear", "Observation checklist", "Aviation, medicine", "Reduces omissions."], ["Interpretations take over", "Separating facts from interpretations", "Scientific method", "Avoids premature conclusions."], ["Information is missing", "Guided questions", "Method of the Question, inquiry", "Highlights what is not known."], ["Several observers describe different events", "Independent comparison of observations", "Scientific research", "Reduces individual biases."], ["The problem is complex", "Systematic data collection", "Experimental sciences", "Builds a reliable foundation."], ["A fast, repeatable method is needed", "The OODA loop (Observe-Orient-Decide-Act)", "Military and decision-making strategy (John Boyd)", "Helps you observe and correct course in real time."], ["A case needs to be gathered in a structured way", "The SOAP framework (Subjective-Objective-Assessment-Plan)", "Clinical medicine", "Separates what the person reports from what is directly observed."]]}, {"t": "sh", "text": "A case — the OODA loop"}, {"t": "p", "text": "An A&E doctor does not have time to gather every piece of data before acting. The OODA loop — Observe, Orient, Decide, Act, developed by Colonel John Boyd — describes exactly this condition: observing the available signals, orienting oneself by comparing them with experience, deciding on the most reasonable action with the information at hand, acting, and starting the cycle again, correcting course as new data arrives. Its usefulness lies not in guaranteeing the perfect decision, but in making explicit that every decision taken under uncertainty remains provisional and open to revision."}, {"t": "p", "text": "The SOAP framework, born in medicine to structure the clinical record, breaks a complex situation down into four parts: Subjective, what the person involved reports, in their own words; Objective, what is directly observed or measured; Assessment, the observer’s interpretation, kept clearly distinct from the first two; Plan, the concrete next steps. Keeping these four levels separate avoids the most common mistake when taking in a case: mixing up a reported symptom with an observed fact, or an interpretation with a fact."}], "ricorda": "Observing comes before explaining. Every piece of data gathered carefully reduces the risk of error. A good observation does not guarantee the solution, but a poor observation makes finding it unlikely.", "approfondire": ["John Boyd – A Discourse on Winning and Losing (posthumous collection of military briefings, 2018)", "Takahiko Masuda, Richard E. Nisbett – Attending Holistically Versus Analytically: Comparing the Context Sensitivity of Japanese and Americans (Journal of Personality and Social Psychology, 2001)", "Lawrence Weed – Medical Records, Medical Education, and Patient Care (Press of Case Western Reserve University, 1969, origin of the SOAP method)", "Daniel Kahneman – Thinking, Fast and Slow (Farrar, Straus and Giroux, 2011)"]}, "3": {"title": "Itinerary 3 — The method — observing and deciding — How can I tell facts apart from interpretations?", "body": [{"t": "p", "text": "As we know, one of the most frequent causes of reasoning errors is confusing what we observe with the meaning we attach to what we observe. A fact is what can be described or verified; an interpretation is the attempt to explain that fact."}, {"t": "p", "text": "Separating facts and interpretations does not mean giving up on forming hypotheses. It means building them on more solid ground — a principle common to medicine, investigation, scientific research and organisational psychology."}, {"t": "sh", "text": "Orientation itinerary"}, {"t": "table", "rows": [["Manifestation", "Tool", "Origin", "Why it is useful"], ["You confuse what you see with what you think", "Separating facts from interpretations", "Scientific method, Logic", "Reduces hasty conclusions."], ["An explanation immediately seems convincing", "Formulating alternative hypotheses", "Experimental sciences", "Avoids stopping at the first idea."], ["Objective elements are missing", "Systematic data collection", "Medicine, Research", "Strengthens the quality of the analysis."], ["People describe the same event differently", "Comparing independent observations", "Scientific research", "Reduces the influence of individual biases."], ["You don’t know whether a conclusion is correct", "Testing hypotheses", "Scientific method", "Distinguishes what is plausible from what is supported."], ["You want to understand where the reasoning “climbed” too fast", "The ladder of inference", "Chris Argyris — organisational psychology (an interpretation also tested cross-culturally, see text)", "Shows the steps between observation and action, one by one."]]}, {"t": "sh", "text": "A case — the ladder of inference"}, {"t": "p", "text": "A colleague does not reply to a message for two days. On Chris Argyris’s ladder of inference, the first rung is the fact: no reply. The second is selection: we notice this particular detail, among the thousand possible ones. The third is interpretation: “they’re not interested in me”. The fourth is conclusion: “the relationship has cooled”. The fifth is action: we start behaving with distance. The point of the ladder is not to stop yourself climbing it — that is impossible, it happens automatically — but to recognise which rung you are on, so as to be able to climb back down and check before acting on the fifth."}, {"t": "p", "text": "It is worth knowing that the third rung — interpretation — is not culturally neutral either. A 1994 study by Michael Morris and Kaiping Peng, published in the Journal of Personality and Social Psychology, compared how Americans and Chinese explain the same behaviour: Americans tend to attribute it to stable personal dispositions (“they’re not interested in me”, a trait of the person), the Chinese more often to situational factors (“they must have had a difficult week”, an external circumstance). The study confirmed the pattern even when comparing news articles about the same murder, written by American and Chinese journalists. Argyris’s ladder remains valid everywhere — but the kind of interpretation one climbs to most spontaneously, at that third rung, also depends on which culture taught us to read other people’s behaviour."}], "ricorda": "A fact can be observed or verified; an interpretation must be argued for. The more reliable data you gather, the more solid your conclusions will be. Changing an interpretation in the face of new facts is a sign of rigour, not of weakness.", "approfondire": ["Galileo Galilei – The Assayer (1623)", "Karl Popper – The Logic of Scientific Discovery (Julius Springer, 1934; English ed. Hutchinson, 1959)", "Charles S. Peirce – Deduction, Induction, and Hypothesis (Popular Science Monthly, 1878)", "Chris Argyris – Overcoming Organizational Defenses (Allyn & Bacon, 1990)", "Michael Morris, Kaiping Peng – Culture and Cause: American and Chinese Attributions for Social and Physical Events (Journal of Personality and Social Psychology, 1994)"]}, "4": {"title": "Itinerary 4 — The method — observing and deciding — How can I ask better questions?", "body": [{"t": "p", "text": "Every answer depends on the question that precedes it. A confused question often produces confused answers; a well-formed question makes it easier to spot missing information, build hypotheses and choose which path to follow."}, {"t": "p", "text": "Philosophy, the scientific method, medicine and investigative disciplines have always used structured questions to understand reality better: they are a tool for orientation even before they are a tool for answers."}, {"t": "sh", "text": "Orientation itinerary"}, {"t": "table", "rows": [["Question", "Tool", "Origin", "Why it is useful"], ["Too generic", "Make it more specific", "Scientific method", "Reduces ambiguity."], ["Emotional", "Separate the emotion from the problem", "Method of the Question", "Helps focus the goal."], ["Lacking data", "Identify the missing information", "Diagnostic medicine", "Guides data collection."], ["With only one possible answer", "Formulate alternative hypotheses", "Scientific research", "Reduces the risk of error."], ["Unrealistic", "Ask what is actually knowable", "Epistemology", "Avoids impossible lines of inquiry."], ["Poorly structured", "The six guiding questions: Who, What, When, Where, Why, How", "Investigative and journalistic method", "Systematically covers the main aspects of a situation."], ["Repeated with no clear answer", "The Five Whys technique", "Sakichi Toyoda, Toyota", "Helps trace the way back from the surface to the cause."]]}, {"t": "sh", "text": "A case — the Five Whys technique"}, {"t": "p", "text": "At a car manufacturer, a machine stops on the production line. Why? A fuse has blown. Why? The motor overheated. Why? The bearing was not lubricated. Why? The pump that lubricates it was not working. Why? The pump was not included in the maintenance schedule. Five questions — the technique devised by Sakichi Toyoda for Toyota — shifted attention from a blown fuse, the symptom, to an organisational issue, the cause. Replacing the fuse would have solved the problem for a day; understanding why maintenance had not been checked solves it more durably."}], "ricorda": "A good question orients the search even before it provides an answer. Questions can be improved and reformulated. Missing information points to the next step in the reasoning.\n\nA different application of the same principle comes from the Brazilian educator Paulo Freire, who in the twentieth century proposed a “problematising” education: instead of handing over ready-made answers, he taught people to turn their own condition into a question to explore together, through dialogue. It is no accident that, for Freire, knowledge was born from dialogue even before it was born from the lesson: it is the same trust in the well-posed question that runs through this book, applied to a context — the education of entire communities — broader than the individual one.", "approfondire": ["Paulo Freire – Pedagogy of the Oppressed (Paz e Terra, 1968; English ed. Herder and Herder, 1970)", "Socrates – dialogue and inquiry (handed down in Plato’s Dialogues)", "Karl Popper – The Logic of Scientific Discovery (Julius Springer, 1934; English ed. Hutchinson, 1959)", "Sakichi Toyoda – the Five Whys technique (documented in Taiichi Ohno, The Toyota Production System, 1978)"]}, "5": {"title": "Itinerary 5 — The method — observing and deciding — How can I build and test stronger hypotheses?", "body": [{"t": "p", "text": "We already know that a hypothesis is a possible way of explaining a fact, not an already proven truth. Building it and testing it are two moments of the same process: first we formulate a possible explanation, then we put it to the test by also looking for what could disprove it. We have already seen that the risk arises when we grow attached to the first explanation we find, or when we look only for confirmation instead of genuine verification."}, {"t": "p", "text": "The scientific disciplines teach that a hypothesis is useful only if it can be checked against the facts and, if necessary, modified or abandoned."}, {"t": "sh", "text": "Orientation itinerary"}, {"t": "table", "rows": [["Manifestation", "Tool", "Origin", "Why it is useful"], ["You have only one explanation", "Formulate alternative hypotheses", "Scientific method", "Reduces the risk of stopping too soon."], ["A hypothesis seems too convincing / you are only looking for confirmation", "Actively look for data that might disprove it", "Karl Popper — falsifiability", "Makes the check more rigorous, reduces self-deception."], ["Information is missing or the results are unclear", "Gather new data, repeat the check", "Experimental research", "Improves the reliability of the conclusions."], ["Several hypotheses explain the same facts", "Compare which requires fewer assumptions", "Occam’s razor", "Favours simpler explanations."], ["New facts emerge / the picture changes", "Revise, update or abandon the hypothesis", "Scientific method", "Keeps the reasoning anchored to reality."], ["You feel you have already understood everything", "Method of multiple competing hypotheses", "Thomas Chamberlin, geologist", "Keeps several explanations open until the data narrow them down."], ["You have partial evidence and want to update your judgement", "Bayesian reasoning (updating probabilities)", "Bayesian statistics", "Weighs new evidence without starting from scratch."], ["Several hypotheses remain possible after a first check", "Design new, targeted checks", "Experimental method", "Helps distinguish between them with greater confidence."]]}, {"t": "p", "text": "The principle, attributed to the Franciscan friar William of Ockham, says that between two explanations equally compatible with the available facts, the one requiring fewer additional assumptions should be preferred — not because the simpler explanation is always the true one, but because it is the one to check first."}, {"t": "p", "text": "Chamberlin proposed writing down, from the very start, several possible explanations instead of just one, and keeping them all open until the data allow some to be ruled out: a deliberate antidote against growing attached too soon to the first plausible idea, before even checking the others."}, {"t": "sh", "text": "A case — Bayesian reasoning"}, {"t": "p", "text": "A diagnostic test comes back positive for a rare disease (1 person in 1,000), and the test is 95% accurate. It is natural to think: “I’m almost certainly ill.” Bayesian reasoning corrects this intuition: out of 1,000 people, one is genuinely ill, but of the remaining 999 healthy people, around 50 will still test positive by error (the 5% false-positive rate). Out of 51 total positives, only 1 is genuinely ill: fewer than 2%, not 95%. Bayesian reasoning does not deny the value of evidence: it shows that its weight always depends on the starting probability, not only on the accuracy of the instrument measuring it."}], "ricorda": "A hypothesis is not a fact, nor a proven truth. The best hypotheses are those that can be checked and disproved. A verification serves to test a hypothesis, not to defend it. Changing or abandoning a hypothesis in the face of new evidence is a sign of rigour, not of weakness.\n\nTwo examples from the history of science show this principle is not recent. In eleventh-century China, the scientist Shen Kuo observed fossilised sea shells on a mountain far from any sea, and deduced that the land must have transformed over time through erosion and sedimentation — a hypothesis the West would only formulate seven hundred years later. In nineteenth-century Russia, the chemist Dmitri Mendeleev left empty boxes in his periodic table and precisely predicted the properties of elements still unknown: gallium, germanium and scandium were discovered in the following years, confirming exactly what he had calculated. In both cases, the value of the hypothesis lay not in its already being certain, but in its being testable.", "approfondire": ["Shen Kuo – Dream Pool Essays (Mengxi Bitan, c. 1088)", "Dmitri Mendeleev – The Periodic System of the Elements (Zhurnal Russkogo Fiziko-Khimicheskogo Obshchestva, 1869)", "Karl Popper – The Logic of Scientific Discovery (Julius Springer, 1934; English ed. Hutchinson, 1959)", "Charles S. Peirce – Deduction, Induction, and Hypothesis (Popular Science Monthly, 1878)", "William of Ockham – Summa Logicae (principle of parsimony, c. 1323)", "Thomas Chamberlin – The Method of Multiple Working Hypotheses (Science, 1890)"]}, "6": {"title": "Itinerary 6 — The method — observing and deciding — How can I choose the method best suited to the problem?", "body": [{"t": "p", "text": "There is no method valid for every situation. A procedure that is effective in one field can prove inadequate in another: scientific research tests hypotheses, statistics studies collective phenomena, law weighs evidence and rules, engineering designs solutions, medicine formulates diagnoses. Recognising the type of problem in front of you is already a step towards solving it."}, {"t": "p", "text": "This map brings together, in a single image, some of the most respected and widely used methods — born in different disciplines — organised by problem type. Among them, the Ishikawa diagram (also called the “fishbone” diagram, for its shape) is a visual representation that organises the possible causes of a problem into categories, to identify its most likely origin. The Method of the Question does not replace these methods: it helps identify when and how to use them."}, {"t": "sh", "text": "Text key to the map"}, {"t": "table", "rows": [["Type of problem", "Main methods", "Origin", "When it is useful"], ["Technical, practical or naturalistic", "Root-cause analysis (Five Whys) Ishikawa diagram Hypothetico-deductive scientific method Statistical data analysis", "Industrial quality, engineering, science, statistics", "To identify the real cause of a problem, test a hypothesis or interpret numerical data."], ["Decision-making", "Decision matrix Decision tree Cost-benefit analysis", "Decision sciences, behavioural economics (Simon)", "When you need to choose between several concrete alternatives."], ["Complex and systemic", "Systems thinking Cause-and-effect maps Feedback-loop analysis", "Systems thinking (Senge), cybernetics", "When causes and effects are intertwined and non-linear."], ["Relational", "Non-violent Communication Interest-based negotiation Structured mediation", "Rosenberg; Fisher and Ury (Harvard Negotiation Project, see cultural note in the text)", "When the problem involves the needs or viewpoints of several people."], ["Creative and open-ended", "Lateral thinking Design Thinking TRIZ", "de Bono; industrial design; Altshuller", "When no known solution yet exists and new ones need to be generated."], ["Emotional, affecting your reasoning", "See Itinerary 1: regulating body and mind", "—", "Before tackling any other type of problem, if emotional arousal is high."]]}, {"t": "p", "text": "A note on the epistemic status of these methods: they do not all share the same degree of rigour. The scientific method, statistical analysis, decision trees and feedback-loop analysis rest on formal or widely empirically validated foundations. Others — lateral thinking, Design Thinking, TRIZ, Nonviolent Communication — are practical, widespread and useful frameworks, but less formalised: their effectiveness rests more on applied experience than on systematic, controlled testing. This is no demerit: they were born to answer problems — relational, creative — that lend themselves less readily to measurement. But the difference should be recognised, not hidden under a single label of “method”."}, {"t": "p", "text": "**What they are, in brief**"}, {"t": "p", "text": "Technical, practical or naturalistic"}, {"t": "p", "text": "**Hypothetico-deductive scientific method — formulating a hypothesis that makes testable predictions, then actively looking for data that could disprove it, not only confirm it: the same principle met in Stage 3 of this book.**"}, {"t": "p", "text": "**Statistical data analysis — using mathematical tools to distinguish a real pattern from a variation due to chance, when working with large numbers of observations rather than a single episode.**"}, {"t": "p", "text": "Decision-based"}, {"t": "p", "text": "**Decision matrix — listing the alternatives on one axis and the choice criteria on the other, assigning a score to each combination, to compare complex options without relying only on an overall impression.**"}, {"t": "p", "text": "**Decision tree — graphically representing a decision as a sequence of forks, each with the probabilities and consequences of the different choices, to compare not only the best outcome but also the risk of each path.**"}, {"t": "p", "text": "**Cost-benefit analysis — listing, for each option, the expected costs and benefits, translated where possible into the same unit of measurement, to compare alternatives that would otherwise seem incommensurable.**"}, {"t": "p", "text": "Complex and systemic"}, {"t": "p", "text": "**Systems thinking — looking at a problem as a network of elements influencing one another, rather than as a chain of isolated causes, to identify the points where a small intervention produces the widest effect.**"}, {"t": "p", "text": "**Cause-and-effect maps — graphically representing the relationships between a system’s variables, including those that loop back on each other, to make visible connections that purely linear reasoning would miss.**"}, {"t": "p", "text": "**Feedback-loop analysis — identifying the points where the effect of an action feeds back onto the cause that generated it, amplifying or dampening it, instead of treating each step as final.**"}, {"t": "p", "text": "Relational"}, {"t": "p", "text": "**Nonviolent Communication — distinguishing observation from judgement, expressing one’s own feeling and the need behind it, and making a concrete request instead of a demand: a structured way of speaking that reduces the likelihood of the other person becoming defensive.**"}, {"t": "p", "text": "**Interest-based negotiation — looking, behind the positions the parties state, for the real interests motivating them — apparently incompatible positions often conceal interests that can be satisfied together.**"}, {"t": "p", "text": "**Structured mediation — the intervention of a neutral third party who helps the parties communicate and seek an agreement, without imposing a solution or taking either side.**"}, {"t": "p", "text": "Creative and open-ended"}, {"t": "p", "text": "**Lateral thinking — deliberately stepping off the most obvious logical path to generate alternatives that sequential reasoning would not have produced, for example starting from a provocative idea and seeing where it leads.**"}, {"t": "p", "text": "**Design Thinking — an iterative process alternating moments of opening up and narrowing down: understanding the real need of whoever will live with the problem, generating many ideas without filtering them straight away, building a simple prototype, testing it and correcting it.**"}, {"t": "p", "text": "**TRIZ — a Russian acronym (Teoriya Resheniya Izobretatelskikh Zadatch, “theory of inventive problem solving”): a method born from the systematic analysis of hundreds of thousands of patents, which catalogues solution patterns already used successfully in other fields to resolve a type of contradiction similar to the one in front of you.**"}, {"t": "sh", "text": "A case — the Ishikawa diagram"}, {"t": "p", "text": "A software project runs past its deadline. The Ishikawa diagram organises the search for causes along categories: people (insufficient skills in the team?), methods (was the planning realistic?), tools (did the development environments work?), materials (were the specifications clear?). It does not provide the answer: it maps out the space in which to look for it, preventing attention from stopping at the first plausible cause — often a person — while overlooking structural causes that are less visible but more decisive."}], "ricorda": "Before choosing a solution, choose the method best suited to the problem. No method is universal: each was born for one type of problem. Many real problems mix several categories together: it can help to combine several tools. Recognising the type of problem is already part of the solution, not just a step that precedes it.", "approfondire": ["Karl Popper – The Logic of Scientific Discovery (Julius Springer, 1934; English ed. Hutchinson, 1959)", "Herbert Simon – Administrative Behavior (Macmillan, 1947)", "Edward de Bono – Lateral Thinking (Ward Lock Education, 1970)", "Peter Senge – The Fifth Discipline (Doubleday/Currency, 1990)", "Marshall Rosenberg – Nonviolent Communication (PuddleDancer Press, 1999)", "Roger Fisher and William Ury – Getting to Yes (Houghton Mifflin, 1981)", "Genrich Altshuller – Creativity as an Exact Science (Gordon and Breach Science Publishers, 1984, foundations of TRIZ)", "Tim Brown – Change by Design (HarperBusiness, 2009)", "Kaoru Ishikawa – Guide to Quality Control (Genba no QC Shuho, 1968; English ed. Asian Productivity Organization, 1976)"]}, "7": {"title": "Itinerary 7 — The limit that will not move — How can I face what cannot be solved?", "body": [{"t": "p", "text": "In the course of the journey we will meet very different kinds of problems. Not all of them call for the same answer."}, {"t": "p", "text": "Some can be solved: there exists a solution that removes or corrects the problem."}, {"t": "p", "text": "Others can be understood: perhaps we cannot change them, but we can better understand their causes, their meaning or their consequences."}, {"t": "p", "text": "Still others can only be lived through: no answer will erase the pain, the loss, or the limit they represent."}, {"t": "p", "text": "Recognising the difference is already part of the Method of the Question."}, {"t": "p", "text": "Because looking for a solution where none exists breeds frustration. But giving up looking for one when it does exist means missing an opportunity."}, {"t": "p", "text": "The first task of the method, then, is not to find an answer straight away."}, {"t": "p", "text": "It is to understand what kind of problem we are facing."}, {"t": "p", "text": "This distinction does not replace the one already met in the Traveller’s Atlas, in Stage 1
