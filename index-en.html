 that stretch of the path."}, {"t": "p", "text": "In your backpack"}, {"t": "p", "text": "Every traveller, before setting out, chooses carefully what they will carry with them."}, {"t": "p", "text": "Space is limited."}, {"t": "p", "text": "Every item has to earn its place."}, {"t": "p", "text": "We too, having reached the end of this first Stage, can look back and ask ourselves what we have actually gained. We have not learned to solve a problem. Not yet."}, {"t": "p", "text": "We have learned something harder."}, {"t": "p", "text": "We have learned to distrust our first certainties."}, {"t": "p", "text": "It may not sound like much. It is."}, {"t": "p", "text": "Because almost every mistake we will make along the journey will be born in those first instants, when the mind tries too quickly to fill in what it does not yet know."}, {"t": "p", "text": "We have discovered that observing does not simply mean opening our eyes. It means distinguishing."}, {"t": "p", "text": "Distinguishing facts from interpretations. Observations from explanations. Hypotheses from conclusions."}, {"t": "p", "text": "Possibilities from certainties. It is a discipline. It does not arise spontaneously. The brain prefers to build stories."}, {"t": "p", "text": "We are slowly learning to check, first, whether those stories actually rest on reality."}, {"t": "p", "text": "We have also learned something about ourselves. We have discovered that the way we reason does not depend only on intelligence. It also depends on the physical and emotional state we are in."}, {"t": "p", "text": "A body dominated by fear, pain or illness observes the world differently from a calm one."}, {"t": "p", "text": "Not because it is less capable. Because it is doing another job. It is trying to protect us."}, {"t": "p", "text": "For this reason, we will no longer judge ourselves only by what we think. We will also learn to ask ourselves in what condition we were thinking. This distinction will stay with us for the whole journey."}, {"t": "p", "text": "The mind is not a neutral observer. It is an interpreter. And that is precisely why it needs method."}, {"t": "p", "text": "Before moving on, I want to leave you with three questions. They are not exercises. You do not need to answer them now."}, {"t": "p", "text": "I would like them to stay with you over the coming days."}, {"t": "p", "text": "Whenever something catches your attention, try to stop for a moment and ask yourself:"}, {"t": "p", "text": "Right now, am I in a condition to reason with sufficient clarity?"}, {"t": "p", "text": "Then add a second question."}, {"t": "p", "text": "What have I actually observed?"}, {"t": "p", "text": "Finally, a third."}, {"t": "p", "text": "What am I adding myself?"}, {"t": "p", "text": "If you manage to carry only these three questions with you, this first Stage will already have achieved its purpose."}, {"t": "p", "text": "If only I’d had this compass…"}, {"t": "p", "text": "It is a question many readers will ask themselves. Perhaps you too."}, {"t": "p", "text": "“How many decisions would I have made differently?” “How many arguments would have ended another way?”"}, {"t": "p", "text": "“How many fears would have dissolved simply by waiting for one more piece of information?”"}, {"t": "p", "text": "We cannot answer that."}, {"t": "p", "text": "Life does not let us go back and repeat the experiment."}, {"t": "p", "text": "What we can do, though, is something just as important. We can change the way we approach the next crossroads."}, {"t": "p", "text": "This book cannot change the past."}, {"t": "p", "text": "It can only offer you a compass for the future."}, {"t": "p", "text": "A compass does not get rid of the night."}, {"t": "p", "text": "It does not move mountains."}, {"t": "p", "text": "It does not shorten the path."}, {"t": "p", "text": "But it can stop you losing your bearings."}, {"t": "p", "text": "And sometimes that is exactly what allows a traveller to reach their destination."}, {"t": "h", "text": "Conclusion of Stage 1"}, {"t": "p", "text": "We began this journey with a question."}, {"t": "p", "text": "How do I know whether what I think I see is truly what is there?"}, {"t": "p", "text": "We have not found a definitive answer."}, {"t": "p", "text": "It was impossible."}, {"t": "p", "text": "We have found something more useful."}, {"t": "p", "text": "A way of continuing to ask that question without stopping along the way."}, {"t": "p", "text": "From this moment on, the Traveller knows that every problem is born twice."}, {"t": "p", "text": "The first time, in reality."}, {"t": "p", "text": "The second, in the way their mind interprets it."}, {"t": "p", "text": "Learning to tell these two births apart means stopping the darkness we produce ourselves."}, {"t": "p", "text": "The candle does not turn night into day."}, {"t": "p", "text": "It lights the next step."}, {"t": "p", "text": "The compass does not choose the destination."}, {"t": "p", "text": "It only reminds you of the direction."}, {"t": "p", "text": "After every Stage worth the name comes a small Pause, which we will take before setting off again, to pick up a few last things — small tools for our backpack, deeper maps of reality — that will help us finally enter the heart of the Method of the Question."}, {"t": "p", "text": "We will learn to build questions that do not trap us in the answers we want, but bring us, step by step, closer to reality."}, {"t": "p", "text": "Because the journey does not consist in immediately finding the way. It consists in learning to recognise it."}, {"t": "h", "text": "**The limit of this Stage**"}, {"t": "p", "text": "Observing more carefully does not remove uncertainty, and it does not guarantee that we will always tell a fact from a story on the first attempt. By the end of this chapter, Marco knows how to ask the right question — he does not yet have the answer. Knowing that you are constructing an interpretation, rather than simply recording it as reality, is a starting point, not a destination: it tells you that something needs checking, not yet how. That is the step the coming Stages begin to tackle."}, {"t": "h", "text": "**The same principle, in other fields**"}, {"t": "p", "text": "Telling a fact apart from an interpretation is not an invention of psychology. It is the very foundation of the scientific method. The Danish astronomer Tycho Brahe spent decades recording, with the naked eye and with a precision never achieved before, the exact positions of the planets in the sky — pure observational data, with no theory to explain them. It was only after his death that Kepler, working from those same data, drew from them the interpretation that made sense of them: the orbits were not perfect circles, as had been believed for millennia, but ellipses. Had Brahe recorded only what the theory of his time expected to see, instead of what he actually saw, that discovery could never have happened."}, {"t": "p", "text": "The distinction between the quality of a decision and the quality of its outcome, which we met in Marco’s story, also has a precise name in mathematics: expected value. A bet can have a positive expected value — be, on average, the right choice — and still lose on a single occasion, purely by chance. The reverse is just as true: a reckless bet can win once without thereby becoming a good decision. Probability theory formalises, in exact language, exactly what the coin toss shows us intuitively."}], "id": "c13"}, {"title": "Atlas 1 – Can I use the compass? What this Atlas is", "group": "Part 2 — Learning to See", "body": [{"t": "p", "text": "This tool does not replace the Method of the Question. It comes before it. It is an orientation map that helps the Traveller understand where they stand before deciding how to proceed."}, {"t": "sh", "text": "What it is for"}, {"t": "p", "text": "When something important happens, the first question is not «How do I solve the problem?», but «Am I in a condition to face it?». This Atlas helps answer that question."}, {"t": "sh", "text": "How to use it"}, {"t": "p", "text": "1. Stop."}, {"t": "p", "text": "2. Look at the map."}, {"t": "p", "text": "3. Identify the territory in difficulty."}, {"t": "p", "text": "4. Look for a suitable tool, with the help of a professional if needed."}, {"t": "p", "text": "5. When conditions improve, return to the Method of the Question."}, {"t": "sh", "text": "What it does NOT do"}, {"t": "p", "text": "This Atlas does not teach breathing techniques, meditation, nutrition, physical activity or other practices. It only points to them as possible tools, directing you to proper sources and qualified professionals to learn them."}, {"t": "sh", "text": "Core idea"}, {"t": "p", "text": "Before the compass comes the Traveller. Before the method come the conditions in which the method will be applied."}, {"t": "h", "text": "Traveller’s map, Stage 1"}], "id": "c14"}, {"title": "Pause 1 – Staying with what is", "group": "Part 2 — Learning to See", "body": [{"t": "p", "text": "**Why a Pause This is not a list of cultural suggestions. It is an integral part of the Method. Every Stage, as happens on every journey, is accompanied by a Pause, in which the same question is explored through art, music, film, literature, science and direct experience. The purpose is not to accumulate information, but to train the eye. This first Stage invites you to distinguish between looking and observing: many things are already in front of our eyes, yet never truly enter our awareness.**"}, {"t": "sh", "text": "**To contemplate**"}, {"t": "p", "text": "**René Magritte – The Human Condition Look at the painting. Where does the representation end and reality begin? The central question of this Stage is born here.**"}, {"t": "p", "text": "**René Magritte – The Son of Man The obstacle to seeing is not the landscape, but what covers our gaze.**"}, {"t": "p", "text": "**Johannes Vermeer – The Astronomer Before forming a hypothesis, the man observes patiently.**"}, {"t": "p", "text": "**Caravaggio – The Calling of Saint Matthew Pause on the instant someone notices what had always been there.**"}, {"t": "sh", "text": "**To listen to**"}, {"t": "p", "text": "**John Cage – 4′33″ Don’t listen to the pianist. Listen to what happens around you. Silence reveals what usually escapes us.**"}, {"t": "p", "text": "**Arvo Pärt – Spiegel im Spiegel Let the pace of your thoughts slow down and observe how your attention changes.**"}, {"t": "p", "text": "**Johann Sebastian Bach – Prelude No. 1 in C major Follow the gradual emergence of order.**"}, {"t": "sh", "text": "**To watch**"}, {"t": "p", "text": "**The Truman Show Ask yourself which event breaks the routine and forces Truman to look at the world with new eyes.**"}, {"t": "p", "text": "**The Matrix The red pill does not offer the truth: it makes it possible to question what seemed obvious.**"}, {"t": "p", "text": "**12 Angry Men Watch how one single juror keeps bringing everyone back to the facts rather than the impressions.**"}, {"t": "sh", "text": "**To read**"}, {"t": "p", "text": "**Arthur Conan Doyle – Sherlock Holmes “You see, but you do not observe.” A sentence that sums up the whole Stage.**"}, {"t": "p", "text": "**Edgar Allan Poe – The Murders in the Rue Morgue Correct deductions are born from correct observations.**"}, {"t": "p", "text": "**Galileo Galilei – The Assayer (1623) Nature must be observed before it is interpreted.**"}, {"t": "p", "text": "**A small experiment**"}, {"t": "p", "text": "Go into a room you know well. Stay silent for ten minutes. Write down at least twenty details you had never noticed before. Finally, ask yourself: did they appear today, or had you simply never observed them?"}, {"t": "p", "text": "**A photograph to remember**"}, {"t": "p", "text": "Look at a photograph of the Earth seen from space (for example, ’Earthrise’). A simple change of perspective can completely transform what we think we know."}, {"t": "p", "text": "**An episode from the history of science**"}, {"t": "p", "text": "Revisit Galileo’s first use of the telescope. The revolution was born not from a new sky, but from a new way of looking at it."}, {"t": "sh", "text": "**Question for the journey**"}, {"t": "p", "text": "What, in my everyday life, do I keep looking at without ever truly having seen it?"}], "id": "c15"}, {"title": "Stage 2 — Symptom, cause or problem: what am I really looking at?", "group": "Part 2 — Learning to See", "body": [{"t": "p", "text": "**Compass Rose direction: Distinguish — Question**"}, {"t": "h", "text": "The start of the stage"}, {"t": "p", "text": "In the previous Stage we learned to stop at a precise instant: the moment when the mind stops observing and begins telling a story about what it observes. That was a reflex to train, not yet a method to apply — it was enough to notice it happening; nothing more was needed yet. Now the journey takes a further step: once we have stopped, what do we do with that moment? Noticing that we are interpreting is not enough. We must learn to break down what we observe into recognisable parts — a fact is never just one single thing, and confusing its parts is one of the most common mistakes when facing a difficulty."}, {"t": "p", "text": "In fact, even as we observe what happens, we do not see reality exactly as it is: without noticing, we are adding something of our own — an interpretation."}, {"t": "p", "text": "**This is the question that will guide the whole Stage:**"}, {"t": "p", "text": "Symptom, cause or problem: what am I really looking at? The difference may seem subtle, but many of the decisions we make depend on it. A fact is what we can observe or describe without adding a meaning. An interpretation is the meaning we attach to that fact."}, {"t": "p", "text": "Many problems arise precisely when we stop distinguishing between these two things. We have seen that we mistake an interpretation for a fact and begin building reasoning on a foundation we have never checked. Before learning to solve a problem, then, we must learn to recognise the ground on which it appears, and how."}, {"t": "p", "text": "Interpreting is not a mistake. It is a tool. The mistake arises when we forget that it is a tool and mistake our interpretation for reality itself."}, {"t": "p", "text": "This happens more often than we imagine. A sentence spoken in an unusual tone, a look, an unanswered message or a closed door is enough to start building explanations. Some will be correct, others not. The trouble is that, very often, we no longer distinguish what we observed from what we added."}, {"t": "p", "text": "The Method of the Question asks us to take a small step back."}, {"t": "p", "text": "Before asking whether our interpretation is correct, we must ask whether what we are stating belongs to the facts or to the explanation we are giving of them. Only after making this distinction does it become possible to proceed with greater clarity."}, {"t": "h", "text": "A small experiment"}, {"t": "p", "text": "Before going on, try pausing your reading for a moment. This scene is not just a stand-alone exercise: we will follow it through the whole chapter, returning to it whenever we need a concrete example."}, {"t": "p", "text": "Read this scene carefully."}, {"t": "p", "text": "A woman walks into the office ten minutes late. She puts her bag down on the desk without greeting her colleagues. She switches on her computer and stays silent."}, {"t": "p", "text": "Now stop."}, {"t": "p", "text": "Without reading on, try writing down on a sheet of paper everything you think you know about the situation."}, {"t": "p", "text": "Many people write down sentences like:"}, {"t": "p", "text": "«She’s angry.»"}, {"t": "p", "text": "«She’s had an argument with someone.»"}, {"t": "p", "text": "«She’s rude.»"}, {"t": "p", "text": "«She’s had a bad day.»"}, {"t": "p", "text": "Now reread the scene. None of this information is actually in the account. What we really know is only this:"}, {"t": "p", "text": "a woman walks into the office;"}, {"t": "p", "text": "she arrives ten minutes late;"}, {"t": "p", "text": "she puts her bag down on the desk;"}, {"t": "p", "text": "she does not greet her colleagues;"}, {"t": "p", "text": "she switches on her computer;"}, {"t": "p", "text": "she stays silent."}, {"t": "p", "text": "Everything else was added by our own mind — you already know this from the previous Stage. What we are doing now is a step further: from this same scene, we will see how one single observed fact can conceal, within itself, quite different things — a symptom, a problem, a cause, a consequence — depending on how we look at it."}, {"t": "h", "text": "When the name becomes the problem"}, {"t": "p", "text": "Let us now look at another situation."}, {"t": "p", "text": "A person goes to the doctor because they have had a fever for three days. After taking medication the temperature drops, but a few hours later it returns."}, {"t": "p", "text": "Many people would say straight away: «The problem is the fever.» But are we really sure we have identified the problem?"}, {"t": "p", "text": "It might be the main problem, but it might also be the sign of something else. Mistaking the symptom for the problem means starting the search from the wrong question."}, {"t": "p", "text": "This happens far more often than we imagine. We give a name to what we observe and, almost without noticing, stop investigating. The name gives us the impression of having understood, when in reality we have only classified what we see."}, {"t": "p", "text": "The Method of the Question invites us to stop one instant earlier. It invites us to ask: «Am I already calling a problem something that might only be a symptom?»"}, {"t": "p", "text": "**Words can hide reality**"}, {"t": "p", "text": "Words are precious tools. They let us describe, communicate and share what we observe. For that very reason they can deceive us: once we find a name, we often have the feeling of having understood."}, {"t": "p", "text": "Think of expressions like «it’s a crisis», «it’s a failure», «it’s depression», «it’s a betrayal», «he’s a difficult boy». Each of these words can be correct in a given context, but none of them replaces the description of the facts."}, {"t": "p", "text": "**The name is not the explanation.**"}, {"t": "p", "text": "Saying a company is in crisis does not tell us why it is. Saying a person is aggressive does not tell us which behaviours we actually observed. Saying a project has failed does not explain which goals were set, which results were achieved, and which conditions led to that outcome."}, {"t": "p", "text": "The Method of the Question therefore invites us to do a simple but rigorous exercise. Every time we use a word to describe a problem, let us ask ourselves: «Which concrete facts led me to use precisely this word?»"}, {"t": "p", "text": "If we cannot answer, perhaps we are not yet describing reality: we are only using a label. And a label, on its own, is not enough to understand or to solve a problem."}, {"t": "p", "text": "«If names are not used with precision, speech loses its correspondence with the truth of things, and if speech loses its correspondence with the truth of things, action too ends up failing its purpose.»"}, {"t": "p", "text": "So taught Confucius in his Analects, more than two thousand years ago. It is an idea that has crossed the centuries intact: words can change the way we see the world and the way we live through a situation."}, {"t": "p", "text": "Precisely because they are so powerful, we must use them with rigour. A word can illuminate reality or hide it. It can open an enquiry or close it down too soon."}, {"t": "p", "text": "Words are not the problem. They are one of the compasses we think with. And that is exactly why they deserve respect, precision and care."}, {"t": "p", "text": "With this awareness, we are ready to take the next step. Before choosing a direction, we must understand what kind of problem we have in front of us."}, {"t": "p", "text": "The same method, different problems"}, {"t": "p", "text": "The Method of the Question does not belong to any single discipline. It is not useful only in the laboratory, the courtroom or the doctor’s surgery. Every time we try to understand reality, the first step remains the same."}, {"t": "p", "text": "**Medicine**"}, {"t": "p", "text": "Observe and distinguish before diagnosing."}, {"t": "p", "text": "A fever is an observable fact. The cause of the fever is still an open question."}, {"t": "p", "text": "**Justice**"}, {"t": "p", "text": "Observe and distinguish before judging."}, {"t": "p", "text": "A testimony is an element of the enquiry, not its conclusion."}, {"t": "p", "text": "**Science**"}, {"t": "p", "text": "Observe and distinguish before explaining."}, {"t": "p", "text": "A piece of data can be measured. Its interpretation requires hypotheses and verification."}, {"t": "p", "text": "**Family**"}, {"t": "p", "text": "Observe and distinguish before attributing intentions."}, {"t": "p", "text": "A person’s silence is a fact. Thinking we know its reason is already an interpretation."}, {"t": "p", "text": "**Work**"}, {"t": "p", "text": "Observe and distinguish before concluding."}, {"t": "p", "text": "A project assigned to a colleague is a fact. The reasons for that choice are still to be understood."}, {"t": "p", "text": "**Education**"}, {"t": "p", "text": "Observe and distinguish before labelling."}, {"t": "p", "text": "A behaviour can be described precisely. Defining a person through a label is a different step."}, {"t": "p", "text": "**Faith**"}, {"t": "p", "text": "Observe and distinguish before asserting."}, {"t": "p", "text": "Even the deepest questions deserve humility, attention and enquiry."}, {"t": "p", "text": "The principle is always the same."}, {"t": "h", "text": "A question before every answer"}, {"t": "p", "text": "If you have come this far, you will probably have noticed something: distinguishing a fact from an interpretation is not an exercise reserved for scientists or philosophers. It is a habit that can change the way we face any situation."}, {"t": "p", "text": "From today, every time you encounter a problem, try to stop for a few moments before looking for the solution. Not to slow your thinking down, but to make it more reliable."}, {"t": "p", "text": "On the next page we will take a further step. Not all problems are the same. Before deciding how to tackle them, we will need to learn to recognise what kind of problem we are facing."}, {"t": "p", "text": "**First observe. Then describe. Then distinguish. Only then interpret. Reversing this order means risking building convincing answers to badly formulated questions. Respecting it does not guarantee you will always be right, but it increases the chances of getting closer to reality.**"}], "id": "c16"}, {"title": "The Compass of the Question", "group": "Part 2 — Learning to See", "body": [{"t": "p", "text": "Having learned to distinguish facts from interpretations, we can take a further step. Not all problems are the same. Two situations can look similar and yet require completely different strategies. For this reason, before looking for a solution, it is useful to stop and get our bearings."}, {"t": "p", "text": "Every time you encounter a problem, try working through these six steps in the order given. First, make sure you can observe from a good psycho-physical state. Then ask yourself:"}, {"t": "p", "text": "**1. What happened?**"}, {"t": "p", "text": "Describe the event as simply as possible, without adding explanations."}, {"t": "p", "text": "**2. What do I know with certainty?**"}, {"t": "p", "text": "List the observable facts and the data available."}, {"t": "p", "text": "**3. What am I interpreting?**"}, {"t": "p", "text": "Recognise the hypotheses, beliefs, fears and explanations that may not yet have been verified."}, {"t": "p", "text": "**4. What is the real problem?**"}, {"t": "p", "text": "Distinguish: ask yourself whether you are observing a symptom, a cause, a consequence, or the problem itself."}, {"t": "p", "text": "**5. What kind of problem is it?**"}, {"t": "p", "text": "Understanding the nature of the problem allows you to choose the most suitable tools."}, {"t": "p", "text": "**6. What is the right question?**"}, {"t": "p", "text": "Only now formulate the question you wish to find an answer to."}, {"t": "p", "text": "A principle to remember"}, {"t": "p", "text": "**The compass does not tell you which decision to make. It helps you find your bearings before deciding. A compass does not remove the difficulty of the journey, but it reduces the risk of walking in the wrong direction.**"}, {"t": "h", "text": "Before classifying, avoid one mistake"}, {"t": "p", "text": "When we encounter a difficulty, we tend to give it a name straight away. It is a natural gesture: giving something a name seems to help us understand it. In reality, a name can only ever be the starting point."}, {"t": "p", "text": "**The same fact can be described in different ways.**"}, {"t": "table", "rows": [["Statement", "What does it represent?"], ["«I have a fever.»", "Describes a symptom."], ["«I have an infection.»", "Proposes a possible cause."], ["«I can’t go to work.»", "Describes a consequence."], ["«I need to understand what’s going on.»", "States the real problem to address."]]}, {"t": "p", "text": "Until you distinguish symptom, cause, consequence and problem, you risk using the wrong tools. For this reason, classification is not there to complicate the reasoning, but to make it more precise."}, {"t": "p", "text": "**Guiding question**"}, {"t": "p", "text": "**«Am I trying to solve the right problem, or am I only acting on whatever I noticed first?»**"}, {"t": "h", "text": "Working card: the symptom"}, {"t": "p", "text": "Let us go back to the woman we observed walking into the office late, without greeting anyone, in silence. What we saw — the lateness, the silence, the absence of a greeting — is a symptom: the first thing we notice, what catches our attention because it produces an immediate reaction in the observer. Precisely for that reason, it is easy to mistake it for the problem."}, {"t": "p", "text": "**What is a symptom?**"}, {"t": "p", "text": "A symptom is a signal. It indicates that something is happening, but does not necessarily explain why it is happening."}, {"t": "p", "text": "**How to recognise it**"}, {"t": "p", "text": "It is what you observe first."}, {"t": "p", "text": "It can be described without formulating explanations."}, {"t": "p", "text": "It can be the effect of very different causes."}, {"t": "p", "text": "It can disappear even while the problem remains."}, {"t": "p", "text": "**Common mistake**"}, {"t": "p", "text": "Mistaking the symptom for the problem often leads to looking for a quick fix that eases the discomfort without understanding what generated it."}, {"t": "p", "text": "**Useful questions**"}, {"t": "p", "text": "What am I really observing?"}, {"t": "p", "text": "Is this the problem, or only its signal?"}, {"t": "p", "text": "If this symptom disappeared, would the problem really be solved?"}, {"t": "p", "text": "**To remember**"}, {"t": "p", "text": "The symptom deserves attention, but does not always point in the direction of the solution. It is a doorway, not a destination."}, {"t": "h", "text": "Working card: the problem"}, {"t": "p", "text": "Now imagine the same behaviour — the lateness, the silence — repeating itself for weeks, not just that one morning. At that point the symptom alone is no longer enough to describe the situation: a real question arises, one that no single episode on its own contained. Why has this person’s behaviour changed over the past month? This question, not the lateness itself, is the problem."}, {"t": "p", "text": "**What is a problem?**"}, {"t": "p", "text": "A problem is a situation in which a gap exists between the reality we observe and the reality we desire. The problem does not necessarily coincide with whatever makes the most noise or causes the most discomfort."}, {"t": "p", "text": "**How to recognise it**"}, {"t": "p", "text": "It can be formulated as a clear question."}, {"t": "p", "text": "It requires an enquiry or a decision."}, {"t": "p", "text": "It may have one or several possible solutions."}, {"t": "p", "text": "It remains open until it is understood or addressed."}, {"t": "p", "text": "**Common mistake**"}, {"t": "p", "text": "Confusing the problem with the symptom or the cause. In these cases, there is a risk of working on the wrong aspect of the situation."}, {"t": "p", "text": "**Useful questions**"}, {"t": "p", "text": "What is the question to which I am really looking for an answer?"}, {"t": "p", "text": "If I resolved this aspect, would the situation really be resolved?"}, {"t": "p", "text": "Am I addressing the problem, or one of its effects?"}, {"t": "p", "text": "**To remember**"}, {"t": "p", "text": "The problem is the centre of the enquiry. Giving it the right name does not mean it is already solved, but it does allow us to start walking in the right direction."}, {"t": "h", "text": "Working card: the cause"}, {"t": "p", "text": "Why has this person’s behaviour changed? It could be an excessive workload, a family difficulty, a conflict with a colleague, a health problem — or something no one has yet even imagined. None of these hypotheses is yet a proven cause: they are possibilities to verify, not conclusions."}, {"t": "p", "text": "**What is a cause?**"}, {"t": "p", "text": "The cause is what generates, or helps to generate, a phenomenon. In some cases it can be identified with good confidence; in others, we can only formulate hypotheses."}, {"t": "p", "text": "**How to recognise it**"}, {"t": "li", "text": "It does not automatically coincide with the first event we notice."}, {"t": "li", "text": "It requires observation, comparison and verification."}, {"t": "li", "text": "It may be a single cause, or it may act together with others."}, {"t": "li", "text": "It sometimes remains unknown."}, {"t": "p", "text": "**Common mistake**"}, {"t": "p", "text": "Mistaking a plausible explanation for a proven cause. A good hypothesis is valuable, but it remains a hypothesis until it has been verified."}, {"t": "p", "text": "**Useful questions**"}, {"t": "li", "text": "What evidence supports this explanation?"}, {"t": "li", "text": "Are there other possible causes?"}, {"t": "li", "text": "Am I describing a fact, or a hypothesis?"}, {"t": "li", "text": "Is there information I am still missing?"}, {"t": "p", "text": "**To remember**"}, {"t": "p", "text": "Recognising that we do not yet know a cause is not a defeat. It is often the first step towards a more rigorous enquiry. The Method of the Question prefers an honest question to a hasty answer."}, {"t": "h", "text": "Working card: the consequence"}, {"t": "p", "text": "Whatever the cause, the problem is already producing its own effects: colleagues have started avoiding her, a shared project risks falling behind schedule, her manager has begun to worry. These effects are real and need to be addressed — but addressing them does not mean we have understood what generated them."}, {"t": "p", "text": "**What is a consequence?**"}, {"t": "p", "text": "A consequence is what follows from a problem, a cause or a decision. It can be positive or negative, expected or unexpected."}, {"t": "p", "text": "**How to recognise it**"}, {"t": "li", "text": "It appears after a fact, a cause or a choice."}, {"t": "li", "text": "It can in turn generate new problems."}, {"t": "li", "text": "It does not necessarily explain why something happened."}, {"t": "li", "text": "It can be observed even when the cause remains unknown."}, {"t": "p", "text": "**Common mistake**"}, {"t": "p", "text": "Focusing only on the consequences and forgetting the original problem. This means acting on the effects without changing what keeps producing them."}, {"t": "p", "text": "**Useful questions**"}, {"t": "li", "text": "Is what I am observing the origin of the problem, or one of its effects?"}, {"t": "li", "text": "If I eliminated this consequence, would the problem still exist?"}, {"t": "li", "text": "What other consequences might this situation produce?"}, {"t": "p", "text": "**To remember**"}, {"t": "p", "text": "Consequences deserve attention because they affect our life, but understanding them does not mean we have understood the problem. The Method of the Question always invites us to distinguish the effect from its origin."}, {"t": "h", "text": "Working card: the constraint"}, {"t": "p", "text": "Anyone wanting to understand how to help the woman in our example runs straight into a real limit: no one can be forced to reveal what is happening in their own life, and a project’s deadlines do not move by themselves. These limits do not prevent action — they define the space within which action is possible."}, {"t": "p", "text": "**What is a constraint?**"}, {"t": "p", "text": "A constraint is a limit within which we have to operate. It can be imposed by nature, by time, by the resources available, by laws, by knowledge, or by the conditions of the situation."}, {"t": "p", "text": "**How do I recognise it?**"}, {"t": "li", "text": "It marks out what is possible to do."}, {"t": "li", "text": "It does not necessarily coincide with the problem."}, {"t": "li", "text": "It can be permanent or temporary."}, {"t": "li", "text": "It can be changeable or unavoidable."}, {"t": "p", "text": "**Common mistake**"}, {"t": "p", "text": "Treating every constraint as an obstacle to be removed. Some constraints can be changed; others must be recognised and built into the search for a solution."}, {"t": "p", "text": "**Useful questions**"}, {"t": "li", "text": "Which limits can I not change?"}, {"t": "li", "text": "Which limits depend, at least in part, on me?"}, {"t": "li", "text": "Am I wasting energy trying to change what cannot be changed?"}, {"t": "li", "text": "Are there resources or strategies that could widen my room for action?"}, {"t": "p", "text": "**To remember**"}, {"t": "p", "text": "The constraint is not always the enemy of the solution. Very often it is the structure within which a good solution can be born. The Method of the Question invites us first to recognise the constraints, and only then to decide how to act."}, {"t": "h", "text": "Working card: the goal"}, {"t": "p", "text": "At this point the question shifts once more: what do we actually want to achieve? Not simply “for the lateness to stop”, but understanding how to support this person without intruding on her private life, while still keeping the team’s commitments. It is the question that holds together everything we have observed, from the first symptom to this point."}, {"t": "p", "text": "**What is a goal?**"}, {"t": "p", "text": "A goal is the result towards which we direct our actions. It is not the same as a vague wish; it clearly describes where we want to get to. In the Method of the Question, the goal does not replace the question: it orients it."}, {"t": "p", "text": "**How do I recognise it?**"}, {"t": "li", "text": "It describes a destination, not a means."}, {"t": "li", "text": "It must be formulated clearly."}, {"t": "li", "text": "It must be compatible with the constraints of the situation."}, {"t": "li", "text": "It can change if new information emerges."}, {"t": "p", "text": "**Common mistake**"}, {"t": "p", "text": "Confusing the goal with the solution. Saying “I want to get better” expresses a destination; working out how to reach it is the problem to be solved. In the same way, “I want to be right” is not the purpose of the enquiry, but a position to be defended. The Method of the Question invites us instead to ask: “I want to understand what is true.”"}, {"t": "p", "text": "**Useful questions**"}, {"t": "li", "text": "What do I really want to achieve?"}, {"t": "li", "text": "Is my goal clearly formulated?"}, {"t": "li", "text": "Is it compatible with the constraints I have recognised?"}, {"t": "li", "text": "Am I looking for the truth, or for confirmation of what I already think?"}, {"t": "p", "text": "**To remember**"}, {"t": "p", "text": "The goal shows the direction of the path. The question shows the trail. The solution, if one exists, is the point of arrival."}, {"t": "p", "text": "**The same case, read through in full**"}, {"t": "p", "text": "Before moving to another field, it is worth pausing for a moment to reread the case of the late-arriving woman as a whole, from beginning to end — no longer split across the six working cards, but taken together, just as it would appear to someone observing it with the Method of the Question already in hand."}, {"t": "table", "rows": [["Element", "In the case of the woman who is late"], ["Symptom", "The ten-minute delay, the silence, the absence of a greeting — that single morning. It is what you notice first, before knowing anything else."], ["Problem", "The same behaviour — lateness, silence — has been repeating for weeks. The real question is no longer the single episode: why has this person’s behaviour changed over the last month?"], ["Cause (to be verified)", "Still no certainty: it could be an excessive workload, a family difficulty, a conflict with a colleague, a health problem — or something no one has yet imagined. Hypotheses, not conclusions."], ["Consequence", "Colleagues have started avoiding her. A shared project risks falling behind schedule. Her manager has started to worry."], ["Constraint", "No one can be forced to reveal what is happening in their private life. The project deadlines will not move by themselves."], ["Goal", "Not simply “for the lateness to stop”, but understanding how to support this person without intruding on her private life, while still meeting the team’s commitments."]]}, {"t": "p", "text": "Six different perspectives on the same fact — not six different problems. Confusing them with one another, as often happens in the rush of real life, could mean spending months managing colleagues’ irritation (a consequence) without ever coming to understand what is really happening to this colleague (the problem)."}, {"t": "h", "text": "**The limit of this Stage**"}, {"t": "p", "text": "Distinguishing symptom, problem, cause, consequence, constraint and goal does not yet tell us whether the hypotheses formulated in each box are true. The late-arriving woman in this chapter remains, in the end, a case still open: we know how to break it down precisely, not yet which explanation is the correct one. Classifying a problem well is the condition for looking for the right answer — it is not, on its own, the answer. That is the task of the next Stage."}, {"t": "h", "text": "**The same principle, in other fields**"}, {"t": "p", "text": "Distinguishing a symptom from a problem, and a problem from its cause, also has a precise technical name in software engineering: root cause analysis. A program that crashes shows a symptom — the error message — but fixing only that message, without tracing back to what really caused it, produces a program that will break again, somewhere else, the next chance it gets. The most experienced engineers do not stop at the first visible level: they trace back, one step at a time, to the cause that generates the error, not just to the point where the error shows itself — exactly the path the Compass of the Question proposes."}, {"t": "p", "text": "The French mathematician Jacques Hadamard, at the start of the twentieth century, proposed a criterion for telling well-formulated problems apart from badly formulated ones: a problem is “well-posed” only if it has a solution, if that solution is unique, and if small variations in the starting data produce small variations in the answer, not an unpredictable reversal. A vague question — “why are things going wrong?” — is almost always a badly posed problem, in Hadamard’s precise sense: before it can be solved, it needs to be reformulated more carefully. It is the same work the Compass of the Question asks us to do, even before looking for an answer."}], "id": "c17"}, {"title": "Atlas 2 – The Compass of the Question", "group": "Part 2 — Learning to See", "body": [{"t": "sh", "text": "What this Atlas is"}, {"t": "p", "text": "This tool does not replace the Method of the Question. It completes it. It is a map that helps you recognise, when facing a difficulty, which of its parts you are looking at in a given moment — before even choosing which question to ask."}, {"t": "sh", "text": "What it is for"}, {"t": "p", "text": "Faced with a problem, the first question is not «How do I solve it?», but «What, exactly, am I looking at: a symptom, the problem itself, a cause, a consequence, a constraint or a goal?» Confusing these parts with one another is one of the most frequent causes of effort that moves, but gets nowhere."}, {"t": "sh", "text": "How to use it"}, {"t": "li", "text": "Stop before looking for a solution."}, {"t": "li", "text": "Describe the event as simply as possible, without adding explanations."}, {"t": "li", "text": "Work through the six working cards, one at a time: symptom, problem, cause, consequence, constraint, goal."}, {"t": "li", "text": "Identify which card you are really on, not the one you thought you were on."}, {"t": "li", "text": "Only then formulate the question you really want to answer."}, {"t": "sh", "text": "What it does NOT do"}, {"t": "p", "text": "This Atlas does not provide solutions, does not replace specialist advice when the problem requires it, and does not guarantee that the right question automatically produces the right answer. It only helps you avoid looking for it in the wrong place."}, {"t": "sh", "text": "Core idea"}, {"t": "p", "text": "Before the answer comes the question. Before the question comes knowing, precisely, what you are really talking about."}, {"t": "h", "text": "Traveller’s map, Stage 2"}], "id": "c18"}, {"title": "Pause 2 – Looking with different eyes", "group": "Part 2 — Learning to See", "body": [{"t": "p", "text": "You have just completed an important stretch of the journey. You have learned to distinguish between symptom, problem, cause, consequence, constraint and goal. It might seem as though you have only acquired new concepts. In reality, you have started to change the way you observe reality. The works that follow are not simply cultural suggestions. They are travelling companions. Each of them faces the same question: «Am I really seeing what is there, or what I believe I see?»"}, {"t": "p", "text": "**📚 To read**"}, {"t": "p", "text": "Gilbert K. Chesterton – The Innocence of Father Brown Father Brown does not solve his cases by looking only at material clues. He understands human beings by continually distinguishing between facts, appearances and interpretations. It is perfectly in line with Stage 2. Umberto Eco – The Name of the Rose (Bompiani, 1980) The investigation proceeds by correcting premature interpretations. The problem changes name several times before it is understood."}, {"t": "p", "text": "**🎬 To watch**"}, {"t": "p", "text": "Rashomon (Akira Kurosawa, 1950) Because the whole narrative turns on the question:"}, {"t": "p", "text": "Does a fact exist independently of the witnesses’ interpretations?"}, {"t": "p", "text": "It is one of the most important films ever made on the relationship between reality, testimony and interpretation."}, {"t": "p", "text": "Arrival (Denis Villeneuve, 2016) Words are not simple labels: they change the way we understand reality."}, {"t": "p", "text": "**🎨 To contemplate**"}, {"t": "p", "text": "Jan van Eyck — The Arnolfini Portrait"}, {"t": "p", "text": "Why?"}, {"t": "p", "text": "This painting forces the viewer to keep asking:"}, {"t": "p", "text": "Who is observing?"}, {"t": "p", "text": "Who is reflected in the mirror?"}, {"t": "p", "text": "What is actually present?"}, {"t": "p", "text": "What am I inferring?"}, {"t": "p", "text": "It is a perfect work for distinguishing observation from interpretation."}, {"t": "p", "text": "Diego Velázquez – Las Meninas Invites us to question the point of view and our immediate interpretations."}, {"t": "p", "text": "**🎼 To listen to**"}, {"t": "p", "text": "Simon & Garfunkel – The Sound of Silence An invitation to listen beyond appearances and to reflect on the relationship between understanding and silence."}, {"t": "p", "text": "**🌿 To try**"}, {"t": "p", "text": "Go to a public place and observe for ten minutes. Note down only what you can actually observe, avoiding interpretations. Then reread your notes and ask yourself how hard it was to separate facts from interpretations."}, {"t": "p", "text": "**A question for the journey**"}, {"t": "p", "text": "«How many times in my life have I looked for a solution without yet having given the problem its right name?»"}, {"t": "p", "text": "**Quotation**"}, {"t": "p", "text": "«The real voyage of discovery consists not in seeking new landscapes, but in having new eyes.» — Marcel Proust"}], "id": "c19"}, {"title": "Stage 3 — Have I really verified this, or have I only looked for confirmation?", "group": "Part 2 — Learning to See", "body": [{"t": "p", "text": "**Compass Rose direction: Verify**"}, {"t": "p", "text": "Elena has run a small clinical analysis laboratory for eight years. One morning in March, opening the appointments register, she notices something she had overlooked for the past two weeks: bookings have fallen by almost a third. It is not just a bad day. It is the third week in a row."}, {"t": "p", "text": "She stays at her desk longer than usual, her coffee gone cold in her hand. And, as almost always happens at such moments, an explanation arrives before she has even really gone looking for it."}, {"t": "h", "text": "The first hypothesis, and how true it already seems"}, {"t": "p", "text": "That afternoon, as she is closing up, she mentions it to Marta, the nurse who has worked with her for years."}, {"t": "p", "text": "«Have you seen March’s numbers?» Elena asks."}, {"t": "p", "text": "«Yes, I’ve seen them. It must be that new lab down the road, the one with the advertising on the buses,» Marta answers, without thinking too hard about it."}, {"t": "p", "text": "«That’s what I think too,» says Elena. «They’ve got parking as well, and we haven’t.»"}, {"t": "p", "text": "The conversation lasts only a few minutes, but that is enough for the idea to take shape. It is not a bad idea to start with — it is reasonable, even probable. The problem, although Elena does not know it yet, is not having thought of the new laboratory. It is stopping thinking right after."}, {"t": "h", "text": "How an idea confirms itself"}, {"t": "p", "text": "Over the following days, without noticing, Elena starts gathering only the evidence that proves her right."}, {"t": "p", "text": "A long-standing patient, Mrs Rinaldi, tells her: «You know, my niece went to the new place. She says it’s ever so convenient, with the parking.»"}, {"t": "p", "text": "«I thought so too,» Elena replies, and that evening she tells Marta the same thing as if it were definitive proof."}, {"t": "p", "text": "A friend mentions a flyer she saw at the chemist’s. Another patient brings up «all that new advertising around.» Every fragment is added to the same story, and each time Elena feels a little more certain."}, {"t": "p", "text": "What she does not do, on any of these days, is one single thing: she never asks the people who stopped coming why they stopped coming. She only asks the people who stayed — and the people who stayed, almost by definition, cannot tell her much about why the others left."}, {"t": "p", "text": "She has not even checked something simpler: whether the drop affects every type of test in the laboratory, or only some."}, {"t": "h", "text": "The question that changes everything"}, {"t": "p", "text": "The turning point comes by chance, on a Friday, during the lunch break. Elena shows the numbers to Davide, a colleague who works at another laboratory in the area and who happens to be there that day only to return a piece of equipment he had borrowed."}, {"t": "p", "text": "«Look at this mess,» Elena tells him, pointing at the graph on the screen. «Since that new place opened down the road, we’ve lost a third of our appointments.»"}, {"t": "p", "text": "Davide looks at the numbers, then looks at her. «Let me get one thing straight first,» he says. «What you just told me — “we’ve lost appointments because of the competitor” — is that something you actually observed, or is it already an explanation you’ve given yourself?»"}, {"t": "p", "text": "Elena falls silent for a moment. «It’s... it’s what I think happened,» she admits."}, {"t": "p", "text": "«Then let’s separate them,» says Davide, picking up a sheet of paper. «The fact — what you have actually observed with your own eyes — is only this: appointments have fallen by a third in three weeks. Everything else — the competitor, the parking, the bus adverts — you haven’t observed. You’ve told it to yourself, because it seemed like the explanation closest to hand.»"}, {"t": "p", "text": "At these words, Elena recognises something she had already learned some time before and had, in her hurry, stopped applying: the difference between a fact and an interpretation is not a minor detail. It is the first step of any sound piece of reasoning, and it is the first thing to go when we are in a hurry to reach an explanation."}, {"t": "p", "text": "«Now the second thing,» Davide continues. «The drop in appointments — is it the problem, or is it a symptom of something else?»"}, {"t": "p", "text": "«I don’t know,» says Elena. «I hadn’t thought of it in those terms.»"}, {"t": "p", "text": "«A symptom is what you see from the outside,» says Davide. «The problem is what is really there, underneath. If you treat a symptom as if it were already the problem, you risk treating the fever without knowing what is causing it.»"}, {"t": "p", "text": "It is the same distinction at the heart of the Compass of the Question: symptom, problem, cause, consequence, constraint, goal — six different boxes, easy to confuse when you already have an answer in mind and are only looking for something to confirm it. The drop in appointments, Elena realises, is a symptom. The problem — what is really causing it — is still entirely to be discovered."}, {"t": "p", "text": "«Good,» says Davide. «That’s where we can really start. Does the drop affect every test, or only some?»"}, {"t": "p", "text": "Elena is taken aback. She had never asked herself that. «I... I don’t know,» she admits. «I’ve never looked at the breakdown by type of test.»"}, {"t": "p", "text": "«Because if it really were the competitor, you’d expect to lose patients across the board, more or less evenly,» Davide replies. «But if the drop is concentrated on one specific test, the story is different.»"}, {"t": "p", "text": "Elena opens the register again in front of him, this time looking at the breakdown by test type that she had never checked. Routine blood tests are stable, almost identical to the previous month. What has collapsed, almost on its own, are the appointments for a single specialist test — the one that requires the laboratory’s most delicate piece of equipment."}, {"t": "p", "text": "«That machine,» Elena says slowly, «was broken and being repaired for almost three weeks, in February.»"}, {"t": "p", "text": "«And did you communicate that properly to the patients who already had appointments?» Davide asks."}, {"t": "p", "text": "Elena thinks about it. «With some, yes. With others... maybe not. Maybe they simply went elsewhere for that test.»"}, {"t": "p", "text": "It does not end there. She calls three patients who never came back, and this time she asks the question she had never asked before: why didn’t you come back? Two out of three tell her the same thing. They had come in for that specific test, and found the machine out of order. Once they had found another available laboratory, they had stayed there for their other tests too — not because it was better, but because, by then, they were already there."}, {"t": "h", "text": "Looking for what could prove you wrong"}, {"t": "p", "text": "The philosopher of science Karl Popper spent a large part of his career answering a question that looks simple on the surface: what distinguishes a scientific theory from one that is not? His answer changed the way science thinks about itself: a theory is scientific if, and only if, there exists at least one possible observation that could prove it false. If I say “all swans are white”, that statement is scientific. Because it would take only a single black swan, found anywhere in the world, to prove it false. And that is exactly what happened: black swans were discovered in Australia."}, {"t": "p", "text": "Popper also used this criterion to expose theories that seemed to explain everything, and precisely for that reason explained nothing. He had noticed that certain theories of his time — some forms of psychoanalysis, astrology — shared a suspicious feature: whatever happened, the theory always found a way to be right. No event could ever prove them wrong. For Popper, this was not a strength. It was the clearest sign that such a theory was not really saying anything about the world — because a theory that can explain every possible outcome cannot distinguish, in advance, what will happen from what will not."}, {"t": "p", "text": "Elena’s hypothesis had exactly this problem, even though she did not know it. “It’s the new laboratory’s fault” was an explanation capable of absorbing any piece of evidence: the parking, the flyer, Mrs Rinaldi’s niece. But none of this evidence could ever have proved it wrong. An explanation that is never at risk of being disproved is not a verified explanation. It is just a convenient story."}, {"t": "h", "text": "An experiment that is more like Elena than it seems"}, {"t": "p", "text": "In 1960 the psychologist Peter Wason devised an experiment that became one of the most cited in the history of the psychology of reasoning. Participants were shown a sequence of three numbers — 2, 4, 6 — with only the information that it followed a hidden rule. Their task was to discover the rule by proposing other sequences of three numbers and receiving a yes or no answer each time."}, {"t": "p", "text": "Almost all participants immediately formed a hypothesis — usually, “even numbers in ascending order, two apart” — and spent the rest of the time proposing sequences that confirmed exactly that idea: 8, 10, 12, 20, 22, 24. Each time the answer was yes, exactly as expected. They felt increasingly confident. Almost no one tried proposing a sequence that could have disproved their own rule — for example, 3, 2, 1, or 1, 5, 20."}, {"t": "p", "text": "The true rule, the one Wason actually had in mind, was far simpler and broader than anyone had imagined: simply, three numbers in ascending order, with no other condition. Of twenty-nine participants, only a minority guessed it on the first attempt — not because the others were unintelligent, but because they had done exactly what the human mind almost always does: look for confirmation, not disconfirmation."}, {"t": "p", "text": "It is exactly the same mechanism as Elena’s. It is not a personal weakness. It is a tendency of the human mind so common that it has a name — confirmation bias — and that is precisely why recognising it takes a deliberate effort, not just good will."}, {"t": "h", "text": "Keeping several hypotheses alive, with equal care"}, {"t": "p", "text": "The geologist Thomas Chamberlin, who directed the geological observatory of the University of Wisconsin for years, noticed a very similar danger in his own field. When a researcher grows attached to a single explanation — what he called a ruling theory — they begin, almost without noticing, to notice only the data that confirm it and to overlook the data that do not fit. In 1890 he proposed a precise remedy, which he called the method of multiple working hypotheses."}, {"t": "p", "text": "The idea was as simple as it was genuinely hard to apply: instead of falling in love with a single explanation, hold several in mind at the same time, giving each the same attention and the same care, until the facts themselves allow some to be ruled out. Chamberlin called the opposite mistake — growing attached to the first plausible idea — a kind of “parental affection” for one’s own hypothesis: protecting it instead of testing it, exactly as a parent might defend a child instead of looking at them with a critical eye."}, {"t": "p", "text": "Had Elena applied this method from day one, alongside “it’s the new laboratory” she would have written down at least a couple of other possibilities, equally plausible. A problem with a piece of equipment. A change in staff shifts. Even a reason entirely unrelated to the laboratory, such as roadworks making the area harder to reach. Not to believe in them more. Only to give each one the same chance of being true, before choosing."}, {"t": "h", "text": "How a piece of evidence can really tell you something"}, {"t": "p", "text": "Anyone reasoning in Bayesian terms adds one last piece, perhaps the most practical of all. The idea, named after the mathematician Thomas Bayes, is simple to state: every new piece of evidence should favour one hypothesis over the others — not simply confirm the one you already preferred. Let us walk through it step by step, with the real numbers from Elena’s story."}, {"t": "p", "text": "Imagine starting out, before looking at any evidence, with three suspects for the drop in appointments, and giving each the same degree of trust: a third each. The competitor. A technical problem. Chance."}, {"t": "p", "text": "Then a precise piece of evidence arrives: the drop affects only one type of test, not all of them. At this point, for each suspect, you ask yourself exactly the same question: if this suspect were the true one, would I expect to see precisely this evidence?"}, {"t": "p", "text": "If it really were the competitor, the answer would be no: a more convenient competitor should draw patients away from every test, not just one. This suspect loses almost all its credibility."}, {"t": "p", "text": "If it were a technical problem, the answer is yes, and it is exactly what you would expect: a broken machine affects one specific test, not the whole laboratory. This suspect gains almost all the trust the first one lost."}, {"t": "p", "text": "If it were chance, the answer is maybe, but it is unlikely that chance alone would always and only strike the same type of test, week after week. This suspect remains weak, but not entirely ruled out."}, {"t": "p", "text": "This is what reasoning in the Bayesian way means: you have not simply confirmed the idea you already had. You have used one precise fact to shift your confidence, differently, across each of the three hypotheses — strengthening one, weakening another, leaving a third almost unchanged."}, {"t": "h", "text": "The same principle, in different fields"}, {"t": "p", "text": "As with the Compass of the Question, it is worth seeing how this same principle — looking for what could prove you wrong, not only for what confirms you — applies far beyond a clinical laboratory."}, {"t": "p", "text": "In medicine, a doctor who suspects a diagnosis should ask not only which symptoms confirm it, but which tests, if negative, would rule it out with confidence — which is exactly why differential diagnoses exist, built precisely so as not to become attached to the first hypothesis."}, {"t": "p", "text": "In a relationship, anyone who suspects that a silence is hiding a problem should ask what they would observe differently if the silence depended instead simply on a tiring day — and look for that signal, before building an entire story on top of it."}, {"t": "p", "text": "In a company, anyone proposing a new project should be the first to ask: what data would show that it is not working, if it appeared? Not to feel discouraged. But because a project that no data could ever make fail has not really been put to the test."}, {"t": "h", "text": "The limit of this Stage"}, {"t": "p", "text": "Verifying a hypothesis well does not guarantee finding the right one. Sometimes, even when we carefully look for what could prove us wrong, the data remain ambiguous, insufficient, or open to more than one reading. This is not a failure of the method: it is the point at which the method itself shows that a decision still has to be made, knowing that we do not yet have every answer. That is the step the next Stage will address."}, {"t": "h", "text": "**The same principle, in other fields**"}, {"t": "p", "text": "Popper’s criterion of falsifiability, which we met in this Stage, is not an abstract idea: it arises from observing how physics actually behaves. The most famous example is the solar eclipse of 1919. Einstein’s general theory of relativity, published a few years earlier, made a precise and risky prediction: starlight passing close to the Sun would bend by an angle that could be calculated in advance — different from the angle predicted by Newtonian physics. The astronomer Arthur Eddington led an expedition to the island of Príncipe, off the coast of Africa, specifically to photograph the stars visible during the eclipse and measure that angle. Einstein’s prediction passed the test."}, {"t": "p", "text": "It is worth adding, with the same honesty this book has always tried to keep: historians of science have since debated how precise, by today’s standards, Eddington’s measurements really were. Even the most famous test in the history of physics, in other words, did not settle the matter once and for all — it has been checked and rechecked in the decades since, with ever more precise instruments. This is exactly the point of this Stage: even a good verification is never the final word."}], "id": "c20"}, {"title": "Atlas 3 – How do I really verify a hypothesis?", "group": "Part 2 — Learning to See", "body": [{"t": "sh", "text": "What this Atlas is"}, {"t": "p", "text": "This tool does not replace the Method of the Question. It puts it to the test. It is a practical guide to keep beside you whenever you have formed a hypothesis and are about to decide whether to trust it."}, {"t": "sh", "text": "What it is for"}, {"t": "p", "text": "Faced with an idea that convinces you, the strongest temptation is to look for confirmation, not disconfirmation. This Atlas exists to reverse that instinct at the very moment it matters — not afterwards, once the mistake has already been made."}, {"t": "sh", "text": "How to use it"}, {"t": "p", "text": "1. Write your hypothesis in a single sentence, as simply as possible."}, {"t": "p", "text": "2. Ask yourself: what should I observe, as a fact, if this idea were wrong? If you cannot answer, it is not yet a testable hypothesis."}, {"t": "p", "text": "3. Generate at least a second hypothesis, even if the first already convinces you."}, {"t": "p", "text": "4. Actively look for the missing information, not only the confirming kind — especially when it is less convenient to reach."}, {"t": "p", "text": "5. When a piece of evidence arrives, ask whether it could also have proved you wrong. If the answer is no, that evidence is not verifying anything."}, {"t": "p", "text": "6. Ask someone else to look at the same facts before you decide. A view that has not yet grown attached to your hypothesis often sees what escapes you."}, {"t": "sh", "text": "What it does NOT do"}, {"t": "p", "text": "This Atlas does not guarantee that you will find the correct explanation, and it does not remove the residual uncertainty that every verification, however careful, carries with it. It only helps you avoid stopping at the first plausible idea and mistaking it for an established truth."}, {"t": "sh", "text": "Core idea"}, {"t": "p", "text": "A hypothesis that no fact could ever disprove is not telling you anything about the world. It is only confirming what you had already decided to believe."}, {"t": "h", "text": "Traveller’s map, Stage 3"}], "id": "c21"}, {"title": "Pause 3 – Looking at what proves you wrong", "group": "Part 2 — Learning to See", "body": [{"t": "p", "text": "Here is the pause after the stage. This is not a list of cultural suggestions. It is an integral part of the path: a moment to let this Stage’s principle settle, before setting off walking again."}, {"t": "sh", "text": "To contemplate"}, {"t": "p", "text": "M. C. Escher – Belvedere An impossible architectural structure that seems perfectly coherent until you check every single detail. Look for the exact point where the coherence breaks down."}, {"t": "p", "text": "Galileo Galilei’s drawings of the Moon (Sidereus Nuncius, 1610) The Moon, observed through the telescope, was not the perfect sphere that Aristotelian tradition had taken for granted. A single drawing, grounded in direct observation, was enough to disprove centuries of theory that had never really been put to the test."}, {"t": "sh", "text": "To listen to"}, {"t": "p", "text": "Johann Sebastian Bach – The Art of Fugue Each variation takes up the same theme from a different angle, as if testing it anew each time. Listen to how the theme holds, or transforms, with every repetition."}, {"t": "sh", "text": "To watch"}, {"t": "p", "text": "Blow-Up (Michelangelo Antonioni, 1966) A photographer, enlarging a photograph taken by chance in a park again and again, believes he has photographed a murder. The more he searches for definitive proof, the more the image dissolves into shapeless grain — and in the end, even the body he thought he had seen disappears, leaving only the doubt of whether it was ever real."}, {"t": "sh", "text": "To read"}, {"t": "p", "text": "Leonardo Sciascia – The Day of the Owl Captain Bellodi investigates a mafia murder, testing his hypotheses one by one against a wall of silence and evasive testimony. A plausible explanation is not enough for him: he systematically looks for what could disprove it, even when everything around him pushes him to settle for the first convenient version."}, {"t": "p", "text": "Richard Feynman – Cargo Cult Science (Caltech commencement address, 1974) “The first principle is that you must not fool yourself — and you are the easiest person to fool.” A Nobel-winning physicist explains why the discipline of seeking one’s own refutations is not just a technical method, but a form of honesty."}, {"t": "sh", "text": "A small experiment"}, {"t": "p", "text": "Try Peter Wason’s task on yourself, or with a friend: choose a sequence of three numbers, for example 2, 4, 6, and say only that it follows a rule. Have the other person propose further sequences, answering yes or no, until they announce the rule. Notice how many of the sequences proposed were designed to confirm the hypothesis, and how many to disprove it."}, {"t": "sh", "text": "Question for the journey"}, {"t": "p", "text": "«The last time I was sure I was right, did I really look for a way to be wrong?»"}], "id": "c22"}, {"title": "Stage 4 — How much longer should I keep looking, before deciding?", "group": "Part 2 — Learning to See", "body": [{"t": "p", "text": "**Compass Rose direction: Accept the Limit — Decide**"}, {"t": "p", "text": "Chiara has run a small graphic design studio for six years. For two months she has been looking for someone to work alongside her, but the desk next to hers remains exactly as it was: empty."}, {"t": "p", "text": "It is not that she has no candidates. She has two, both good, who reached the end of a long and carefully run selection process. The trouble is that, every time she should choose, she finds a reason to put it off a little longer."}, {"t": "h", "text": "A method applied well, up to a point"}, {"t": "p", "text": "One afternoon, she has coffee with Roberto, a friend who runs a larger agency and has, over the years, hired dozens of people. Before getting to the point where she is stuck, Roberto wants to understand how she got there."}, {"t": "p", "text": "«Let’s start from the beginning,» he tells her. «What have you actually observed about the two candidates — and what, instead, have you only told yourself?»"}, {"t": "p", "text": "Chiara thinks about it. «The facts are the portfolio, the interview answers, the different way they each handled a hard question I put to both of them. What I’ve told myself, perhaps, is that one of the two “seems more reliable to me” — but if you ask me why, I can’t point to a precise fact.»"}, {"t": "p", "text": "«Good, you’ve already made that distinction yourself,» says Roberto. «Second question: did you actually know what you were looking for, or were you looking generically for “someone to help me”?»"}, {"t": "p", "text": "«No, that part was clear to me,» Chiara replies. «I didn’t need generic help. The real problem — not the symptom, the problem — was that I was spending too much time on small projects and not enough on the big ones. The goal was someone able to manage the small ones independently.»"}, {"t": "p", "text": "«And did you verify that ability, or did you just take their word for it?» Roberto asks further."}, {"t": "p", "text": "«I verified it,» says Chiara, almost with pride. «I gave both of them a paid trial assignment, precisely to see what they could actually do, not just what they said they could do. And I also deliberately looked for whatever might change my mind about each of them — not only the things that made them look good.»"}, {"t": "p", "text": "Roberto nods, and for a moment says nothing. Chiara realises, going back over every step out loud, that she has genuinely done all the work the method asks for: she observed without confusing facts and impressions, she asked herself the right question instead of settling for a generic one, she verified by also looking for what could disprove her view, not only for confirmation. All this work, done well, has produced two good candidates — and no certainty."}, {"t": "h", "text": "When verification becomes a way of not deciding"}, {"t": "p", "text": "«I’ve almost decided,» Chiara tells him. «I just want to hold a third interview with both of them, maybe with a personality test this time, to be more certain.»"}, {"t": "p", "text": "Roberto looks at her with an expression Chiara knows well — the look of someone about to ask an uncomfortable question. «Can I ask you something? What do you expect this third interview to tell you, that the first two and the trial assignment haven’t already told you?»"}, {"t": "p", "text": "Chiara opens her mouth to answer, and realises she does not have a ready reply. «I... I don’t know exactly,» she admits. «I just want to be more certain, before choosing.»"}, {"t": "p", "text": "«I understand that,» says Roberto. «But try asking yourself something else: if even the third interview went well for both of them — as happened with the first two — would your uncertainty dissolve, or would it stay exactly the same?»"}, {"t": "p", "text": "This time Chiara really thinks about it. And she realises something she had never said out loud to herself: whatever extra information she gathered, it probably would not change her underlying feeling. Both candidates would remain, in their different ways, good and uncertain at the same time. She is not looking for the information she is missing. She is looking for a way not to have to choose."}, {"t": "h", "text": "The limit that no further verification can dissolve"}, {"t": "p", "text": "«Your method, up to now, has been right,» Roberto tells her. «You observed, you distinguished the facts from your impressions, you asked yourself the right question, you verified by also looking for what could prove you wrong. The problem is not that you worked badly. It’s that you’re asking verification to do a job it cannot do: take away all the risk.»"}, {"t": "p", "text": "«And if I’m wrong?» Chiara asks."}, {"t": "p", "text": "«You might be wrong anyway,» Roberto replies, without softening it. «Even after a fourth interview, even after a fifth. No amount of verification removes the risk from a decision about a person, not a number. At a certain point, the task is no longer to verify better. It’s to accept that a margin remains that no verification can fill, and to choose anyway.»"}, {"t": "h", "text": "A second case"}, {"t": "p", "text": "A few weeks later, Chiara tells this story to her sister Giulia, who is facing something very different but, looking closely, not so far removed: for months she has been putting off the decision to have her son seen by a speech therapist, after his teacher flagged some difficulty with language."}, {"t": "p", "text": "«I’ve read three different articles, I’ve asked two friends, I’m waiting for the paediatrician’s opinion next week,» Giulia tells her. «I just want to be sure before starting anything.»"}, {"t": "p", "text": "«Can I ask you the same question Roberto asked me?» says Chiara. «The paediatrician’s opinion, if it confirms what you already think, would it change your decision — or would it only confirm it, while you go on looking for yet another opinion after that one?»"}, {"t": "p", "text": "Giulia stays silent longer than she expected to. Then she admits that the speech therapist she had already spoken to on the phone, months before, had told her more or less the same thing she expects to hear from the paediatrician. She is not missing a piece of information. She is missing the courage to begin something that, deep down, she fears might mean admitting there really is a problem."}, {"t": "p", "text": "It is not exactly the same situation as Chiara’s — here the risk is not hiring the wrong person, it is the time a young child does not get back if useful help is put off for too long. But the mechanism keeping Giulia stuck is the same: looking for yet another check, not because it could really change the decision, but because starting feels more frightening than waiting a little longer."}, {"t": "h", "text": "Deciding when “good” is better than “perfect”"}, {"t": "p", "text": "The economist Herbert Simon, Nobel laureate in 1978, devoted much of his career to an observation that only seems obvious once you have heard it: no one, in real life, can truly compare every possible option before choosing. Time is limited, information is limited, and our own mind has a limit on how many variables it can hold in view at once. Simon called this condition bounded rationality. We do not look for the best choice in absolute terms. We look for the first choice that clears a reasonable threshold, and then we stop."}, {"t": "p", "text": "This is not a lesser compromise, as is sometimes believed. It is the only realistic way of deciding anything important, because the search for the perfect choice, taken to its extreme, does not produce a better decision: most often, it produces no decision at all — exactly what was about to happen to Chiara."}, {"t": "p", "text": "The psychologist Gary Klein observed the same principle from a different angle. In 1985 he interviewed twenty-six fire commanders, with an average of twenty-three years’ experience, analysing one hundred and fifty-six decisions made during real fires. He expected to find, even under pressure, a comparison between at least two or three options before acting. He found the exact opposite: in more than eighty per cent of cases, the commanders did not compare alternatives at all — they recognised the situation as similar to one they had already lived through, and acted accordingly."}, {"t": "p", "text": "One of the cases Klein collected has become the most cited of them all. A commander leads his crew into what looks like an ordinary kitchen fire, in a single-storey house. He orders water sprayed on the fire — but instead of dying down, the flames flare up stronger. Something does not add up: the living room is unusually hot for a fire confined to the kitchen, and strangely quiet. Without yet knowing why, the commander orders his crew out immediately. A few seconds later, the floor they had been standing on collapses: the real fire had been burning beneath them, in a basement, and the kitchen had shown only its reflection."}, {"t": "p", "text": "The commander later described that decision as a kind of sixth sense. Klein, studying it closely, showed there was nothing supernatural about it: the man’s experience had registered, without his being aware of it, a set of signals that did not add up — the misplaced heat, the silence, the fire’s resistance to water — assembling them into a warning before his conscious mind could even name it. Klein called this model recognition-primed decision-making: the most experienced firefighters do not mentally list every possible strategy and then pick the best one. Thanks to experience, they recognise a course of action — or a danger — that feels right, picture it playing out, and, if something does not convince them, adjust the details, without ever stopping to weigh it systematically against ten alternatives."}, {"t": "p", "text": "Chiara is not in a burning building, and she rightly had the time to verify carefully before reaching this point. But the principle is the same: once verification has done its job, looking for still more of it does not produce a safer decision. It only produces a delay, dressed up as caution."}, {"t": "h", "text": "The same principle, in different fields"}, {"t": "p", "text": "In medicine, there always comes a moment when one more test would not change the treatment to be started — and continuing to order them, at that point, is not caution: it is a way of putting off a frightening decision, at the patient’s expense while they wait."}, {"t": "p", "text": "In a relationship that has deteriorated, there is a point at which yet another clarifying conversation adds no new information, only time — and sometimes the honest question to ask is the same one Roberto asked: would this extra conversation really change anything, or am I only putting off a choice I already know I have to make?"}, {"t": "p", "text": "In an investment, or a major purchase, there is always one more opinion, one more review, one more price comparison you could look for — but beyond a certain threshold, looking for still more does not reduce the risk: it only reduces the time left to enjoy the choice, once it is made."}, {"t": "h", "text": "The limit of this Stage"}, {"t": "p", "text": "Deciding by accepting the limit does not mean every decision made this way will turn out well. Chiara might choose the candidate who, in time, proves less suited to the role. This is not a failure of the method: it is the risk that always remains, in any choice concerning a future that no verification can fully know. The method does not promise to remove it. It promises to help you avoid adding to it, needlessly, by standing still longer than necessary."}, {"t": "h", "text": "**The same principle, in other fields**"}, {"t": "p", "text": "Herbert Simon’s principle of “good instead of perfect” has an important parallel in theoretical computer science. There exist computationally hard problems — including many NP-hard problems — for which the search for an exact solution can quickly become impractical as the size of the instance grows. In such cases, computer scientists often turn to approximation algorithms or other strategies that favour solutions that are good enough, obtainable with reasonable resources, over the search for the exact optimum. This is not necessarily a shortcut born of laziness: it can be a mathematically and computationally deliberate choice — the same logic that Chiara, in this Stage’s story, learns to apply without knowing its name."}], "id": "c23"}, {"title": "Atlas 4 – How do I recogni
