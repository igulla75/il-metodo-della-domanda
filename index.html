  4: {

  6: {

    citazione: { testo: 'Suppongo sia tentante, se l\u2019unico strumento che hai è un martello, trattare ogni cosa come se fosse un chiodo.', autore: 'Abraham Maslow', fonte: 'Toward a Psychology of Being, 1962' },

  7: {

  21: {
    intro: 'Il pensiero della morte può nascere da luoghi molto diversi, e confonderli porta a risposte sbagliate. Prima di qualunque tecnica, distingui quale delle tre situazioni descrive meglio ciò che stai vivendo adesso.',
    manifestazioni: [

      { manifestazione: 'Il pensiero è comparso insieme a un sintomo fisico nuovo, persistente, o che peggiora — un dolore, un cambiamento nel corpo che non avevi notato prima', strumento: 'Prima di ogni riflessione, una valutazione medica: solo un professionista può dirti se il sintomo è un segnale reale', origine: 'Non esiste una singola fonte da citare qui: è il criterio di buon senso della pratica clinica, non una linea guida specifica.', perche: 'Nessuna tecnica di regolazione emotiva sostituisce un accertamento medico quando il corpo manda un segnale nuovo. Rimanda la riflessione a dopo, non a prima.', toolKey: null },
      { manifestazione: 'Il pensiero della morte è così frequente, intenso o invasivo da impedirti di vivere la quotidianità — dormire, lavorare, stare con le persone che ami', strumento: 'Riconoscere che quando la paura diventa pervasiva e paralizzante, non basta più un lavoro personale sul limite: serve un supporto professionale', origine: 'Distinzione clinica tra ansia esistenziale e disturbo d\u2019ansia', perche: 'Un pensiero ricorrente che impedisce di funzionare è un segnale che merita una valutazione psicologica o psichiatrica, non solo filosofica.', toolKey: null },

  14: {
    tipo: 'informativo',
    intro: 'Ogni altro Itinerario di questo libro nomina strumenti da provare. Questo è diverso, e lo è per una ragione precisa: condizioni come la depressione maggiore, i disturbi d\u2019ansia cronici, il disturbo bipolare o la schizofrenia non sono uno stato che si attraversa in un pomeriggio, né una condizione che si scioglie con una tecnica personale. Per questo qui il libro non propone tecniche.',
    sezioni: [
      {
        titolo: 'Un fatto',
        corpo: 'Secondo l\u2019Organizzazione Mondiale della Sanità, la depressione è la prima causa di disabilità al mondo, e colpisce oltre trecento milioni di persone. Non è un segno di debolezza personale: la ricerca la descrive come l\u2019intreccio di fattori biologici, psicologici e sociali — mai una colpa individuale. Lo stesso vale per il disturbo bipolare e la schizofrenia, condizioni mediche complesse con basi neurobiologiche documentate. Eppure, anche nei paesi più ricchi del mondo, quasi la metà delle persone con depressione non riceve alcun trattamento. La causa più citata non è la mancanza di cure efficaci — esistono, e funzionano per la maggior parte di chi le riceve — ma lo stigma: la vergogna di ammetterlo, il timore di essere giudicati.',
      },
      {
        titolo: 'Una voce, non una tecnica',
        corpo: 'Lo scrittore Andrew Solomon, che ha intrecciato la propria esperienza di depressione con anni di ricerca, scrive che l\u2019opposto della depressione non è la felicità, ma la vitalità — la capacità di sentire, anche quando ciò che si sente è doloroso. Non offre una tecnica per uscirne. Offre la prova, argomentata e non consolatoria, che è possibile descrivere questa condizione con precisione, dignità e persino bellezza, senza minimizzarla né lasciarsene definire.',
      },
      {
        titolo: 'Chi vive accanto',
        corpo: 'Convivere con chi soffre di una malattia psichiatrica seria è, a sua volta, un\u2019esperienza complessa e spesso solitaria — un problema a sé, con una propria letteratura scientifica. Gli psichiatri Christine Vaughn e Julian Leff hanno documentato che le famiglie in cui prevalgono critica, ostilità o un coinvolgimento emotivo eccessivo si associano a un rischio di ricaduta del paziente da tre a sette volte più alto. Non è un giudizio sulle famiglie, quasi sempre già provate: è un dato che ha portato a sviluppare programmi di psicoeducazione familiare, la cui efficacia nel ridurre le ricadute è verificata in numerosi studi controllati. Esiste un aiuto specifico anche per chi accompagna, non solo per chi è malato.',
      },
      {
        titolo: 'Dove cercare aiuto',
        corpo: 'Il medico di base è spesso il primo punto di accesso, e orienta verso uno specialista quando serve. Lo psicoterapeuta lavora sugli aspetti psicologici, spesso con approcci di efficacia dimostrata. Lo psichiatra è competente anche per un\u2019eventuale terapia farmacologica. I servizi di salute mentale pubblici offrono, in molti paesi, anche percorsi di psicoeducazione familiare. Le linee di ascolto restano un punto di accesso per chi non sa da dove cominciare. Nessuno di questi percorsi è un segno di fallimento — né per chi è malato, né per chi gli sta accanto.',
      },
    ],
  },

// ============ 1. RESPIRAZIONE GUIDATA ============
function BreathingTool({ baseFont, onExit }) {
  const [running, setRunning] = useState(false);
  const [phase, setPhase] = useState('inspira'); // inspira | trattieni | espira
  const [scale, setScale] = useState(0.55);
  const [cycles, setCycles] = useState(0);
  const timeoutRef = useRef(null);

  const PHASES = [
    { key: 'inspira', label: 'Inspira dal naso', duration: 4000, targetScale: 1 },
    { key: 'trattieni', label: 'Trattieni', duration: 1500, targetScale: 1 },
    { key: 'espira', label: 'Espira dalla bocca', duration: 6000, targetScale: 0.55 },
  ];

  useEffect(() => {
    if (!running) return;
    let idx = PHASES.findIndex((p) => p.key === phase);
    const current = PHASES[idx];
    setScale(current.targetScale);
    timeoutRef.current = setTimeout(() => {
      const nextIdx = (idx + 1) % PHASES.length;
      if (nextIdx === 0) setCycles((c) => c + 1);
      setPhase(PHASES[nextIdx].key);
    }, current.duration);
    return () => clearTimeout(timeoutRef.current);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [running, phase]);

  const start = () => { setPhase('inspira'); setCycles(0); setRunning(true); };
  const stop = () => { setRunning(false); clearTimeout(timeoutRef.current); setScale(0.55); };
  const currentLabel = PHASES.find((p) => p.key === phase)?.label || 'Inspira dal naso';

  return (
    <div>
      <div style={{ ...card, textAlign: 'center', paddingTop: 40, paddingBottom: 36 }}>
        <div style={{ width: 220, height: 220, margin: '0 auto 28px auto', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <div style={{
            width: 180 * scale, height: 180 * scale, borderRadius: '50%',
            background: 'radial-gradient(circle, #EAF1FC 0%, #1F4E8C 100%)',
            transition: `all ${phase === 'inspira' ? 4 : phase === 'espira' ? 6 : 1.5}s ease-in-out`,
            boxShadow: '0 4px 24px rgba(31,78,140,0.25)',
          }} />
        </div>
        <div style={{ fontSize: baseFont * 1.15, fontWeight: 800, color: '#17203A', marginBottom: 8, minHeight: 30 }}>
          {running ? currentLabel : 'Pronto quando vuoi'}
        </div>
        {running && <div style={{ fontSize: baseFont * 0.85, color: '#8a8a8a' }}>Cicli completati: {cycles}</div>}
      </div>
      <div style={{ display: 'flex', gap: 12, justifyContent: 'center' }}>
        {!running
          ? <button onClick={start} style={btnPrimary('#1F4E8C')}>Inizia</button>
          : <button onClick={stop} style={btnSecondary}>Fermati</button>}
        <button onClick={onExit} style={btnSecondary}>&#8592; Torna agli strumenti</button>
      </div>
      <p style={{ fontSize: baseFont * 0.85, color: '#8a8a8a', textAlign: 'center', marginTop: 20, lineHeight: 1.5 }}>
        Inspira mentre il cerchio cresce, espira mentre si restringe. Bastano cinque-dieci minuti.
      </p>
    </div>
  );
}

// ============ 2. RILASSAMENTO MUSCOLARE (JACOBSON) ============
const MUSCLE_GROUPS = ['Mani e avambracci', 'Braccia', 'Spalle', 'Viso', 'Addome', 'Gambe', 'Piedi'];
function JacobsonTool({ baseFont, onExit }) {
  const [idx, setIdx] = useState(0);
  const [phase, setPhase] = useState('ready'); // ready | tension | release
  const [secondsLeft, setSecondsLeft] = useState(6);
  const intervalRef = useRef(null);

  useEffect(() => {
    if (phase === 'ready') return;
    setSecondsLeft(phase === 'tension' ? 6 : 8);
    intervalRef.current = setInterval(() => {
      setSecondsLeft((s) => {
        if (s <= 1) {
          clearInterval(intervalRef.current);
          if (phase === 'tension') setPhase('release');
          else if (idx < MUSCLE_GROUPS.length - 1) { setIdx((i) => i + 1); setPhase('ready'); }
          else setPhase('done');
          return 0;
        }
        return s - 1;
      });
    }, 1000);
    return () => clearInterval(intervalRef.current);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [phase]);

  const startGroup = () => setPhase('tension');
  const restart = () => { setIdx(0); setPhase('ready'); };

  if (phase === 'done') {
    return (
      <div style={card}>
        <div style={{ textAlign: 'center' }}>
          <div style={{ fontSize: 40, marginBottom: 12 }}>&#10003;</div>
          <div style={{ fontSize: baseFont * 1.1, fontWeight: 800, color: '#17203A', marginBottom: 20 }}>
            Sequenza completata
          </div>
          <div style={{ display: 'flex', gap: 12, justifyContent: 'center' }}>
            <button onClick={restart} style={btnPrimary('#6B4FA0')}>Ricomincia</button>
            <button onClick={onExit} style={btnSecondary}>&#8592; Strumenti</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div>
      <div style={{ fontSize: 13, color: '#8a8a8a', fontWeight: 700, marginBottom: 8 }}>
        GRUPPO {idx + 1} DI {MUSCLE_GROUPS.length}
      </div>
      <div style={{ ...card, textAlign: 'center', paddingTop: 32, paddingBottom: 32 }}>
        <div style={{ fontSize: baseFont * 1.3, fontWeight: 800, color: '#6B4FA0', marginBottom: 18 }}>
          {MUSCLE_GROUPS[idx]}
        </div>
        {phase === 'ready' && (
          <>
            <p style={{ fontSize: baseFont, color: '#2b2b2b', marginBottom: 20 }}>Pronto a contrarre questo gruppo muscolare?</p>
            <button onClick={startGroup} style={btnPrimary('#6B4FA0')}>Inizia contrazione</button>
          </>
        )}
        {phase === 'tension' && (
          <>
            <div style={{ fontSize: baseFont * 1.6, fontWeight: 800, color: '#C0392B', marginBottom: 10 }}>Contrai</div>
            <div style={{ fontSize: baseFont * 2, fontWeight: 800, color: '#17203A' }}>{secondsLeft}</div>
          </>
        )}
        {phase === 'release' && (
          <>
            <div style={{ fontSize: baseFont * 1.6, fontWeight: 800, color: '#2F8F5B', marginBottom: 10 }}>Rilascia</div>
            <div style={{ fontSize: baseFont * 2, fontWeight: 800, color: '#17203A' }}>{secondsLeft}</div>
            <p style={{ fontSize: baseFont * 0.85, color: '#8a8a8a', marginTop: 12 }}>Nota il contrasto tra tensione e distensione.</p>
          </>
        )}
      </div>
      <button onClick={onExit} style={btnSecondary}>&#8592; Torna agli strumenti</button>
    </div>
  );
}

// ============ 3. GROUNDING 5-4-3-2-1 ============
const GROUNDING_STEPS = [
  { count: 5, sense: 'vedi', icon: '\u{1F441}\uFE0F', color: '#2F8F5B' },
  { count: 4, sense: 'tocchi', icon: '\u270B', color: '#3F7FBF' },
  { count: 3, sense: 'senti (udito)', icon: '\u{1F442}', color: '#D4A017' },
  { count: 2, sense: 'odori', icon: '\u{1F443}', color: '#6B4FA0' },
  { count: 1, sense: 'assapori', icon: '\u{1F445}', color: '#C0392B' },
];
function GroundingTool({ baseFont, onExit }) {
  const [idx, setIdx] = useState(0);
  const [values, setValues] = useState(Array(5).fill(''));
  const step = GROUNDING_STEPS[idx];
  const items = (values[idx] || '').split('\n');

  const updateItem = (i, val) => {
    const lines = (values[idx] || '').split('\n');
    while (lines.length < step.count) lines.push('');
    lines[i] = val;
    setValues((prev) => { const next = [...prev]; next[idx] = lines.join('\n'); return next; });
  };

  if (idx >= GROUNDING_STEPS.length) {
    return (
      <div style={card}>
        <div style={{ textAlign: 'center' }}>
          <div style={{ fontSize: 40, marginBottom: 12 }}>&#10003;</div>
          <div style={{ fontSize: baseFont * 1.1, fontWeight: 800, color: '#17203A', marginBottom: 8 }}>Percorso completato</div>
          <p style={{ fontSize: baseFont * 0.9, color: '#5b5b5b', marginBottom: 20 }}>Come ti senti adesso, rispetto a prima?</p>
          <div style={{ display: 'flex', gap: 12, justifyContent: 'center' }}>
            <button onClick={() => { setIdx(0); setValues(Array(5).fill('')); }} style={btnPrimary('#2F8F5B')}>Ricomincia</button>
            <button onClick={onExit} style={btnSecondary}>&#8592; Strumenti</button>
          </div>
        </div>
      </div>
    );
  }

  const lines = (values[idx] || '').split('\n');
  while (lines.length < step.count) lines.push('');

  return (
    <div>
      <div style={{ fontSize: 13, color: '#8a8a8a', fontWeight: 700, marginBottom: 8 }}>PASSO {idx + 1} DI 5</div>
      <div style={card}>
        <div style={{ fontSize: 34, marginBottom: 8 }}>{step.icon}</div>
        <div style={{ fontSize: baseFont * 1.15, fontWeight: 800, color: step.color, marginBottom: 16 }}>
          Nomina {step.count} cose che {step.sense}
        </div>
        {Array.from({ length: step.count }).map((_, i) => (
          <input key={i} type="text" value={lines[i] || ''} onChange={(e) => updateItem(i, e.target.value)}
            placeholder={`${i + 1}.`} style={inputStyle} />
        ))}
      </div>
      <div style={{ display: 'flex', justifyContent: 'space-between', gap: 12 }}>
        <button onClick={onExit} style={btnSecondary}>&#8592; Strumenti</button>
        <button onClick={() => setIdx((i) => i + 1)} style={btnPrimary(step.color)}>
          {idx < GROUNDING_STEPS.length - 1 ? 'Avanti \u2192' : 'Concludi'}
        </button>
      </div>
    </div>
  );
}

    if (!running) return;
    intervalRef.current = setInterval(() => {
      setSecondsLeft((s) => { if (s <= 1) { setRunning(false); return 0; } return s - 1; });
    }, 1000);
    let expanding = true;
    breathRef.current = setInterval(() => { setScale(expanding ? 1 : 0.6); expanding = !expanding; }, 4000);
    return () => { clearInterval(intervalRef.current); clearInterval(breathRef.current); };
  }, [running]);

  const mins = Math.floor(secondsLeft / 60);
  const secs = secondsLeft % 60;
  const start = () => { setSecondsLeft(5 * 60); setRunning(true); };
  const stop = () => { setRunning(false); setSecondsLeft(5 * 60); setScale(0.6); };

  return (
    <div>
      <div style={{ ...card, textAlign: 'center', paddingTop: 40, paddingBottom: 36 }}>
        <div style={{ width: 200, height: 200, margin: '0 auto 24px auto', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>

function FivePercheTool({ baseFont, onExit }) {
  const [problem, setProblem] = useState('');
  const [reasons, setReasons] = useState(['', '', '', '', '']);
  const [started, setStarted] = useState(false);

  const updateReason = (i, val) => setReasons((prev) => { const next = [...prev]; next[i] = val; return next; });
  const lastFilled = reasons.reduce((acc, r, i) => r.trim() ? i : acc, -1);

  if (!started) {
    return (
      <div>
        <div style={card}>
          <div style={{ fontSize: baseFont * 0.95, fontWeight: 800, color: '#D4A017', marginBottom: 10 }}>Qual è il sintomo o il problema iniziale?</div>
          <p style={{ fontSize: baseFont * 0.85, color: '#8a8a8a', marginBottom: 10 }}>Descrivilo come lo racconteresti a qualcuno — il fatto, non ancora la causa.</p>
          <input type="text" value={problem} onChange={(e) => setProblem(e.target.value)} placeholder="Es. Un progetto è in ritardo di due settimane" style={inputStyle} />
        </div>
        <button onClick={() => problem.trim() && setStarted(true)} disabled={!problem.trim()} style={{ ...btnPrimary('#D4A017'), opacity: problem.trim() ? 1 : 0.5, width: '100%', marginBottom: 12 }}>
          Comincia a chiederti "perché"
        </button>
        <button onClick={onExit} style={btnSecondary}>&#8592; Torna agli strumenti</button>
      </div>
    );
  }

  return (
    <div>
      <div style={{ ...card, background: '#FEF6E2', borderColor: '#D4A017' }}>
        <div style={{ fontSize: 12.5, fontWeight: 800, color: '#8a6d00', marginBottom: 4 }}>IL PROBLEMA</div>
        <div style={{ fontSize: baseFont * 0.95, color: '#17203A' }}>{problem}</div>
      </div>
      <p style={{ fontSize: baseFont * 0.78, color: '#8a8a8a', marginBottom: 14, lineHeight: 1.4 }}>
        Cinque "perché" non garantiscono di arrivare alla causa vera — nei problemi complessi, di solito non esiste una sola causa da scoprire. Questo esercizio aiuta a esplorare possibili cause, non a dimostrarle.
      </p>
      {reasons.map((val, i) => {
        if (i > 0 && !reasons[i - 1].trim()) return null;
        return (
          <div key={i} style={card}>
            <div style={{ fontSize: baseFont * 0.95, fontWeight: 800, color: '#D4A017', marginBottom: 8 }}>
              Perché {i === 0 ? '' : 'è successo questo'}? <span style={{ color: '#c9a227' }}>({i + 1}/5)</span>
            </div>
            <input type="text" value={val} onChange={(e) => updateReason(i, e.target.value)}
              placeholder="Scrivi la causa immediata..." style={inputStyle} autoFocus={i === lastFilled + 1} />
          </div>
        );
      })}
      {lastFilled === 4 && (
        <div style={{ ...card, background: '#D4A017', color: '#fff' }}>
          <div style={{ fontSize: 12.5, fontWeight: 800, marginBottom: 6 }}>UNA POSSIBILE CAUSA PIÙ PROFONDA</div>
          <div style={{ fontSize: baseFont * 1.02, fontWeight: 600 }}>{reasons[4]}</div>
        </div>
      )}
      <button onClick={onExit} style={btnSecondary}>&#8592; Torna agli strumenti</button>
    </div>
  );
}

const OODA_PHASES = [
  { key: 'osserva', label: 'Osserva', prompt: 'Quali segnali hai disponibili adesso, senza ancora interpretarli?', color: '#1F4E8C' },
  { key: 'orienta', label: 'Orienta', prompt: 'Come si collegano questi segnali a quello che già sai o hai già vissuto?', color: '#2F8F5B' },
  { key: 'decidi', label: 'Decidi', prompt: 'Qual è l\u2019azione più ragionevole, con le informazioni che hai ora?', color: '#E67E22' },
  { key: 'agisci', label: 'Agisci', prompt: 'Cosa farai, concretamente? Il ciclo ricomincerà osservando l\u2019effetto di questa azione.', color: '#C0392B' },
];
function OODATool({ baseFont, onExit }) {
  const [round, setRound] = useState(1);
  const [idx, setIdx] = useState(0);
  const [history, setHistory] = useState([]);
  const [current, setCurrent] = useState({ osserva: '', orienta: '', decidi: '', agisci: '' });
  const phase = OODA_PHASES[idx];

  const updateField = (val) => setCurrent((prev) => ({ ...prev, [phase.key]: val }));
  const next = () => {
    if (idx < 3) { setIdx(idx + 1); return; }
    setHistory((h) => [...h, { round, ...current }]);
    setCurrent({ osserva: '', orienta: '', decidi: '', agisci: '' });
    setIdx(0);
    setRound((r) => r + 1);
  };

  return (
    <div>
      {history.length > 0 && (
        <div style={{ marginBottom: 16 }}>
          {history.map((h, i) => (
            <div key={i} style={{ fontSize: baseFont * 0.8, color: '#8a8a8a', marginBottom: 4 }}>
              Ciclo {h.round} completato — hai agito: "{h.agisci.slice(0, 60)}{h.agisci.length > 60 ? '\u2026' : ''}"
            </div>
          ))}
        </div>
      )}
      <div style={{ fontSize: 13, color: '#8a8a8a', fontWeight: 700, marginBottom: 8 }}>CICLO {round} — PASSO {idx + 1} DI 4</div>
      <div style={{ ...card, borderColor: phase.color }}>
        <div style={{ fontSize: baseFont * 1.2, fontWeight: 800, color: phase.color, marginBottom: 10 }}>{phase.label}</div>
        <p style={{ fontSize: baseFont * 0.92, color: '#2b2b2b', marginBottom: 14, lineHeight: 1.5 }}>{phase.prompt}</p>
        <textarea value={current[phase.key]} onChange={(e) => updateField(e.target.value)} rows={4} style={{ ...inputStyle, marginBottom: 0, resize: 'vertical' }} />
      </div>
      <div style={{ display: 'flex', justifyContent: 'space-between', gap: 12 }}>
        <button onClick={onExit} style={btnSecondary}>&#8592; Strumenti</button>
        <button onClick={next} style={btnPrimary(phase.color)}>{idx < 3 ? 'Avanti \u2192' : 'Agisci e ricomincia il ciclo'}</button>
      </div>
    </div>
  );
}

function MatriceTool({ baseFont, onExit }) {

      {options.some((o) => o.trim()) && criteria.some((c) => c.trim()) && (

                <tr key={oi}>
                  <td style={{ padding: 6, fontWeight: 700 }}>{opt}</td>

                    <td key={ci} style={{ padding: 6, textAlign: 'center' }}>

                    </td>
                  ))}
                  <td style={{ padding: 6, textAlign: 'center', fontWeight: 800, color: totals[oi] === maxTotal && maxTotal > 0 ? '#2F8F5B' : '#17203A' }}>

// ============ 13. COLORA E RESPIRA ============
function hexPoints(cx, cy, r) {
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const angle = (Math.PI / 180) * (60 * i - 30);
    pts.push(`${cx + r * Math.cos(angle)},${cy + r * Math.sin(angle)}`);
  }
  return pts.join(' ');
}
const PALETTE = ['#1F4E8C', '#2F8F5B', '#D4A017', '#C0392B', '#6B4FA0', '#E67E22', '#C2185B', '#3F7FBF', '#FBF6EE'];
function ColoringTool({ baseFont, onExit }) {
  const HEX_R = 26;
  const HEX_W = HEX_R * Math.sqrt(3);
  const HEX_H = HEX_R * 2;
  const COLS = 6, ROWS = 7;
  const [fills, setFills] = useState({});
  const [activeColor, setActiveColor] = useState(PALETTE[0]);
  const [secondsLeft, setSecondsLeft] = useState(10 * 60);
  const [running, setRunning] = useState(false);
  const intervalRef = useRef(null);

  useEffect(() => {
    if (!running) return;
    intervalRef.current = setInterval(() => {
      setSecondsLeft((s) => { if (s <= 1) { setRunning(false); return 0; } return s - 1; });
    }, 1000);
    return () => clearInterval(intervalRef.current);
  }, [running]);

  const hexes = [];
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const x = col * HEX_W + (row % 2 === 1 ? HEX_W / 2 : 0) + HEX_W;
      const y = row * (HEX_H * 0.75) + HEX_H / 2 + 10;
      hexes.push({ id: `h${row}-${col}`, cx: x, cy: y });
    }
  }
  const viewW = COLS * HEX_W + HEX_W + 10;
  const viewH = ROWS * HEX_H * 0.75 + HEX_H / 2 + 20;

  const paint = (id) => setFills((prev) => ({ ...prev, [id]: activeColor }));
  const reset = () => { setFills({}); setSecondsLeft(10 * 60); setRunning(false); };
  const mins = Math.floor(secondsLeft / 60);
  const secs = secondsLeft % 60;

  return (
    <div>
      <div style={{ ...card, textAlign: 'center' }}>
        <p style={{ fontSize: baseFont * 0.85, color: '#5b5b5b', marginBottom: 16, lineHeight: 1.5 }}>
          Scegli un colore, poi tocca le celle per colorarle. Non c’è un modo giusto di farlo.
        </p>
        <svg viewBox={`0 0 ${viewW} ${viewH}`} width="100%" style={{ maxWidth: 320, margin: '0 auto', display: 'block' }}>
          {hexes.map((h) => (
            <polygon key={h.id} points={hexPoints(h.cx, h.cy, HEX_R - 1.5)} fill={fills[h.id] || '#fff'} stroke="#d8d2bf" strokeWidth="1"
              onClick={() => paint(h.id)} style={{ cursor: 'pointer' }} />
          ))}
        </svg>
        <div style={{ display: 'flex', gap: 8, justifyContent: 'center', flexWrap: 'wrap', marginTop: 18, marginBottom: 16 }}>
          {PALETTE.map((c) => (
            <button key={c} onClick={() => setActiveColor(c)} aria-label={`Scegli colore ${c}`}
              style={{ width: 32, height: 32, borderRadius: '50%', background: c, border: activeColor === c ? '3px solid #17203A' : '1.5px solid #d8d2bf', cursor: 'pointer' }} />
          ))}
        </div>
        <div style={{ fontSize: baseFont * 1.1, fontWeight: 800, color: '#17203A', marginBottom: 12 }}>
          {String(mins).padStart(2, '0')}:{String(secs).padStart(2, '0')}
        </div>
        <div style={{ display: 'flex', gap: 10, justifyContent: 'center' }}>
          {!running
            ? <button onClick={() => setRunning(true)} style={btnPrimary('#6B4FA0')}>{secondsLeft < 10 * 60 ? 'Riprendi' : 'Inizia il timer'}</button>
            : <button onClick={() => setRunning(false)} style={btnSecondary}>Pausa</button>}
          <button onClick={reset} style={btnSecondary}>Ricomincia</button>
        </div>
      </div>
      <p style={{ fontSize: baseFont * 0.78, color: '#8a8a8a', textAlign: 'center', marginBottom: 16, lineHeight: 1.5 }}>
        La ricerca associa il colorare uno schema strutturato come questo a una riduzione dell’ansia nel breve termine — non è specifico di una forma in particolare, ma dell’avere contorni già dati, senza dover decidere cosa disegnare.
      </p>
      <button onClick={onExit} style={btnSecondary}>&#8592; Torna agli strumenti</button>
    </div>
  );
}

// ============ 15. CHE TIPO DI PROBLEMA È? (ALBERO PER SCEGLIERE IL METODO) ============
function DecisionTreeTool({ baseFont, onExit }) {
  const [step, setStep] = useState(0);
  const [answers, setAnswers] = useState([]);

  const questions = [
    { q: 'Il problema riguarda soprattutto un fatto verificabile, o un\u2019interpretazione/opinione?', a: 'Un fatto verificabile', b: 'Un\u2019interpretazione o un\u2019opinione' },
    { q: 'Coinvolge altre persone con cui devi arrivare a un accordo, o è una questione che riguarda solo te?', a: 'Altre persone, serve un accordo', b: 'Riguarda solo me' },
    { q: 'Hai già un\u2019idea di causa, o sei ancora nel buio su cosa stia succedendo?', a: 'Ho già un\u2019idea da verificare', b: 'Sono ancora nel buio' },
  ];

  const results = {
    'a-a-a': { title: 'Verifica dei fatti', tools: ['Laboratorio ipotesi', 'Schema SOAP'], nota: 'Hai già una spiegazione plausibile: il passo giusto è metterla alla prova con le prove, non cercarne un\u2019altra.' },
    'a-a-b': { title: 'Ricerca delle cause', tools: ['I 5 Perché', 'Diagramma di Ishikawa'], nota: 'Manca ancora una spiegazione chiara: questi strumenti aiutano a risalire dal sintomo alla causa.' },
    'a-b-a': { title: 'Negoziazione basata sui fatti', tools: ['Comunicazione Nonviolenta', 'Schema SOAP'], nota: 'C\u2019è un fatto da chiarire insieme ad altri: separare l\u2019osservazione dall\u2019interpretazione è il primo passo.' },
    'a-b-b': { title: 'Confronto collaborativo', tools: ['Comunicazione Nonviolenta', 'I 5 Perché'], nota: 'Prima di negoziare una soluzione, può servire capire insieme cosa sta succedendo davvero.' },
    'b-a-a': { title: 'Decisione personale', tools: ['Matrice decisionale', 'Cerchio di controllo e influenza'], nota: 'Hai già un\u2019opzione in mente: confrontarla con criteri chiari aiuta a decidere con più sicurezza.' },
    'b-a-b': { title: 'Chiarire prima di decidere', tools: ['Ristrutturazione cognitiva', 'Cerchio di controllo e influenza'], nota: 'Prima di scegliere, può aiutare capire quanto di questo dipende davvero da te.' },
    'b-b-a': { title: 'Confronto su un\u2019interpretazione condivisa', tools: ['Comunicazione Nonviolenta', 'Matrice decisionale'], nota: 'Il disaccordo riguarda un\u2019interpretazione, non un fatto: ascoltare prima di proporre soluzioni.' },
    'b-b-b': { title: 'Esplorazione aperta', tools: ['I 5 Perché', 'Comunicazione Nonviolenta'], nota: 'Situazione ancora poco chiara e che coinvolge altri: partire dalle domande, non dalle soluzioni.' },
  };

  const pick = (choice) => {
    const next = [...answers, choice];
    setAnswers(next);
    setStep(step + 1);
  };
  const reset = () => { setAnswers([]); setStep(0); };
  const key = answers.join('-');
  const result = results[key];

  return (
    <div>
      <div style={card}>
        {step < questions.length ? (
          <>
            <div style={{ fontSize: 12.5, fontWeight: 800, color: '#1F4E8C', marginBottom: 10 }}>PASSO {step + 1} DI {questions.length}</div>
            <p style={{ fontSize: baseFont * 1.02, lineHeight: 1.5, marginBottom: 20 }}>{questions[step].q}</p>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              <button onClick={() => pick('a')} style={btnPrimary('#1F4E8C')}>{questions[step].a}</button>
              <button onClick={() => pick('b')} style={btnPrimary('#1F4E8C')}>{questions[step].b}</button>
            </div>
          </>
        ) : result ? (
          <>
            <div style={{ fontSize: 12.5, fontWeight: 800, color: '#1F4E8C', marginBottom: 10 }}>UNA PRIMA PISTA DA ESPLORARE</div>
            <p style={{ fontSize: baseFont * 1.1, fontWeight: 800, marginBottom: 10 }}>{result.title}</p>
            <p style={{ fontSize: baseFont * 0.9, lineHeight: 1.5, color: '#5b5b5b', marginBottom: 10 }}>{result.nota}</p>
            <p style={{ fontSize: baseFont * 0.8, lineHeight: 1.5, color: '#8a8a8a', marginBottom: 14, fontStyle: 'italic' }}>Questa è una classificazione orientativa, non diagnostica: un problema reale può appartenere a più categorie insieme, e richiedere più strumenti diversi.</p>
            <div style={{ fontSize: 12.5, fontWeight: 800, color: '#8a8a8a', marginBottom: 8 }}>STRUMENTI SUGGERITI</div>
            {result.tools.map((t, i) => (
              <div key={i} style={{ padding: '10px 14px', background: '#F5F1E6', borderRadius: 10, marginBottom: 8, fontSize: baseFont * 0.92 }}>{t}</div>
            ))}
            <button onClick={reset} style={{ ...btnSecondary, marginTop: 10 }}>Ricomincia</button>
          </>
        ) : null}
      </div>
      <button onClick={onExit} style={btnSecondary}>&#8592; Torna agli strumenti</button>
    </div>
  );
}

  );

function ExpressiveWritingTool({ baseFont, onExit }) {
  const [text, setText] = useState('');
  const [seconds, setSeconds] = useState(15 * 60);
  const [running, setRunning] = useState(false);
  const intervalRef = useRef(null);

  useEffect(() => {
    if (!running) return;
    intervalRef.current = setInterval(() => {
      setSeconds((s) => { if (s <= 1) { setRunning(false); return 0; } return s - 1; });
    }, 1000);
    return () => clearInterval(intervalRef.current);
  }, [running]);

  const mins = Math.floor(seconds / 60);
  const secs = seconds % 60;
  const reset = () => { setSeconds(15 * 60); setRunning(false); };

  return (
    <div>
      <div style={card}>
        <p style={{ fontSize: baseFont * 0.85, color: '#5b5b5b', marginBottom: 12, lineHeight: 1.5 }}>
          Scrivi senza fermarti a correggere, per te stesso — non per essere letto. Racconta cosa è successo, cosa provi davvero, e come si collega ad altri momenti della tua vita. La ricerca associa questa pratica, ripetuta nel tempo, a un miglioramento del benessere — non a un sollievo immediato: alcune persone si sentono più agitate subito dopo aver scritto, prima di sentirsi meglio.
        </p>
        <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 14 }}>
          <div style={{ fontSize: baseFont * 1.1, fontWeight: 800, color: '#6B4FA0' }}>{String(mins).padStart(2, '0')}:{String(secs).padStart(2, '0')}</div>
          {!running
            ? <button onClick={() => setRunning(true)} style={btnPrimary('#6B4FA0')}>{seconds < 15 * 60 ? 'Riprendi' : 'Inizia il timer'}</button>
            : <button onClick={() => setRunning(false)} style={btnSecondary}>Pausa</button>}
          <button onClick={reset} style={btnSecondary}>Ricomincia</button>
        </div>
        <textarea value={text} onChange={(e) => setText(e.target.value)} placeholder="Comincia a scrivere..."
          style={{ ...inputStyle, minHeight: 220, resize: 'vertical', marginBottom: 0, fontFamily: 'inherit' }} />
      </div>
      <p style={{ fontSize: baseFont * 0.78, color: '#8a8a8a', textAlign: 'center', marginBottom: 16 }}>
        Questo strumento non salva né invia quello che scrivi: il testo esiste solo mentre questa pagina resta aperta e sparisce quando la chiudi. Se usi un dispositivo condiviso, considera che il browser potrebbe comunque conservare tracce nella cronologia o nella cache.
      </p>
      <button onClick={onExit} style={btnSecondary}>&#8592; Torna agli strumenti</button>
    </div>
  );
}

// ============ 28. TEMPO PER PREOCCUPARSI ============
function WorryTimeTool({ baseFont, onExit }) {
  const [worries, setWorries] = useState([]);
  const [draft, setDraft] = useState('');
  const [phase, setPhase] = useState('cattura'); // 'cattura' | 'finestra'
  const [secondsLeft, setSecondsLeft] = useState(20 * 60);
  const [running, setRunning] = useState(false);
  const intervalRef = useRef(null);

  useEffect(() => {
    if (!running) return;
    intervalRef.current = setInterval(() => {
      setSecondsLeft((s) => { if (s <= 1) { setRunning(false); return 0; } return s - 1; });
    }, 1000);
    return () => clearInterval(intervalRef.current);
  }, [running]);

  const addWorry = () => {
    if (!draft.trim()) return;
    setWorries((p) => [...p, { id: Date.now(), text: draft.trim(), note: '', done: false }]);
    setDraft('');
  };
  const removeWorry = (id) => setWorries((p) => p.filter((w) => w.id !== id));
  const updateNote = (id, note) => setWorries((p) => p.map((w) => (w.id === id ? { ...w, note } : w)));
  const toggleDone = (id) => setWorries((p) => p.map((w) => (w.id === id ? { ...w, done: !w.done } : w)));
  const resetAll = () => { setWorries([]); setPhase('cattura'); setSecondsLeft(20 * 60); setRunning(false); };

  const mins = Math.floor(secondsLeft / 60);
  const secs = secondsLeft % 60;

  return (
    <div>
      <div style={card}>
        <p style={{ fontSize: baseFont * 0.85, color: '#5b5b5b', marginBottom: 0, lineHeight: 1.5 }}>
          Quando una preoccupazione arriva, non provare a risolverla subito: scrivila qui e rimandala a un momento dedicato. La ricerca mostra che spostare il momento in cui ci si pensa davvero — senza sopprimerla — riduce quanto spesso e quanto a lungo torna nel resto della giornata.
        </p>
      </div>

      {phase === 'cattura' && (
        <>
          <div style={card}>
            <div style={{ fontSize: 12.5, fontWeight: 800, color: '#3F7FBF', marginBottom: 10 }}>CATTURA</div>
            <input value={draft} onChange={(e) => setDraft(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && addWorry()}
              placeholder="Cosa ti sta preoccupando in questo momento?" style={inputStyle} />
            <button onClick={addWorry} style={btnPrimary('#3F7FBF')}>Aggiungi e rimanda</button>
          </div>

          {worries.length > 0 && (
            <div style={card}>
              <div style={{ fontSize: 12.5, fontWeight: 800, color: '#8a8a8a', marginBottom: 10 }}>IN ATTESA ({worries.length})</div>
              {worries.map((w) => (
                <div key={w.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '8px 0', borderBottom: '1px solid #f0ece0' }}>
                  <span style={{ fontSize: baseFont * 0.9 }}>{w.text}</span>
                  <button onClick={() => removeWorry(w.id)} style={{ background: 'none', border: 'none', color: '#bbb', cursor: 'pointer', fontSize: 18 }}>&#215;</button>
                </div>
              ))}
            </div>
          )}

          <button onClick={() => setPhase('finestra')} disabled={worries.length === 0}
            style={{ ...btnPrimary(worries.length === 0 ? '#c9c2ab' : '#D4A017'), width: '100%', marginBottom: 16, cursor: worries.length === 0 ? 'not-allowed' : 'pointer' }}>
            Apri la finestra dedicata &#8594;
          </button>
        </>
      )}

      {phase === 'finestra' && (
        <>
          <div style={{ ...card, textAlign: 'center' }}>
            <div style={{ fontSize: baseFont * 1.1, fontWeight: 800, color: '#17203A', marginBottom: 12 }}>
              {String(mins).padStart(2, '0')}:{String(secs).padStart(2, '0')}
            </div>
            <div style={{ display: 'flex', gap: 10, justifyContent: 'center' }}>
              {!running
                ? <button onClick={() => setRunning(true)} style={btnPrimary('#D4A017')}>{secondsLeft < 20 * 60 ? 'Riprendi' : 'Inizia la finestra'}</button>
                : <button onClick={() => setRunning(false)} style={btnSecondary}>Pausa</button>}
            </div>
          </div>

          <div style={{ fontSize: 12.5, fontWeight: 800, color: '#8a8a8a', margin: '20px 0 10px 0' }}>ORA, UNA ALLA VOLTA</div>
          {worries.map((w) => (
            <div key={w.id} style={{ ...card, opacity: w.done ? 0.55 : 1 }}>
              <label style={{ display: 'flex', alignItems: 'flex-start', gap: 10, marginBottom: 10, cursor: 'pointer' }}>
                <input type="checkbox" checked={w.done} onChange={() => toggleDone(w.id)} style={{ width: 18, height: 18, marginTop: 2, flexShrink: 0 }} />
                <span style={{ fontSize: baseFont * 0.92, fontWeight: 700, textDecoration: w.done ? 'line-through' : 'none' }}>{w.text}</span>
              </label>
              <textarea value={w.note} onChange={(e) => updateNote(w.id, e.target.value)}
                placeholder="Cosa noti ora, pensandoci davvero? È ancora urgente come sembrava?"
                style={{ ...inputStyle, minHeight: 50, resize: 'vertical', marginBottom: 0 }} />
            </div>
          ))}

          <button onClick={() => setPhase('cattura')} style={{ ...btnSecondary, width: '100%', marginBottom: 16 }}>&#8592; Torna a catturare</button>
        </>
      )}

      <button onClick={resetAll} style={{ ...btnSecondary, width: '100%', marginBottom: 16 }}>Ricomincia da domani</button>
      <button onClick={onExit} style={btnSecondary}>&#8592; Torna agli strumenti</button>
    </div>
  );
}

// ============ 29. RISOLVERE UN PROBLEMA, PASSO DOPO PASSO ============
function ProblemSolvingTool({ baseFont, onExit }) {
  const [problem, setProblem] = useState('');
  const [goal, setGoal] = useState('');
  const [alternatives, setAlternatives] = useState(['', '']);
  const [evaluation, setEvaluation] = useState({});
  const [chosen, setChosen] = useState(null);
  const [plan, setPlan] = useState('');
  const [checkDate, setCheckDate] = useState('');

  const updateAlt = (i, val) => { const c = [...alternatives]; c[i] = val; setAlternatives(c); };
  const addAlt = () => setAlternatives([...alternatives, '']);
  const removeAlt = (i) => {
    setAlternatives(alternatives.filter((_, idx) => idx !== i));
    if (chosen === i) setChosen(null);
  };
  const updateEval = (i, val) => setEvaluation((p) => ({ ...p, [i]: val }));

  return (
    <div>
      <div style={card}>
        <p style={{ fontSize: baseFont * 0.85, color: '#5b5b5b', marginBottom: 0, lineHeight: 1.5 }}>
          Un metodo in quattro passi, con decenni di studi controllati alle spalle: definire il problema con precisione, generare più alternative possibili senza giudicarle, valutarle e sceglierne una, poi verificare se ha funzionato davvero.
        </p>
      </div>

      <div style={{ ...card, borderColor: '#2F8F5B' }}>
        <div style={{ fontSize: 12.5, fontWeight: 800, color: '#2F8F5B', marginBottom: 8 }}>1. DEFINISCI IL PROBLEMA</div>
        <p style={{ fontSize: baseFont * 0.8, color: '#8a8a8a', marginBottom: 10 }}>Con precisione: cosa, esattamente — chi è coinvolto, quando succede. Non "va tutto male", ma il fatto specifico.</p>
        <textarea value={problem} onChange={(e) => setProblem(e.target.value)} placeholder="Il problema, con precisione, è..."
          style={{ ...inputStyle, minHeight: 55, resize: 'vertical' }} />
        <p style={{ fontSize: baseFont * 0.8, color: '#8a8a8a', marginBottom: 10, marginTop: 4 }}>Se questo problema fosse risolto, cosa sarebbe diverso? Cosa vuoi ottenere, in concreto?</p>
        <textarea value={goal} onChange={(e) => setGoal(e.target.value)} placeholder="Voglio arrivare a..."
          style={{ ...inputStyle, minHeight: 45, resize: 'vertical', marginBottom: 0 }} />
      </div>

      <div style={{ ...card, borderColor: '#D4A017' }}>
        <div style={{ fontSize: 12.5, fontWeight: 800, color: '#D4A017', marginBottom: 8 }}>2. GENERA ALTERNATIVE</div>
        <p style={{ fontSize: baseFont * 0.8, color: '#8a8a8a', marginBottom: 10 }}>Quante più possibili, anche quelle che sembrano poco realistiche — non scartare nulla ora, solo elenca.</p>
        {alternatives.map((a, i) => (
          <div key={i} style={{ display: 'flex', gap: 8, marginBottom: 8 }}>
            <input value={a} onChange={(e) => updateAlt(i, e.target.value)} style={{ ...inputStyle, marginBottom: 0 }} placeholder={`Alternativa ${i + 1}`} />
            {alternatives.length > 2 && <button onClick={() => removeAlt(i)} style={{ background: 'none', border: 'none', color: '#bbb', cursor: 'pointer', fontSize: 20 }}>&#215;</button>}
          </div>
        ))}
        <button onClick={addAlt} style={btnSecondary}>+ Aggiungi alternativa</button>
      </div>

      <div style={{ ...card, borderColor: '#1F4E8C' }}>
        <div style={{ fontSize: 12.5, fontWeight: 800, color: '#1F4E8C', marginBottom: 8 }}>3. VALUTA E SCEGLI</div>
        <p style={{ fontSize: baseFont * 0.8, color: '#8a8a8a', marginBottom: 10 }}>Per ciascuna, un pro e un contro. Poi scegli quella che ti sembra più praticabile — non deve essere perfetta.</p>
        {alternatives.filter((a) => a.trim()).map((a, i) => (
          <div key={i} style={{ marginBottom: 12, padding: 12, background: chosen === i ? '#EAF1FC' : '#F5F1E6', borderRadius: 10, border: chosen === i ? '2px solid #1F4E8C' : '1px solid #e5dfc9' }}>
            <p style={{ fontSize: baseFont * 0.88, fontWeight: 700, margin: '0 0 8px 0' }}>{a}</p>
            <input value={evaluation[i] || ''} onChange={(e) => updateEval(i, e.target.value)} style={{ ...inputStyle, marginBottom: 8 }} placeholder="Pro e contro di questa opzione..." />
            <button onClick={() => setChosen(i)} style={{ ...btnSecondary, borderColor: '#1F4E8C', color: '#1F4E8C', padding: '6px 14px', fontSize: baseFont * 0.82 }}>
              {chosen === i ? '\u2713 Scelta' : 'Scegli questa'}
            </button>
          </div>
        ))}
      </div>

      <div style={{ ...card, background: '#17203A' }}>
        <div style={{ fontSize: 12.5, fontWeight: 800, color: '#b8c0d4', marginBottom: 8 }}>4. IMPLEMENTA E VERIFICA</div>
        <p style={{ fontSize: baseFont * 0.85, color: '#b8c0d4', marginBottom: 10, lineHeight: 1.5 }}>Qual è il primo passo concreto, e quando lo farai?</p>
        <textarea value={plan} onChange={(e) => setPlan(e.target.value)} placeholder="Il primo passo è..."
          style={{ ...inputStyle, minHeight: 50, resize: 'vertical' }} />
        <p style={{ fontSize: baseFont * 0.8, color: '#b8c0d4', marginBottom: 10 }}>Quando controllerai se ha funzionato?</p>
        <input value={checkDate} onChange={(e) => setCheckDate(e.target.value)} style={{ ...inputStyle, marginBottom: 0 }} placeholder="Es. tra una settimana, venerdì prossimo..." />
      </div>
      <button onClick={onExit} style={btnSecondary}>&#8592; Torna agli strumenti</button>
    </div>
  );
}

function StimulusControlTool({ baseFont, onExit }) {
  const rules = [
    { id: 'r1', text: 'Vai a letto solo quando hai sonno, non solo perché è \u201cl\u2019ora\u201d', help: 'Sonnolenza reale, non stanchezza generica: gli occhi che si chiudono da soli.' },
    { id: 'r2', text: 'Usa il letto solo per dormire (e per l\u2019intimità) \u2014 non telefono, TV, lettura', help: 'Ogni altra attività a letto insegna al cervello ad associarlo alla veglia, non al sonno.' },
    { id: 'r3', text: 'Se non ti addormenti entro 15-20 minuti, alzati e vai in un\u2019altra stanza', help: 'Torna a letto solo quando il sonno arriva davvero \u2014 senza guardare l\u2019ora.' },
    { id: 'r4', text: 'Ripeti il passo precedente tutte le volte che serve durante la notte', help: 'Anche più volte, se necessario \u2014 il principio è lo stesso ogni volta.' },
    { id: 'r5', text: 'Sveglia alla stessa ora ogni mattina, indipendentemente da quanto hai dormito', help: 'Anche dopo una notte difficile \u2014 è ciò che ricostruisce un ritmo stabile.' },

  const [checks, setChecks] = useState({});
  const [nights, setNights] = useState(0);

  const toggle = (id) => setChecks((p) => ({ ...p, [id]: !p[id] }));

  return (

        <p style={{ fontSize: baseFont * 0.85, color: '#5b5b5b', marginBottom: 0, lineHeight: 1.5 }}>

        </p>
      </div>

      <div style={card}>
        <div style={{ fontSize: 12.5, fontWeight: 800, color: '#6B4FA0', marginBottom: 10 }}>QUESTA NOTTE, COSA HAI SEGUITO?</div>

          <label key={r.id} style={{ display: 'flex', alignItems: 'flex-start', gap: 10, marginBottom: 12, cursor: 'pointer' }}>

            <span>
              <div style={{ fontSize: baseFont * 0.9 }}>{r.text}</div>
              <div style={{ fontSize: baseFont * 0.76, color: '#8a8a8a' }}>{r.help}</div>
            </span>
          </label>
        ))}

        <button onClick={logNight} style={btnPrimary('#6B4FA0')}>Registra questa notte</button>
      </div>

      <div style={{ ...card, textAlign: 'center' }}>
        <div style={{ fontSize: baseFont * 1.3, fontWeight: 800, color: '#17203A' }}>{nights}</div>
        <p style={{ fontSize: baseFont * 0.85, color: '#8a8a8a', margin: 0 }}>notti registrate finora</p>
      </div>

      <button onClick={reset} style={{ ...btnSecondary, width: '100%', marginBottom: 16 }}>Ricomincia il conteggio</button>
      <button onClick={onExit} style={btnSecondary}>&#8592; Torna agli strumenti</button>
    </div>
  );

// ============ 34. MOMENTI DI SVOLTA (PER DUE PERSONE) ============
function TurningTowardTool({ baseFont, onExit }) {
  const [nameA, setNameA] = useState('');
  const [nameB, setNameB] = useState('');
  const [moments, setMoments] = useState([]);
  const [draft, setDraft] = useState('');
  const [draftWho, setDraftWho] = useState('A');
  const [phase, setPhase] = useState('setup'); // 'setup' | 'conversazione' | 'gesti'

  const conversationPrompts = [
    { label: 'PER CHI HA SCOPERTO', text: 'Cosa senti in questo momento, con le tue parole \u2014 senza doverlo giustificare o minimizzare?' },
    { label: 'PER CHI HA TRADITO', text: 'Cosa capisci, ora, di cosa ha significato questo per l\u2019altra persona \u2014 non cosa avresti voluto che significasse?' },
    { label: 'INSIEME', text: 'La ricostruzione, se la desiderate entrambi, non parte da una singola grande promessa: parte da piccoli gesti ripetuti nel tempo. Quali gesti concreti, non parole, potrebbero cominciare a costruirla?' },
  ];

  const addMoment = () => {
    if (!draft.trim()) return;
    setMoments((p) => [{ id: Date.now(), who: draftWho, text: draft.trim() }, ...p]);
    setDraft('');
  };
  const removeMoment = (id) => setMoments((p) => p.filter((m) => m.id !== id));

  if (phase === 'setup') {
    return (
      <div>
        <div style={card}>
          <p style={{ fontSize: baseFont * 0.85, color: '#5b5b5b', marginBottom: 16, lineHeight: 1.5 }}>
            Questo strumento è pensato per essere usato insieme, non da soli. La fiducia, dopo un tradimento, non si ripara con una singola grande dichiarazione: si accumula attraverso piccoli gesti quotidiani in cui una persona si volta verso l’altra invece che allontanarsene, ripetuti con costanza nel tempo.
          </p>
          <input value={nameA} onChange={(e) => setNameA(e.target.value)} placeholder="Il tuo nome" style={inputStyle} />
          <input value={nameB} onChange={(e) => setNameB(e.target.value)} placeholder="Il nome dell'altra persona" style={{ ...inputStyle, marginBottom: 0 }} />
        </div>
        <button onClick={() => setPhase('conversazione')} disabled={!nameA.trim() || !nameB.trim()}
          style={{ ...btnPrimary(!nameA.trim() || !nameB.trim() ? '#c9c2ab' : '#C2185B'), width: '100%', marginBottom: 16 }}>
          Comincia
        </button>
        <button onClick={onExit} style={btnSecondary}>&#8592; Torna agli strumenti</button>
      </div>
    );
  }

  return (
    <div>
      <div style={{ display: 'flex', gap: 8, marginBottom: 16 }}>
        <button onClick={() => setPhase('conversazione')} style={phase === 'conversazione' ? btnPrimary('#C2185B') : btnSecondary}>Conversazione guidata</button>
        <button onClick={() => setPhase('gesti')} style={phase === 'gesti' ? btnPrimary('#C2185B') : btnSecondary}>Gesti notati</button>
      </div>

      {phase === 'conversazione' && conversationPrompts.map((p, i) => (
        <div key={i} style={card}>
          <div style={{ fontSize: 12.5, fontWeight: 800, color: '#C2185B', marginBottom: 8 }}>{p.label}</div>
          <p style={{ fontSize: baseFont * 0.85, color: '#5b5b5b', marginBottom: 10, lineHeight: 1.5 }}>{p.text}</p>
          <textarea placeholder={`Note di ${nameA}...`} style={{ ...inputStyle, minHeight: 50, resize: 'vertical' }} />
          <textarea placeholder={`Note di ${nameB}...`} style={{ ...inputStyle, minHeight: 50, resize: 'vertical', marginBottom: 0 }} />
        </div>
      ))}

      {phase === 'gesti' && (
        <>
          <div style={card}>
            <p style={{ fontSize: baseFont * 0.85, color: '#5b5b5b', marginBottom: 14, lineHeight: 1.5 }}>
              Annotate insieme, nel tempo, i piccoli gesti concreti che notate — da entrambe le parti. Non promesse: gesti già accaduti.
            </p>
            <textarea value={draft} onChange={(e) => setDraft(e.target.value)} placeholder="Un gesto concreto che hai notato..."
              style={{ ...inputStyle, minHeight: 45, resize: 'vertical' }} />
            <div style={{ display: 'flex', gap: 8, marginBottom: 12 }}>
              <button onClick={() => setDraftWho('A')} style={{ ...btnSecondary, borderColor: draftWho === 'A' ? '#C2185B' : '#d8d2bf', color: draftWho === 'A' ? '#C2185B' : '#5b5b5b', fontWeight: draftWho === 'A' ? 800 : 600 }}>
                {nameA || 'Persona A'}
              </button>
              <button onClick={() => setDraftWho('B')} style={{ ...btnSecondary, borderColor: draftWho === 'B' ? '#C2185B' : '#d8d2bf', color: draftWho === 'B' ? '#C2185B' : '#5b5b5b', fontWeight: draftWho === 'B' ? 800 : 600 }}>
                {nameB || 'Persona B'}
              </button>
            </div>
            <button onClick={addMoment} style={btnPrimary('#C2185B')}>Aggiungi</button>
          </div>

          {moments.length === 0 ? (
            <p style={{ fontSize: baseFont * 0.85, color: '#bbb', fontStyle: 'italic', textAlign: 'center' }}>Ancora nessun gesto registrato.</p>
          ) : (
            moments.map((m) => (
              <div key={m.id} style={{ ...card, display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                <div>
                  <div style={{ fontSize: 11.5, fontWeight: 800, color: '#C2185B', marginBottom: 4 }}>{m.who === 'A' ? (nameA || 'Persona A') : (nameB || 'Persona B')}</div>
                  <div style={{ fontSize: baseFont * 0.9 }}>{m.text}</div>
                </div>
                <button onClick={() => removeMoment(m.id)} style={{ background: 'none', border: 'none', color: '#bbb', cursor: 'pointer', fontSize: 18 }}>&#215;</button>
              </div>
            ))
          )}
        </>
      )}
      <button onClick={onExit} style={{ ...btnSecondary, marginTop: 8 }}>&#8592; Torna agli strumenti</button>
    </div>
  );
}

// ============ 36. AUTOTEST, NON RILETTURA ============
function AutotestTool({ baseFont, onExit }) {
  const [argomenti, setArgomenti] = useState([
    { argomento: '', ricordato: '', controllato: false, perso: '' },
  ]);

  const update = (i, field, val) => {
    const c = [...argomenti];
    c[i] = { ...c[i], [field]: val };
    setArgomenti(c);
  };
  const add = () => setArgomenti([...argomenti, { argomento: '', ricordato: '', controllato: false, perso: '' }]);
  const remove = (i) => setArgomenti(argomenti.filter((_, idx) => idx !== i));

  return (
    <div>
      <div style={card}>
        <p style={{ fontSize: baseFont * 0.85, color: '#5b5b5b', marginBottom: 0, lineHeight: 1.5 }}>
          Chiudi il libro o gli appunti prima di scrivere, non dopo. Chi si autotesta ricorda di più a distanza di tempo di chi rilegge ripetutamente — anche se rileggere fa sentire più preparati.
        </p>
      </div>
      {argomenti.map((a, i) => (
        <div key={i} style={card}>
          <div style={{ fontSize: 12.5, fontWeight: 800, color: '#3F7FBF', marginBottom: 8 }}>ARGOMENTO {i + 1}</div>
          <input value={a.argomento} onChange={(e) => update(i, 'argomento', e.target.value)}
            placeholder="Che argomento stai testando?" style={inputStyle} />
          <label style={{ display: 'block', fontSize: baseFont * 0.85, fontWeight: 700, marginBottom: 6, color: '#17203A' }}>
            Prima di guardare: cosa ricordi?
          </label>
          <textarea value={a.ricordato} onChange={(e) => update(i, 'ricordato', e.target.value)}
            placeholder="Scrivi tutto quello che ti viene in mente, anche a pezzi, anche se non sei sicuro." rows={4}
            style={{ ...inputStyle, resize: 'vertical', marginBottom: 12 }} />
          <label style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: baseFont * 0.9, cursor: 'pointer', marginBottom: 10 }}>
            <input type="checkbox" checked={a.controllato} onChange={(e) => update(i, 'controllato', e.target.checked)} style={{ width: 18, height: 18 }} />
            Ho controllato gli appunti
          </label>
          {a.controllato && (
            <>
              <label style={{ display: 'block', fontSize: baseFont * 0.85, fontWeight: 700, marginBottom: 6, color: '#17203A' }}>
                Cosa ti eri perso, o ricordato in modo impreciso?
              </label>
              <textarea value={a.perso} onChange={(e) => update(i, 'perso', e.target.value)}
                placeholder="Questo è il punto su cui vale la pena tornare — non tutto il resto." rows={3}
                style={{ ...inputStyle, resize: 'vertical', marginBottom: 0 }} />
            </>
          )}
          {argomenti.length > 1 && <button onClick={() => remove(i)} style={{ ...btnSecondary, marginTop: 10 }}>Rimuovi</button>}
        </div>
      ))}
      <button onClick={add} style={{ ...btnSecondary, marginBottom: 16 }}>+ Aggiungi argomento</button>
      <button onClick={onExit} style={btnSecondary}>&#8592; Torna agli strumenti</button>
    </div>
  );
}

// ============ 37. PIANO DI STUDIO DISTRIBUITO ============
function StudyPlanTool({ baseFont, onExit }) {
  const [dataProva, setDataProva] = useState('');
  const [argomentiTesto, setArgomentiTesto] = useState('');
  const [piano, setPiano] = useState(null);

  const generaPiano = () => {
    if (!dataProva) return;
    const argomenti = argomentiTesto.split('\n').map((a) => a.trim()).filter(Boolean);
    if (argomenti.length === 0) return;

    const oggi = new Date(); oggi.setHours(0, 0, 0, 0);
    const prova = new Date(dataProva); prova.setHours(0, 0, 0, 0);
    const giorniTotali = Math.round((prova - oggi) / (1000 * 60 * 60 * 24));

    if (giorniTotali <= 0) { setPiano({ errore: 'La data inserita non è nel futuro.' }); return; }
    if (giorniTotali < argomenti.length) {
      setPiano({ errore: `Hai ${argomenti.length} argomenti ma solo ${giorniTotali} giorni: prova a raggruppare qualche argomento insieme, o considera se serve rimandare la prova.` });
      return;
    }

    // Prima passata: distribuisco ogni argomento una volta, nel primo 60% del tempo (min. 1 giorno)
    const giorniPrimaPassata = Math.max(argomenti.length, Math.round(giorniTotali * 0.6));
    const passo1 = Math.max(1, Math.floor(giorniPrimaPassata / argomenti.length));
    const sessioni = [];
    argomenti.forEach((arg, i) => {
      const giorno = Math.min(i * passo1 + 1, giorniPrimaPassata);
      sessioni.push({ giorno, tipo: 'Prima volta', argomento: arg });
    });

    // Seconda passata: ripasso distanziato degli stessi argomenti, nel tempo restante
    const giorniRipasso = giorniTotali - giorniPrimaPassata;
    if (giorniRipasso > 0) {
      const passo2 = Math.max(1, Math.floor(giorniRipasso / argomenti.length));
      argomenti.forEach((arg, i) => {
        const giorno = Math.min(giorniPrimaPassata + i * passo2 + 1, giorniTotali - 1);
        sessioni.push({ giorno, tipo: 'Ripasso (autotest)', argomento: arg });
      });
    }
    sessioni.sort((a, b) => a.giorno - b.giorno);

    const conData = sessioni.map((s) => {
      const d = new Date(oggi); d.setDate(d.getDate() + s.giorno);
      return { ...s, data: d.toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short' }) };
    });
    setPiano({ sessioni: conData, giorniTotali });
  };

  return (
    <div>
      <div style={card}>
        <p style={{ fontSize: baseFont * 0.85, color: '#5b5b5b', marginBottom: 0, lineHeight: 1.5 }}>
          Sessioni brevi e distanziate nel tempo producono una memoria più stabile di un'unica maratona di studio, anche a parità di ore totali — e chiedono meno, momento per momento, a una mente già affaticata dall'ansia.
        </p>
      </div>
      {!piano ? (
        <>
          <div style={card}>
            <label style={{ display: 'block', fontSize: baseFont * 0.9, fontWeight: 700, marginBottom: 8, color: '#17203A' }}>
              Data della prova
            </label>
            <input type="date" value={dataProva} onChange={(e) => setDataProva(e.target.value)} style={inputStyle} />
            <label style={{ display: 'block', fontSize: baseFont * 0.9, fontWeight: 700, marginBottom: 8, color: '#17203A' }}>
              Argomenti da preparare (uno per riga)
            </label>
            <textarea value={argomentiTesto} onChange={(e) => setArgomentiTesto(e.target.value)}
              placeholder={'Capitolo 1\nCapitolo 2\nEsercizi svolti in classe'} rows={6}
              style={{ ...inputStyle, resize: 'vertical', marginBottom: 0 }} />
          </div>
          <button onClick={generaPiano} style={primaryBtnStyle('#1F4E8C', baseFont)}>Genera il piano</button>
        </>
      ) : piano.errore ? (
        <div style={{ ...card, background: '#FEF6E2', borderColor: '#D4A017' }}>
          <p style={{ fontSize: baseFont * 0.9, color: '#17203A', margin: 0 }}>{piano.errore}</p>
          <button onClick={() => setPiano(null)} style={{ ...btnSecondary, marginTop: 14 }}>Riprova</button>
        </div>
      ) : (
        <>
          <p style={{ fontSize: baseFont * 0.8, color: '#8a8a8a', marginBottom: 14 }}>
            {piano.giorniTotali} giorni disponibili, distribuiti tra una prima passata e un ripasso.
          </p>
          {piano.sessioni.map((s, i) => (
            <div key={i} style={{ ...card, borderColor: s.tipo === 'Ripasso (autotest)' ? '#2F8F5B' : '#3F7FBF' }}>
              <div style={{ fontSize: 12.5, fontWeight: 800, color: s.tipo === 'Ripasso (autotest)' ? '#2F8F5B' : '#3F7FBF', marginBottom: 4 }}>
                {s.data.toUpperCase()} — {s.tipo.toUpperCase()}
              </div>
              <div style={{ fontSize: baseFont * 0.92 }}>{s.argomento}</div>
            </div>
          ))}
          <button onClick={() => setPiano(null)} style={{ ...btnSecondary, marginBottom: 16 }}>Rifai il piano</button>
        </>
      )}
      <button onClick={onExit} style={btnSecondary}>&#8592; Torna agli strumenti</button>
    </div>
  );
}

      )}

  );
}

function CompassProgress({ activeIndex, size = 108 }) {
  const center = size / 2;
  const radius = size / 2 - 10;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} aria-hidden="true">
      <circle cx={center} cy={center} r={radius} fill="none" stroke="#E3DCC9" strokeWidth="2" />
      {STEPS.map((s, i) => {
        const angle = (i / TOTAL) * 2 * Math.PI - Math.PI / 2;
        const x = center + radius * Math.cos(angle);
        const y = center + radius * Math.sin(angle);
        const done = i <= activeIndex;
        return (
          <circle key={s.key} cx={x} cy={y} r={done ? 7 : 5} fill={done ? s.color : '#E3DCC9'}
            stroke="#FBF6EE" strokeWidth="2" style={{ transition: 'all 0.4s ease' }} />
        );
      })}
      <circle cx={center} cy={center} r={4} fill="#17203A" />
    </svg>
  );
}

// ============ ROSA DEI VENTI PERSONALE — mappa aggregata del cammino ============
function PersonalCompass({ counts, maxCount, size = 260 }) {
  const center = size / 2;
  const rMin = size * 0.16;
  const rMax = size / 2 - 34;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} aria-hidden="true">
      {[0.33, 0.66, 1].map((f, gi) => (
        <circle key={gi} cx={center} cy={center} r={rMin + (rMax - rMin) * f} fill="none" stroke="#E3DCC9" strokeWidth="1" />
      ))}
      {STEPS.map((s, i) => {
        const angle = (i / TOTAL) * 2 * Math.PI - Math.PI / 2;
        const count = counts[i] || 0;
        const frac = maxCount > 0 ? count / maxCount : 0;
        const r = rMin + (rMax - rMin) * frac;
        const x = center + r * Math.cos(angle);
        const y = center + r * Math.sin(angle);
        const lx = center + (rMax + 22) * Math.cos(angle);
        const ly = center + (rMax + 22) * Math.sin(angle);
        return (
          <g key={s.key}>
            <line x1={center} y1={center} x2={x} y2={y} stroke={s.color} strokeWidth="2.5" strokeLinecap="round" opacity={count > 0 ? 0.85 : 0.25} />
            <circle cx={x} cy={y} r={count > 0 ? 8 : 4} fill={count > 0 ? s.color : '#E3DCC9'} stroke="#FBF6EE" strokeWidth="2" />
            <text x={lx} y={ly} textAnchor="middle" dominantBaseline="middle" fontSize="10.5" fontWeight="700" fill={s.color}>{count}</text>
          </g>
        );
      })}
      <circle cx={center} cy={center} r={5} fill="#17203A" />
    </svg>
  );
}

  const [savedProgress, setSavedProgress] = useState(null); // { answers, whenAnswer, savedAt } se trovato in memoria
  const [journeyData, setJourneyData] = useState(null); // { counts: [8], itinerariList: [{id, done, total}] }
  const [journeyLoading, setJourneyLoading] = useState(false);
  const saveTimeout = useRef(null);

  const previousScreen = useRef('welcome');

  const stepIndex = typeof screen === 'number' ? screen : null;
  const baseStep = stepIndex !== null ? STEPS[stepIndex] : null;
  const itin = selectedItinId ? ITINERARI[selectedItinId] : null;
  const override = (selectedItinId && ITINERARIO_STEPS[selectedItinId] && stepIndex !== null)
    ? ITINERARIO_STEPS[selectedItinId][stepIndex] : null;
  const step = baseStep ? { ...baseStep, ...(override || {}) } : null;

  useEffect(() => {
    if (textareaRef.current) textareaRef.current.focus();
  }, [screen]);

  const baseFont = 17 * fontScale;

  const saveProgress = (id, nextAnswers, nextWhen) => {
    if (!id) return;
    clearTimeout(saveTimeout.current);
    saveTimeout.current = setTimeout(() => {
      try {
        localStorage.setItem(`itin-progress:${id}`, JSON.stringify({ answers: nextAnswers, whenAnswer: nextWhen, savedAt: Date.now() }));
      } catch (e) { /* storage pieno o non disponibile: si continua senza autosalvataggio */ }
    }, 600);
  };

  const goToLanding = async (id) => {
    setSelectedItinId(id);
    setScreen('landing');
    setSavedProgress(null);
    try {
      const raw = localStorage.getItem(`itin-progress:${id}`);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.answers) && parsed.answers.some((a) => a && a.trim())) {
          setSavedProgress(parsed);
        }
      }
    } catch (e) { /* nessun progresso salvato, va bene così */ }
  };
  const resumeProgress = () => {
    if (!savedProgress) return;
    setAnswers(savedProgress.answers);
    setWhenAnswer(savedProgress.whenAnswer || '');
    setSavedProgress(null);
    setScreen(0);
  };
  const discardProgress = () => {
    setSavedProgress(null);
    if (selectedItinId) {
      try { localStorage.removeItem(`itin-progress:${selectedItinId}`); } catch (e) { /* niente da fare */ }
    }
  };

  const openJourneyMap = async () => {
    setScreen('rosa-personale');
    setJourneyLoading(true);
    setJourneyData(null);
    try {
      const prefix = 'itin-progress:';
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(prefix)) keys.push(k);
      }
      const counts = Array(TOTAL).fill(0);
      const itinerariList = [];
      for (const key of keys) {
        try {
          const raw = localStorage.getItem(key);
          if (!raw) continue;
          const parsed = JSON.parse(raw);
          const ans = Array.isArray(parsed.answers) ? parsed.answers : [];
          const doneCount = ans.filter((a) => a && a.trim()).length;
          if (doneCount === 0) continue;
          ans.forEach((a, i) => { if (a && a.trim()) counts[i] += 1; });
          const id = parseInt(key.replace(prefix, ''), 10);
          itinerariList.push({ id, done: doneCount, total: TOTAL });
        } catch (e) { /* voce singola non leggibile, salta */ }
      }
      itinerariList.sort((a, b) => b.done - a.done);
      setJourneyData({ counts, itinerariList });
