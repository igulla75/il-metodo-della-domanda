        <h1 style={{ fontSize: 24 * fontScale, fontWeight: 800, margin: '0 0 6px 0', color: '#17203A' }}>La tua Rosa dei Venti</h1>
        <p style={{ fontSize: baseFont * 0.88, color: '#5b5b5b', marginBottom: 22, lineHeight: 1.5 }}>
          Uno sguardo d’insieme su quali direzioni del Metodo hai esercitato di più, attraverso gli Itinerari che hai affrontato finora.
        </p>

        {journeyLoading && (
          <p style={{ textAlign: 'center', color: '#8a8a8a', fontSize: baseFont * 0.9 }}>Sto raccogliendo il tuo cammino...</p>
        )}

        {!journeyLoading && journeyData && journeyData.itinerariList.length === 0 && (
          <div style={{ background: '#fff', border: '1.5px solid #d8d2bf', borderRadius: 14, padding: '20px', textAlign: 'center', marginBottom: 20 }}>
            <p style={{ fontSize: baseFont * 0.92, color: '#5b5b5b', lineHeight: 1.5, margin: 0 }}>
              Non hai ancora risposte salvate. Comincia un Itinerario, scrivi qualche risposta, e torna qui: la tua Rosa dei Venti comincerà a prendere forma.
            </p>
          </div>
        )}

        {!journeyLoading && journeyData && journeyData.itinerariList.length > 0 && (
          <>
            <div style={{ display: 'flex', justifyContent: 'center', marginBottom: 10 }}>
              <PersonalCompass counts={journeyData.counts} maxCount={journeyData.itinerariList.length} size={260} />
            </div>
            <p style={{ textAlign: 'center', fontSize: baseFont * 0.8, color: '#8a8a8a', marginBottom: 26 }}>
              Ogni numero indica quanti Itinerari, tra quelli che hai affrontato, includono una risposta scritta per quella direzione.
            </p>

            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, justifyContent: 'center', marginBottom: 26 }}>
              {STEPS.map((s, i) => (
                <div key={s.key} style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: baseFont * 0.78, color: '#5b5b5b' }}>
                  <span style={{ width: 10, height: 10, borderRadius: '50%', background: s.color, display: 'inline-block' }} />
                  {s.label}
                </div>
              ))}
            </div>

            <div style={{ fontSize: 12.5, fontWeight: 800, color: '#8a8a8a', marginBottom: 10, letterSpacing: 0.3 }}>ITINERARI CHE HAI AFFRONTATO</div>
            {journeyData.itinerariList.map((it) => {
              const itinData = ITINERARI[it.id];
              if (!itinData) return null;
              return (
                <button key={it.id} onClick={() => goToLanding(it.id)}
                  style={{ display: 'block', width: '100%', textAlign: 'left', background: '#fff', border: '1.5px solid #d8d2bf', borderRadius: 12, padding: '12px 16px', marginBottom: 8, cursor: 'pointer' }}>
                  <div style={{ fontSize: baseFont * 0.9, fontWeight: 700, color: '#17203A', marginBottom: 2 }}>{itinData.title}</div>
                  <div style={{ fontSize: baseFont * 0.78, color: '#8a8a8a' }}>{it.done} di {it.total} passi con una risposta</div>
                </button>
              );
            })}
          </>
        )}

        <button onClick={goBack} style={{ ...secondaryBtnStyle(baseFont), width: '100%', marginTop: 20 }}>&#8592; Torna all’inizio</button>
      </div></div>
    );
  }

  if (screen === 'suggerisci') {
    const invia = () => {
      const testo = suggerimentoTesto.trim();
      if (!testo) return;
      const oggetto = encodeURIComponent('Il Metodo della Domanda — segnalazione di un problema non trattato');
      const corpo = encodeURIComponent(
        `Problema o situazione segnalata:\n\n${testo}\n\n` +
        (suggerimentoContatto.trim() ? `Contatto per eventuale risposta: ${suggerimentoContatto.trim()}\n\n` : '') +
        `— inviato dall'app "Il Metodo della Domanda"`
      );
      window.location.href = `mailto:igulla@libero.it?subject=${oggetto}&body=${corpo}`;
    };
    return (
      <div style={shell}><div style={inner}>
        {fontControls}
        <h2 style={{ fontSize: 22 * fontScale, fontWeight: 800, margin: '0 0 6px 0', color: '#17203A' }}>Non trovi il tuo problema?</h2>
        <p style={{ fontSize: baseFont * 0.9, color: '#5b5b5b', margin: '0 0 20px 0', lineHeight: 1.5 }}>
          I 32 Itinerari non possono coprire tutto. Se stai affrontando qualcosa che non trovi qui, descrivilo: aiuta a capire cosa manca. Non è una richiesta di aiuto immediato — è un suggerimento per chi cura questo libro e questa app.
        </p>

        <label htmlFor="sugg-testo" style={{ display: 'block', fontSize: baseFont * 0.9, fontWeight: 700, marginBottom: 8, color: '#17203A' }}>
          Descrivi il problema o la situazione
        </label>
        <textarea id="sugg-testo" value={suggerimentoTesto} onChange={(e) => setSuggerimentoTesto(e.target.value)}
          placeholder="Es. Non trovo nulla su..." rows={6}
          style={{ ...inputStyle, resize: 'vertical', marginBottom: 16 }} />

        <label htmlFor="sugg-contatto" style={{ display: 'block', fontSize: baseFont * 0.9, fontWeight: 700, marginBottom: 8, color: '#17203A' }}>
          La tua email (facoltativa, solo se vuoi una risposta)
        </label>
        <input id="sugg-contatto" type="email" value={suggerimentoContatto} onChange={(e) => setSuggerimentoContatto(e.target.value)}
          placeholder="nome@esempio.it" style={{ ...inputStyle, marginBottom: 8 }} />
        <p style={{ fontSize: baseFont * 0.76, color: '#8a8a8a', marginBottom: 20, lineHeight: 1.4 }}>
          Il pulsante qui sotto apre la tua app di posta, già scritta e indirizzata: dovrai solo premere "Invia". Se non hai un'app di posta configurata su questo dispositivo, non si aprirà nulla — in quel caso puoi scrivere direttamente a igulla@libero.it.
        </p>

        <button onClick={invia} disabled={!suggerimentoTesto.trim()}
          style={{ ...primaryBtnStyle('#6B4FA0', baseFont), opacity: suggerimentoTesto.trim() ? 1 : 0.5, marginBottom: 12 }}>
          &#9993; Invia il suggerimento
        </button>
        <button onClick={() => setScreen('atlante')} style={{ ...secondaryBtnStyle(baseFont), width: '100%' }}>&#8592; Torna indietro</button>
      </div></div>
    );
  }

  if (screen === 'atlante') {
    const activeTabData = ATLANTE_TABS.find((t) => t.key === atlanteTab);
    return (
      <div style={shell}><div style={inner}>
        {fontControls}
        <h2 style={{ fontSize: 22 * fontScale, fontWeight: 800, margin: '0 0 6px 0', color: '#17203A' }}>Da dove iniziamo?</h2>
        <p style={{ fontSize: baseFont * 0.92, color: '#5b5b5b', margin: '0 0 20px 0', lineHeight: 1.5 }}>
          Scegli la porta che ti sembra più naturale — portano tutte allo stesso posto.
        </p>

        <div style={{ display: 'flex', gap: 8, marginBottom: 20, flexWrap: 'wrap' }}>
          {ATLANTE_TABS.map((t) => (
            <button key={t.key} onClick={() => setAtlanteTab(t.key)}
              style={tabBtnStyle(t.key === atlanteTab, baseFont)}>
              <span style={{ marginRight: 6 }}>{t.icon}</span>{t.label}
            </button>
          ))}
        </div>

        <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginBottom: 24 }}>
          {activeTabData.data.map((row, i) => (
            <button key={i} onClick={() => pickRow(row)} style={optionRowStyle(baseFont)}>
              {row.label}
            </button>
          ))}
        </div>

        <div style={{ marginTop: 'auto' }}>
          <button onClick={() => setScreen('suggerisci')} style={{ ...secondaryBtnStyle(baseFont), width: '100%', marginBottom: 12, borderColor: '#6B4FA0', color: '#6B4FA0' }}>
            &#9993; Non trovi il tuo problema? Suggeriscilo
          </button>
          <button onClick={goBack} style={secondaryBtnStyle(baseFont)}>&#8592; Indietro</button>
        </div>
      </div></div>
    );
  }

  if (screen === 'itinerarioList') {
    return (
      <div style={shell}><div style={inner}>
        {fontControls}
        <h2 style={{ fontSize: 21 * fontScale, fontWeight: 800, margin: '0 0 6px 0', color: '#17203A' }}>
          "{selectedRow.label}"
        </h2>
        <p style={{ fontSize: baseFont * 0.92, color: '#5b5b5b', margin: '0 0 20px 0', lineHeight: 1.5 }}>
          Più di un Itinerario può aiutarti qui. Scegli quello che ti sembra più vicino — puoi sempre tornare indietro.
        </p>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginBottom: 24 }}>
          {selectedRow.itinerari.map((id) => (
            <button key={id} onClick={() => goToLanding(id)} style={optionRowStyle(baseFont)}>
              <span style={{ fontWeight: 800, marginRight: 8 }}>{id}.</span>{ITINERARI[id].title}
            </button>
          ))}
        </div>
        <div style={{ marginTop: 'auto' }}>
          <button onClick={goBack} style={secondaryBtnStyle(baseFont)}>&#8592; Indietro</button>
        </div>
      </div></div>
    );
  }

  if (screen === 'landing' && itin) {
    const help = itin.helpLine ? HELP_LINES[itin.helpLine] : null;
    return (
      <div style={shell}><div style={inner}>
        {fontControls}
        <div style={{ fontSize: 13, color: '#8a8a8a', fontWeight: 700, letterSpacing: 0.5, marginBottom: 6 }}>
          ITINERARIO {selectedItinId} · {itin.family.toUpperCase()}
        </div>
        <h1 style={{ fontSize: 25 * fontScale, fontWeight: 800, lineHeight: 1.3, margin: '0 0 18px 0', color: '#17203A' }}>
          {itin.title}
        </h1>

        {savedProgress && (
          <div style={{ background: '#F0EAFB', border: '1.5px solid #6B4FA0', borderRadius: 14, padding: '14px 18px', marginBottom: 16 }}>
            <p style={{ fontSize: baseFont * 0.9, lineHeight: 1.5, margin: '0 0 12px 0', color: '#17203A' }}>
              Hai già delle risposte salvate qui, dell’ultima volta.
            </p>
            <div style={{ display: 'flex', gap: 10 }}>
              <button onClick={resumeProgress} style={{ ...primaryBtnStyle('#6B4FA0', baseFont), padding: '10px 16px', fontSize: baseFont * 0.88 }}>Continua da dove eri</button>
              <button onClick={discardProgress} style={{ ...secondaryBtnStyle(baseFont), padding: '10px 16px', fontSize: baseFont * 0.88 }}>Ricomincia da capo</button>
            </div>
          </div>
        )}

        <div style={{ background: '#fff', border: '1.5px solid #d8d2bf', borderRadius: 14, padding: '16px 18px', marginBottom: 16 }}>
          <p style={{ fontSize: baseFont, lineHeight: 1.6, margin: 0, color: '#2b2b2b' }}>{itin.recognition}</p>
        </div>

        {itin.caution && (
          <div style={{ background: '#FDF0E2', border: '1.5px solid #E8791E', borderRadius: 14, padding: '14px 18px', marginBottom: 16 }}>
            <p style={{ fontSize: baseFont * 0.92, lineHeight: 1.55, margin: 0, color: '#7a4a12' }}>
              {CAUTION_TEXT[itin.caution]}
            </p>
          </div>
        )}

        {help && (
          <div style={{ background: '#EAF1FC', border: '1.5px solid #1F4E8C', borderRadius: 14, padding: '14px 18px', marginBottom: 16 }}>
            <p style={{ fontSize: baseFont * 0.92, lineHeight: 1.55, margin: 0, color: '#17203A' }}>
              {help.phone && <strong>{help.phone} — </strong>}{help.text}
            </p>
          </div>
        )}

        <div style={{ background: '#F0EAFB', border: '1.5px solid #6B4FA0', borderRadius: 14, padding: '14px 18px', marginBottom: 26 }}>
          <div style={{ fontSize: 12.5, fontWeight: 800, color: '#6B4FA0', marginBottom: 5, letterSpacing: 0.3 }}>DA RICORDARE</div>
          <p style={{ fontSize: baseFont * 0.94, lineHeight: 1.55, margin: 0, color: '#2b2b2b' }}>{itin.keyInsight}</p>
        </div>

        {itin.citazione && (
          <div style={{ background: '#17203A', borderRadius: 14, padding: '18px 20px', marginBottom: 26 }}>
            <p style={{ fontSize: baseFont * 1.02, lineHeight: 1.55, margin: '0 0 10px 0', color: '#fff', fontStyle: 'italic' }}>
              &#8220;{itin.citazione.testo}&#8221;
            </p>
            <p style={{ fontSize: baseFont * 0.82, margin: 0, color: '#b8c0d4' }}>
              — {itin.citazione.autore}, <span style={{ fontStyle: 'italic' }}>{itin.citazione.fonte}</span>
            </p>
          </div>
        )}

        {itin.cultura && (
          <div style={{ background: '#fff', border: '1.5px solid #d8d2bf', borderRadius: 14, padding: '16px 18px', marginBottom: 26 }}>
            <div style={{ fontSize: 12.5, fontWeight: 800, color: '#8a6d00', marginBottom: 10, letterSpacing: 0.3 }}>SE TI VA — UN’OPERA, UN BRANO, UN FILM</div>
            {itin.cultura.arte && (
              <a href={itin.cultura.arte.url} target="_blank" rel="noopener noreferrer" style={cultureLinkStyle}>
                <span style={{ fontSize: 20 }}>&#127912;</span>
                <span>
                  <div style={{ fontWeight: 700, fontSize: baseFont * 0.88, color: '#17203A' }}>{itin.cultura.arte.titolo}</div>
                  <div style={{ fontSize: baseFont * 0.78, color: '#5b5b5b' }}>{itin.cultura.arte.nota}</div>
                </span>
              </a>
            )}
            {itin.cultura.musica && (
              <a href={itin.cultura.musica.url} target="_blank" rel="noopener noreferrer" style={cultureLinkStyle}>
                <span style={{ fontSize: 20 }}>&#127925;</span>
                <span>
                  <div style={{ fontWeight: 700, fontSize: baseFont * 0.88, color: '#17203A' }}>{itin.cultura.musica.titolo}</div>
                  <div style={{ fontSize: baseFont * 0.78, color: '#5b5b5b' }}>{itin.cultura.musica.nota}</div>
                  {itin.cultura.musica.url.includes('search_query') && (
                    <div style={{ fontSize: baseFont * 0.7, color: '#8a8a8a', marginTop: 2 }}>Cerca su YouTube &#8594;</div>
                  )}
                </span>
              </a>
            )}
            {itin.cultura.film && (
              <a href={itin.cultura.film.url} target="_blank" rel="noopener noreferrer" style={{ ...cultureLinkStyle, marginBottom: 0 }}>
                <span style={{ fontSize: 20 }}>&#127916;</span>
                <span>
                  <div style={{ fontWeight: 700, fontSize: baseFont * 0.88, color: '#17203A' }}>{itin.cultura.film.titolo}</div>
                  <div style={{ fontSize: baseFont * 0.78, color: '#5b5b5b' }}>{itin.cultura.film.nota}</div>
                  {itin.cultura.film.url.includes('search_query') && (
                    <div style={{ fontSize: baseFont * 0.7, color: '#8a8a8a', marginTop: 2 }}>Cerca su YouTube &#8594;</div>
                  )}
                </span>
              </a>
            )}
          </div>
        )}

        <p style={{ fontSize: baseFont * 0.9, color: '#5b5b5b', marginBottom: 24, lineHeight: 1.5 }}>
          Ti riconosci in questo? Se sì, proseguiamo con le otto direzioni del Metodo, applicate a questa tua situazione specifica.
        </p>

        {selectedItinId === 1 && (
          <button onClick={() => { previousScreen.current = 'landing'; setScreen('tools'); }}
            style={{ ...secondaryBtnStyle(baseFont), width: '100%', marginBottom: 16, borderColor: '#2F8F5B', color: '#1e5c3a' }}>
            &#9757;&#65039; Prova prima uno strumento pratico di regolazione
          </button>
        )}
        {selectedItinId === 6 && (
          <button onClick={() => { previousScreen.current = 'landing'; setScreen('tool-albero-metodo'); }}
            style={{ ...secondaryBtnStyle(baseFont), width: '100%', marginBottom: 16, borderColor: '#1F4E8C', color: '#1F4E8C' }}>
            &#127795; Usa la mappa “Che tipo di problema è?”
          </button>
        )}

        <div style={{ marginTop: 'auto', display: 'flex', justifyContent: 'space-between', gap: 12 }}>
          <button onClick={goBack} style={secondaryBtnStyle(baseFont)}>&#8592; Cerca un altro Itinerario</button>
          <button onClick={goNext} style={primaryBtnStyle('#1F4E8C', baseFont)}>Sì, comincia &#8594;</button>
        </div>
      </div></div>
    );
  }

  if (screen === 'orientamento' && itin && selectedItinId && ORIENTAMENTO_TABLES[selectedItinId]) {
    const table = ORIENTAMENTO_TABLES[selectedItinId];
    return (
      <div style={shell}><div style={inner}>
        {fontControls}
        <h1 style={{ fontSize: 22 * fontScale, fontWeight: 800, margin: '0 0 4px 0', color: '#17203A' }}>{itin.title}</h1>
        <div style={{ fontSize: 12.5, fontWeight: 800, color: '#8a8a8a', marginBottom: 14, letterSpacing: 0.3 }}>PERCORSO DI ORIENTAMENTO — NON LA SEQUENZA STANDARD</div>
        <p style={{ fontSize: baseFont * 0.92, lineHeight: 1.55, color: '#3a3a3a', marginBottom: 20 }}>{table.intro}</p>

        {table.tipo === 'informativo' ? (
          table.sezioni.map((s, i) => (
            <div key={i} style={{ marginBottom: 22 }}>
              <div style={{ fontSize: 12.5, fontWeight: 800, color: '#3F7FBF', marginBottom: 8, letterSpacing: 0.3 }}>{s.titolo.toUpperCase()}</div>
              <p style={{ fontSize: baseFont * 0.92, lineHeight: 1.6, color: '#3a3a3a', margin: 0 }}>{s.corpo}</p>
            </div>
          ))
        ) : (
          <>
            {table.cautionNote && (
              <div style={{ background: '#FFF4E5', border: '1.5px solid #C98A1E', borderRadius: 14, padding: '14px 18px', marginBottom: 22 }}>
                <p style={{ fontSize: baseFont * 0.85, lineHeight: 1.5, margin: 0, color: '#5c4110' }}>{table.cautionNote}</p>
              </div>
            )}

            {table.manifestazioni.map((m, i) => {
              const tool = m.toolKey ? TOOLS_LIST.find((t) => t.key === m.toolKey) : null;
              return (
                <div key={i} style={{ background: '#fff', border: '1.5px solid #d8d2bf', borderRadius: 14, padding: '16px 18px', marginBottom: 12 }}>
                  <p style={{ fontSize: baseFont * 0.95, fontWeight: 700, color: '#17203A', margin: '0 0 10px 0', lineHeight: 1.4 }}>{m.manifestazione}</p>
                  <p style={{ fontSize: baseFont * 0.85, color: '#3a3a3a', margin: '0 0 6px 0', lineHeight: 1.5 }}><strong>Cosa aiuta:</strong> {m.strumento}</p>
                  <p style={{ fontSize: baseFont * 0.78, color: '#8a8a8a', margin: '0 0 6px 0' }}>{m.origine}</p>
                  <p style={{ fontSize: baseFont * 0.8, color: '#5b5b5b', margin: tool ? '0 0 12px 0' : 0, fontStyle: 'italic' }}>{m.perche}</p>
                  {tool && (
                    <button onClick={() => { previousScreen.current = 'orientamento'; setScreen('tool-' + tool.key); }}
                      style={{ ...secondaryBtnStyle(baseFont * 0.85), borderColor: tool.color, color: tool.color, padding: '8px 14px' }}>
                      {tool.icon} Prova: {tool.title}
                    </button>
                  )}
                </div>
              );
            })}

            {table.cosaFare && (
              <>
                <div style={{ fontSize: 12.5, fontWeight: 800, color: '#8a8a8a', margin: '24px 0 12px 0', letterSpacing: 0.3 }}>COSA FARE, CON LA DOVUTA CAUTELA</div>
                {Object.values(table.cosaFare).map((sezione, i) => (
                  <div key={i} style={{ background: '#F5F1E6', borderRadius: 14, padding: '16px 18px', marginBottom: 14 }}>
                    {sezione.pericoloImmediato && (
                      <div style={{ background: '#8B1E1E', color: '#fff', borderRadius: 10, padding: '12px 14px', marginBottom: 14, fontSize: baseFont * 0.86, lineHeight: 1.5, fontWeight: 600 }}>
                        &#9888; {sezione.pericoloImmediato}
                      </div>
                    )}
                    <p style={{ fontSize: baseFont * 0.9, fontWeight: 700, color: '#17203A', margin: '0 0 10px 0' }}>{sezione.titolo}</p>
                    {sezione.passi.map((p, j) => (
                      <p key={j} style={{ fontSize: baseFont * 0.85, color: '#3a3a3a', margin: '0 0 8px 0', lineHeight: 1.5 }}>&#8226; {p}</p>
                    ))}
                    {sezione.nota && <p style={{ fontSize: baseFont * 0.78, color: '#8a8a8a', margin: '10px 0 0 0', fontStyle: 'italic' }}>{sezione.nota}</p>}
                  </div>
                ))}
              </>
            )}
          </>
        )}

        {itin.helpLine && HELP_LINES[itin.helpLine] && (
          <div style={{ background: '#17203A', borderRadius: 14, padding: '16px 18px', marginBottom: 20 }}>
            <p style={{ fontSize: baseFont * 0.88, color: '#fff', margin: 0, lineHeight: 1.5 }}>{HELP_LINES[itin.helpLine].text}</p>
          </div>
        )}

        <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginTop: 'auto' }}>
          {itin.caution === 'violence' && (
            <button onClick={() => { previousScreen.current = 'orientamento'; setScreen('tools'); }} style={primaryBtnStyle('#8B1E1E', baseFont)}>
              &#128737;&#65039; Vai al piano di sicurezza
            </button>
          )}
          <button onClick={goBack} style={secondaryBtnStyle(baseFont)}>&#8592; Torna indietro</button>
        </div>
      </div></div>
    );
  }

  if (screen === 'summary') {
    const oggi = new Date().toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' });
    const allText = `IL METODO DELLA DOMANDA — ${oggi}\nITINERARIO ${selectedItinId}: ${itin ? itin.title : ''}\n\n` +
      STEPS.map((s, i) => `${s.label.toUpperCase()}\n${answers[i] || '(nessuna risposta)'}`).join('\n\n') +
      `\n\nQuando pensi di fare questo passo?\n${whenAnswer || '(non specificato)'}`;

    const downloadText = () => {
      const blob = new Blob([allText], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const safeTitle = (itin ? itin.title : 'percorso').slice(0, 40).replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-');
      a.download = `metodo-della-domanda_${safeTitle || 'percorso'}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    };

    const decidiAnswer = answers[5]; // 'decidi' step index

    return (
      <div style={shell}><div style={inner}>
        {fontControls}
        <div style={{ textAlign: 'center', marginBottom: 22 }}>
          <CompassProgress activeIndex={TOTAL - 1} size={100} />
          <h1 style={{ fontSize: 26 * fontScale, fontWeight: 800, margin: '14px 0 4px 0', color: '#17203A' }}>Il tuo percorso</h1>
          {itin && <div style={{ fontSize: baseFont * 0.9, color: '#8a8a8a', fontWeight: 600, marginBottom: 6 }}>{itin.title}</div>}
          <p style={{ fontSize: baseFont * 0.92, color: '#5b5b5b', margin: 0 }}>
            Il cerchio si chiude qui — ma resta aperto: puoi ripartire da Osserva ogni volta che serve.
          </p>
        </div>

        {decidiAnswer && (
          <div style={{ background: '#E67E22', borderRadius: 16, padding: '18px 20px', marginBottom: 22 }}>
            <div style={{ fontSize: 12.5, fontWeight: 800, color: '#fff', marginBottom: 8, letterSpacing: 0.5 }}>
              IL TUO PASSO CONCRETO
            </div>
            <p style={{ fontSize: baseFont * 1.02, lineHeight: 1.55, margin: '0 0 16px 0', color: '#fff', fontWeight: 600 }}>
              {decidiAnswer}
            </p>
            <label htmlFor="quando" style={{ display: 'block', fontSize: baseFont * 0.88, color: '#fff', marginBottom: 8 }}>
              Quando pensi di farlo? (facoltativo, ma aiuta)
            </label>
            <input id="quando" type="text" value={whenAnswer} onChange={(e) => { setWhenAnswer(e.target.value); saveProgress(selectedItinId, answers, e.target.value); }}
              placeholder="Es. domani mattina, entro venerdì, appena mi sento pronta..."
              style={{ width: '100%', padding: '10px 12px', borderRadius: 10, border: 'none', fontSize: baseFont * 0.9, fontFamily: 'inherit', boxSizing: 'border-box' }} />
          </div>
        )}

        <div style={{ display: 'flex', flexDirection: 'column', gap: 14, marginBottom: 22 }}>
          {STEPS.map((s, i) => (
            <div key={s.key} style={{ background: s.colorSoft, border: `1.5px solid ${s.color}`, borderRadius: 14, padding: '14px 16px' }}>
              <div style={{ fontWeight: 800, fontSize: baseFont * 0.98, color: s.color, marginBottom: 5 }}>{i + 1}. {s.label}</div>
              <div style={{ fontSize: baseFont * 0.94, lineHeight: 1.55, color: '#2b2b2b', whiteSpace: 'pre-wrap' }}>
                {answers[i] ? answers[i] : <span style={{ color: '#9a9a9a', fontStyle: 'italic' }}>Nessuna risposta scritta.</span>}
              </div>
            </div>
          ))}
        </div>

        {itin && itin.helpLine && HELP_LINES[itin.helpLine] && (
          <div style={{ background: '#EAF1FC', border: '1.5px solid #1F4E8C', borderRadius: 14, padding: '14px 18px', marginBottom: 22 }}>
            <p style={{ fontSize: baseFont * 0.9, lineHeight: 1.5, margin: 0, color: '#17203A' }}>
              {HELP_LINES[itin.helpLine].phone && <strong>{HELP_LINES[itin.helpLine].phone} — </strong>}
              {HELP_LINES[itin.helpLine].text}
            </p>
          </div>
        )}

        <button onClick={downloadText} style={{ ...primaryBtnStyle('#2F8F5B', baseFont), width: '100%', marginBottom: 12, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8 }}>
          &#8681; Scarica le tue risposte
        </button>
        {itin && itin.caution === 'violence' ? (
          <p style={{ fontSize: 12.5, color: '#8B1E1E', marginTop: 0, marginBottom: 24, textAlign: 'center', fontWeight: 600 }}>
            Se scegli di scaricare, assicurati che il file non possa essere trovato da chi ti fa del male — o scegli di non scaricarlo.
          </p>
        ) : (
        <p style={{ fontSize: 12.5, color: '#8a8a8a', marginTop: 0, marginBottom: 24, textAlign: 'center' }}>
          Salva un file di testo sul tuo dispositivo, così non perdi nulla di ciò che hai scritto.
        </p>
        )}

        <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap', justifyContent: 'center' }}>
          <button onClick={goBack} style={secondaryBtnStyle(baseFont)}>&#8592; Rivedi l’ultimo passo</button>
          <button onClick={restart} style={primaryBtnStyle('#17203A', baseFont)}>Trova un altro Itinerario</button>
        </div>
      </div></div>
    );
  }

  if (step) {
    return (
      <div style={shell}><div style={inner}>
        {fontControls}
        <div style={{ display: 'flex', alignItems: 'center', gap: 16, marginBottom: 10 }}>
          <CompassProgress activeIndex={stepIndex} size={72} />
          <div>
            <div style={{ fontSize: 13, color: '#8a8a8a', fontWeight: 600, letterSpacing: 0.3 }}>PASSO {stepIndex + 1} DI {TOTAL}</div>
            <div style={{ fontSize: 24 * fontScale, fontWeight: 800, color: step.color, lineHeight: 1.2 }}>{step.label}</div>
          </div>
        </div>
        {itin && (
          <div style={{ fontSize: 12.5, color: '#8a8a8a', marginBottom: 18, fontStyle: 'italic' }}>
            Itinerario {selectedItinId}: {itin.title}
          </div>
        )}

        <div style={{ background: step.colorSoft, border: `1.5px solid ${step.color}`, borderRadius: 16, padding: '18px 20px', marginBottom: 22 }}>
          <p style={{ fontSize: baseFont, lineHeight: 1.6, margin: 0, color: '#2b2b2b' }}>{step.intro}</p>
        </div>

        {itin && itin.caution && (
          <p style={{ fontSize: baseFont * 0.76, color: '#8a8a8a', marginBottom: 18, lineHeight: 1.45, fontStyle: 'italic' }}>
            Le risposte di questo Itinerario vengono salvate automaticamente solo su questo browser/dispositivo (non su un server, non in un account), per permetterti di riprenderle in un secondo momento. Se cancelli i dati di navigazione o cambi dispositivo, andranno perse. Su un dispositivo condiviso, valuta di non riprendere la bozza quando l’app te lo chiede: puoi cancellarla in quel momento.
          </p>
        )}

        <label htmlFor="risposta" style={{ display: 'block', fontSize: baseFont, fontWeight: 700, marginBottom: 10, color: '#17203A', lineHeight: 1.5 }}>
          {step.question}
        </label>
        <textarea id="risposta" ref={textareaRef} value={answers[stepIndex]} onChange={(e) => updateAnswer(e.target.value)}
          placeholder={step.placeholder} rows={6}
          style={{ width: '100%', fontSize: baseFont, lineHeight: 1.6, padding: '14px 16px', borderRadius: 12, border: '1.5px solid #d8d2bf', fontFamily: 'inherit', color: '#17203A', boxSizing: 'border-box', resize: 'vertical', marginBottom: 28, background: '#fff' }} />

        <div style={{ marginTop: 'auto', display: 'flex', justifyContent: 'space-between', gap: 12 }}>
          <button onClick={goBack} style={secondaryBtnStyle(baseFont)}>&#8592; Indietro</button>
          <button onClick={goNext} style={primaryBtnStyle(step.color, baseFont)}>
            {stepIndex < TOTAL - 1 ? 'Avanti \u2192' : 'Vedi il riepilogo'}
          </button>
        </div>
      </div></div>
    );
  }

  return null;
}

const ctrlBtnStyle = { border: '1px solid #d8d2bf', background: '#fff', borderRadius: 8, width: 34, height: 30, fontSize: 13, fontWeight: 700, color: '#17203A', cursor: 'pointer' };
const pauseBtnStyle = { border: '1.5px solid #2F8F5B', background: '#EAF7EF', color: '#1e5c3a', borderRadius: 10, padding: '7px 12px', fontSize: 13, fontWeight: 700, cursor: 'pointer' };
const cultureLinkStyle = { display: 'flex', alignItems: 'center', gap: 12, textDecoration: 'none', padding: '10px 0', borderBottom: '1px solid #f0ebe0', marginBottom: 4 };
function primaryBtnStyle(color, fontSize) {
  return { background: color, color: '#fff', border: 'none', borderRadius: 12, padding: '13px 26px', fontSize: fontSize * 0.98, fontWeight: 700, cursor: 'pointer', boxShadow: '0 2px 6px rgba(0,0,0,0.12)' };
}
function secondaryBtnStyle(fontSize) {
  return { background: 'transparent', color: '#5b5b5b', border: '1.5px solid #d8d2bf', borderRadius: 12, padding: '13px 22px', fontSize: fontSize * 0.95, fontWeight: 600, cursor: 'pointer' };
}
function tabBtnStyle(active, fontSize) {
  return {
    background: active ? '#17203A' : '#fff', color: active ? '#fff' : '#17203A',
    border: '1.5px solid #17203A', borderRadius: 10, padding: '9px 14px',
    fontSize: fontSize * 0.85, fontWeight: 700, cursor: 'pointer',
  };
}
function optionRowStyle(fontSize) {
  return {
    textAlign: 'left', background: '#fff', border: '1.5px solid #d8d2bf', borderRadius: 12,
    padding: '14px 16px', fontSize: fontSize * 0.94, color: '#17203A', cursor: 'pointer', lineHeight: 1.4,
  };
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<MetodoDellaDomandaApp />);
</script>

<button id="installBtn" class="pwa-fab">⬇ Installa l'app</button>
<button id="downloadBtn" class="pwa-fab show">📥 Scarica versione offline</button>
<div id="pwaToast" class="pwa-toast"></div>

<script>
(function(){
  'use strict';

  // ---------- 1) Service worker: rende l'app utilizzabile offline dopo la prima visita ----------
  // Funziona solo se il file è ospitato su http/https (anche in locale su localhost).
  // Se aperto come file singolo (file://) questa parte semplicemente non fa nulla: nessun errore per l'utente.
  if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){ /* nessun problema: l'app funziona comunque */ });
    });
  }

  function toast(msg, withInstallHint){
    var t = document.getElementById('pwaToast');
    t.innerHTML = msg + (withInstallHint ? '<button id="pwaToastClose">Ho capito</button>' : '');
    t.classList.add('show');
    var closeBtn = document.getElementById('pwaToastClose');
    if(closeBtn) closeBtn.addEventListener('click', function(){ t.classList.remove('show'); });
    else setTimeout(function(){ t.classList.remove('show'); }, 4200);
  }

  var installBtn = document.getElementById('installBtn');
  var downloadBtn = document.getElementById('downloadBtn');

  // ---------- 2) Pulsante "Installa l'app" ----------
  var deferredPrompt = null;
  var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if(!isStandalone){
    if(isIOS){
      installBtn.classList.add('show');
      installBtn.addEventListener('click', function(){
        toast('Per installarla: tocca il pulsante <strong>Condividi</strong> (il riquadro con la freccia verso l\u2019alto) nella barra di Safari, poi scegli <strong>\u201cAggiungi alla schermata Home\u201d</strong>.', true);
      });
    } else {
      window.addEventListener('beforeinstallprompt', function(e){
        e.preventDefault();
        deferredPrompt = e;
        installBtn.classList.add('show');
      });
      installBtn.addEventListener('click', function(){
        if(!deferredPrompt){
          toast('L\u2019installazione automatica non \u00e8 disponibile in questo browser. Puoi comunque usare \u201cScarica versione offline\u201d per salvare l\u2019app sul dispositivo.');
          return;
        }
        deferredPrompt.prompt();
        deferredPrompt.userChoice.finally(function(){ deferredPrompt = null; installBtn.classList.remove('show'); });
      });
      window.addEventListener('appinstalled', function(){
        installBtn.classList.remove('show');
        toast('App installata. La trovi tra le tue app, funziona anche offline.');
      });
    }
  }

  // ---------- 3) Pulsante "Scarica versione offline" ----------
  downloadBtn.addEventListener('click', function(){
    try{
      var clone = document.documentElement.cloneNode(true);
      ['installBtn','downloadBtn','pwaToast'].forEach(function(id){
        var el = clone.querySelector('#'+id);
        if(el) el.remove();
      });
      var html = '<!DOCTYPE html>\n' + clone.outerHTML;
      var blob = new Blob([html], {type:'text/html;charset=utf-8'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'il-metodo-della-domanda-viaggio-nel-buio-offline.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      toast('Scaricato. Apri il file salvato con un doppio clic: funziona anche senza connessione (dopo la prima apertura, se sei online almeno una volta).');
    }catch(err){
      toast('Non sono riuscito a preparare il download in questo browser. Prova invece a salvare la pagina con Ctrl/Cmd+S.');
    }
  });

})();
</script>

</body>
</html>
