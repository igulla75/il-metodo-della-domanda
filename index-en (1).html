// ============ 28. TIME TO WORRY ============
function WorryTimeTool({ baseFont, onExit }) {
  const [worries, setWorries] = useState([]);
  const [draft, setDraft] = useState('');
  const [phase, setPhase] = useState('cattura'); // 'cattura' (capture) | 'finestra' (window)
  const [secondsLeft, setSecondsLeft] = useState(20 * 60);
  const [running, setRunning] = useState(false);
  const intervalRef = useRef(null);

  useEffect(() => {
    if (!running) return;
    intervalRef.current = setInterval(() => {
      setSecondsLeft((s) => { if (s <= 1) { setRunning(false); return 0; } return s - 1; });
    }, 1000);
    return () => clearInterval(intervalRef.current);
  }, [running]);

  const addWorry = () => {
    if (!draft.trim()) return;
    setWorries((p) => [...p, { id: Date.now(), text: draft.trim(), note: '', done: false }]);
    setDraft('');
  };
  const removeWorry = (id) => setWorries((p) => p.filter((w) => w.id !== id));
  const updateNote = (id, note) => setWorries((p) => p.map((w) => (w.id === id ? { ...w, note } : w)));
  const toggleDone = (id) => setWorries((p) => p.map((w) => (w.id === id ? { ...w, done: !w.done } : w)));
  const resetAll = () => { setWorries([]); setPhase('cattura'); setSecondsLeft(20 * 60); setRunning(false); };

  const mins = Math.floor(secondsLeft / 60);
  const secs = secondsLeft % 60;

  return (
    <div>
      <div style={card}>
        <p style={{ fontSize: baseFont * 0.85, color: '#5b5b5b', marginBottom: 0, lineHeight: 1.5 }}>
          When a worry arrives, don’t try to solve it right away: write it here and postpone it to a dedicated moment. Research shows that shifting the moment you actually think about it — without suppressing it — reduces how often and how long it comes back for the rest of the day.
        </p>
      </div>

      {phase === 'cattura' && (
        <>
          <div style={card}>
            <div style={{ fontSize: 12.5, fontWeight: 800, color: '#3F7FBF', marginBottom: 10 }}>CAPTURE</div>
            <input value={draft} onChange={(e) => setDraft(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && addWorry()}
              placeholder="What’s worrying you right now?" style={inputStyle} />
            <button onClick={addWorry} style={btnPrimary('#3F7FBF')}>Add and postpone</button>
          </div>

          {worries.length > 0 && (
            <div style={card}>
              <div style={{ fontSize: 12.5, fontWeight: 800, color: '#6b6b6b', marginBottom: 10 }}>WAITING ({worries.length})</div>
              {worries.map((w) => (
                <div key={w.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '8px 0', borderBottom: '1px solid #f0ece0' }}>
                  <span style={{ fontSize: baseFont * 0.9 }}>{w.text}</span>
                  <button onClick={() => removeWorry(w.id)} style={{ background: 'none', border: 'none', color: '#bbb', cursor: 'pointer', fontSize: 18 }}>&#215;</button>
                </div>
              ))}
            </div>
          )}

          <button onClick={() => setPhase('finestra')} disabled={worries.length === 0}
            style={{ ...btnPrimary(worries.length === 0 ? '#c9c2ab' : '#D4A017'), width: '100%', marginBottom: 16, cursor: worries.length === 0 ? 'not-allowed' : 'pointer' }}>
            Open the dedicated window &#8594;
          </button>
        </>
      )}

      {phase === 'finestra' && (
        <>
          <div style={{ ...card, textAlign: 'center' }}>
            <div style={{ fontSize: baseFont * 1.1, fontWeight: 800, color: '#17203A', marginBottom: 12 }}>
              {String(mins).padStart(2, '0')}:{String(secs).padStart(2, '0')}
            </div>
            <div style={{ display: 'flex', gap: 10, justifyContent: 'center' }}>
              {!running
                ? <button onClick={() => setRunning(true)} style={btnPrimary('#D4A017')}>{secondsLeft < 20 * 60 ? 'Resume' : 'Start the window'}</button>
                : <button onClick={() => setRunning(false)} style={btnSecondary}>Pause</button>}
            </div>
          </div>

          <div style={{ fontSize: 12.5, fontWeight: 800, color: '#6b6b6b', margin: '20px 0 10px 0' }}>NOW, ONE AT A TIME</div>
          {worries.map((w) => (
            <div key={w.id} style={{ ...card, opacity: w.done ? 0.55 : 1 }}>
              <label style={{ display: 'flex', alignItems: 'flex-start', gap: 10, marginBottom: 10, cursor: 'pointer' }}>
                <input type="checkbox" checked={w.done} onChange={() => toggleDone(w.id)} style={{ width: 18, height: 18, marginTop: 2, flexShrink: 0 }} />
                <span style={{ fontSize: baseFont * 0.92, fontWeight: 700, textDecoration: w.done ? 'line-through' : 'none' }}>{w.text}</span>
              </label>
              <textarea value={w.note} onChange={(e) => updateNote(w.id, e.target.value)}
                placeholder="What do you notice now, really thinking about it? Is it still as urgent as it seemed?"
                style={{ ...inputStyle, minHeight: 50, resize: 'vertical', marginBottom: 0 }} />
            </div>
          ))}

          <button onClick={() => setPhase('cattura')} style={{ ...btnSecondary, width: '100%', marginBottom: 16 }}>&#8592; Back to capturing</button>
        </>
      )}

      <button onClick={resetAll} style={{ ...btnSecondary, width: '100%', marginBottom: 16 }}>Start over tomorrow</button>
      <button onClick={onExit} style={btnSecondary}>&#8592; Back to tools</button>
    </div>
  );
}

// ============ 29. SOLVING A PROBLEM, STEP BY STEP ============
function ProblemSolvingTool({ baseFont, onExit }) {
  const [problem, setProblem] = useState('');
  const [goal, setGoal] = useState('');
  const [alternatives, setAlternatives] = useState(['', '']);
  const [evaluation, setEvaluation] = useState({});
  const [chosen, setChosen] = useState(null);
  const [plan, setPlan] = useState('');
  const [checkDate, setCheckDate] = useState('');

  const updateAlt = (i, val) => { const c = [...alternatives]; c[i] = val; setAlternatives(c); };
  const addAlt = () => setAlternatives([...alternatives, '']);
  const removeAlt = (i) => {
    setAlternatives(alternatives.filter((_, idx) => idx !== i));
    if (chosen === i) setChosen(null);
  };
  const updateEval = (i, val) => setEvaluation((p) => ({ ...p, [i]: val }));

  return (
    <div>
      <div style={card}>
        <p style={{ fontSize: baseFont * 0.85, color: '#5b5b5b', marginBottom: 0, lineHeight: 1.5 }}>
          A four-step method, backed by decades of controlled studies: define the problem precisely, generate as many alternatives as possible without judging them, evaluate them and choose one, then check whether it really worked.
        </p>
      </div>

      <div style={{ ...card, borderColor: '#2F8F5B' }}>
        <div style={{ fontSize: 12.5, fontWeight: 800, color: '#2F8F5B', marginBottom: 8 }}>1. DEFINE THE PROBLEM</div>
        <p style={{ fontSize: baseFont * 0.8, color: '#6b6b6b', marginBottom: 10 }}>Precisely: what, exactly — who is involved, when it happens. Not "everything is going wrong", but the specific fact.</p>
        <textarea value={problem} onChange={(e) => setProblem(e.target.value)} placeholder="The problem, precisely, is..."
          style={{ ...inputStyle, minHeight: 55, resize: 'vertical' }} />
        <p style={{ fontSize: baseFont * 0.8, color: '#6b6b6b', marginBottom: 10, marginTop: 4 }}>If this problem were solved, what would be different? What do you want to achieve, concretely?</p>
        <textarea value={goal} onChange={(e) => setGoal(e.target.value)} placeholder="I want to reach..."
          style={{ ...inputStyle, minHeight: 45, resize: 'vertical', marginBottom: 0 }} />
      </div>

      <div style={{ ...card, borderColor: '#D4A017' }}>
        <div style={{ fontSize: 12.5, fontWeight: 800, color: '#D4A017', marginBottom: 8 }}>2. GENERATE ALTERNATIVES</div>
        <p style={{ fontSize: baseFont * 0.8, color: '#6b6b6b', marginBottom: 10 }}>As many as possible, even ones that seem unrealistic — don’t rule anything out now, just list.</p>
        {alternatives.map((a, i) => (
          <div key={i} style={{ display: 'flex', gap: 8, marginBottom: 8 }}>
            <input value={a} onChange={(e) => updateAlt(i, e.target.value)} style={{ ...inputStyle, marginBottom: 0 }} placeholder={`Alternative ${i + 1}`} />
            {alternatives.length > 2 && <button onClick={() => removeAlt(i)} style={{ background: 'none', border: 'none', color: '#bbb', cursor: 'pointer', fontSize: 20 }}>&#215;</button>}
          </div>
        ))}
        <button onClick={addAlt} style={btnSecondary}>+ Add alternative</button>
      </div>

      <div style={{ ...card, borderColor: '#1F4E8C' }}>
        <div style={{ fontSize: 12.5, fontWeight: 800, color: '#1F4E8C', marginBottom: 8 }}>3. EVALUATE AND CHOOSE</div>
        <p style={{ fontSize: baseFont * 0.8, color: '#6b6b6b', marginBottom: 10 }}>For each one, a pro and a con. Then choose the one that seems most workable — it doesn’t have to be perfect.</p>
        {alternatives.filter((a) => a.trim()).map((a, i) => (
          <div key={i} style={{ marginBottom: 12, padding: 12, background: chosen === i ? '#EAF1FC' : '#F5F1E6', borderRadius: 10, border: chosen === i ? '2px solid #1F4E8C' : '1px solid #e5dfc9' }}>
            <p style={{ fontSize: baseFont * 0.88, fontWeight: 700, margin: '0 0 8px 0' }}>{a}</p>
            <input value={evaluation[i] || ''} onChange={(e) => updateEval(i, e.target.value)} style={{ ...inputStyle, marginBottom: 8 }} placeholder="Pros and cons of this option..." />
            <button onClick={() => setChosen(i)} style={{ ...btnSecondary, borderColor: '#1F4E8C', color: '#1F4E8C', padding: '6px 14px', fontSize: baseFont * 0.82 }}>
              {chosen === i ? '✓ Chosen' : 'Choose this one'}
            </button>
          </div>
        ))}
      </div>

      <div style={{ ...card, background: '#17203A' }}>
        <div style={{ fontSize: 12.5, fontWeight: 800, color: '#b8c0d4', marginBottom: 8 }}>4. IMPLEMENT AND VERIFY</div>
        <p style={{ fontSize: baseFont * 0.85, color: '#b8c0d4', marginBottom: 10, lineHeight: 1.5 }}>What is the first concrete step, and when will you take it?</p>
        <textarea value={plan} onChange={(e) => setPlan(e.target.value)} placeholder="The first step is..."
          style={{ ...inputStyle, minHeight: 50, resize: 'vertical' }} />
        <p style={{ fontSize: baseFont * 0.8, color: '#b8c0d4', marginBottom: 10 }}>When will you check whether it worked?</p>
        <input value={checkDate} onChange={(e) => setCheckDate(e.target.value)} style={{ ...inputStyle, marginBottom: 0 }} placeholder="E.g. in a week, next Friday..." />
      </div>
      <button onClick={onExit} style={btnSecondary}>&#8592; Back to tools</button>
    </div>
  );
}

// ============ 30. STIMULUS CONTROL FOR SLEEP ============
function StimulusControlTool({ baseFont, onExit }) {
  const rules = [
    { id: 'r1', text: 'Go to bed only when you feel sleepy, not just because it’s "time"', help: 'Real drowsiness, not general tiredness: eyes closing on their own.' },
    { id: 'r2', text: 'Use the bed only for sleep (and intimacy) — not phone, TV, reading', help: 'Any other activity in bed teaches the brain to associate it with wakefulness, not sleep.' },
    { id: 'r3', text: 'If you don’t fall asleep within 15-20 minutes, get up and go to another room', help: 'Go back to bed only when sleepiness really arrives — without checking the clock.' },
    { id: 'r4', text: 'Repeat the previous step as many times as needed during the night', help: 'Even several times, if necessary — the principle is the same each time.' },
    { id: 'r5', text: 'Wake up at the same time every morning, regardless of how much you slept', help: 'Even after a difficult night — this is what rebuilds a stable rhythm.' },
    { id: 'r6', text: 'Avoid naps during the day', help: 'Even if tired — sleep accumulated during the day takes sleep away from the night.' },
  ];
  const [checks, setChecks] = useState({});
  const [nights, setNights] = useState(0);

  const toggle = (id) => setChecks((p) => ({ ...p, [id]: !p[id] }));
  const logNight = () => { setNights((n) => n + 1); setChecks({}); };
  const reset = () => { setChecks({}); setNights(0); };
  const doneCount = Object.values(checks).filter(Boolean).length;

  return (
    <div>
      <div style={card}>
        <p style={{ fontSize: baseFont * 0.85, color: '#5b5b5b', marginBottom: 0, lineHeight: 1.5 }}>
          Stimulus control is one of the core components of cognitive behavioural therapy for insomnia, the non-drug treatment most supported by research. The underlying idea: the bed needs to go back to being associated only with sleep, not with frustrated wakefulness. The first few days are often the hardest — the full effects usually arrive after 2-4 weeks of consistent practice.
        </p>
      </div>

      <div style={card}>
        <div style={{ fontSize: 12.5, fontWeight: 800, color: '#6B4FA0', marginBottom: 10 }}>TONIGHT, WHICH DID YOU FOLLOW?</div>
        {rules.map((r) => (
          <label key={r.id} style={{ display: 'flex', alignItems: 'flex-start', gap: 10, marginBottom: 12, cursor: 'pointer' }}>
            <input type="checkbox" checked={!!checks[r.id]} onChange={() => toggle(r.id)} style={{ width: 18, height: 18, marginTop: 2, flexShrink: 0 }} />
            <span>
              <div style={{ fontSize: baseFont * 0.9 }}>{r.text}</div>
              <div style={{ fontSize: baseFont * 0.76, color: '#6b6b6b' }}>{r.help}</div>
            </span>
          </label>
        ))}
        <p style={{ fontSize: baseFont * 0.85, color: '#5b5b5b', margin: '10px 0 14px 0' }}>{doneCount} of 6 rules followed tonight.</p>
        <button onClick={logNight} style={btnPrimary('#6B4FA0')}>Log this night</button>
      </div>

      <div style={{ ...card, textAlign: 'center' }}>
        <div style={{ fontSize: baseFont * 1.3, fontWeight: 800, color: '#17203A' }}>{nights}</div>
        <p style={{ fontSize: baseFont * 0.85, color: '#6b6b6b', margin: 0 }}>nights logged so far</p>
      </div>

      <button onClick={reset} style={{ ...btnSecondary, width: '100%', marginBottom: 16 }}>Reset the count</button>
      <button onClick={onExit} style={btnSecondary}>&#8592; Back to tools</button>
    </div>
  );
}

}

// ============ 37. SPACED STUDY PLAN ============
function StudyPlanTool({ baseFont, onExit }) {
  const [dataProva, setDataProva] = useState('');
  const [argomentiTesto, setArgomentiTesto] = useState('');
  const [piano, setPiano] = useState(null);

  const generaPiano = () => {
    if (!dataProva) return;
    const argomenti = argomentiTesto.split('\n').map((a) => a.trim()).filter(Boolean);
    if (argomenti.length === 0) return;

    const oggi = new Date(); oggi.setHours(0, 0, 0, 0);
    const prova = new Date(dataProva); prova.setHours(0, 0, 0, 0);
    const giorniTotali = Math.round((prova - oggi) / (1000 * 60 * 60 * 24));

    if (giorniTotali <= 0) { setPiano({ errore: 'The date you entered is not in the future.' }); return; }
    if (giorniTotali < argomenti.length) {
      setPiano({ errore: `You have ${argomenti.length} topics but only ${giorniTotali} days: try grouping a few topics together, or consider whether the exam needs to be postponed.` });
      return;
    }

    // First pass: spread each topic once, over the first 60% of the time (min. 1 day)
    const giorniPrimaPassata = Math.max(argomenti.length, Math.round(giorniTotali * 0.6));
    const passo1 = Math.max(1, Math.floor(giorniPrimaPassata / argomenti.length));
    const sessioni = [];
    argomenti.forEach((arg, i) => {
      const giorno = Math.min(i * passo1 + 1, giorniPrimaPassata);
      sessioni.push({ giorno, tipo: 'First pass', argomento: arg });
    });

    // Second pass: spaced review of the same topics, over the remaining time
    const giorniRipasso = giorniTotali - giorniPrimaPassata;
    if (giorniRipasso > 0) {
      const passo2 = Math.max(1, Math.floor(giorniRipasso / argomenti.length));
      argomenti.forEach((arg, i) => {
        const giorno = Math.min(giorniPrimaPassata + i * passo2 + 1, giorniTotali - 1);
        sessioni.push({ giorno, tipo: 'Review (self-test)', argomento: arg });
      });
    }
    sessioni.sort((a, b) => a.giorno - b.giorno);

    const conData = sessioni.map((s) => {
      const d = new Date(oggi); d.setDate(d.getDate() + s.giorno);
      return { ...s, data: d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) };
    });
    setPiano({ sessioni: conData, giorniTotali });
  };

  return (
    <div>
      <div style={card}>
        <p style={{ fontSize: baseFont * 0.85, color: '#5b5b5b', marginBottom: 0, lineHeight: 1.5 }}>
          Short sessions spaced out over time produce a more stable memory than a single study marathon, even for the same total hours — and they ask less, moment by moment, of a mind already tired by anxiety.
        </p>
      </div>
      {!piano ? (
        <>
          <div style={card}>
            <label style={{ display: 'block', fontSize: baseFont * 0.9, fontWeight: 700, marginBottom: 8, color: '#17203A' }}>
              Exam date
            </label>
            <input type="date" value={dataProva} onChange={(e) => setDataProva(e.target.value)} style={inputStyle} />
            <label style={{ display: 'block', fontSize: baseFont * 0.9, fontWeight: 700, marginBottom: 8, color: '#17203A' }}>
              Topics to prepare (one per line)
            </label>
            <textarea value={argomentiTesto} onChange={(e) => setArgomentiTesto(e.target.value)}
              placeholder={'Chapter 1\nChapter 2\nExercises done in class'} rows={6}
              style={{ ...inputStyle, resize: 'vertical', marginBottom: 0 }} />
          </div>
          <button onClick={generaPiano} style={primaryBtnStyle('#1F4E8C', baseFont)}>Generate the plan</button>
        </>
      ) : piano.errore ? (
        <div style={{ ...card, background: '#FEF6E2', borderColor: '#D4A017' }}>
          <p style={{ fontSize: baseFont * 0.9, color: '#17203A', margin: 0 }}>{piano.errore}</p>
          <button onClick={() => setPiano(null)} style={{ ...btnSecondary, marginTop: 14 }}>Try again</button>
        </div>
      ) : (
        <>
          <p style={{ fontSize: baseFont * 0.8, color: '#6b6b6b', marginBottom: 14 }}>
            {piano.giorniTotali} days available, split between a first pass and a review.
          </p>
          {piano.sessioni.map((s, i) => (
            <div key={i} style={{ ...card, borderColor: s.tipo === 'Review (self-test)' ? '#2F8F5B' : '#3F7FBF' }}>
              <div style={{ fontSize: 12.5, fontWeight: 800, color: s.tipo === 'Review (self-test)' ? '#2F8F5B' : '#3F7FBF', marginBottom: 4 }}>
                {s.data.toUpperCase()} — {s.tipo.toUpperCase()}
              </div>
              <div style={{ fontSize: baseFont * 0.92 }}>{s.argomento}</div>
            </div>
          ))}
          <button onClick={() => setPiano(null)} style={{ ...btnSecondary, marginBottom: 16 }}>Redo the plan</button>
        </>
      )}
      <button onClick={onExit} style={btnSecondary}>&#8592; Back to tools</button>
    </div>
  );
}

  const analyze = () => {
    const found = [];
    if (!/https?:\/\/|www\.|\bsource\b|\baccording to\b/i.test(text)) {
      found.push('There is no link or cited source in the text: there is nothing to verify yet.');

      found.push('There is at least one very precise figure: it needs checking against a real source — looking exact isn’t enough.');
    }
    if (/\bcertainly\b|\bwithout (a )?doubt\b|\bdefinitely\b|\bguaranteed\b|\bwe guarantee\b|it is a fact that/i.test(text)) {
      found.push('The text uses words of absolute certainty ("certainly", "guaranteed"...): a confident tone is not proof.');

  if (phase === 'flags') {

      <div>

        </p>
        <button onClick={() => setPhase('steps')} style={{ ...btnPrimary(current.color), width: '100%', marginBottom: 12 }}>Continue with the six Steps</button>
        <button onClick={restart} style={btnSecondary}>&#8592; Choose another case</button>
      </div>
    );
  }

  if (phase === 'steps') {
    const step = current.steps[stepIndex];
    return (
      <div>
        <div style={{ fontSize: 13, color: '#6b6b6b', fontWeight: 600, marginBottom: 10 }}>STEP {stepIndex + 1} OF 6 — {current.label}</div>
        <div style={{ ...card, background: '#EAF1FC', borderColor: current.color }}>
          <p style={{ fontSize: baseFont * 0.95, fontWeight: 700, color: '#17203A', margin: '0 0 10px 0', lineHeight: 1.5 }}>{step.q}</p>
          <p style={{ fontSize: baseFont * 0.82, color: '#5b5b5b', margin: 0, lineHeight: 1.5, fontStyle: 'italic' }}>{step.example}</p>
        </div>
        <label style={{ display: 'block', fontSize: baseFont * 0.88, fontWeight: 700, marginBottom: 8, color: '#17203A' }}>Your answer, for this case:</label>
        <textarea value={answers[stepIndex]} onChange={(e) => updateAnswer(e.target.value)} placeholder={step.placeholder} rows={4}
          style={{ ...inputStyle, resize: 'vertical' }} />
        <div style={{ display: 'flex', justifyContent: 'space-between', gap: 12, marginTop: 8 }}>
          <button onClick={goBack} style={btnSecondary}>&#8592; Back</button>
          <button onClick={goNext} style={btnPrimary(current.color)}>{stepIndex < 5 ? 'Next →' : 'See the summary'}</button>
        </div>
      </div>
    );
  }

  return (
    <div>
      <div style={card}>
        <div style={{ fontSize: baseFont * 0.95, fontWeight: 800, color: current.color, marginBottom: 10 }}>Summary — {current.label}</div>
        {current.steps.map((step, i) => (
          <div key={i} style={{ marginBottom: 14 }}>
            <div style={{ fontSize: baseFont * 0.82, fontWeight: 700, color: '#17203A', marginBottom: 4 }}>{i + 1}. {step.q}</div>
            <div style={{ fontSize: baseFont * 0.82, color: answers[i] ? '#2b2b2b' : '#a39a82', lineHeight: 1.5, fontStyle: answers[i] ? 'normal' : 'italic' }}>
              {answers[i] || '(not filled in)'}
            </div>
          </div>
        ))}
      </div>
      <p style={{ fontSize: baseFont * 0.8, color: '#6b6b6b', marginBottom: 20, lineHeight: 1.5 }}>
        The confidence with which something is said doesn’t measure how true it is. It only measures how confidently it was said.
      </p>
      <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap' }}>
        <button onClick={restart} style={btnPrimary('#17203A')}>Check another case</button>
        <button onClick={onExit} style={btnSecondary}>&#8592; Back to tools</button>
      </div>
    </div>
  );
}

function PersonalCompass({ counts, maxCount, size = 260 }) {
  const center = size / 2;
  const rMin = size * 0.16;
  const rMax = size / 2 - 34;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} aria-hidden="true">
      {[0.33, 0.66, 1].map((f, gi) => (
        <circle key={gi} cx={center} cy={center} r={rMin + (rMax - rMin) * f} fill="none" stroke="#E3DCC9" strokeWidth="1" />
      ))}
      {STEPS.map((s, i) => {
        const angle = (i / TOTAL) * 2 * Math.PI - Math.PI / 2;
        const count = counts[i] || 0;
        const frac = maxCount > 0 ? count / maxCount : 0;
        const r = rMin + (rMax - rMin) * frac;
        const x = center + r * Math.cos(angle);
        const y = center + r * Math.sin(angle);
        const lx = center + (rMax + 22) * Math.cos(angle);
        const ly = center + (rMax + 22) * Math.sin(angle);
        return (
          <g key={s.key}>
            <line x1={center} y1={center} x2={x} y2={y} stroke={s.color} strokeWidth="2.5" strokeLinecap="round" opacity={count > 0 ? 0.85 : 0.25} />
            <circle cx={x} cy={y} r={count > 0 ? 8 : 4} fill={count > 0 ? s.color : '#E3DCC9'} stroke="#FBF6EE" strokeWidth="2" />
            <text x={lx} y={ly} textAnchor="middle" dominantBaseline="middle" fontSize="10.5" fontWeight="700" fill={s.color}>{count}</text>
          </g>
        );
      })}
      <circle cx={center} cy={center} r={5} fill="#17203A" />
    </svg>
  );
}

              return (
                <div key={i} style={{ background: '#fff', border: '1.5px solid #d8d2bf', borderRadius: 14, padding: '16px 18px', marginBottom: 12 }}>
                  <p style={{ fontSize: baseFont * 0.95, fontWeight: 700, color: '#17203A', margin: '0 0 10px 0', lineHeight: 1.4 }}>{m.manifestation}</p>
                  <p style={{ fontSize: baseFont * 0.85, color: '#3a3a3a', margin: '0 0 6px 0', lineHeight: 1.5 }}><strong>What helps:</strong> {m.tool}</p>
                  <p style={{ fontSize: baseFont * 0.78, color: '#6b6b6b', margin: '0 0 6px 0' }}>{m.origin}</p>
                  <p style={{ fontSize: baseFont * 0.8, color: '#5b5b5b', margin: tool ? '0 0 12px 0' : 0, fontStyle: 'italic' }}>{m.why}</p>
                  {tool && (
                    <button onClick={() => { previousScreen.current = 'orientamento'; setScreen('tool-' + tool.key); }}
                      style={{ ...secondaryBtnStyle(baseFont * 0.85), borderColor: tool.color, color: tool.color, padding: '8px 14px' }}>
                      {tool.icon} Try: {tool.title}
                    </button>
                  )}
                </div>
              );
            })}

            {table.whatToDo && (
              <>
                <div style={{ fontSize: 12.5, fontWeight: 800, color: '#6b6b6b', margin: '24px 0 12px 0', letterSpacing: 0.3 }}>WHAT TO DO, WITH DUE CAUTION</div>
                {Object.values(table.whatToDo).map((sezione, i) => (
                  <div key={i} style={{ background: '#F5F1E6', borderRadius: 14, padding: '16px 18px', marginBottom: 14 }}>
                    {sezione.immediateDanger && (
                      <div style={{ background: '#8B1E1E', color: '#fff', borderRadius: 10, padding: '12px 14px', marginBottom: 14, fontSize: baseFont * 0.86, lineHeight: 1.5, fontWeight: 600 }}>
                        &#9888; {sezione.immediateDanger}
                      </div>
                    )}
                    <p style={{ fontSize: baseFont * 0.9, fontWeight: 700, color: '#17203A', margin: '0 0 10px 0' }}>{sezione.title}</p>
                    {sezione.steps.map((p, j) => (
                      <p key={j} style={{ fontSize: baseFont * 0.85, color: '#3a3a3a', margin: '0 0 8px 0', lineHeight: 1.5 }}>&#8226; {p}</p>
                    ))}
                    {sezione.note && <p style={{ fontSize: baseFont * 0.78, color: '#6b6b6b', margin: '10px 0 0 0', fontStyle: 'italic' }}>{sezione.note}</p>}
                  </div>
                ))}
              </>
            )}
          </>
        )}

        {itin.helpLine && HELP_LINES[itin.helpLine] && (
          <div style={{ background: '#17203A', borderRadius: 14, padding: '16px 18px', marginBottom: 20 }}>
            <p style={{ fontSize: baseFont * 0.88, color: '#fff', margin: 0, lineHeight: 1.5 }}>{HELP_LINES[itin.helpLine].text}</p>
          </div>
        )}

        <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginTop: 'auto' }}>
          {itin.caution === 'violence' && (
            <button onClick={() => { previousScreen.current = 'orientamento'; setScreen('tools'); }} style={primaryBtnStyle('#8B1E1E', baseFont)}>
              &#128737;&#65039; Go to the safety plan
            </button>
          )}
          <button onClick={goBack} style={secondaryBtnStyle(baseFont)}>&#8592; Go back</button>
        </div>
      </div></div>
    );
  }

  if (screen === 'summary') {
    const oggi = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
    const allText = `THE METHOD OF THE QUESTION — ${oggi}\nITINERARY ${selectedItinId}: ${itin ? itin.title : ''}\n\n` +
      STEPS.map((s, i) => `${s.label.toUpperCase()}\n${answers[i] || '(no answer)'}`).join('\n\n') +
      `\n\nWhen do you plan to take this step?\n${whenAnswer || '(not specified)'}`;

    const downloadText = () => {
      const blob = new Blob([allText], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const safeTitle = (itin ? itin.title : 'path').slice(0, 40).replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-');
      a.download = `method-of-the-question_${safeTitle || 'path'}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    };

    const decidiAnswer = answers[6]; // 'decide' step index (STEPS: 0 observe, 1 distinguish, 2 question, 3 verify, 4 limit, 5 update, 6 decide, 7 resume)

    return (
      <div style={shell}><div style={inner}>
        {fontControls}
        <div style={{ textAlign: 'center', marginBottom: 22 }}>
          <CompassProgress activeIndex={TOTAL - 1} size={100} />
          <h1 style={{ fontSize: 26 * fontScale, fontWeight: 800, margin: '14px 0 4px 0', color: '#17203A' }}>Your path</h1>
          {itin && <div style={{ fontSize: baseFont * 0.9, color: '#6b6b6b', fontWeight: 600, marginBottom: 6 }}>{itin.title}</div>}
          <p style={{ fontSize: baseFont * 0.92, color: '#5b5b5b', margin: 0 }}>
            The circle closes here — but stays open: you can start again from Observe whenever you need to.
          </p>
        </div>

        {decidiAnswer && (
          <div style={{ background: '#E67E22', borderRadius: 16, padding: '18px 20px', marginBottom: 22 }}>
            <div style={{ fontSize: 12.5, fontWeight: 800, color: '#fff', marginBottom: 8, letterSpacing: 0.5 }}>
              YOUR CONCRETE STEP
            </div>
            <p style={{ fontSize: baseFont * 1.02, lineHeight: 1.55, margin: '0 0 16px 0', color: '#fff', fontWeight: 600 }}>
              {decidiAnswer}
            </p>
            <label htmlFor="whenAnswer" style={{ display: 'block', fontSize: baseFont * 0.88, color: '#fff', marginBottom: 8 }}>
              When do you plan to do it? (optional, but it helps)
            </label>
            </label>
            <input id="whenAnswer" type="text" value={whenAnswer} onChange={(e) => { setWhenAnswer(e.target.value); saveProgress(selectedItinId, answers, e.target.value); }}
              placeholder="E.g. tomorrow morning, by Friday, as soon as I feel ready..."
              style={{ width: '100%', padding: '10px 12px', borderRadius: 10, border: 'none', fontSize: baseFont * 0.9, fontFamily: 'inherit', boxSizing: 'border-box' }} />
          </div>
        )}

        <div style={{ display: 'flex', flexDirection: 'column', gap: 14, marginBottom: 22 }}>
          {STEPS.map((s, i) => (
            <div key={s.key} style={{ background: s.colorSoft, border: `1.5px solid ${s.color}`, borderRadius: 14, padding: '14px 16px' }}>
              <div style={{ fontWeight: 800, fontSize: baseFont * 0.98, color: s.color, marginBottom: 5 }}>{i + 1}. {s.label}</div>
              <div style={{ fontSize: baseFont * 0.94, lineHeight: 1.55, color: '#2b2b2b', whiteSpace: 'pre-wrap' }}>
                {answers[i] ? answers[i] : <span style={{ color: '#9a9a9a', fontStyle: 'italic' }}>No answer written.</span>}
              </div>
            </div>
          ))}
        </div>

        {itin && itin.helpLine && HELP_LINES[itin.helpLine] && (
          <div style={{ background: '#EAF1FC', border: '1.5px solid #1F4E8C', borderRadius: 14, padding: '14px 18px', marginBottom: 22 }}>
            <p style={{ fontSize: baseFont * 0.9, lineHeight: 1.5, margin: 0, color: '#17203A' }}>
              {HELP_LINES[itin.helpLine].phone && <strong>{HELP_LINES[itin.helpLine].phone} — </strong>}
              {HELP_LINES[itin.helpLine].text}
            </p>
          </div>
        )}

        <button onClick={downloadText} style={{ ...primaryBtnStyle('#2F8F5B', baseFont), width: '100%', marginBottom: 12, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8 }}>
          &#8681; Download your answers
        </button>
        {itin && itin.caution === 'violence' ? (
          <p style={{ fontSize: 12.5, color: '#8B1E1E', marginTop: 0, marginBottom: 24, textAlign: 'center', fontWeight: 600 }}>
            If you choose to download, make sure the file can’t be found by someone who is hurting you — or choose not to download it.
          </p>
        ) : (
        <p style={{ fontSize: 12.5, color: '#6b6b6b', marginTop: 0, marginBottom: 24, textAlign: 'center' }}>
          Save a text file to your device, so you don’t lose anything you’ve written.
        </p>
        )}

        <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap', justifyContent: 'center' }}>
          <button onClick={goBack} style={secondaryBtnStyle(baseFont)}>&#8592; Review the last step</button>
          <button onClick={restart} style={primaryBtnStyle('#17203A', baseFont)}>Find another Itinerary</button>
        </div>
      </div></div>
    );
  }

  if (step) {
    return (
      <div style={shell}><div style={inner}>
        {fontControls}
        <div style={{ display: 'flex', alignItems: 'center', gap: 16, marginBottom: 10 }}>
          <CompassProgress activeIndex={stepIndex} size={72} />
          <div>
            <div style={{ fontSize: 13, color: '#6b6b6b', fontWeight: 600, letterSpacing: 0.3 }}>STEP {stepIndex + 1} OF {TOTAL}</div>
            <div style={{ fontSize: 24 * fontScale, fontWeight: 800, color: step.color, lineHeight: 1.2 }}>{step.label}</div>
          </div>
        </div>
        {itin && (
          <div style={{ fontSize: 12.5, color: '#6b6b6b', marginBottom: 18, fontStyle: 'italic' }}>
            Itinerary {selectedItinId}: {itin.title}
          </div>
        )}

        <div style={{ background: step.colorSoft, border: `1.5px solid ${step.color}`, borderRadius: 16, padding: '18px 20px', marginBottom: 22 }}>
          <p style={{ fontSize: baseFont, lineHeight: 1.6, margin: 0, color: '#2b2b2b' }}>{step.intro}</p>
        </div>

        {itin && itin.caution && (
          <p style={{ fontSize: baseFont * 0.76, color: '#6b6b6b', marginBottom: 18, lineHeight: 1.45, fontStyle: 'italic' }}>
            This Itinerary’s answers are saved automatically only on this browser/device (not on a server, not in an account), so you can pick them up again later. If you clear your browsing data or switch devices, they will be lost. On a shared device, consider not resuming the draft when the app asks you to: you can delete it at that point.
          </p>
        )}

        <label htmlFor="risposta" style={{ display: 'block', fontSize: baseFont, fontWeight: 700, marginBottom: 10, color: '#17203A', lineHeight: 1.5 }}>
          {step.question}
        </label>
        <textarea id="risposta" ref={textareaRef} value={answers[stepIndex]} onChange={(e) => updateAnswer(e.target.value)}
          placeholder={step.placeholder} rows={6}
          style={{ width: '100%', fontSize: baseFont, lineHeight: 1.6, padding: '14px 16px', borderRadius: 12, border: '1.5px solid #d8d2bf', fontFamily: 'inherit', color: '#17203A', boxSizing: 'border-box', resize: 'vertical', marginBottom: 28, background: '#fff' }} />

        <div style={{ marginTop: 'auto', display: 'flex', justifyContent: 'space-between', gap: 12 }}>
          <button onClick={goBack} style={secondaryBtnStyle(baseFont)}>&#8592; Back</button>
          <button onClick={goNext} style={primaryBtnStyle(step.color, baseFont)}>
            {stepIndex < TOTAL - 1 ? 'Next →' : 'See the summary'}
          </button>
        </div>
      </div></div>
    );
  }

  return null;
}

const ctrlBtnStyle = { border: '1px solid #d8d2bf', background: '#fff', borderRadius: 8, width: 34, height: 30, fontSize: 13, fontWeight: 700, color: '#17203A', cursor: 'pointer' };
const pauseBtnStyle = { border: '1.5px solid #2F8F5B', background: '#EAF7EF', color: '#1e5c3a', borderRadius: 10, padding: '7px 12px', fontSize: 13, fontWeight: 700, cursor: 'pointer' };
const cultureLinkStyle = { display: 'flex', alignItems: 'center', gap: 12, textDecoration: 'none', padding: '10px 0', borderBottom: '1px solid #f0ebe0', marginBottom: 4 };
function primaryBtnStyle(color, fontSize) {
  return { background: color, color: '#fff', border: 'none', borderRadius: 12, padding: '13px 26px', fontSize: fontSize * 0.98, fontWeight: 700, cursor: 'pointer', boxShadow: '0 2px 6px rgba(0,0,0,0.12)' };
}
function secondaryBtnStyle(fontSize) {
  return { background: 'transparent', color: '#5b5b5b', border: '1.5px solid #d8d2bf', borderRadius: 12, padding: '13px 22px', fontSize: fontSize * 0.95, fontWeight: 600, cursor: 'pointer' };
}
function tabBtnStyle(active, fontSize) {
  return {
    background: active ? '#17203A' : '#fff', color: active ? '#fff' : '#17203A',
    border: '1.5px solid #17203A', borderRadius: 10, padding: '9px 14px',
    fontSize: fontSize * 0.85, fontWeight: 700, cursor: 'pointer',
  };
}
function optionRowStyle(fontSize) {
  return {
    textAlign: 'left', background: '#fff', border: '1.5px solid #d8d2bf', borderRadius: 12,
    padding: '14px 16px', fontSize: fontSize * 0.94, color: '#17203A', cursor: 'pointer', lineHeight: 1.4,
  };
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<MetodoDellaDomandaApp />);
</script>

<button id="installBtn" class="pwa-fab">⬇ Install the app</button>
  <a id="giftBtn" href="yoga-nidra.html" class="pwa-fab show" style="bottom:calc(130px + env(safe-area-inset-bottom,0px)); text-decoration:none;">🎁 A surprise for you</a>
<button id="downloadBtn" class="pwa-fab show">📥 Download offline version</button>
<div id="pwaToast" class="pwa-toast"></div>

<script>
(function(){
  'use strict';

  // ---------- 1) Service worker: makes the app usable offline after the first visit ----------
  // Only works if the file is hosted over http/https (including locally on localhost).
  // If opened as a single file (file://) this part simply does nothing: no error for the user.
  // It only cleans up any "stray" service workers (broken versions, or ones
  // installed from a different path previously) and leaves the current one
  // alone if it's already the right one: re-registering the same sw-en.js,
  // byte-for-byte identical, does not restart the install nor
  // re-download the cache — it only does that if the file has actually changed.
  // (Previously, an unconditional unregister on every visit forced a full
  // reinstall even when nothing had changed.)
  if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
    window.addEventListener('load', function(){
      navigator.serviceWorker.getRegistrations().then(function(regs){
        var stale = regs.filter(function(r){
          return !(r.active && /\/sw-en\.js$/.test(r.active.scriptURL));
        });
        return Promise.all(stale.map(function(reg){ return reg.unregister(); }));
      }).catch(function(){}).then(function(){
        return navigator.serviceWorker.register('sw-en.js');
      }).catch(function(){ /* no problem: the app still works */ });
    });
  }

  function toast(msg, withInstallHint){
    var t = document.getElementById('pwaToast');
    t.innerHTML = msg + (withInstallHint ? '<button id="pwaToastClose">Got it</button>' : '');
    t.classList.add('show');
    var closeBtn = document.getElementById('pwaToastClose');
    if(closeBtn) closeBtn.addEventListener('click', function(){ t.classList.remove('show'); });
    else setTimeout(function(){ t.classList.remove('show'); }, 4200);
  }

  var installBtn = document.getElementById('installBtn');
  var downloadBtn = document.getElementById('downloadBtn');

  // ---------- 2) "Install the app" button ----------
  var deferredPrompt = null;
  var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if(!isStandalone){
    if(isIOS){
      installBtn.classList.add('show');
      installBtn.addEventListener('click', function(){
        toast('To install it: tap the <strong>Share</strong> button (the square with an arrow pointing up) in Safari’s toolbar, then choose <strong>“Add to Home Screen”</strong>.', true);
      });
    } else {
      window.addEventListener('beforeinstallprompt', function(e){
        e.preventDefault();
        deferredPrompt = e;
        installBtn.classList.add('show');
      });
      installBtn.addEventListener('click', function(){
        if(!deferredPrompt){
          toast('Automatic installation isn’t available in this browser. You can still use “Download offline version” to save the app to your device.');
          return;
        }
        deferredPrompt.prompt();
        deferredPrompt.userChoice.finally(function(){ deferredPrompt = null; installBtn.classList.remove('show'); });
      });
      window.addEventListener('appinstalled', function(){
        installBtn.classList.remove('show');
        toast('App installed. You’ll find it among your apps, and it also works offline.');
      });
    }
  }

  // ---------- 3) "Download offline version" button ----------
  downloadBtn.addEventListener('click', function(){
    try{
      var clone = document.documentElement.cloneNode(true);
      ['installBtn','downloadBtn','pwaToast'].forEach(function(id){
        var el = clone.querySelector('#'+id);
        if(el) el.remove();
      });
      var html = '<!DOCTYPE html>\n' + clone.outerHTML;
      var blob = new Blob([html], {type:'text/html;charset=utf-8'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'the-method-of-the-question-journey-into-the-dark-offline.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      toast('Downloaded. Open the saved file with a double-click: it also works without a connection (after the first opening, as long as you’ve been online at least once).');
    }catch(err){
      toast('I wasn’t able to prepare the download in this browser. Try saving the page instead with Ctrl/Cmd+S.');
    }
  });

})();
</script>
