  'Violence and manipulation',

const ITINERARIES = {
  1: {
    title: 'Regaining clarity when body and mind are struggling',
    family: 'Knowledge and observation',
    recognition: 'Anxiety, panic, stress, pain or exhaustion stop you from thinking in an orderly way — the problem isn’t only what is happening, but the condition in which you’re facing it.',
    keyInsight: 'No tool is universal. Knowing more than one means being freer to choose, not having more obligations to meet.',
    caution: null,
    helpLine: null,
    culture: {
      art: { title: 'Katsushika Hokusai — The Great Wave off Kanagawa (1831)', note: 'The fishermen stay calm, not paralysed, in the face of an enormous wave — exactly the clarity this Itinerary is about, not the absence of difficulty.', url: 'https://commons.wikimedia.org/wiki/File:The_Great_Wave_off_Kanagawa.jpg' },
      music: { title: 'Johann Sebastian Bach — Prelude in C major, BWV 846 (1722)', note: 'Orderly, predictable lines that bring a sense of methodical calm — often used in clinical settings precisely to support concentration.', url: 'https://www.youtube.com/results?search_query=Bach%20Prelude%20in%20C%20major%20BWV%20846' },
      film: { title: 'Sully (2016), Clint Eastwood', note: 'Pilot Chesley Sullenberger keeps operational clarity through the 208 seconds of the flight — not spectacular heroism, but the cold application of learned procedure.', url: 'https://www.youtube.com/results?search_query=Sully%202016%20trailer' },
    },
    quote: { text: 'You can’t stop the waves, but you can learn to surf.', author: 'Jon Kabat-Zinn', source: 'Wherever You Go, There You Are, 1994' },
  },
  2: {
    title: 'Observing better before looking for a solution',
    family: 'Knowledge and observation',
    recognition: 'You notice that people involved in the same situation describe it differently, or that you’re jumping straight to an explanation without having gathered enough facts.',
    keyInsight: 'Observation comes before explanation. Poor observation makes finding the solution unlikely, even when one exists.',
    caution: null,
    helpLine: null,
    culture: {
      art: { title: 'Johannes Vermeer — Girl with a Pearl Earring (1665)', note: 'A face that seems to say everything and nothing — the work most often cited for the quality of patient observation, before any interpretation.', url: 'https://www.mauritshuis.nl/en/our-collection/artworks/670-girl-with-a-pearl-earring' },
      music: { title: 'Erik Satie — Gymnopédie No. 1 (1888)', note: 'A suspended, unhurried pace that invites you to listen in full before drawing conclusions.', url: 'https://www.youtube.com/results?search_query=Erik%20Satie%20Gymnopedie%20No%201' },
      film: { title: 'Paterson (2016), Jim Jarmusch', note: 'A bus driver patiently observes the smallest details of his day before turning them into poetry — the opposite of interpretive haste.', url: 'https://www.youtube.com/results?search_query=Paterson%202016%20Jarmusch%20trailer' },
    },
    quote: { text: 'The difference between looking and seeing is intelligence.', author: 'Amy Herman', source: 'Visual Intelligence, 2016' },
  },
  3: {
    title: 'Telling facts apart from interpretations',
    family: 'Knowledge and observation',
    recognition: 'A colleague, a friend, a family member does something ambiguous — doesn’t reply, changes tone — and you notice you’ve already built a whole story out of a single detail.',
    keyInsight: 'A fact can be observed or verified; an interpretation has to be argued for. Changing your interpretation when new facts appear is rigour, not weakness.',
    caution: null,
    helpLine: null,
    culture: {
      art: { title: 'René Magritte — The Treachery of Images, “Ceci n’est pas une pipe” (1929)', note: 'The world’s most famous work on the gap between representation and reality — exactly this Itinerary’s theme, in a single image.', url: 'https://collections.lacma.org/object/31931' },
      music: { title: 'Joni Mitchell — Both Sides Now (1969)', note: 'A song built explicitly around changing one’s interpretation of the same reality — clouds, love, life — seen from more than one side.', url: 'https://www.youtube.com/results?search_query=Joni%20Mitchell%20Both%20Sides%20Now' },
      film: { title: 'Rashomon (1950), Akira Kurosawa', note: 'The same event told by four witnesses in radically different ways — the reference film on the gap between fact and interpretation.', url: 'https://www.youtube.com/results?search_query=Rashomon%201950%20trailer' },
    },
    quote: { text: 'This Ladder of Inference shows that the evaluations and judgments people reach automatically are not concrete or self-evident. They are abstract and highly inferential.', author: 'Chris Argyris', source: 'Overcoming Organizational Defenses, 1990' },
  },
  4: {
    title: 'Asking better questions',
    family: 'Knowledge and observation',
    recognition: 'You feel stuck not because answers are missing, but because the question you’re asking yourself is confused, too broad, or more emotional than practical.',
    keyInsight: 'A good question orients the search before it even gives an answer. Missing information points to the next step.',
    caution: null,
    helpLine: null,
    culture: {
      art: { title: 'Auguste Rodin — The Thinker (1904)', note: 'Not a man who already has the answer, but a man inside the question — the very posture of reflection, not of conclusion.', url: 'https://www.musee-rodin.fr/en/musee/collections/oeuvres/thinker' },
      music: { title: 'U2 — I Still Haven’t Found What I’m Looking For (1987)', note: 'A song built entirely around the search for, not the possession of, an answer.', url: 'https://www.youtube.com/results?search_query=U2%20I%20Still%20Haven%27t%20Found%20What%20I%27m%20Looking%20For' },
      film: { title: 'Good Will Hunting (1997), Gus Van Sant', note: 'It’s the psychologist’s questions, not his answers, that unlock the protagonist — the best-known illustration of the power of a good question.', url: 'https://www.youtube.com/results?search_query=Good%20Will%20Hunting%201997%20trailer' },
    },
    quote: { text: 'A beautiful question is an ambitious yet actionable question that can begin to shift the way we perceive or think about something — and that might serve as a catalyst to bring about change.', author: 'Warren Berger', source: 'A More Beautiful Question, 2014, p. 8' },
  },
  5: {
    title: 'Building and testing sturdier hypotheses',
    family: 'Knowledge and observation',
    recognition: 'You already have an explanation in mind and notice you’re only looking for evidence that confirms it, or that you stopped at the first plausible idea without really checking it.',
    keyInsight: 'A hypothesis is not a fact. The best hypotheses are the ones that can be checked and proven wrong — changing them in the face of new evidence is rigour, not weakness.',
    caution: null,
    helpLine: null,
    culture: {
      art: { title: 'Thomas Eakins — The Gross Clinic (1875)', note: 'The discipline of direct clinical observation and verification, not of assumption — one of the reference paintings on the scientific method applied to the body.', url: 'https://en.wikipedia.org/wiki/The_Gross_Clinic' },
      music: { title: 'Coldplay — The Scientist (2002)', note: 'The attempt to go back to the start and redo the calculations, the way you do when a hypothesis turns out wrong and needs correcting.', url: 'https://www.youtube.com/results?search_query=Coldplay%20The%20Scientist' },
      film: { title: 'Blow-Up (1966), Michelangelo Antonioni', note: 'Palme d’Or at Cannes. A photographer obsessively enlarges an image to check what he actually saw — this Itinerary’s own discipline, taken to the extreme.', url: 'https://www.youtube.com/results?search_query=Blow-Up%201966%20Antonioni%20trailer' },
    },
    quote: { text: 'Every genuine test of a theory is an attempt to falsify it, to refute it. It can never be positively justified: it can only be found not yet refuted.', author: 'Karl Popper', source: 'Conjectures and Refutations, 1963, p. 36' },
  },
  6: {
    title: 'Choosing the method that fits the problem',
    family: 'Knowledge and observation',
    recognition: 'You’re tackling a problem with the wrong tool — for instance trying to negotiate something that is really a technical matter, or the other way round.',
    keyInsight: 'No method is universal: each one was built for a type of problem. Recognising the type of problem is already part of the solution.',
    caution: null,
    helpLine: null,
    culture: {
      art: { title: 'Leonardo da Vinci — drawings of machines and instruments, Codex Atlanticus (c. 1478-1519)', note: 'A whole lifetime spent designing a different instrument for every different problem, never one universal tool.', url: 'https://en.wikipedia.org/wiki/Codex_Atlanticus' },
      music: { title: 'Miles Davis — So What (1959, from Kind of Blue)', note: 'The track that opened the door to modal jazz — a compositional method chosen precisely because the problem, improvisation, called for a different tool than traditional harmony.', url: 'https://www.youtube.com/results?search_query=Miles%20Davis%20So%20What' },
      film: { title: 'Moneyball (2011), Bennett Miller', note: 'A sports manager applies an unconventional statistical method, but the right one for the problem in front of him, against those who insist on the traditional tools.', url: 'https://www.youtube.com/results?search_query=Moneyball%202011%20trailer' },
    },
    quote: { text: 'I suppose it is tempting, if the only tool you have is a hammer, to treat everything as if it were a nail.', author: 'Abraham Maslow', source: 'Toward a Psychology of Being, 1962' },
  },
  7: {
    title: 'Facing what cannot be solved',
    family: 'Limit',
    recognition: 'A diagnosis, a bereavement, a condition no action can change. You’re not looking for a solution: you’re trying to stay clear-headed while you go through something that has no resolution.',
    keyInsight: 'Not every problem can be solved: some have to be gone through. Asking for help is not a failure of the method — it is part of it.',
    caution: 'sensitive',
    helpLine: null,
    quote: { text: 'When we are no longer able to change a situation, we are challenged to change ourselves.', author: 'Viktor E. Frankl', source: 'Man’s Search for Meaning, 1946' },
    culture: {
      art: { title: 'Vincent van Gogh — At Eternity’s Gate (1890)', note: 'An old man, face in his hands, before what he cannot change — not mute despair, but a pain that remains present all the same. Van Gogh Museum.', url: 'https://www.vangoghmuseum.nl/en/collection/s0182v1962' },
      music: { title: 'Leonard Cohen — Anthem (1992)', note: 'One of the most quoted songs on how to stay open inside a wound that doesn’t close, without offering an easy fix.', url: 'https://www.youtube.com/results?search_query=Leonard%20Cohen%20Anthem' },
      film: { title: 'Wit (2001), Mike Nichols', note: 'From the Pulitzer Prize-winning play. Emma Thompson faces a terminal diagnosis without sentimentality, with dignity and clarity to the end.', url: 'https://www.youtube.com/results?search_query=Wit%202001%20Emma%20Thompson' },
    },
  },
  8: {
    title: 'Thinking clearly inside a condition that doesn’t depend on you',

    recognition: 'You’re living with scarcity of money, time or resources, and find it hard to plan, decide calmly, or resist choices you wouldn’t make with a clear head.',

    helpLine: null,
    culture: {

      music: { title: 'Tracy Chapman — Fast Car (1988)', note: 'One of the most honest songs about economic scarcity and the wish to get out of it, without self-pity.', url: 'https://www.youtube.com/results?search_query=Tracy%20Chapman%20Fast%20Car' },
      film: { title: 'Nomadland (2020), Chloé Zhao', note: 'Academy Award for Best Picture. Tells the story of life inside real economic scarcity, without cheap compassion or an easy redemption.', url: 'https://www.youtube.com/results?search_query=Nomadland%202020%20trailer' },
    },
    quote: { text: 'Scarcity captures our attention, and this attention has a narrow benefit: we are better at handling pressing needs in the moment. But it also has a cost: we neglect other things, and become less effective in the rest of life.', author: 'Sendhil Mullainathan and Eldar Shafir', source: 'Scarcity: Why Having Too Little Means So Much, 2013' },
  },
  9: {

    keyInsight: 'Weak ties — acquaintances, not close friends — are statistically the most effective channel for finding real opportunities.',

    helpLine: null,
    culture: {

      film: { title: 'Days and Clouds (Giorni e nuvole, 2007), Silvio Soldini', note: 'An Italian middle-class couple faces the sudden loss of a job, with dignity and no comic tone.', url: 'https://www.youtube.com/results?search_query=Giorni%20e%20nuvole%202007%20trailer' },

  10: {

    recognition: 'A friendship drifts apart without a clean break, a relationship ends, or the thought of losing an animal you love takes your breath away even while it’s still with you.',
    keyInsight: 'Loneliness isn’t a character flaw: it has measurable physical consequences. A loss without a clean break is still a real loss.',

    helpLine: null,

      film: { title: 'Lost in Translation (2003), Sofia Coppola', note: 'Two lonely people in the same city, who find each other without looking.', url: 'https://www.youtube.com/results?search_query=Lost%20in%20Translation%202003%20trailer' },
    },
    quote: { text: 'People who get trapped in loneliness have done nothing wrong. None of us is immune to feelings of isolation, any more than we are immune to hunger or physical pain.', author: 'John T. Cacioppo', source: 'Loneliness: Human Nature and the Need for Social Connection, 2008' },

  11: {
    title: 'Looking back without becoming its prisoner',

    recognition: 'You stop to look at the road you’ve travelled and ask yourself whether it was the right one — a thought that can arrive as easily at forty as at eighty.',

    caution: null,
    helpLine: null,
    culture: {

    helpLine: null,

      film: { title: 'Sliding Doors (1998), Peter Howitt', note: 'Two parallel lives branching off from a single tiny choice — the fantasy, and the fear, behind every decision: what if I’d chosen the other option?', url: 'https://www.youtube.com/results?search_query=Sliding%20Doors%201998%20trailer' },

    quote: { text: 'Learning to choose is hard. Learning to choose well is harder. And learning to choose well in a world of unlimited possibilities is harder still, perhaps too hard.', author: 'Barry Schwartz', source: 'The Paradox of Choice, 2004' },
  },
  13: {

    family: 'Future of the planet',
    recognition: 'Worry about climate change weighs on you, drains your energy, or makes you feel alone in a way that seems out of proportion.',
    keyInsight: 'It isn’t an overreaction to be corrected: it is a response shared by millions of people, recognised as rational by the scientific community.',
    caution: null,
    helpLine: null,
    culture: {

    quote: { text: 'I have long since abandoned the idea of a life without storms, or a world without dry and savage seasons. Life is too complicated, too constantly changing, to be anything but what it is.', author: 'Kay Redfield Jamison', source: 'An Unquiet Mind, 1995, p. 215' },

      art: { title: 'Rembrandt — The Return of the Prodigal Son (1669)', note: 'Not the guilt itself, but what happens next: the amends offered and accepted, not turned away. The Hermitage Museum.', url: 'https://www.hermitagemuseum.org/digital-collection/43413?lng=en' },
      music: { title: 'Johnny Cash — Hurt (2002, Nine Inch Nails cover)', note: 'A merciless look at one’s own past that acknowledges the mistake without sliding into total self-destruction.', url: 'https://www.youtube.com/results?search_query=Johnny%20Cash%20Hurt' },
      film: { title: 'Manchester by the Sea (2016), Kenneth Lonergan', note: 'Academy Award for Best Original Screenplay. A man consumed by a sense of guilt that tips over into paralysing shame.', url: 'https://www.youtube.com/results?search_query=Manchester%20by%20the%20Sea%20trailer' },
    },
    quote: { text: 'When we feel shame, we feel wrong as a person — fundamentally flawed because of something we did. It reflects who we are as people, not what we did.', author: 'June Tangney', source: 'interview, American Psychological Association, Speaking of Psychology podcast' },
  },
  16: {
    title: 'Understanding an addiction — yours, or that of someone close to you',
    family: 'Addiction',
    recognition: 'You, or someone close to you, struggles to stop something — a substance, gambling — despite a genuine wish to, and the most common judgment around it is still a weakness of character.',
    keyInsight: 'At its root, addiction is not a matter of character or willpower — all serious research converges on this, even where theories differ on why.',
    caution: 'clinical',
    helpLine: 'professional',
    culture: {
      art: { title: 'Caroline Knapp — Drinking: A Love Story (1996)', note: 'A memoir critics called free of self-pity and of spectacle — recognised for helping to crack the stereotypes around addiction, told in the first person by a woman she herself called a “high-functioning alcoholic”.', url: 'https://en.wikipedia.org/wiki/Caroline_Knapp' },
      music: { title: 'Joe Walsh — One Day at a Time', note: 'Written by a guitarist sober for decades, known for his genuine commitment to supporting recovery — it embodies the “one day at a time” philosophy of support groups, rather than just talking about it.', url: 'https://www.youtube.com/results?search_query=Joe%20Walsh%20One%20Day%20at%20a%20Time' },
      film: { title: 'Beautiful Boy (2018), Felix Van Groeningen', note: 'Tells the story of both the person living with addiction and the person standing by them — a father and a son, as in this Itinerary. Based on a true story, with no glamour.', url: 'https://www.youtube.com/results?search_query=Beautiful%20Boy%202018%20trailer' },
    },
    quote: { text: 'Not why the addiction. Why the pain.', author: 'Gabor Maté', source: 'In the Realm of Hungry Ghosts, 2008' },
  },
  17: {
    title: 'Rebuilding a whole life around a limit that stays',
    family: 'Limit',
    recognition: 'A chronic, non-fatal illness — diabetes, multiple sclerosis, persistent pain, a disability — has changed the life you had imagined, without being either a brief episode or an ending.',
    keyInsight: 'It isn’t personal weakness: it is a “biographical disruption” recognised by research. A sturdier rebuilding than before is possible, not guaranteed.',
    caution: null,
    helpLine: null,
    culture: {
      art: { title: 'Frida Kahlo — The Broken Column (1944)', note: 'Her own ailing body painted without self-pity, with the same frank dignity with which the artist lived her chronic condition. Museo Dolores Olmedo.', url: 'https://en.wikipedia.org/wiki/The_Broken_Column' },
      music: { title: 'Peter Gabriel with Kate Bush — Don’t Give Up (1986)', note: 'A duet built on mutual support inside a difficulty that doesn’t pass quickly, with no easy promises.', url: 'https://www.youtube.com/results?search_query=Peter%20Gabriel%20Kate%20Bush%20Don%27t%20Give%20Up' },
      film: { title: 'The Invisible Kingdom: Reimagining Chronic Illness (2022), Meghan O’Rourke', note: 'National Book Award finalist. A decade spent rebuilding identity and career around a chronic, non-terminal illness.', url: 'https://www.youtube.com/results?search_query=Meghan%20O%27Rourke%20Invisible%20Kingdom' },
    },
    quote: { text: 'The diagnosis of a chronic illness disrupts the expectations and plans a person holds for their own future, requiring a radical rethinking of their own biography and identity.', author: 'Michael Bury', source: 'Chronic Illness as Biographical Disruption, Sociology of Health & Illness, 1982, p. 169' },
  },
  18: {
    title: 'Living with the feeling of never having enough time',
    family: 'Time',
    recognition: 'You feel chronically short of time, even when the calendar doesn’t look that full, and your free time gets eaten up by other people’s demands before you can use it.',
    keyInsight: 'Time poverty is a real, measurable condition, with an impact on wellbeing comparable to unemployment — not a personal failure of organisation.',
    caution: null,
    helpLine: null,
    culture: {
      art: { title: 'Salvador Dalí — The Persistence of Memory (1931)', note: 'The melting clocks — time as we actually live it, subjective and ungraspable, not the time measured precisely by a clock.', url: 'https://www.moma.org/collection/works/79018' },
      music: { title: 'Pink Floyd — Time (1973, from The Dark Side of the Moon)', note: 'One of the most quoted portraits of time slipping away without our noticing.', url: 'https://www.youtube.com/results?search_query=Pink%20Floyd%20Time' },
      film: { title: 'About Time (2013), Richard Curtis', note: 'A man able to travel in time discovers the real lesson isn’t having more of it, but truly inhabiting the time he has.', url: 'https://www.youtube.com/results?search_query=About%20Time%202013%20trailer' },
    },
    quote: { text: 'People who experience time poverty are less happy, less productive, and more stressed. They exercise less, eat fattier foods, and have a higher incidence of cardiovascular disease.', author: 'Ashley Whillans', source: 'Time Smart, 2020' },
  },
  19: {
    title: 'Dealing with the fear of getting it wrong as a parent',
    family: 'Parenthood',
    recognition: 'You’re afraid every mistake you make as a parent leaves permanent damage in your child — a moment of impatience, a misunderstanding, the wrong tone of voice.',
    keyInsight: 'In Tronick’s studies and the parent-child interaction research that followed, moments of misattunement are frequent: the “70%” figure that has circulated around these studies should be read as a feature of the observation protocols used, not as a universal percentage that applies to every relationship. What the data shows most solidly is that repair after a difficult moment matters more than the absence of mistakes.',
    caution: null,
    helpLine: null,
    culture: {
      art: { title: 'Mary Cassatt — The Child’s Bath (1893)', note: 'The imperfect, everyday tenderness of caregiving — not an unreachable ideal of parenthood.', url: 'https://www.artic.edu/artworks/111442/the-child-s-bath' },
      music: { title: 'Stevie Wonder — Isn’t She Lovely (1976)', note: 'Parental tenderness in its most direct form, written for the birth of the artist’s daughter.', url: 'https://www.youtube.com/results?search_query=Stevie%20Wonder%20Isn%27t%20She%20Lovely' },
      film: { title: 'Boyhood (2014), Richard Linklater', note: 'Twelve years of real filming show an imperfect parenthood, made of everyday mistakes and repairs, not an unreachable ideal.', url: 'https://www.youtube.com/results?search_query=Boyhood%202014%20trailer' },
    },
    quote: { text: 'Rupture is inevitable, but repair is what really counts.', author: 'Daniel J. Siegel', source: 'interview, Happily Family' },
  },
  20: {
    title: 'Facing a conflict without letting it become a war',
    family: 'Conflict',
    recognition: 'A disagreement with someone — a family member, a colleague — has turned into something bigger: you’re no longer discussing the original problem, but a pile-up of past wrongs.',
    keyInsight: 'A conflict isn’t resolved by proving who is wrong, but by understanding what problem you’re really trying to address.',
    caution: null,
    helpLine: null,
    culture: {
      art: { title: 'Norman Rockwell — The Golden Rule (1961)', note: 'Different faces and cultures side by side, with none prevailing by force — the opposite of the war a conflict risks becoming. United Nations Headquarters, New York.', url: 'https://en.wikipedia.org/wiki/The_Golden_Rule_(painting)' },
      music: { title: 'Marvin Gaye — What’s Going On (1971)', note: 'An invitation to dialogue instead of confrontation, written at a moment of high social tension.', url: 'https://www.youtube.com/results?search_query=Marvin%20Gaye%20What%27s%20Going%20On' },
      film: { title: '12 Angry Men (1957), Sidney Lumet', note: 'Twelve people in disagreement learn to really listen to each other, one position at a time, instead of simply defending their own.', url: 'https://www.youtube.com/results?search_query=12%20Angry%20Men%201957%20trailer' },
    },
    quote: { text: 'Once you can clearly describe what you are reacting to, free of your interpretation or judgment, the other person is less likely to become defensive as they listen to you.', author: 'Marshall B. Rosenberg', source: 'Nonviolent Communication: A Language of Life, 1999' },
  },
  21: {
    title: 'Living with the knowledge that your own life has an end',
    family: 'Limit',
    recognition: 'The thought of death — your own, or that of someone you love — has come back insistently, perhaps after losing someone your own age, and you find it hard to tell fear apart from real danger.',
    keyInsight: 'Mortality isn’t a problem the method can solve, but a limit it can help you name correctly — telling present danger apart from a general possibility.',
    caution: 'sensitive',
    helpLine: null,
    culture: {
      art: { title: 'Caspar David Friedrich — The Monk by the Sea (1808-10)', note: 'The tiny figure before the immensity: not terror, but contemplation. Alte Nationalgalerie, Berlin.', url: 'https://commons.wikimedia.org/wiki/File:Friedrich,_Caspar_David_-_M%C3%B6nch_am_Meer_-_Alte_Nationalgalerie_in_Berlin.jpg' },
      music: { title: 'Samuel Barber — Adagio for Strings', note: 'Described by scholars as a journey from sadness to a “serene acceptance”, not to despair.', url: 'https://www.youtube.com/results?search_query=Samuel%20Barber%20Adagio%20for%20Strings' },
      film: { title: 'Departures — Okuribito (2008)', note: 'Academy Award for Best Foreign Language Film. Tells the story of death with dignity and delicacy, not drama.', url: 'https://www.youtube.com/results?search_query=Departures%20Okuribito%20trailer' },
    },
    quote: { text: 'The more unlived your life, the greater your death anxiety. The more you fail to live your life fully, the more you will fear death.', author: 'Irvin D. Yalom', source: 'Staring at the Sun, 2008' },
  },
  22: {
    title: 'Finding a direction again when you’ve lost the sense of the path',
    family: 'Search for meaning',
    recognition: 'After a loss, a change, or with no obvious cause, you can no longer see a direction — you haven’t lost the road, you’ve lost the map you used to read it.',
    keyInsight: 'Losing the sense of the path doesn’t mean you’ve lost the way forever. It often means the map needs updating.',
    caution: null,
    helpLine: null,
    culture: {
      art: { title: 'Gustave Doré — illustration for Dante’s Inferno, Canto I (1861)', note: '“Midway upon the journey of our life, I found myself within a forest dark, for the straightforward pathway had been lost” — the image that gave this very book its name.', url: 'https://commons.wikimedia.org/wiki/File:Dante_lost_in_the_dark_forest,_illustration_to_Dante%E2%80%99s_Inferno_by_Gustave_Dor%C3%A9.jpg' },
      music: { title: 'Bruce Springsteen — The Rising (2002)', note: 'A song built explicitly around finding a direction again after losing every map.', url: 'https://www.youtube.com/results?search_query=Bruce%20Springsteen%20The%20Rising' },
      film: { title: 'Wild (2014), Jean-Marc Vallée', note: 'A woman who, after losing every direction, literally rebuilds her own path one step at a time along the Pacific Crest Trail.', url: 'https://www.youtube.com/results?search_query=Wild%202014%20trailer' },
    },
    quote: { text: 'Every transition begins with an ending. We have to let go of the old thing before we can pick up the new one — not just outwardly, but inwardly as well.', author: 'William Bridges', source: 'Transitions: Making Sense of Life’s Changes, 1980' },
  },
  23: {
    title: 'Grieving a child who never arrived',
    family: 'Ambiguous loss',
    recognition: 'A longed-for child doesn’t arrive — through infertility, through a path that never reached its end — and you carry a real pain with no precise event to mourn.',
    keyInsight: 'Not having a precise event to mourn doesn’t make the grief any less real. “Closure is a myth”: the goal isn’t to turn the page, but to learn to live alongside the absence.',
    caution: 'sensitive',
    helpLine: 'fertility',
    culture: {
      art: { title: 'Frida Kahlo — Henry Ford Hospital (1932)', note: 'Painted after a miscarriage, one of the first explicit portrayals of this grief in the history of art — raw, not consoling, but honest.', url: 'https://en.wikipedia.org/wiki/Henry_Ford_Hospital_(painting)' },
      music: { title: 'Sarah McLachlan — Angel (1997)', note: 'Though not written for this, it has been adopted by many perinatal-loss communities as the soundtrack to a grief that is often silent.', url: 'https://www.youtube.com/results?search_query=Sarah%20McLachlan%20Angel' },
      film: { title: 'Private Life (2018), Tamara Jenkins', note: 'Tells, with rare realism, a couple’s journey through infertility and treatment, without sentimentality or guaranteed outcomes.', url: 'https://www.youtube.com/results?search_query=Private%20Life%202018%20trailer' },
    },
    quote: { text: 'We do better to live with grief than to deny it or close the door on it. Our task is to acknowledge our losses, name them, find meaning in them, and let go of the search for closure. Instead of seeking closure, we seek meaning and new hope.', author: 'Pauline Boss', source: 'The Myth of Closure, 2021' },
  },
  24: {
    title: 'Accompanying a parent who, while still present, is beginning to disappear',
    family: 'Ambiguous loss',
    recognition: 'An elderly parent is still physically present, but cognitive decline is making them, little by little, less reachable — and you find yourself effectively becoming your parent’s parent.',
    keyInsight: 'This is an ambiguous loss just as much as a physical absence, and deserves the same recognition. Seeking support as a caregiver is not an exception — it is often necessary.',
    caution: 'sensitive',
    helpLine: 'caregiver',
    culture: {
      art: { title: 'William Utermohlen — self-portraits (1996-2000)', note: 'After his Alzheimer’s diagnosis, the artist painted himself every year to understand what was happening to him — not interpreted by others after his death; the sequence is scientifically documented (The Lancet, 2001). An act of self-understanding, not a spectacle of decline.', url: 'https://en.wikipedia.org/wiki/William_Utermohlen' },
      music: { title: 'Ludovico Einaudi — Seven Days Walking (soundtrack of The Father)', note: 'The Italian composer who wrote the film’s score — hypnotic pieces repeated with small variations, mirroring the confusion of memory.', url: 'https://www.youtube.com/results?search_query=Ludovico%20Einaudi%20Seven%20Days%20Walking' },
      film: { title: 'The Father (2020), Florian Zeller', note: 'Academy Award for Best Actor. Tells the story of dementia from the point of view of the person living it, not only of those caring for them — a rare angle. Emotionally intense; watch it when you feel ready.', url: 'https://www.youtube.com/results?search_query=The%20Father%202020%20trailer' },
    },
    quote: { text: 'I don’t like to use the word “acceptance”, but I think we can learn to be comfortable with what we cannot solve.', author: 'Pauline Boss', source: 'interview, On Being Project' },
  },
  25: {
    title: 'Living through the loss of a place, not a person',
    family: 'Ambiguous loss',
    recognition: 'You’ve left your country, your language, your world of references — or you’ve stayed put while the place you called home has changed before your eyes.',
    keyInsight: 'Losing a place or a world of references is grief in its own right, even without anyone’s death. Keeping a tie to your culture of origin helps, it doesn’t hinder.',
    caution: null,
    helpLine: null,
    culture: {
      art: { title: 'Marc Chagall — I and the Village (1911)', note: 'The world of origin transfigured by memory and distance — not a real place, but the one rebuilt by someone who left it. MoMA.', url: 'https://www.moma.org/collection/works/78984' },
      music: { title: 'Simon & Garfunkel — Homeward Bound (1966)', note: 'Longing for a place left behind, written on tour far from home.', url: 'https://www.youtube.com/results?search_query=Simon%20and%20Garfunkel%20Homeward%20Bound' },
      film: { title: 'Brooklyn (2015), John Crowley', note: 'A young Irish woman torn between two worlds in the 1950s — longing, double belonging, with no easy rhetoric.', url: 'https://www.youtube.com/results?search_query=Brooklyn%202015%20trailer' },
    },
    quote: { text: 'Linguistic dispossession is close to the dispossession of the self.', author: 'Eva Hoffman', source: 'Lost in Translation: A Life in a New Language, 1989' },
  },
  26: {
    title: 'Starting over after an economic failure',
    family: 'Failure and rebuilding',
    recognition: 'A venture you had put everything into has failed, and beyond the practical problem you carry a judgment of yourself that is often harsher than anyone else’s.',
    keyInsight: 'An economic failure is often a grief too, with its own necessary processing. The inner judgment often weighs more than the outer one, and naming it out loud lightens it.',
    caution: null,
    helpLine: null,
    culture: {
      art: { title: 'Grant Wood — American Gothic (1930)', note: 'Still, stern faces, painted in the depths of the Great Depression — dignified endurance inside a hard economic time, not despair. Art Institute of Chicago.', url: 'https://www.artic.edu/artworks/6565/american-gothic' },
      music: { title: 'Bruce Springsteen — Youngstown (1995)', note: 'The collapse of an entire working and productive identity, not just of an income — a direct portrait of economic failure on a personal and collective scale.', url: 'https://www.youtube.com/results?search_query=Bruce%20Springsteen%20Youngstown' },
      film: { title: 'The Pursuit of Happyness (2006), Gabriele Muccino', note: 'Based on a true story. Economic collapse and the attempt to rebuild, step by step, with no shortcuts.', url: 'https://www.youtube.com/results?search_query=The%20Pursuit%20of%20Happyness%20trailer' },
    },
    quote: { text: 'If you put shame in a Petri dish, it needs three ingredients to grow exponentially: secrecy, silence, and judgment.', author: 'Brené Brown', source: 'Daring Greatly, 2012, p. 111' },
  },
  27: {
    title: 'Living through a betrayal in a relationship you still want to live',
    family: 'Betrayal and trust',
    recognition: 'You’ve discovered a betrayal in a relationship that hasn’t ended, and the discovery itself is marking you — intrusive thoughts, hypervigilance, images that keep coming back uncontrolled.',
    keyInsight: 'The pain of betrayal has a real, clinically measured traumatic component. Trust is rebuilt through small, repeated gestures over time, not a single promise.',
    caution: 'sensitive',
    helpLine: null,
    culture: {
      art: { title: 'Philip Hermogenes Calderon — Broken Vows (1856)', note: 'Described by Tate Britain itself as “a study in emotional restraint”: not melodrama, but silent dignity at the moment of discovery.', url: 'https://www.tate.org.uk/art/artworks/calderon-broken-vows-n05780' },
      music: { title: 'Christina Perri — Jar of Hearts (2010)', note: 'The pain and resilience after a discovery that changes everything — not revenge, but the attempt to put oneself back together.', url: 'https://www.youtube.com/results?search_query=Christina%20Perri%20Jar%20of%20Hearts' },
      film: { title: 'The Days of Abandonment (I giorni dell’abbandono, 2005), Roberto Faenza — from the novel by Elena Ferrante', note: 'Tells the upheaval of discovery with rare precision. The film’s ending, though, diverges from this Itinerary: the protagonist doesn’t rebuild the couple, she rebuilds herself.', url: 'https://www.youtube.com/results?search_query=I%20giorni%20dell%27abbandono%20trailer' },
    },
    quote: { text: 'When betrayal robs us of the future we had been working toward, it also invalidates the sacrifices of our past.', author: 'Esther Perel', source: 'The State of Affairs: Rethinking Infidelity, 2017' },
  },
  28: {
    title: 'Carrying a pain that never ends, alongside a love that never runs out',
    family: 'Chronic pain',
    recognition: 'You are a parent of a child with a significant disability, and you carry a pain that returns in waves — often precisely at the moments when other children reach milestones yours will not.',
    keyInsight: 'This chronic pain isn’t a grief to get over once and for all, and it doesn’t contradict your love for your child — it is born, in part, from that very love.',
    caution: 'sensitive',
    helpLine: null,
    culture: {
      art: { title: 'Egon Schiele — Mother with Two Children (1917)', note: 'Not a portrayal of disability itself, but the total, almost painful fusion between a mother and her children — the intensity of a bond that never loosens. Belvedere, Vienna.', url: 'https://en.wikipedia.org/wiki/Mother_with_Two_Children_(Schiele)' },
      music: { title: 'Kevin Hearn — Flying Dreams', note: 'A lullaby written by a real father (keyboardist of the Barenaked Ladies) for his daughter Havana, non-verbal due to a rare brain malformation. It isn’t fiction: it is his life.', url: 'https://www.youtube.com/results?search_query=Kevin%20Hearn%20Flying%20Dreams' },
      film: { title: 'Color Book (2024), David Fortune', note: 'A father and his son with Down syndrome, played by an actor who actually has Down syndrome. Tells the story of love and hardship together, without pitying rhetoric.', url: 'https://www.youtube.com/results?search_query=Color%20Book%202024%20trailer' },
    },
  },
  29: {
    title: 'Living through a crisis in your deepest convictions',
    family: 'Crisis of faith and identity',
    recognition: 'The convictions that have always guided you — religious, philosophical, about who you are — are being called into question, and you feel lost or even guilty for the very fact of doubting.',
    keyInsight: 'This isn’t a failure of your faith or your convictions: it is a recognisable developmental stage, often necessary to reach convictions more mature than the ones you started with.',
    caution: null,
    helpLine: null,
    culture: {
      art: { title: 'Caravaggio — The Incredulity of Saint Thomas (1601-1602)', note: 'The finger that touches the wound in order to truly believe — doubt not as a betrayal of faith, but as part of its journey. Sanssouci, Potsdam.', url: 'https://en.wikipedia.org/wiki/The_Incredulity_of_Saint_Thomas_(Caravaggio)' },
      music: { title: 'Leonard Cohen — Hallelujah (1984)', note: 'One of the most quoted songs about faith travelled through by doubt, not despite it.', url: 'https://www.youtube.com/results?search_query=Leonard%20Cohen%20Hallelujah' },
      film: { title: 'Winter Light (Nattvardsgästerna, 1963), Ingmar Bergman', note: 'A Protestant pastor goes through a radical crisis of faith. Note: the film is darker and more unresolved than how this Itinerary frames doubt — here it doesn’t arrive at a new maturity, it stays in silence.', url: 'https://www.youtube.com/results?search_query=Winter%20Light%20Bergman%201963%20trailer' },
    },
    quote: { text: 'Faith is a person’s way of seeing him- or herself in relation to others against a background of shared meaning and purpose.', author: 'James W. Fowler', source: 'Stages of Faith, 1981' },
  },
  30: {
    title: 'Receiving what life gives you',
    family: 'Gratitude and positive change',
    recognition: 'Something good has happened — a birth, a love, a new job — but instead of enjoying it you feel lost, afraid of not living up to it, or afraid of losing what you’ve gained.',
    keyInsight: 'Even positive changes call for a new orientation. The method is useful even when life surprises you with something good, not only when the road is hard.',
    caution: null,
    helpLine: null,
    culture: {
      art: { title: 'Gustav Klimt — Tree of Life (1909)', note: 'An image of growth and abundance, not of perfect stillness — even positive changes have their own complexity to take in. MAK, Vienna.', url: 'https://en.wikipedia.org/wiki/Tree_of_Life_(Klimt)' },
      music: { title: 'Louis Armstrong — What a Wonderful World (1967)', note: 'Gratitude without naivety — the voice of a man who had also seen the worst of the world, and still chose to name its beauty.', url: 'https://www.youtube.com/results?search_query=Louis%20Armstrong%20What%20a%20Wonderful%20World' },
      film: { title: 'It’s a Wonderful Life (1946), Frank Capra', note: 'The best-known classic about recognising and receiving the good already present in your own life, without having to earn it the hard way.', url: 'https://www.youtube.com/results?search_query=It%27s%20a%20Wonderful%20Life%201946%20trailer' },
    },
    quote: { text: 'In the face of demoralization, gratitude has the power to energize. In the face of brokenness, gratitude has the power to heal. In the face of despair, gratitude has the power to bring hope.', author: 'Robert A. Emmons', source: 'Gratitude Works!, 2013' },
  },
  31: {
    title: 'Living through the death of someone you love, person or animal',
    family: 'Grief and the death of a loved one',
    recognition: 'Someone who was there — a person, or an animal you shared years with — has died, and you don’t know whether the way you’re grieving is the “right” one.',
    keyInsight: 'There is no single track for grief: resilience — continuing to function while staying inside real pain — is the most common outcome, not a sign of detachment.',
    caution: 'sensitive',
    helpLine: null,
    culture: {
      art: { title: 'Käthe Kollwitz — The Grieving Parents (1932)', note: 'A sculpture the artist dedicated to her son Peter, killed in the war at 18 — not an abstract allegory, but her own experience as a mother. “There is in our lives a wound that will never heal. And it shouldn’t,” she wrote.', url: 'https://en.wikipedia.org/wiki/K%C3%A4the_Kollwitz' },
      music: { title: 'Gabriel Fauré — Requiem, “In Paradisum”', note: 'Among the most consoling funeral music in the classical repertoire — explicitly less dark than other requiems.', url: 'https://www.youtube.com/results?search_query=Faure%20Requiem%20In%20Paradisum' },
      film: { title: 'Departures — Okuribito (2008)', note: 'The same film as the Itinerary on mortality: here it resonates from the side of those who remain.', url: 'https://www.youtube.com/results?search_query=Departures%20Okuribito%20trailer' },
    },
    quote: { text: 'We are not used to thinking of grief as a process that brings comfort — yet this is exactly what resilient people tend to do.', author: 'George A. Bonanno', source: 'The Other Side of Sadness, 2009, p. 72' },
  },
  32: {
    title: 'Recognising physical, psychological or economic violence, and manipulation',
    family: 'Violence and manipulation',
    recognition: 'You feel constantly belittled, controlled or second-guessed by someone close to you — or you systematically doubt your own perception after talking with this person.',
    keyInsight: 'Violence isn’t only physical. Doubting your own perception, inside a relationship like this, is more often a symptom of manipulation than a sign of being “too sensitive”.',
    caution: 'violence',
    helpLine: '1522',
    culture: {

// ============ 1. GUIDED BREATHING ============
function BreathingTool({ baseFont, onExit }) {
  const [running, setRunning] = useState(false);
  const [phase, setPhase] = useState('inhale'); // inhale | hold | exhale
  const [scale, setScale] = useState(0.55);
  const [cycles, setCycles] = useState(0);
  const timeoutRef = useRef(null);

  const PHASES = [
    { key: 'inhale', label: 'Breathe in through your nose', duration: 4000, targetScale: 1 },
    { key: 'hold', label: 'Hold', duration: 1500, targetScale: 1 },
    { key: 'exhale', label: 'Breathe out through your mouth', duration: 6000, targetScale: 0.55 },
  ];

  useEffect(() => {
    if (!running) return;
    let idx = PHASES.findIndex((p) => p.key === phase);
    const current = PHASES[idx];
    setScale(current.targetScale);
    timeoutRef.current = setTimeout(() => {
      const nextIdx = (idx + 1) % PHASES.length;
      if (nextIdx === 0) setCycles((c) => c + 1);
      setPhase(PHASES[nextIdx].key);
    }, current.duration);
    return () => clearTimeout(timeoutRef.current);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [running, phase]);

  const start = () => { setPhase('inhale'); setCycles(0); setRunning(true); };
  const stop = () => { setRunning(false); clearTimeout(timeoutRef.current); setScale(0.55); };
  const currentLabel = PHASES.find((p) => p.key === phase)?.label || 'Breathe in through your nose';

  return (
    <div>
      <div style={{ ...card, textAlign: 'center', paddingTop: 40, paddingBottom: 36 }}>
        <div style={{ width: 220, height: 220, margin: '0 auto 28px auto', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <div style={{
            width: 180 * scale, height: 180 * scale, borderRadius: '50%',
            background: 'radial-gradient(circle, #EAF1FC 0%, #1F4E8C 100%)',
            transition: `all ${phase === 'inhale' ? 4 : phase === 'exhale' ? 6 : 1.5}s ease-in-out`,
            boxShadow: '0 4px 24px rgba(31,78,140,0.25)',
          }} />
        </div>
        <div style={{ fontSize: baseFont * 1.15, fontWeight: 800, color: '#17203A', marginBottom: 8, minHeight: 30 }}>
          {running ? currentLabel : 'Ready whenever you are'}
        </div>
        {running && <div style={{ fontSize: baseFont * 0.85, color: '#6b6b6b' }}>Cycles completed: {cycles}</div>}
      </div>
      <div style={{ display: 'flex', gap: 12, justifyContent: 'center' }}>
        {!running
          ? <button onClick={start} style={btnPrimary('#1F4E8C')}>Start</button>
          : <button onClick={stop} style={btnSecondary}>Stop</button>}
        <button onClick={onExit} style={btnSecondary}>&#8592; Back to tools</button>
      </div>
      <p style={{ fontSize: baseFont * 0.85, color: '#6b6b6b', textAlign: 'center', marginTop: 20, lineHeight: 1.5 }}>
        Breathe in as the circle grows, breathe out as it shrinks. Five to ten minutes is enough.
      </p>
    </div>
  );
}

// ============ 2. MUSCLE RELAXATION (JACOBSON) ============
const MUSCLE_GROUPS = ['Hands and forearms', 'Arms', 'Shoulders', 'Face', 'Abdomen', 'Legs', 'Feet'];
function JacobsonTool({ baseFont, onExit }) {
  const [idx, setIdx] = useState(0);
  const [phase, setPhase] = useState('ready'); // ready | tension | release
  const [secondsLeft, setSecondsLeft] = useState(6);
  const intervalRef = useRef(null);

  useEffect(() => {
    if (phase === 'ready') return;
    setSecondsLeft(phase === 'tension' ? 6 : 8);
    intervalRef.current = setInterval(() => {
      setSecondsLeft((s) => {
        if (s <= 1) {
          clearInterval(intervalRef.current);
          if (phase === 'tension') setPhase('release');
          else if (idx < MUSCLE_GROUPS.length - 1) { setIdx((i) => i + 1); setPhase('ready'); }
          else setPhase('done');
          return 0;
        }
        return s - 1;
      });
    }, 1000);
    return () => clearInterval(intervalRef.current);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [phase]);

  const startGroup = () => setPhase('tension');
  const restart = () => { setIdx(0); setPhase('ready'); };

  if (phase === 'done') {
    return (
      <div style={card}>
        <div style={{ textAlign: 'center' }}>
          <div style={{ fontSize: 40, marginBottom: 12 }}>&#10003;</div>
          <div style={{ fontSize: baseFont * 1.1, fontWeight: 800, color: '#17203A', marginBottom: 20 }}>
            Sequence completed
          </div>
          <div style={{ display: 'flex', gap: 12, justifyContent: 'center' }}>
            <button onClick={restart} style={btnPrimary('#6B4FA0')}>Start over</button>
            <button onClick={onExit} style={btnSecondary}>&#8592; Tools</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div>
      <div style={{ fontSize: 13, color: '#6b6b6b', fontWeight: 700, marginBottom: 8 }}>
        GROUP {idx + 1} OF {MUSCLE_GROUPS.length}
      </div>
      <div style={{ ...card, textAlign: 'center', paddingTop: 32, paddingBottom: 32 }}>
        <div style={{ fontSize: baseFont * 1.3, fontWeight: 800, color: '#6B4FA0', marginBottom: 18 }}>
          {MUSCLE_GROUPS[idx]}
        </div>
        {phase === 'ready' && (
          <>
            <p style={{ fontSize: baseFont, color: '#2b2b2b', marginBottom: 20 }}>Ready to tense this muscle group?</p>
            <button onClick={startGroup} style={btnPrimary('#6B4FA0')}>Start tensing</button>
          </>
        )}
        {phase === 'tension' && (
          <>
            <div style={{ fontSize: baseFont * 1.6, fontWeight: 800, color: '#C0392B', marginBottom: 10 }}>Tense</div>
            <div style={{ fontSize: baseFont * 2, fontWeight: 800, color: '#17203A' }}>{secondsLeft}</div>
          </>
        )}
        {phase === 'release' && (
          <>
            <div style={{ fontSize: baseFont * 1.6, fontWeight: 800, color: '#2F8F5B', marginBottom: 10 }}>Release</div>
            <div style={{ fontSize: baseFont * 2, fontWeight: 800, color: '#17203A' }}>{secondsLeft}</div>
            <p style={{ fontSize: baseFont * 0.85, color: '#6b6b6b', marginTop: 12 }}>Notice the contrast between tension and release.</p>
          </>
        )}
      </div>
      <button onClick={onExit} style={btnSecondary}>&#8592; Back to tools</button>
    </div>
  );
}

function GroundingTool({ baseFont, onExit }) {
  const [idx, setIdx] = useState(0);
  const [values, setValues] = useState(Array(5).fill(''));
  const step = GROUNDING_STEPS[idx];
  const items = (values[idx] || '').split('\n');

  const updateItem = (i, val) => {
    const lines = (values[idx] || '').split('\n');
    while (lines.length < step.count) lines.push('');
    lines[i] = val;
    setValues((prev) => { const next = [...prev]; next[idx] = lines.join('\n'); return next; });

  if (idx >= GROUNDING_STEPS.length) {

            <button onClick={onExit} style={btnSecondary}>&#8592; Tools</button>
          </div>
        </div>
      </div>

  const lines = (values[idx] || '').split('\n');
  while (lines.length < step.count) lines.push('');

  return (
    <div>
      <div style={{ fontSize: 13, color: '#6b6b6b', fontWeight: 700, marginBottom: 8 }}>STEP {idx + 1} OF 5</div>
      <div style={card}>

    </div>
  );
}

function MindfulnessTool({ baseFont, onExit }) {
  const [running, setRunning] = useState(false);
  const [secondsLeft, setSecondsLeft] = useState(5 * 60);
  const [scale, setScale] = useState(0.6);
  const intervalRef = useRef(null);
  const breathRef = useRef(null);

  useEffect(() => {
    if (!running) return;
    intervalRef.current = setInterval(() => {
      setSecondsLeft((s) => { if (s <= 1) { setRunning(false); return 0; } return s - 1; });
    }, 1000);
    let expanding = true;
    breathRef.current = setInterval(() => { setScale(expanding ? 1 : 0.6); expanding = !expanding; }, 4000);
    return () => { clearInterval(intervalRef.current); clearInterval(breathRef.current); };
  }, [running]);

  const mins = Math.floor(secondsLeft / 60);

  { key: 'orienta', label: 'Orient', prompt: 'How do these signals connect to what you already know or have already lived through?', color: '#2F8F5B' },

  { key: 'agisci', label: 'Act', prompt: 'What will you actually do? The loop will start again by observing the effect of this action.', color: '#C0392B' },
];
function OODATool({ baseFont, onExit }) {
  const [round, setRound] = useState(1);
  const [idx, setIdx] = useState(0);
  const [history, setHistory] = useState([]);
  const [current, setCurrent] = useState({ osserva: '', orienta: '', decidi: '', agisci: '' });
  const phase = OODA_PHASES[idx];

  const updateField = (val) => setCurrent((prev) => ({ ...prev, [phase.key]: val }));
  const next = () => {
    if (idx < 3) { setIdx(idx + 1); return; }
    setHistory((h) => [...h, { round, ...current }]);
    setCurrent({ osserva: '', orienta: '', decidi: '', agisci: '' });
    setIdx(0);
    setRound((r) => r + 1);
  };

  return (
    <div>
      {history.length > 0 && (
        <div style={{ marginBottom: 16 }}>
          {history.map((h, i) => (
            <div key={i} style={{ fontSize: baseFont * 0.8, color: '#6b6b6b', marginBottom: 4 }}>
              Loop {h.round} completed — you acted: "{h.agisci.slice(0, 60)}{h.agisci.length > 60 ? '…' : ''}"
            </div>
          ))}
        </div>
      )}
      <div style={{ fontSize: 13, color: '#6b6b6b', fontWeight: 700, marginBottom: 8 }}>LOOP {round} — STEP {idx + 1} OF 4</div>
      <div style={{ ...card, borderColor: phase.color }}>
        <div style={{ fontSize: baseFont * 1.2, fontWeight: 800, color: phase.color, marginBottom: 10 }}>{phase.label}</div>
        <p style={{ fontSize: baseFont * 0.92, color: '#2b2b2b', marginBottom: 14, lineHeight: 1.5 }}>{phase.prompt}</p>
        <textarea value={current[phase.key]} onChange={(e) => updateField(e.target.value)} rows={4} style={{ ...inputStyle, marginBottom: 0, resize: 'vertical' }} />
      </div>
      <div style={{ display: 'flex', justifyContent: 'space-between', gap: 12 }}>
        <button onClick={onExit} style={btnSecondary}>&#8592; Tools</button>
        <button onClick={next} style={btnPrimary(phase.color)}>{idx < 3 ? 'Next →' : 'Act and restart the loop'}</button>
      </div>
    </div>
  );
}

function hexPoints(cx, cy, r) {
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const angle = (Math.PI / 180) * (60 * i - 30);
    pts.push(`${cx + r * Math.cos(angle)},${cy + r * Math.sin(angle)}`);
  }
  return pts.join(' ');
}

// ============ 6. CHECKLIST ============
function ChecklistTool({ baseFont, onExit }) {
  const [items, setItems] = useState([{ text: '', done: false }]);

  const updateText = (i, val) => setItems((prev) => prev.map((it, idx) => idx === i ? { ...it, text: val } : it));
  const toggleDone = (i) => setItems((prev) => prev.map((it, idx) => idx === i ? { ...it, done: !it.done } : it));

  return (
    <div>
      <div style={card}>
        <p style={{ fontSize: baseFont * 0.9, color: '#5b5b5b', marginBottom: 16, lineHeight: 1.5 }}>

          <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 10 }}>

// ============ 14. CIRCLE OF CONTROL AND INFLUENCE ============
function ControlCircleTool({ baseFont, onExit }) {
  const [items, setItems] = useState({ controllo: [], influenza: [], preoccupazione: [] });
  const [draft, setDraft] = useState('');
  const [target, setTarget] = useState('controllo');

  const add = () => {
    if (!draft.trim()) return;
    setItems((p) => ({ ...p, [target]: [...p[target], draft.trim()] }));
    setDraft('');
  };
  const remove = (zone, idx) => setItems((p) => ({ ...p, [zone]: p[zone].filter((_, i) => i !== idx) }));

  const zones = [
    { key: 'controllo', label: 'Within my control', desc: 'Depends only on me: my actions, my words, my choices.', color: '#2F8F5B' },
    { key: 'influenza', label: 'I can influence', desc: 'Doesn’t depend only on me, but my actions matter: a conversation, a request, an example.', color: '#D4A017' },
    { key: 'preoccupazione', label: 'Outside my control', desc: 'Doesn’t depend on me in any way — the weather, other people’s choices, the past.', color: '#6b6b6b' },
  ];

  return (
    <div>
      <div style={card}>
        <p style={{ fontSize: baseFont * 0.85, color: '#5b5b5b', marginBottom: 16, lineHeight: 1.5 }}>
          Write down a thought or a worry, then choose which circle to place it in. Often the energy we spend is concentrated exactly where we can do the least.
        </p>
        <input value={draft} onChange={(e) => setDraft(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && add()}
          placeholder="E.g. the fact that my boss doesn’t answer emails..." style={inputStyle} />
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 12 }}>
          {zones.map((z) => (
            <button key={z.key} onClick={() => setTarget(z.key)}
              style={{ ...btnSecondary, borderColor: target === z.key ? z.color : '#d8d2bf', color: target === z.key ? z.color : '#5b5b5b', fontWeight: target === z.key ? 800 : 600 }}>
              {z.label}

          ))}

        <button onClick={add} style={btnPrimary('#2F8F5B')}>Add</button>

          <div style={{ fontSize: 12.5, fontWeight: 800, color: z.color, marginBottom: 4, letterSpacing: 0.3 }}>{z.label.toUpperCase()}</div>
          <p style={{ fontSize: baseFont * 0.8, color: '#6b6b6b', marginBottom: 10 }}>{z.desc}</p>
          {items[z.key].length === 0

              <div key={i} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '8px 0', borderBottom: i < items[z.key].length - 1 ? '1px solid #f0ece0' : 'none' }}>
                <span style={{ fontSize: baseFont * 0.92 }}>{it}</span>
                <button onClick={() => remove(z.key, i)} style={{ background: 'none', border: 'none', color: '#bbb', cursor: 'pointer', fontSize: 18 }}>&#215;</button>
              </div>
            ))}
        </div>
      ))}
      <button onClick={onExit} style={btnSecondary}>&#8592; Back to tools</button>
    </div>
  );
}

// ============ 15. WHAT KIND OF PROBLEM IS IT? (DECISION TREE FOR CHOOSING THE METHOD) ============
function DecisionTreeTool({ baseFont, onExit }) {
  const [step, setStep] = useState(0);
  const [answers, setAnswers] = useState([]);

  const questions = [
    { q: 'Is the problem mostly about a verifiable fact, or an interpretation/opinion?', a: 'A verifiable fact', b: 'An interpretation or opinion' },
    { q: 'Does it involve other people you need to reach an agreement with, or is it a matter that concerns only you?', a: 'Other people, an agreement is needed', b: 'It concerns only me' },
    { q: 'Do you already have an idea of the cause, or are you still in the dark about what’s going on?', a: 'I already have an idea to check', b: 'I’m still in the dark' },
  ];

  const results = {
    'a-a-a': { title: 'Fact-checking', tools: ['Hypothesis lab', 'SOAP scheme'], nota: 'You already have a plausible explanation: the right step is to test it against the evidence, not to look for another one.' },
    'a-a-b': { title: 'Searching for causes', tools: ['The 5 Whys', 'Ishikawa diagram'], nota: 'A clear explanation is still missing: these tools help trace back from the symptom to the cause.' },
    'a-b-a': { title: 'Fact-based negotiation', tools: ['Nonviolent Communication', 'SOAP scheme'], nota: 'There’s a fact to clarify together with others: separating observation from interpretation is the first step.' },
    'a-b-b': { title: 'Collaborative discussion', tools: ['Nonviolent Communication', 'The 5 Whys'], nota: 'Before negotiating a solution, it may help to first understand together what’s really going on.' },
    'b-a-a': { title: 'Personal decision', tools: ['Decision matrix', 'Circle of control and influence'], nota: 'You already have an option in mind: comparing it against clear criteria helps you decide with more confidence.' },
    'b-a-b': { title: 'Clarify before deciding', tools: ['Cognitive restructuring', 'Circle of control and influence'], nota: 'Before choosing, it may help to understand how much of this really depends on you.' },
    'b-b-a': { title: 'Discussion over a shared interpretation', tools: ['Nonviolent Communication', 'Decision matrix'], nota: 'The disagreement is about an interpretation, not a fact: listen before proposing solutions.' },
    'b-b-b': { title: 'Open exploration', tools: ['The 5 Whys', 'Nonviolent Communication'], nota: 'A situation that’s still unclear and involves others: start from the questions, not the solutions.' },
  };

  const pick = (choice) => {
    const next = [...answers, choice];
    setAnswers(next);
    setStep(step + 1);
  };
  const reset = () => { setAnswers([]); setStep(0); };
  const key = answers.join('-');
  const result = results[key];

  return (
    <div>
      <div style={card}>
        {step < questions.length ? (
          <>
            <div style={{ fontSize: 12.5, fontWeight: 800, color: '#1F4E8C', marginBottom: 10 }}>STEP {step + 1} OF {questions.length}</div>
            <p style={{ fontSize: baseFont * 1.02, lineHeight: 1.5, marginBottom: 20 }}>{questions[step].q}</p>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              <button onClick={() => pick('a')} style={btnPrimary('#1F4E8C')}>{questions[step].a}</button>
              <button onClick={() => pick('b')} style={btnPrimary('#1F4E8C')}>{questions[step].b}</button>
            </div>
          </>
        ) : result ? (
          <>
            <div style={{ fontSize: 12.5, fontWeight: 800, color: '#1F4E8C', marginBottom: 10 }}>A FIRST LEAD TO EXPLORE</div>
            <p style={{ fontSize: baseFont * 1.1, fontWeight: 800, marginBottom: 10 }}>{result.title}</p>
            <p style={{ fontSize: baseFont * 0.9, lineHeight: 1.5, color: '#5b5b5b', marginBottom: 10 }}>{result.nota}</p>
            <p style={{ fontSize: baseFont * 0.8, lineHeight: 1.5, color: '#6b6b6b', marginBottom: 14, fontStyle: 'italic' }}>This is an orientational classification, not a diagnostic one: a real problem can belong to several categories at once, and may call for several different tools.</p>
            <div style={{ fontSize: 12.5, fontWeight: 800, color: '#6b6b6b', marginBottom: 8 }}>SUGGESTED TOOLS</div>
            {result.tools.map((t, i) => (
              <div key={i} style={{ padding: '10px 14px', background: '#F5F1E6', borderRadius: 10, marginBottom: 8, fontSize: baseFont * 0.92 }}>{t}</div>
            ))}
            <button onClick={reset} style={{ ...btnSecondary, marginTop: 10 }}>Start over</button>
          </>
        ) : null}
      </div>
      <button onClick={onExit} style={btnSecondary}>&#8592; Back to tools</button>
    </div>
  );
}

// ============ 16. HYPOTHESIS LAB ============
function HypothesisLabTool({ baseFont, onExit }) {
  const [hypothesis, setHypothesis] = useState('');
  const [forEv, setForEv] = useState(['']);
  const [againstEv, setAgainstEv] = useState(['']);
  const [updated, setUpdated] = useState('');

  const addRow = (setter, arr) => setter([...arr, '']);
  const updateRow = (setter, arr, i, val) => { const c = [...arr]; c[i] = val; setter(c); };
  const removeRow = (setter, arr, i) => setter(arr.filter((_, idx) => idx !== i));

  return (
    <div>
      <div style={card}>
        <div style={{ fontSize: 12.5, fontWeight: 800, color: '#C0392B', marginBottom: 8 }}>YOUR HYPOTHESIS</div>
        <p style={{ fontSize: baseFont * 0.85, color: '#5b5b5b', marginBottom: 10, lineHeight: 1.5 }}>Not a fact: a plausible explanation you want to check.</p>
        <textarea value={hypothesis} onChange={(e) => setHypothesis(e.target.value)} placeholder="E.g. I think my colleague isn’t answering me because they’re angry with me..."
          style={{ ...inputStyle, minHeight: 60, resize: 'vertical' }} />
      </div>

      <div style={{ ...card, borderColor: '#2F8F5B' }}>
        <div style={{ fontSize: 12.5, fontWeight: 800, color: '#2F8F5B', marginBottom: 10 }}>EVIDENCE FOR</div>
        {forEv.map((v, i) => (
          <div key={i} style={{ display: 'flex', gap: 8, marginBottom: 8 }}>
            <input value={v} onChange={(e) => updateRow(setForEv, forEv, i, e.target.value)} style={{ ...inputStyle, marginBottom: 0 }} placeholder="An observable fact, not an impression" />
            {forEv.length > 1 && <button onClick={() => removeRow(setForEv, forEv, i)} style={{ background: 'none', border: 'none', color: '#bbb', cursor: 'pointer', fontSize: 20 }}>&#215;</button>}
          </div>
        ))}
        <button onClick={() => addRow(setForEv, forEv)} style={btnSecondary}>+ Add evidence</button>
      </div>

      <div style={{ ...card, borderColor: '#C0392B' }}>
        <div style={{ fontSize: 12.5, fontWeight: 800, color: '#C0392B', marginBottom: 10 }}>EVIDENCE AGAINST</div>
        <p style={{ fontSize: baseFont * 0.8, color: '#6b6b6b', marginBottom: 10 }}>The hardest and most important step: looking for what contradicts the hypothesis, not just what confirms it.</p>
        {againstEv.map((v, i) => (
          <div key={i} style={{ display: 'flex', gap: 8, marginBottom: 8 }}>
            <input value={v} onChange={(e) => updateRow(setAgainstEv, againstEv, i, e.target.value)} style={{ ...inputStyle, marginBottom: 0 }} placeholder="What doesn’t fit with this explanation?" />
            {againstEv.length > 1 && <button onClick={() => removeRow(setAgainstEv, againstEv, i)} style={{ background: 'none', border: 'none', color: '#bbb', cursor: 'pointer', fontSize: 20 }}>&#215;</button>}
          </div>
        ))}
        <button onClick={() => addRow(setAgainstEv, againstEv)} style={btnSecondary}>+ Add evidence</button>
      </div>

      <div style={{ ...card, background: '#17203A' }}>
        <div style={{ fontSize: 12.5, fontWeight: 800, color: '#b8c0d4', marginBottom: 8 }}>UPDATED HYPOTHESIS</div>
        <p style={{ fontSize: baseFont * 0.85, color: '#b8c0d4', marginBottom: 10, lineHeight: 1.5 }}>In light of the evidence, does the hypothesis stay the same, need correcting, or need to be dropped?</p>
        <textarea value={updated} onChange={(e) => setUpdated(e.target.value)} placeholder="My updated hypothesis is..."
          style={{ ...inputStyle, minHeight: 60, resize: 'vertical', marginBottom: 0 }} />
      </div>
      <button onClick={onExit} style={btnSecondary}>&#8592; Back to tools</button>
    </div>
  );
}

// ============ 22. EXPRESSIVE WRITING ============
function ExpressiveWritingTool({ baseFont, onExit }) {
  const [text, setText] = useState('');
  const [seconds, setSeconds] = useState(15 * 60);
  const [running, setRunning] = useState(false);
  const intervalRef = useRef(null);

  useEffect(() => {
    if (!running) return;
    intervalRef.current = setInterval(() => {
      setSeconds((s) => { if (s <= 1) { setRunning(false); return 0; } return s - 1; });
    }, 1000);
    return () => clearInterval(intervalRef.current);
  }, [running]);

  const mins = Math.floor(seconds / 60);
  const secs = seconds % 60;
  const reset = () => { setSeconds(15 * 60); setRunning(false); };

  return (
    <div>
      <div style={card}>
        <p style={{ fontSize: baseFont * 0.85, color: '#5b5b5b', marginBottom: 12, lineHeight: 1.5 }}>
          Write without stopping to correct yourself, for yourself — not to be read. Describe what happened, what you really feel, and how it connects to other moments in your life. Research links this practice, repeated over time, to improved wellbeing — not to immediate relief: some people feel more agitated right after writing, before feeling better.
        </p>
        <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 14 }}>
          <div style={{ fontSize: baseFont * 1.1, fontWeight: 800, color: '#6B4FA0' }}>{String(mins).padStart(2, '0')}:{String(secs).padStart(2, '0')}</div>
          {!running
            ? <button onClick={() => setRunning(true)} style={btnPrimary('#6B4FA0')}>{seconds < 15 * 60 ? 'Resume' : 'Start the timer'}</button>
            : <button onClick={() => setRunning(false)} style={btnSecondary}>Pause</button>}
          <button onClick={reset} style={btnSecondary}>Start over</button>
        </div>
        <textarea value={text} onChange={(e) => setText(e.target.value)} placeholder="Start writing..."
          style={{ ...inputStyle, minHeight: 220, resize: 'vertical', marginBottom: 0, fontFamily: 'inherit' }} />
      </div>
      <p style={{ fontSize: baseFont * 0.78, color: '#6b6b6b', textAlign: 'center', marginBottom: 16 }}>
        This tool doesn’t save or send what you write: the text exists only while this page stays open and disappears when you close it. If you’re using a shared device, keep in mind that the browser may still keep traces in its history or cache.
      </p>
      <button onClick={onExit} style={btnSecondary}>&#8592; Back to tools</button>
    </div>
  );
}

function MindfulEatingTool({ baseFont, onExit }) {
